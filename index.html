[], "id_simple": "2025-Q78"}, {"id": "gsb-2023-L03-Q8", "year": 2023, "qnum": 8, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "39세 산과력 0-0-0-0인 여성이 임신 17주에 검사 결과 확인을 위해 병원에 왔다. 임신 12주에 측정한 태아 목둘레 투명대는 1.0mm 였고, 이 날과 임신 16주에 각각 채혈하여 통합 분석한 모체혈청선별검사의 결과가 아래와 같았다. 필요한 검사는?", "stem_table": "| 통합선별검사 결과다운증후군 고위험군 1:220에드워드증후군 고위험군 1:100신경관 결손 저위험군 1.032 MoM |\n|---|", "options": ["양수천자 (amniocentesis)", "탯줄천자 (cordocentesis)", "비수축검사 (nonstress test, NST)", "융모막융모표본채취 (chorionic villi sampling)", "모체혈청선별검사 (maternal serum screening) 재검"], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q8"}, {"id": "gsb-2023-L03-Q54", "year": 2023, "qnum": 54, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "27세 산과력 0-0-0-0인 여성이 산전관리를 위해 병원에 왔다. 임신 12주 1일에 시행한 초음파 사진은 그림1과 같았고, 임신 16주 1일에 시행한 양수검사 결과는 그림2와 같다. 진단은?", "stem_table": null, "options": ["정상", "다운증후군 (Down syndrome)", "13삼염색체 증후군 (trisomy 13 syndrome)", "18삼염색체 증후군 (trisomy 18 syndrome)", "클라인펠터증후군 (Klinefelter syndrome)"], "answer": [2], "image": "gsb_img/image7.png", "images": [], "id_simple": "2023-Q54"}, {"id": "gsb-2023-L03-Q81", "year": 2023, "qnum": 81, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "임신 37주 2일 초임부(primigravida)가 외래를 방문하였다. 수술 병력이나 특이한 가족력은 없었다. 키 163cm, 몸무게 69kg, 혈압 145/90mmHg이었으며, 신체 검진 상 이상은 없었고, 자궁 경부는 닫혀 있었으며 소실(effacement)은 없었다. 두통, 시야 흐림, 우상복부 통증 모두 없었으며, 진통은 없었고, 태동도 잘 느껴진다고 했다. 검사 결과는 다음과 같았다.\n다음으로 해야 할 가장 적합한 것을 고르시오.", "stem_table": null, "options": ["비수축검사(non-stress test)를 한다.", "제대동맥 도플러 검사를 한다.", "유도분만을 한다.", "제왕절개분만을 한다.", "자연진통을 기다린다."], "answer": [3], "image": "gsb_img/image8.png", "images": [], "id_simple": "2023-Q81"}, {"id": "gsb-2022-L03-Q22", "year": 2022, "qnum": 22, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "생물리학적 계수(Biophysical Profile, BPP)의 항목 중 만성 지표(chronic marker)를 고르시오", "stem_table": null, "options": ["양수양", "태아호흡운동", "태아움직임", "태아긴장도", "비수축검사"], "answer": [1], "image": null, "images": [], "id_simple": "2022-Q22"}, {"id": "gsb-2022-L03-Q41", "year": 2022, "qnum": 41, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "태아 염색체 이상에 대한 산전진단으로 시행하는 선별 검사/진단검사에 대한 설명 중 옳은 것은?", "stem_table": null, "options": ["양수검사로는 태아 염색체 이상을 진단할 수 없다", "다운증후군 아기는 대부분 만 35세 이상의 고령산모에게서 태어난다", "모세혈장 내 유리 DNA 검사는 정확도가 높아서 진단 검사로 이용된다", "임신 제 1삼분기 태아 목덜미 측정은 다운증후군 고위험군 선별에 제한적인 검사이다", "모세 혈청 선별검사에서 다운증후군이면 AFP가 정상대조군에 비해 감소한다."], "answer": [5], "image": null, "images": [], "id_simple": "2022-Q41"}, {"id": "gsb-2021-L03-Q83", "year": 2021, "qnum": 83, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "태아 염색체 이상에 대한 산전진단으로 시행하는 선별검사/진단검사에 대한 설명 중 옳은 것은?", "stem_table": null, "options": ["태아염색체 이상은 양수검사로만 진단할 수 있다.", "태아의 다운증후군은 산모의 연령이 35세 미만인 경우 거의 발생하지 않는다.", "모체 혈장 내 유리 DNA 검사는 정확도가 높아서 진단검사로 이용된다.", "임신 제 1삼분기 태아 목덜미 투명대 측정은 다운증후군 고위험군 선별에 유용한 검사이다.", "모체 혈청 선별검사에서 다운증후군이면 AFP와 uE3가 정상대조군에 비해 증가한다."], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q83"}, {"id": "gsb-2021-L03-Q84", "year": 2021, "qnum": 84, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "임신 37주 초산부에서 시행한 초음파 검사상 태위는 둔위, 태아예상체중은 1830g(이 주수의 태아예상체중 10th percentile 값은 2320g이다), 양수지수 (amniotic fluid index)는 3.6cm이었다. 탯줄 동맥 도플러 검사의 혈류 파형은 다음과 같았다. 옳은 것은?", "stem_table": null, "options": ["태반에서의 혈류 저항성이 증가하여 나타나는 소견이다.", "대부분 태아의 중뇌동맥 혈류(middle cerebral artery) 저항성 증가가 동반된다.", "상태가 보다 악화되면 제대동맥의 확장기말 혈류(end diastolic flow) 양이 증가하게 된다.", "제대동맥 도플러 검사는 태아 저산소증을 발견하기 위해 37주 이후 모든 산모에서 시행한다.", "태아가 건강하다고 판단할 수 있으므로 1주일 후 재검사를 시행한다."], "answer": [1], "image": "gsb_img/image9.png", "images": [], "id_simple": "2021-Q84", "note": "(원본 사진 *강의록에 없음)"}, {"id": "gsb-2020-L03-Q5", "year": 2020, "qnum": 5, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "39세 임산부가 임신 17+1주에 시행한 양수검사에 대한 결과는 다음과 같았다. 이런 양수검사 결과를 보이는 산모에 대한 설명 중 옳은 것은?", "stem_table": null, "options": ["위와 같은 결과는 양수검사로만 얻을 수 있다.", "위와 같은 결과는 산모의 연령이 35세 미만에서는 거의 발생하지 않는다.", "위와 같은 결과가 나오는 산모는 대부분 이 진단에 대한 가족력이 있다.", "임신 제 1 삼분기 태아 목덜미 투명대 측정은 이 질환에 대한 고위험군 선별에 유용한 검사이다.", "모체 혈청 선별검사 결과가 저 위험군이라면 이와 같은 결과가 나올 수 없다."], "answer": [4], "image": "gsb_img/image10.png", "images": [], "id_simple": "2020-Q5"}, {"id": "gsb-2020-L03-Q6", "year": 2020, "qnum": 6, "jokbo_lec_no": "03", "lecture": "산전진단, 산전태아평가", "professor": "김선민", "curr_lec_no": "03", "curr_lecture": "산전진단/산전태아평가", "stem": "34주의 단태아 임산부가 태동이 줄었다고 하여 비수축 검사를 시행하였다. 다음 중 옳은 설명은?", "stem_table": null, "options": ["검사 시작 후 20분 이내에 15초 이상 지속되고 15bpm 이상되는 태아심박수 증가 2회 이상 발생하면 reactive로 판정한다.", "paper 속도는 1cm/min 이다.", "임신 주수와 상관없이 실시할 수 있는 태아 건강 평가 방법 중 가장 기본이 되는 검사이다.", "만일 산모가 태아의 움직임을 느낄 수 없다면 위 검사는 실시할 수 없다.", "쌍태임신에서는 비수축검사가 임상적으로 유용하지 않다."], "answer": [1], "image": "gsb_img/image11.png", "images": [], "id_simple": "2020-Q6"}, {"id": "gsb-2025-L04-Q79", "year": 2025, "qnum": 79, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "그림 (Friedman Curve)에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["A는 active phase의 시작점이다.", "B부터 E까지를 2nd stage라고 한다.", "C는 active phase의 시작점이다.", "D부터 cardinal movement가 본격적으로 일어난다.", "E부터 3rd stage가 시작된다."], "answer": [4], "image": "gsb_img/image12.jpeg", "images": [], "id_simple": "2025-Q79"}, {"id": "gsb-2025-L04-Q80", "year": 2025, "qnum": 80, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "36세 산과력 0-0-1-0인 여성이 임신 39+2주에 2시간 전부터 시작된 규칙적인 복통으로 병원에 왔다. 초음파 검사에서 선진부는 두위, 태아예상체중은 3,120g (50백분위수 3160g), 양수지수는 8.8cm 이었다. 복통의 강도가 점점 세지면서 아래와 같은 전자태아심음감시 결과가 확인되었다. 자궁목은 90% 소실, 4cm 개대, 하강도 –1 이며, 혈압은 120/70mmHg, 맥박은 102회/분이었다. 필요한 조치를 모두 고르면?", "stem_table": null, "options": ["산소 공급", "좌측위로 눕히기", "수액 공급", "옥시토신 투여", "인공 양막파수"], "answer": [1, 2, 3], "image": "gsb_img/image13.jpeg", "images": [], "id_simple": "2025-Q80"}, {"id": "gsb-2023-L04-Q32", "year": 2023, "qnum": 32, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "인간 분만(parturition)의 단계(phase)에 관한 설명 중 옳지 않은 것은?", "stem_table": null, "options": ["Phase 1에서는 amnion에서 생성된 prostaglandin이 chorion에 존재하는 PGDH에 의해 불활성화되어 모체조직(자궁근육 등)으로의 transport가 억제된다.", "Phase 2에서는 자궁경부에 존재하는 collagen fiber 내 fibril 사이의 결합이 느슨해지는 cervical ripening이 일어난다.", "Phase 2에서는 progesterone 분비가 감소하여 classic progesterone withdrawal이 일어난다.", "Phase 3에서는 prostaglandin 및 그 수용체와 oxytocin 및 그 수용체가 중요한 역할을 한다.", "Phase 3에서는 labor의 latent phase 및 active phase를 거쳐 태아 분만이 일어난다."], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q32"}, {"id": "gsb-2023-L04-Q46", "year": 2023, "qnum": 46, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "임신 38주의 31세 초산부가 태아발육부전으로 유도분만을 시행하였다. 분만 진통 중 자궁 경부는 90% effacement, 4cm dilatation 되었는데, 아래와 같은 전자 태아심박동수 감시 소견을 보였다. 이 산모에게 우선 해야 할 처치로 옳지 않은 것은?", "stem_table": null, "options": ["옥시토신 정맥주입을 중단한다.", "산소투여를 시작한다.", "수액을 빠르게 정맥주입한다.", "Supine position으로 자세를 취하게 한다.", "전자 태아심박동 감시를 계속 면밀하게 관찰한다."], "answer": [4], "image": "gsb_img/image14.png", "images": [], "id_simple": "2023-Q46"}, {"id": "gsb-2022-L04-Q13", "year": 2022, "qnum": 13, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "진통 중 아래 그림과 같은 전자태아 심박수 감시 (Electronic fetal heart rate monitoring) 소견의 원인으 로 옳은 설명은?", "stem_table": null, "options": ["태아의 호흡운동이나 움직임에 의해 생긴다", "태아 머리 압박에 따른 미주신경 활성화에 의해 생긴다", "자궁 태반 혈류 부족에 의한 저산소증 때문이다", "자궁 수축에 의한 탯줄압박에 따른 소견이다", "중추신경 억제제나 황산마그네슘 등 약물에 의해 생긴다."], "answer": [2], "image": "gsb_img/image15.png", "images": [], "id_simple": "2022-Q13"}, {"id": "gsb-2021-L04-Q5", "year": 2021, "qnum": 5, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "임신 39주의 31세 초산부가 양수과소증으로 유도분만을 시행하였다. 분만 진통 중 자궁 경부는 90% effacement, 4cm dilation 되었는데, 아래와 같은 전자 태아심박동수 감시 소견을 보였다. 이 산모에게 우선 해야 할 처치로 옳지 않은 것은?", "stem_table": null, "options": ["옥시토신 정맥주입을 중단한다.", "산소투여를 시작한다.", "Supine Position으로 자세를 취하게 한다.", "수액을 빠르게 정맥주입한다.", "전자 태아심박동 감시를 계속 면밀하게 관찰한다."], "answer": [3], "image": "gsb_img/image16.png", "images": [], "id_simple": "2021-Q5", "note": "(원본 사진 *강의록에 없음)"}, {"id": "gsb-2021-L04-Q6", "year": 2021, "qnum": 6, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "인간 분만(parurition)의 단계(phase)에 관한 설명 중 옳지 않은 것은?", "stem_table": null, "options": ["Phase 1에서는 Amnion에서 생성된 Prostaglandin이 Chorion에 존재하는 PGDH에 의해 불활성화되어 모체조직(자궁근육 등)으로의 Transport가 억제된다.", "Phase 2에서는 Progesterone 분비가 감소하여 Classic Progesterone Withdrawal이 일어난다.", "Phase 2에서는 자궁경부에 존재하는 Collagen Fiver 내 Fibril 사이의 결합이 느슨해지는 Cervical Ripening이 일어난다.", "Phase 3에서는 Prostaglandin 및 그 수용체와 Oxytocin 및 그 수용체가 중요한 역할을 한다.", "Phase 3에서는 Labor의 Latent Phase 및 Active Phase를 거쳐 태아 분만이 일어난다."], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q6"}, {"id": "gsb-2020-L04-Q7", "year": 2020, "qnum": 7, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "진통 중 자궁수축태아심박동검사(cardiotocography)를 시행하여 category 1으로 분류하기에 적합하지 않은 소견은?", "stem_table": null, "options": ["baseline fetal HR – 115 beat/minute", "baseline FHR variability – moderate", "variable deceleration – present", "early deceleration – present", "acceleration – absent"], "answer": [3], "image": null, "images": [], "id_simple": "2020-Q7"}, {"id": "gsb-2020-L04-Q8", "year": 2020, "qnum": 8, "jokbo_lec_no": "04", "lecture": "정상분만의 관리, 분만 중 태아감시", "professor": "박찬욱", "curr_lec_no": "08", "curr_lecture": "정상분만의 관리/분만 중 태아감시", "stem": "그림에서 태향 (fetal position)은 무엇인가?", "stem_table": null, "options": ["longitudinal", "breech", "compound", "right mento-anterior", "left sacro-posterior"], "answer": [5], "image": "gsb_img/image17.png", "images": [], "id_simple": "2020-Q8"}, {"id": "gsb-2025-L05-Q1", "year": 2025, "qnum": 1, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "32세 산과력 0-0-0-0인 미분만부가 임신 32주 0일에 물처럼 흐르는 질 분비물이 있어 다니던 산부인과를 방문하였다. 방문 1시간 전부터 시작되었으며, 태동은 잘 느껴지고, 가끔 배가 딱딱해지는 느낌은 있지만 아플 정도는 아니라고 하였다. 혈압 90/64 mmHg, 맥박수 88회/분, 체온 36.3℃로 확인되었다. 비수축검사는 아래 그림 1과 같았고, 검진에서 질 분비물에 나이트라진 검사종이를 갖다대었을 때 아래 그림 2와 같이 색깔이 나타났다. 적절한 치료는?", "stem_table": null, "options": ["경과관찰", "옥시토신 투여", "스테로이드 투여", "양수주입술", "자궁목원형묶음술"], "answer": [3], "image": null, "images": ["gsb_img/image18.jpeg", "gsb_img/image19.jpeg"], "id_simple": "2025-Q1"}, {"id": "gsb-2025-L05-Q2", "year": 2025, "qnum": 2, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "36세 산과력 0-1-1-1인 다분만부가 임신 13주에 정기검진을 위하여 산부인과를 방문하였다. 1년 전 임신 19주에 통증 없이 질 출혈이 갑자기 발생하여 병원에 갔었는데 당시 자궁목이 아래 그림과 같이 완전히 열려있어 자궁목무력증이 진단되었고, 유산을 하게 되었다고 하였다. 2년 전에는 임신 20주에 시행한 초음파에서 자궁목의 길이가 짧아 프로게스테론 질정을 투여하며 지켜보았으나 26주에 조기진통이 발생하였고, 자궁수축억제재를 투여하였음에도 27주에 조산을 하였다고 할 때, 이 환자에게 조산을 예방하기 위하여 할 수 있는 적절한 치료는?", "stem_table": null, "options": ["경과관찰", "항생제 치료", "스테로이드 투여", "자궁수축억제재 투여", "자궁목원형묶음술"], "answer": [5], "image": "gsb_img/image20.jpeg", "images": [], "id_simple": "2025-Q2"}, {"id": "gsb-2023-L05-Q14", "year": 2023, "qnum": 14, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "32세 산과력 2-0-0-2인 임신 30주 산모가 자궁수축이 있다며 병원에 왔다. 비수축검사에서 20분 동안 6회의 규칙적인 자궁수축이 있었다. 태아 심박동은 140회/분이었다. 자궁경부는 3cm 확장되어 있었다. 처치는?", "stem_table": null, "options": ["경과관찰", "Progesterone 질정제 투여", "Oxytocin 투여", "Ritodrine 투여", "Emergent cervical cerclage 시행"], "answer": [4], "image": null, "images": [], "id_simple": "2023-Q14"}, {"id": "gsb-2023-L05-Q50", "year": 2023, "qnum": 50, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "30세 산과력 0-0-0-0인 임신 33주 산모가 물같이 맑은 질 분비물로 병원에 왔다. Nitrazine test는 positive로 확인되었고, 초음파 검사에서 태아는 두위였다. 비수축 검사는 반응성이었고, 자궁 수축은 없었다. 가장 적절한 처치는?", "stem_table": null, "options": ["예방적 항생제를 사용한다.", "옥시토신을 투여하여 유도분만을 시행한다.", "자궁수축억제제를 사용한다.", "Fetal neuroprotection을 위한 MgSO4를 사용한다.", "응급제왕절개술을 시행한다."], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q50"}, {"id": "gsb-2022-L05-Q36", "year": 2022, "qnum": 36, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "30세 산과력 1-0-0-1, 임신주수 34주 4일 단태아를 임신중인 여자가 간헐적인 배뭉침이 있어 응급실에 왔다. 내진을 시행하였을 때 자궁경부는 닫혀있었고 양막파수는 없었다. 30분 동안 시행한 전자태아심박동-자궁수축감시에서 태아 심박동에는 이상이 없었으나 10분에서 20분 간격 의 불규칙한 자궁수축이 확인되었다. 초음파 검사상 태아에 게 이상은 없었으며 자궁경부 길이는 3.0cm로 이전과 같 았다. 다음 처치로 가장 알맞은 것을 고르시오", "stem_table": null, "options": ["프로게스테론 혈청 투여", "리도드린 투여", "자궁경부봉축술", "경과관찰", "스테로이드 투여"], "answer": [4], "image": "gsb_img/image21.png", "images": [], "id_simple": "2022-Q36"}, {"id": "gsb-2022-L05-Q64", "year": 2022, "qnum": 64, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "28세 산과력 0-0-0-0 임신주수 31주 1일 단태아를 임신 중인 여자가 배 뭉침이 있어 응급실에 왔다. 내원 당 시 질경으로 관찰하였을 때 자궁경부가 1cm 개대되었고 1 시간 후에 자궁경부는 2cm 개대되어 그 사이로 양막이 보 였다. 복부 초음파 검사상 태아에게 이상은 없었으며 태아 의 선진부는 두정위였다. 규칙적인 자궁 수축감이 있어 시 행한 전자태아심박동 자궁수축감시에서도 지속적으로 규칙 적인 자궁수축이 있었고 태아 심박동에는 이상이 없었다. 다음 처치로 가장 알맞은 것을 고르시오", "stem_table": null, "options": ["경과관찰", "항생제 투여", "자궁수축 억제제 투여", "응급 자궁경부봉축술", "응급 제왕절개술"], "answer": [3], "image": "gsb_img/image22.png", "images": [], "id_simple": "2022-Q64"}, {"id": "gsb-2021-L05-Q85", "year": 2021, "qnum": 85, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "30세 28주 초산부가 10분 간격으로 규칙적인 아랫배 통증이 3시간 동안 지속되어 병원에 왔다. 초음파 검사에서 태아는 둔위였고 예상 몸무게는 1,150g (50 percentile), AFI 10 이었다. 내진시 자궁 경부는 25% 소실, 1cm 개대되어 있었으며 태아 하강도는 –3이었다. 양막파열은 되지 않았다. 처치는?", "stem_table": null, "options": ["항생제 투여", "옥시토신 투여", "자궁수축억제제 투여", "응급 자궁경부봉축술(emergency cerclage)", "응급 제왕절개술"], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q85"}, {"id": "gsb-2021-L05-Q86", "year": 2021, "qnum": 86, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "28세 33주 경산부가 3분 간격의 규칙적인 진통과 물 같은 질 분비물이 흘러 병원에 왔다. 초음파 검사에서 태아는 두위였고, 예상 몸무게는 2010g (50 percentile), AFI 3 이었다. 내진시 자궁 경부는 90% 소실, 7cm 개대되어 있었으며 태아 하강도는 –1이었다. Mitrazine test를 하였더니 종이가 파란색으로 변했다. 전자태아심음감시 결과는 양호하였다. 처치는?", "stem_table": null, "options": ["progesterone 투여", "prostaglandin 투여", "corticosteroid 투여", "ritodrine 투여", "ergonovine 투여"], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q86"}, {"id": "gsb-2020-L05-Q11", "year": 2020, "qnum": 11, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "임신 30주에 조기양막파수로 입원한 산모에 대한 설명 중 옳은것은?", "stem_table": null, "options": ["침상 안정과 수액 공급은 분만 진통의 발생을 지연시키는데 도움이 된다.", "Randomized trial 연구들에서 항생제의 사용 후 임신기간은 연장되었으나, 신생아 생존률은 비슷하였다.", "양수양이 매우 감소되어있으면 양수주입술을 시행한다.", "Ureaplasma spp.가 주원인균이므로 Erythromycin의 투여는 큰 도움이 된다.", "Corticosteroid 투여 후 7일이 지났음에도 분만하지 않은 경우 한번 더 투여하는 것이 신생아곤란 증후군 예방에 도움이 된다."], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q11"}, {"id": "gsb-2020-L05-Q12", "year": 2020, "qnum": 12, "jokbo_lec_no": "05", "lecture": "조산", "professor": "박지윤", "curr_lec_no": "06", "curr_lecture": "조산", "stem": "다음 조산의 원인과 치료에 대한 설명 중 옳은 것을 고르시오.\n가. 미국 등에서 조산을 막기 위해서 항생제의 사용은 금기사항으로 되어있다.\n나. 자궁경부에서의 fetal fibronectin이 양성일 경우 조산의 위험도가 증가한다.\n다. 자궁경부의 길이가 짧아진 산모에게 자궁경부봉죽술을 시행하면 조산을 상당수 막을 수 있다.\n라. 조기 진통산모에게 자궁수축을 억제하는 ritodrine을 투여하였을 때 조산을 의미있게 예방하는 효과가 있다,\n마. Bacterial vaginosis가 있는 산모는 조산의 위험이 증가하지만 치료를 하여도 조산을 막지는 못한다.", "stem_table": null, "options": ["가, 라", "가,나,마", "가,나,다", "다,라", "나,마"], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q12"}, {"id": "gsb-2025-L06-Q87", "year": 2025, "qnum": 87, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "35세 임신 31주 미분만부가 패드 3장 가량의 질출혈이 있어 병원에 왔다. 도착 당시 혈압은 115/80mmHg, 맥박은 80회/분이었고 질출혈은 없었다. 혈액검사 결과 백혈구 7,800/ul, Hb 11.2g/dL, 혈소판 205,000/ul 이었다. 전자태아심음감시 및 초음파 소견은 아래와 같다. 처치는?", "stem_table": null, "options": ["경과관찰", "내진", "수혈", "유도분만", "제왕절개술"], "answer": [1], "image": null, "images": ["gsb_img/image23.png", "gsb_img/image24.png"], "id_simple": "2025-Q87"}, {"id": "gsb-2025-L06-Q88", "year": 2025, "qnum": 88, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "28세 임신 36주 다분만부가 갑작스러운 복부 통증과 다량의 질출혈을 주소로 병원에 왔다. 도착 당시 혈압은 90/60mmHg, 맥박은 120회/분이었다. 자궁경부는 75% 숙화되어 있었고, 3.0cm 개대되어 있었다. 전자태아심음 감시소견이 아래와 같을 때, 처치는?", "stem_table": null, "options": ["경과관찰", "항생제 투여", "유도분만", "자궁 동맥 색전술", "응급 제왕절개술"], "answer": [5], "image": "gsb_img/image25.png", "images": [], "id_simple": "2025-Q88"}, {"id": "gsb-2023-L06-Q7", "year": 2023, "qnum": 7, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "36세 산과력 1-0-2-1인 여성이 임신 36주 3일에 통증 없는 질출혈로 병원에 왔다. 혈압은 100/70mmHg, 맥박 95회/분, 호흡 20회/분, 체온 36.7˚C였다. 비수축검사 결과는 반응성이었고, 자궁수축은 동반되지 않았다. 아래는 초음파 검사 사진이다. 진단은?", "stem_table": null, "options": ["초기진통 (preterm labor pain)", "전치혈관 (Vasa previa)", "전치태반 (Placenta previa)", "태반조기박리 (placental abruptio)", "자궁파열 (Uterine rupture)"], "answer": [3], "image": "gsb_img/image26.png", "images": [], "id_simple": "2023-Q7"}, {"id": "gsb-2023-L06-Q29", "year": 2023, "qnum": 29, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "34세 산과력 2-0-0-2인 여성이 임신 38주 3일에 3,400g의 남아를 질식분만 후 1시간 동안 질출혈이 지속되었다. 혈압은 80/50mmHg, 맥박 120회/분, 호흡 20회/분, 체온 36.5˚C 였다. 자궁 수축은 좋지 않았다. 질경을 통한 검사에서 자궁경부와 질의 찢김은 없었다. 초음파 검사에서도 자궁 안에 덩이는 보이지 않았다. 먼저 할 처치는?", "stem_table": null, "options": ["경과관찰", "오시토신", "리토드린", "자궁내막 긁음술", "자궁동맥색전술(Uterine artery embolism)"], "answer": [2], "image": null, "images": [], "id_simple": "2023-Q29"}, {"id": "gsb-2022-L06-Q56", "year": 2022, "qnum": 56, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "28세 산과력 0-0-0-0 임신 주수 35주 3일인 임산부 가 집에서 속옷이 흠뻑 젖을 정도의 질 출혈이 있었고 태 동이 느껴지지 않는다고 응급실에 왔다. 혈압은 118/68mmHg, 심박수는 100회/분, 체온은 37.0도였다. 질경 검사상 소량의 질 출혈이 있었고 다른 증상은 없었다. 질식 초음파 상 아래 그림과 같았고 복부 초음파 상 양수 량은 정상이었으나 자궁 내에서 태아가 사망한 상태였다. 다음 처치로 가장 알맞은 것을 고르시오", "stem_table": null, "options": ["경과관찰", "내진으로 자궁경부 상태 확인", "유도분만", "자궁경부 봉축술", "자궁 절개술"], "answer": [5], "image": "gsb_img/image27.png", "images": [], "id_simple": "2022-Q56"}, {"id": "gsb-2022-L06-Q57", "year": 2022, "qnum": 57, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "32세 산과력 0-0-0-0 임신주수 32주 1일 전자간증 으로 입원중인 임산부에게 갑작스러 복통과 질 출혈이 발 생했다. 혈압은 190/70mmHg, 심박수는 114회/분 체온 은 36.8도였다. 내진 시행시 자궁경부는 닫혀있었다. 전자 태아심박동-자궁수축감시 결과는 아래와 같다. 다음 처치 로 가장 알맞은 것을 고르시오", "stem_table": null, "options": ["경과관찰", "항생제 투여", "자궁수축 억제제 투여", "유도분만", "응급 제왕절개술"], "answer": [5], "image": "gsb_img/image28.png", "images": [], "id_simple": "2022-Q57"}, {"id": "gsb-2021-L06-Q87", "year": 2021, "qnum": 87, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "33세 임신 34주 초산부가 패드 1장 가량의 질출혈과 태아가 놀지 않는다고 병원에 왔다. 도착 당시 질출혈이나 복통은 없었다. 혈압은 120/75, 맥박은 80회/분이었고 혈액검사 결과 WBC 6,500/ul, Hb 11.3 g/dL, platelet 185,000/ul이었다. 초음파 소견은 아래와 같고, 태아 심박동이 보이지 않았다. 처치는?", "stem_table": null, "options": ["내진", "수혈", "자궁수축억제제", "유도분만", "제왕절개술"], "answer": [5], "image": "gsb_img/image29.png", "images": [], "id_simple": "2021-Q87", "note": "(원본 사진 *강의록에 없음)"}, {"id": "gsb-2021-L06-Q88", "year": 2021, "qnum": 88, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "30세 임신 36주 경산부가 복부 통증과 질출혈을 주소로 병원에 왔다. 도착 당시 질출혈은 멎었으나, 불규칙적인 복통은 있었다. 혈압은 120/80, 맥박은 90회/분이었다. 자궁경부는 숙화되거나 개대되어 있지 않았다. 초음파 검사상 태반은 자궁 저부(fundus)에 위치하고 있었으나 태아 심박동이 보이지 않았다. 처치는?", "stem_table": null, "options": ["항생제 투여", "자궁수축억제제 투여", "유도분만", "자궁 동맥 색전술", "제왕절개술"], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q88"}, {"id": "gsb-2020-L06-Q19", "year": 2020, "qnum": 19, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "32세 여자가 아랫배 불편감과 소량의 질출혈로 병원에 왔다. 최종월경시작일은 7주 전, 평소 월경은 28일 간격으로 규칙적이었다. 질경검진 결과 자궁목은 닫혀 있고, 자궁목의 이동성 압통은 없었다. 골반초음파검사 결과는 사진과 같고, 태아 심박동은 관찰되지 않았다. 진단은? (CRL: 0.94 cm)", "stem_table": null, "options": ["계류유산 (Missed abortion)", "불가피유산 (Inevitable abortion)", "불완전유산 (Incomplete abortion)", "완전유산 (Complete abortion)", "절박유산 (Threatened abortion)"], "answer": [1], "image": "gsb_img/image30.jpeg", "images": [], "id_simple": "2020-Q19"}, {"id": "gsb-2020-L06-Q20", "year": 2020, "qnum": 20, "jokbo_lec_no": "06", "lecture": "산과 출혈", "professor": "박중신", "curr_lec_no": "07", "curr_lecture": "산과 출혈", "stem": "평소 건강한 30세 여자가 아랫배 불편감과 소량의 질출혈로 병원에 왔다. 최종월경시작일은 6주 전, 평소 월경은 28일 간격으로 규칙적이었다. 혈압 120/70mmHg, 맥박 80회/분, 호흡 20회/분, 체온 36.5ºC이었고 혈액과 골반초음파검사 결과는 다음과 같다. 처치는?\n○ 베타사람융모막생식샘자극호르몬:\n(내원 당일) 1,800mIU/mL\n(48시간 후) 2,200mIU/mL\n○ 골반초음파(내원 당일, 48시간 후): 자궁 안에 임신낭이 보이지 않고 자궁 부속기에 덩이도 관찰되지 않음.\n골반강 내 액체가 고여있지 않음.", "stem_table": null, "options": ["경과 관찰", "프로스타글란딘", "메토트렉세이트", "자궁긁어냄술", "복강경수술"], "answer": [3], "image": null, "images": [], "id_simple": "2020-Q20"}, {"id": "gsb-2025-L07-Q53", "year": 2025, "qnum": 53, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "자간전증의 발생기전을 설명하는 “2단계 장애 (two-stage disorder)” 가설에서 1단계 (stage 1)에 해당하는 것을 고르시오", "stem_table": null, "options": ["Angiogenic and Antiangiogenic Factors", "Endothelial Cell Activation", "Faulty endovascular trophoblastic remodeling", "Increased Pressor Responses", "Vasospasm and Hypertension"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q53"}, {"id": "gsb-2025-L07-Q54", "year": 2025, "qnum": 54, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "34주 미만 expectant management 중인 자간전증 산모에서, 산모 안정 및 폐 성숙을 위한 단회 코르티코스테로이드 투여 후 즉시 분만해야 하는 경우와 태아 폐성숙을 위한 스테로이드 치료를 위해 가능하다면 48시간 분만을 연기해야하는 경우 중 즉시 분만 해야하는 경우를 고르시오.", "stem_table": null, "options": ["Oligohydramnios", "Preterm ruptured membranes or labor", "Reversed end-diastolic Doppler flow in umbilical artery", "Uncontrolled severe hypertension", "Worsening renal dysfunction"], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q54"}, {"id": "gsb-2023-L07-Q25", "year": 2023, "qnum": 25, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "다음 중 임신 중 고혈압질환에 대한 기술 중 잘못된 것을 고르시오.", "stem_table": null, "options": ["37세 미산부(nullipara)가 임신을 하면 전자간증 예방을 위하여 저용량 아스피린을 분만 시까지 먹는 것이 추천된다.", "임신 27주에 혈압의 상승과 함께 진통제를 먹어도 지속되는 두통이 있다면 분만을 진행하는 것이 좋다.", "자간증을 예방하기 위해 페니토인(phenytoin)보다 MgSO4를 사용하는 것이 좋다.", "항고혈압제는 수축기 160이상이거나 이완기 110이상이 되어야 사용한다.", "혈압이 150/100이고 혈소판은 90K로 감소한 임산부는 집에서 혈압을 측정하며 통원치료를 받을 수 있다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q25"}, {"id": "gsb-2022-L07-Q73", "year": 2022, "qnum": 73, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "임신 35주의 초임부(nullipara)가 외래에서 혈압이 높 아 입원하여 병력 검진 및 검사를 시행하였다. 임신 전 고 혈압, 당뇨병과 수술 병력은 없었다. 키는 165cm 체중은 82kg였고 신체 검진 상 손과 발에 부종이 있는 것을 제외하고는 특이 소견은 없었다. 4시간 간격으로 측정한 혈압이 150/95mmHg 145/98mmHg였으며 증상으로는 불규칙 한 하복부 통증과 이명(tinnitus)이 있었다. 비수축검사는 반응성(reactive)이었고 초음파로 확인한 태아는 두정위 (vertex)였으며 양수량도 적당하였고 예상 체중은 2300 g으로 50 percentile에 해당하였다. 혈액 및 소변 검사결과는 아래와 같다. 다음 중 이 임신부에 대한 처치로 가장 적당한 것은?", "stem_table": "| Hemoglobin 12.2 g/dLHematocrit 38%Platelet 140,000/mLCholesterol 380 mg/dLAspartate transaminase (AST) 58IU/LAlanine transaminase (ALT) 42IU/LHBsAG/Ab negative/negativeCreatinine 0.7 mg/dLUrine protein creatinine ratio 5.0 |\n|---|", "options": ["퇴원하여 자연 진통이 올때까지 기다린다", "즉시 유도분만", "즉시 제왕절개분만", "임신 37주가 되면 유도분만", "임신 37주가 되면 제왕절개분만"], "answer": [4], "image": null, "images": [], "id_simple": "2022-Q73"}, {"id": "gsb-2022-L07-Q77", "year": 2022, "qnum": 77, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "31세 여자가 임신 15주에 외래를 방문하였다. 2년 전 한 차례 임신하였으며 임신 33주 경 중증임신중독증이 발 생하여 조산하였다. 그 외 특별한 과거력은 없었으며 현재 혈압은 120/75mmHg로 최근 22년간 정기적인 혈압 측 정 결과는 정상이었다. 임신 3개월 전부터 엽산 400ug을 복용중이며 이 외 투약중인 약물은 없었다. 임신중독증 재 발의 위험도를 낮추기 위해 필요한 처치는?", "stem_table": null, "options": ["아스피린 복용", "엽산 증량", "항고혈압제 보용", "와파린 복용", "오메가-3 복용"], "answer": [1], "image": null, "images": [], "id_simple": "2022-Q77"}, {"id": "gsb-2021-L07-Q79", "year": 2021, "qnum": 79, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "임신 35주의 초임부(nullipara)가 입원하여 병력, 검진 및 검사를 시행하였다. 임신 전 고혈압, 당뇨병과 수술 병력은 없었다. 키는 165cm 체중은 82kg이었고 신체검진상 손과 발에 부종이 있는 것을 제외하고는 특이소견은 없었다. 4시간 간격으로 측정한 혈압이 150/95mmHg, 145/98mmHg이었으며 증상으로는 불규칙한 하복부 통증과 이명(tinnitus)이 있었다. 비수축검사는 반응성(reactive)이었고 초음파고 확인한 태아는 두정위(vertex)였으며 양수량도 적당하였고 예상 체중은 2300g으로 50%tile에 해당하였다. 혈액검사 결과는 아래와 같다. 다음 중 이 임신부에 대한 처치로 가장 적당한 것은?", "stem_table": "| Hemoglobin 12.2 g/dLHematocrit 38%Platelet 140,000/mLCholesterol 380 mg/dLAST 58 IU/L, ALT 42 IU/LHBsAG/Ab negative/negativeCreatinine 1.2 mg/dL |\n|---|", "options": ["퇴원하여 자연 진통이 올 때까지 기다린다.", "유도 분만", "제왕절개분만", "임신 37주가 되면 유도 분만", "임신 37주가 되면 제왕절개분만"], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q79"}, {"id": "gsb-2021-L07-Q80", "year": 2021, "qnum": 80, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "자간전증은 신체 전반에 증상이 나타나는 임신 특이 질환으로 발병 기전에 대하여도 많은 연구가 이루어졌다. 부종, 단백뇨, 혈전, 용혈 등을 설명하는 가장 직접적인 발병 기전은 무엇인가?", "stem_table": null, "options": ["vasospasm", "systeic endothelial injury", "increased pressor response", "increased antiangiogenic protein", "acute graft rejection"], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q80"}, {"id": "gsb-2020-L07-Q13", "year": 2020, "qnum": 13, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "산부가 임신 25주에 혈압 160/110, urine protein 3+, Platelet 78K이며 눈이 침침함을 호소하였다. 초음파검사상 태아의 체중은 400gm으로 심한 발육지연 상태였다. 이 산모와 관련된 내용으로 옳은 것을 고르시오.", "stem_table": null, "options": ["HELLP syndrome의 가능성이 높으므로 혈소판을 수혈한다.", "고혈압약은 가능한 사용하지 않는다.", "아기가 너무 작으므로 산모 폐부종이 없다면 집중관찰하면서 임신을 유지한다.", "MgSO4는 아직 투여하기에 이르다.", "extravascular volume이 정상산모에 비하여 감소되어 있으므로 가능한 이뇨제를 사용하지 않는다."], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q13"}, {"id": "gsb-2020-L07-Q14", "year": 2020, "qnum": 14, "jokbo_lec_no": "07", "lecture": "임신 중 고혈압성 질환", "professor": "김병재", "curr_lec_no": "04", "curr_lecture": "임신 중 고혈압성 질환", "stem": "임신 33주 외래에서 측정한 혈압 150/110mmHg, dipstick 요단백검사 2+소견을 보였다. 의심할 수 있는 질환과 관계된 설명으로 옳은 것을 세가지 고르시오.", "stem_table": null, "options": ["태아발육지연이 있으면 바로 분만을 한다.", "담배피는 산모에서 발생 가능성이 높다.", "산모 혈액에서 soluble endoglin 농도가 증가했을 가능성이 있다.", "Trophoblast가 자궁의 spiral artery로 너무 많이 invasion 된 것이 주된 원인이다.", "다태임신 산모에서 소량의 아스피린을 임신 중기에 사용하는 것이 권장되고 있다."], "answer": [1, 3, 5], "image": null, "images": [], "id_simple": "2020-Q14"}, {"id": "gsb-2025-L08-Q35", "year": 2025, "qnum": 35, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "35세 쌍태임신 초산부가 임신 24주에 정기 산전진찰을 위해 내원하였다. 임신 초기 초음파 검사 결과 (그림 1), 현재 초음파 검사 결과 (그림 2), 및 혈액검사 결과이다. 처치는?", "stem_table": "| 혈액: 50g 당부하검사 결과 120 g/dL혈색소 12.3 g/dL, 백혈구 10,000/mm3 혈소판 240,000/mm3 |\n|---|", "options": ["1달 후 외래 추적 관찰", "2주 후 외래 추적 관찰", "매주 외래 추적 관찰", "입원 후 경과 관찰", "응급제왕절개술"], "answer": [2], "image": null, "images": ["gsb_img/image31.jpeg", "gsb_img/image32.jpeg"], "id_simple": "2025-Q35"}, {"id": "gsb-2025-L08-Q36", "year": 2025, "qnum": 36, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "29세 초산부가 임신 25주에 다음과 같은 초음파 소견으로 상담을 위해 내원하였다. 입원 후 태아의 상태를 관찰하기로 하였다. 입원를 고려하게 된 이유는?", "stem_table": "| 초음파) 둔위/ 480g-AFI 10cm (3 percentile for 25 weeks: 594g) |\n|---|", "options": ["산모 나이 29세", "둔위", "태아 예상체중 3 percentile 미만", "양수지수 10cm", "제대동맥 도플러 소견"], "answer": [5], "image": "gsb_img/image33.jpeg", "images": [], "id_simple": "2025-Q36"}, {"id": "gsb-2023-L08-Q51", "year": 2023, "qnum": 51, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "태아수혈증후군에 대한 설명이다. 잘못된 것을 고르시오.", "stem_table": null, "options": ["일란성 쌍태임신에서만 발생한다.", "이융모막 쌍태임신에서는 발생하지 않는다.", "단일 양막 쌍태임신에서는 발생하지 않는다.", "태아경하 레이저 시술이 1차적으로 추천되는 치료법이다.", "동맥-정맥 문합(arterio-venous anastomosis) 이 있으면 발생한다."], "answer": [3], "image": null, "images": [], "id_simple": "2023-Q51"}, {"id": "gsb-2023-L08-Q65", "year": 2023, "qnum": 65, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "31세 임신 32주 쌍테임신 임신부가 초음파검사를 했다. 단일융모막 이양막이고 태아의 신체계측 및 검사 소견은 다음과 같았다. 가장 적절한 처치는?", "stem_table": null, "options": ["태아경을 이용한 레이저 치료를 한다.", "입원하여 집중적 태아감시(fetal surve65.illance)를 한다.", "유도분만을 한다.", "제왕절개분만을 한다.", "1주일 후 외래 방문을 하여 평가한다."], "answer": [5], "image": "gsb_img/image34.png", "images": [], "id_simple": "2023-Q65"}, {"id": "gsb-2022-L08-Q45", "year": 2022, "qnum": 45, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "다음 태아발육부전 태아에 대한 기술 중 잘못된 것을 고르시오", "stem_table": null, "options": ["초음파로 예상되는 저체중아도 건강한 경우가 대부분이다.", "탯줄동맥의 도플러 검사는 임상적 효용성이 뚜렷하다", "임신 38주가 되면 다른 임상적 지표가 정상이더라도 분만하는 것이 좋다", "임산부가 일시적으로 영양섭취가 불량하더라도 태아 발육부전이 되는 경우는 많지 않다", "자궁태반관류부전이 있을 경우 대칭적 발육부전이 발생한다."], "answer": [5], "image": null, "images": [], "id_simple": "2022-Q45"}, {"id": "gsb-2022-L08-Q48", "year": 2022, "qnum": 48, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "무월경 9주 임신부의 초음파 검사 소견이다. 이 임신 에서 일어날 가능성이 없는 것을 고르시오", "stem_table": null, "options": ["weight discordancy", "different gender", "monozygotic twin", "twin to twin transfusion syndrome", "one placenta"], "answer": [4], "image": "gsb_img/image35.png", "images": [], "id_simple": "2022-Q48"}, {"id": "gsb-2021-L08-Q81", "year": 2021, "qnum": 81, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "무월경 6주 임신부의 초음파 검사 소견이다. 임신이 진행하면서 발생할 가능성이 있는 합병증 중 관계없는 것을 고르시오.", "stem_table": null, "options": ["twin to twin transfusion syndrome", "twin reversed arterial perfusion sequence", "twin anemia polycythemia sequence", "cord entanglement", "weight discordance"], "answer": [4], "image": "gsb_img/image36.png", "images": [], "id_simple": "2021-Q81"}, {"id": "gsb-2021-L08-Q82", "year": 2021, "qnum": 82, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "그래프에 표시된 점은 초음파로 측정한 태아의 예측 체중이다. 이 태아의 예후와 관련성이 가장 높은 태아 감시 방법은 무엇인가?", "stem_table": null, "options": ["비수축검사(nonstress test)", "수축자극검사 (contraction stress test)", "제대동맥(umblical artery) 도플러 검사", "정맥관(ductus venosus) 도플러 검사", "생물리학적계수 (biophysical profile)"], "answer": [3], "image": "gsb_img/image37.png", "images": [], "id_simple": "2021-Q82", "note": "(원본 사진 *강의록에 없음)"}, {"id": "gsb-2020-L08-Q9", "year": 2020, "qnum": 9, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "그림과 같이 쌍둥이가 있을 때 발생할 위험이 가장 적은 것은?", "stem_table": null, "options": ["쌍태아간 수혈증후군 (TTTS)", "불일치 쌍태아 (Discordant twins)", "무심장 쌍태아 (Acardiac twins)", "탯줄의 얽힘 (Cord entaglement)", "일태아 사망 (one fetus demise)"], "answer": [4], "image": "gsb_img/image38.jpeg", "images": [], "id_simple": "2020-Q9"}, {"id": "gsb-2020-L08-Q10", "year": 2020, "qnum": 10, "jokbo_lec_no": "08", "lecture": "다태임신, 발육부전, 과숙아", "professor": "이승미", "curr_lec_no": "05", "curr_lecture": "다태임신/발육부전/과숙아", "stem": "30세 임신 33주 초산부가 태동이 준 것 같다고 병원에 왔다. 초음파 검사에서 태아는 두위, 예상 몸무게는 1150g (33주 예상 몸무게 : 5백분위수 1414g, 10백분위수 1573g), 양수지수는 10이었다. 탯줄동맥 도플러 사진은 아래와 같았다. (정상소견) 비수축검사는 반응성이었다. 다음으로 시행해야할 것은?", "stem_table": null, "options": ["1주 뒤에 탯줄동맥 도플러 및 양수지수 확인", "6주 후에 경과관찰", "예방적 항생제 투여", "즉시 유도분만", "응급 제왕절개술"], "answer": [1], "image": "gsb_img/image39.png", "images": [], "id_simple": "2020-Q10"}, {"id": "gsb-2025-L09-Q61", "year": 2025, "qnum": 61, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "37세 초산부가 분만 후 모유수유에 대한 상담을 위해 내원하였다. 환자는 3년 전 유방암으로 좌측 유방절제술 및 방사선치료를 받았으며, 현재는 유방암 재발로 항암제를 복용 중이다. 또한 과거력으로 B형 바이러스 간염 보균자임이 확인되었고, 산전 검사에서 사람유두종바이러스 감염도 진단되었다. 신생아는 건강하게 출생하였고, 출생 직후 B형 바이러스 간염 면역글로불린을 투여받았다. 다음 중 이 산모에서 모유수유를 절대적으로 금해야 하는 가장 중요한 이유는 무엇인가?", "stem_table": null, "options": ["좌측 유방절제술", "방사선치료", "현재 항암제 치료", "B형 간염 보균 상태", "사람유두종바이러스 감염"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q61"}, {"id": "gsb-2025-L09-Q62", "year": 2025, "qnum": 62, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "39세 초산부가 임신 30주에 발생한 조기양막파수로 2주간 입원치료 중 39.0℃의 발열, 자궁 압통, 태아빈맥이 발생하여 융모양막염으로 진단되었다. 태아가 둔위여서 제왕절개술을 통해 분만하였다. 수술 5일째 환자의 수술 부위에서 발적과 압통이 있으며, 화농성 분비물과 함께 수술 부위 일부가 벌어져 있음이 관찰되었다. 이 환자의 치료로 가장 적절한 것은?", "stem_table": "| 혈액: 혈색소 10.3 g/dL, 백혈구 21,000/mm3, 혈소판 180,000/mm3 |\n|---|", "options": ["경과관찰", "항생제 투여 및 배농", "고용량 스테로이드 투여", "즉시 수술부위 재봉합", "조직검사"], "answer": [2], "image": null, "images": ["gsb_img/image40.png", "gsb_img/image41.png"], "id_simple": "2025-Q62"}, {"id": "gsb-2023-L09-Q16", "year": 2023, "qnum": 16, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "출산 후 유방의 변화 및 이상, 수유 및 수유 시 피임에 관한 설명으로 옳지 않은 것은?", "stem_table": null, "options": ["유방울혈은 출산 직후 발생하며, supportive care로 충분하다.", "유방염증은 출산 후 3주 전후에 호발하며, 항생제(Dicloxacillin 또는 Erythromycin)를 투약한다.", "유방농양은 배액 또는 흡인이 필요하다.", "B형 간염바이러스 보균자라 하더라도 수유할 수 있다.", "수유 중 피임이 필요할 경우, 출산 후 2~3주 후부터 combined estrogen-progestin contraceptives를 처방할 수 있다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q16"}, {"id": "gsb-2023-L09-Q85", "year": 2023, "qnum": 85, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "10일 전 정상분만한 31세 임산부가 다량의 질출혈로 응급실로 내원하였다. 활력징후는 혈압 110/70mmHg, 맥박 115/min, 호흡수 20/min이었다. 질경 검사상 간헐적으로 출혈이 있었고, 자궁은 배꼽 3~4개 손가락 아래에서 촉지되었으나, 아주 단단하게 촉지되지는 않았다. 초음파 검사에서는 자궁강내 1.6cm (폭) x 2cm (길이)의 혼합성 에코음영이 관찰되었다. 우선 해야 할 처치로 옳지 않은 것은?", "stem_table": null, "options": ["초음파 유도하에 curettage를 시행한다.", "methergine을 투여한다.", "oxytocine을 투여한다.", "azithromycin 또는 doxycycline을 투여한다.", "활력징후를 계속 면밀하게 관찰한다."], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q85"}, {"id": "gsb-2022-L09-Q11", "year": 2022, "qnum": 11, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "39주 산모가 양막파수로 유도분만 중 활성기 개대 장애로 제왕절개분만을 하였다. 수술 4일 후부터 38.5도의 발열 및 우측 복통이 발생하여 시행한 전산화 단층촬영 영상은 다음과 같다. 패혈증 및 장구균 감염의 증상이나 징후는 없었으며, 신기능은 정상이었다. 상환에게 가장 적합한 항생제 요법은?", "stem_table": null, "options": ["Vancomycin", "Clindamycin+Gentamicin", "Levofloxacin+Penicillin", "Metronidazole", "Imipenem"], "answer": [2], "image": "gsb_img/image42.png", "images": [], "id_simple": "2022-Q11"}, {"id": "gsb-2022-L09-Q49", "year": 2022, "qnum": 49, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "수유 중인 여성이 갑작스럽게 발생한 왼쪽 유방 통증으로 병원에 왔다. 출산한지 3주째라고 하며 아래 사진과 같은 국소적인 부위에 부종과 압통이 관찰되었고 만져지는 덩어리는 없었다. 체온은 38.1’C로 측정되었다. 적절한 처치는?", "stem_table": null, "options": ["유방마사지", "Dicloxacillin", "왼쪽 유방으로 수유", "유방초음파", "유방촬영(mammography)"], "answer": [2], "image": "gsb_img/image43.png", "images": [], "id_simple": "2022-Q49"}, {"id": "gsb-2021-L09-Q7", "year": 2021, "qnum": 7, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "출산 후 수유 중인 여성에게 투약할 경우 모유의 양이 감소할 수 있어 신중하게 사용해야 하는 피임 방법은?", "stem_table": null, "options": ["프로게스틴 단일 피임약", "에스트로겐-프로게스틴 복합 피임약", "메드록시포로게스테론 주사", "프로게스틴 피하이식형 임플란트", "프로게스테론 분비형 질내고리"], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q7"}, {"id": "gsb-2021-L09-Q8", "year": 2021, "qnum": 8, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "39주 산모가 양막파수로 유도분만 중 활성기 개대 장애로 제왕절개분만을 하였다. 수술 4일 후부터 38.5도의 발열 및 우측 복통이 발생하여 시행한 전산화 단층촬영 영상은 다음과 같다. 패혈증 및 장구균 감염의 증상이나 징후는 없었으며, 신기능은 정상이었다. 상환에게 가장 적합한 항생제 요법은?", "stem_table": null, "options": ["Vancomycin", "Clindamycin+Gentamicin", "Levofloxacin+Penicillin", "Metronidazole", "Imipenem"], "answer": [2], "image": "gsb_img/image42.png", "images": [], "id_simple": "2021-Q8", "note": "(원본 사진 *강의록에 없음)"}, {"id": "gsb-2020-L09-Q17", "year": 2020, "qnum": 17, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "출산 후 수유 중인 여성에게 투약할 경우 모유의 양이 감소할 수 있어 신중하게 사용해야하는 피임 방법은?", "stem_table": null, "options": ["포르게스틴 단일 피임약", "에스트로겐-프로게스틴 복합 피임약", "메드톡시프로게스테론 주사", "포르게스틴 피하이식형 임플란트", "프로게스테론 분비형 질내고리"], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q17"}, {"id": "gsb-2020-L09-Q18", "year": 2020, "qnum": 18, "jokbo_lec_no": "09", "lecture": "정상 산욕기, 산욕기이상", "professor": "김현지", "curr_lec_no": "09", "curr_lecture": "정상 산육기/산육기이상", "stem": "39주 산모가 양막파수로 유도분만 중 활성기 개대 장애로 제왕절개분만을 하였다. 수술 4일 후부터 38.5도의 발열 및 우측복통이 발생하여 시행한 전산화 단층촬영 영상은 다음과 같다. 패혈증 및 장구균 감염의 증상이나 징후는 없었으며 신기능은 정상이었다. 상환에게 가장 적합한 항생제 요법은?", "stem_table": null, "options": ["Vancomycin", "Clindamycin + Gentamicin", "Levofloxacin + Penicillin", "Metronidazole", "Imipenem"], "answer": [2], "image": "gsb_img/image44.jpeg", "images": [], "id_simple": "2020-Q18"}, {"id": "gsb-2025-L10-Q3", "year": 2025, "qnum": 3, "jokbo_lec_no": "10", "lecture": "유산, 자궁외임신", "professor": "조희영", "curr_lec_no": "10", "curr_lecture": "유산/자궁외임신", "stem": "34세 산과력 0-0-1-0인 여자가 임신 8주차에 갑작스러운 하복부 통증과 출혈이 있어 왔다. 환자는 생리주기가 규칙적이었고, 2주 전 시행한 초음파에서 자궁 내 임신낭을 확인하지 못했고 혈청 베타사람융모생식샘자극호르몬 수치는 1,000 mIU/mL 이었다고 한다. 이번에 시행한 초음파상 자궁 내에서 여전히 임신낭이 확인 되지 않았고 난소 주변에 비정상적인 구조물이 발견 되었고 곧창자자궁오목에 액체가 고여있었다.혈압 126/82 mmHg, 맥박수 80회/분, 호흡수 16회/분, 체온 36.9‘C 이었다. 혈액 검사 결과는 백혈구 9,220/mm3, 혈색소 12.8 g/dL, 혈소판 162,000 / mm3 이었다. 진단과 적절한 치료는?", "stem_table": null, "options": ["자궁내 임신- 혈청 베타사람융모생식샘자극호르몬검사 –경과관찰", "자궁외 임신- 혈청 베타사람융모생식샘자극호르몬검사 –수술", "불완전 유산 -혈청 베타사람융모생식샘자극호르몬검사-경과관찰", "난소낭종- 자기공명영상촬영-수술", "절박유산- 자기공명영상촬영-경과관찰"], "answer": [2], "image": null, "images": [], "id_simple": "2025-Q3"}, {"id": "gsb-2025-L10-Q4", "year": 2025, "qnum": 4, "jokbo_lec_no": "10", "lecture": "유산, 자궁외임신", "professor": "조희영", "curr_lec_no": "10", "curr_lecture": "유산/자궁외임신", "stem": "42세 산과력 0-0-0-0인 여자가 아랫배 불편감과 소량의 질출혈로 병원에 왔다. 최종월경시작일은 8주 전, 평소 월경은 28일 간격으로 규칙적이었다. 질경검진 결과 자궁목은 닫혀 있고, 자궁목의 이동성압통은 없었다. 골반초음파검사 결과는 사진과 같고, 태아심박동이 관찰되었다. 진단은?", "stem_table": null, "options": ["자궁내 계류유산 (Missed abortion)", "자궁외 불가피유산 (Inevitable abortion)", "불완전 불완전유산 (Incomplete abortion)", "난소낭완전유산 (Complete abortion)", "절박유절박유산 (Threatened abortion)"], "answer": [5], "image": "gsb_img/image45.png", "images": [], "id_simple": "2025-Q4"}, {"id": "gsb-2023-L10-Q66", "year": 2023, "qnum": 66, "jokbo_lec_no": "10", "lecture": "유산, 자궁외임신", "professor": "조희영", "curr_lec_no": "10", "curr_lecture": "유산/자궁외임신", "stem": "32세 여자가 아랫배 불편감과 소량의 질출혈로 병원에 왔다. 최종월경시작일은 7주 전, 평소 월경은 28일 간격으로 규칙적이었다. 질경검진 결과 자궁목은 닫혀 있고, 자궁목의 이동성압통은 없었다. 초음파검사 결과는 사진과 같고, 태아심박동은 관찰되지 않았다. 진단은?", "stem_table": null, "options": ["계류유산 (Missed abortion)", "불가피유산 (Inevitable abortion)", "유도분만을 한다.", "제왕절개분만을 한다.", "1주일 후 외래 방문을 하여 평가한다."], "answer": [1], "image": "gsb_img/image46.png", "images": [], "id_simple": "2023-Q66"}, {"id": "gsb-2023-L10-Q86", "year": 2023, "qnum": 86, "jokbo_lec_no": "10", "lecture": "유산, 자궁외임신", "professor": "조희영", "curr_lec_no": "10", "curr_lecture": "유산/자궁외임신", "stem": "32세 산과력 0-0-2-0인 여자가 질출혈로 병원에 왔다. 마지막 월경 시작일은 6주 전이고 월경주기는 1~2개월 간격으로 불규칙하다. 혈압 110/70mmHg, 맥박 90회/분, 호흡 20회/분, 체온 36.5℃이다. 골반초음파검사에서 자궁과 자궁부속기는 정상이고 곧창자자궁오목에 액체는 고여 있지 않다. 혈액검사 결과는 다음과 같다. 처치는?\n혈색소 12.0g/dL, 백혈구 7,900mm^3, 혈소판 220, 000/mm^3\n베타사람융모생식샘자극호르몬 1,000 mIU/mL", "stem_table": null, "options": ["48시간 후 혈청 베타사람융모생식샘자극호르몬 검사", "메토트렉세이트", "곧창자자궁오목천자", "자궁내막긁어냄술", "복강경"], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q86"}, {"id": "gsb-2022-L10-Q4", "year": 2022, "qnum": 4, "jokbo_lec_no": "10", "lecture": "유산, 자궁외임신", "professor": "조희영", "curr_lec_no": "10", "curr_lecture": "유산/자궁외임신", "stem": "32세 산과력 0-0-2-0인 여자가 질출혈로 병원에 왔다. 마지막 월경 시작일은 6주 전이고 월경주기는 1~2개월 간격으로 불규칙하다. 혈압 110/70mmHg, 맥박 90회/분, 호흡 20회/분, 체온 36.5’C이다. 골반초음파검사에서 자궁과 자궁부속기는 정상이고 곧창자자궁오목에 액체는 고여있지 않다. 혈액검사 결과 rr_lec_no": "20", "curr_lecture": "청소년의학", "stem": "청소년기 흡연/음주 교육에 대한 설명이다. 틀린 것은?", "stem_table": null, "options": ["청소년기 교육은 흡연 시작 시기를 늦출 수 있다.", "흡연과 음주로 인한 급성 손상과 일탈 행위를 줄일 수 있다.", "교육 시스템의 구축과 지속에 드는 비용에 비해 건강/경제적 이들이 더 크다.", "청소년 발달 상태에 맞는 교육 프로그램을 구성하여야 성공의 가능성이 높아진다.", "절제 행동을 가르쳐도 사회정서적 발달이 미숙하여 흡연율이 매년 지속적으로 증가하고 있다."], "answer": [5], "image": null, "images": [], "id_simple": "2021-Q30"}, {"id": "gsb-2020-L20-Q39", "year": 2020, "qnum": 39, "jokbo_lec_no": "20", "lecture": "청소년의학", "professor": "김주휘", "curr_lec_no": "20", "curr_lecture": "청소년의학", "stem": "1형 당뇨병으로 7년 동안 치료받던 13세 여아가 케톤산증으로 응급실에 왔다. 최근 4주일 전부터 인슐린 주사를 잘 맞지 않았으며, 특히 2일 동안은 지속형 인슐린뿐만 아니라, 식사 시 맞는 인슐린 주사도 맞지 않았다. 최근 1년 동안의 당화혈색소 값이다. 최근 인슐린 주사를 잘 맞지 않는 이유를 확인하는데 있어, 가장 가치가 적은 질문 항목은?", "stem_table": null, "options": ["친구와의 관계", "여가활동", "부모와의 관계", "선생님과의 관계", "당뇨에 대한 정서적 반응"], "answer": [2], "image": "gsb_img/image84.png", "images": [], "id_simple": "2020-Q39"}, {"id": "gsb-2020-L20-Q40", "year": 2020, "qnum": 40, "jokbo_lec_no": "20", "lecture": "청소년의학", "professor": "김주휘", "curr_lec_no": "20", "curr_lecture": "청소년의학", "stem": "우울로 인해 자살 시도 성향을 보이는 환자에게 확인해야 하는 것으로 가장 관련성이 적은 것은?", "stem_table": null, "options": ["흡연여부", "가족 내의 상황", "죽음에 대한 인식변화", "친구관계의 변화", "주변환경의 변화"], "answer": [1], "image": null, "images": [], "id_simple": "2020-Q40"}, {"id": "gsb-2025-L21-Q45", "year": 2025, "qnum": 45, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "6세 된 여아가 지하 방에서 구조되었다. 체중은 12 kg, 외견 상 갈비뼈가 도드라지게 보이고, 복부는 움푹 들어가있다. 온 몸에 멍 자국이 발견되었다. 경찰 조사 결과 장기간 부모로부터 방치된 것이 확인되었다. 가능한 신체 소견은?", "stem_table": null, "options": ["부종이 있다.", "회색 머리카락", "심박수가 느리다.", "체중 대비 키가 작다.", "피부 자극 부의의 변색"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q45"}, {"id": "gsb-2025-L21-Q46", "year": 2025, "qnum": 46, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "15개월 여아가 걷는 모습이 이상하여 내원하였다. 양발을 넓게 벌리고 걷는 모습이었으며, 이유식은 하고 있지 않고, 생우유를 하루 1000mL 먹고 있었다. 검사 결과는 다음과 같았다. 추가적으로 가장 중요한 검사는?", "stem_table": "| 혈색소 10.1 g/dL, 백혈구 9,000/mm3, 혈소판 180,000/mm3, 프로트롬빈시간 1.12 INR칼슘 7.0mg/dL, 인 2.3 mg/dL, 철 30 mg/dL,알칼리인산분해효소 900 U/L말초혈액펴바른 검사: 저염색성의 작은 적혈구, 다양한 모양의 적혈구, 정상 백혈구 |\n|---|", "options": ["혈청 알부민", "흉부 방사선 검사", "갑상샘자극호르몬", "혈청 25-hydroxycholecalciferol", "혈청 1,25-hydroxyergocalciferol"], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q46"}, {"id": "gsb-2023-L21-Q6", "year": 2023, "qnum": 6, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "만 10세 여아가 1년 전부터 체중이 많이 늘어서 병원에 왔다. 초등학교 입학하면서부터 삼겹살과 치킨, 피자, 햄버거를 즐겨먹고, 간식으로 떡볶이, 과자, 음료수, 아이스크림을 자주 먹으며, 주 5회 이상 야식을 하였고, 운동을 전혀 않으면서 평일에는 4시간 이상, 주말에는 하루 종일 TV를 보거나 스마트폰 게임을 하면서 체중이 급격히 증가하였다. 과거력에서 임신나이 38주에 제왕절개로 출생체중 3.9kg으로 출생하였다. 가족력에서 어머니는 복부비만, 당뇨, 고혈압이 있었다.\n내원 시 신체계측 결과는 다음과 같다.\n신체 진찰 시 소견은 그림 1과 같다. 진단은?\n[그림1]", "stem_table": "| 체중 50kg (95백분위수 이상)신장 139.1cm (50 백분위수)체질량지수 25.9kg/m2 (95 백분위수 이상)복부둘레 80cm (90 백분위수 이상) |\n|---|", "options": ["간찰진 (intertrigo)", "다한증 (hyperhidrosis)", "물소혹 (buffalo hump)", "적색 땀띠 (miliaria rubra)", "흑색가시세포증 (acanthosis nigricans)"], "answer": [5], "image": "gsb_img/image85.png", "images": [], "id_simple": "2023-Q6"}, {"id": "gsb-2023-L21-Q77", "year": 2023, "qnum": 77, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "성장부전을 주소로 방문한 영유아에서 신체계측을 시행하였다. 영양결핍이 의심되는 경우 결핍의 급성과 만성 여부를 짐작하는 데 도움이 되는 지표는?", "stem_table": null, "options": ["두위", "체중", "허리둘레", "피부주름 두께", "신장 대비 체중"], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q77"}, {"id": "gsb-2022-L21-Q53", "year": 2022, "qnum": 53, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "평소 건강하던 만 11세 남아가 코로나 판데믹 이후로 2.5 년 동안 지속적으로 체중증가를 보이던 중 학교에서 시행한 학생건강검진 결과 간효소치의 상승 소견이 있다고 듣고 내원하였다. 환아는 기름진 육류와 패스트푸드, 과자, 음료수 아이스크림 위주로 먹으며 과식, 야식을 자주 하였 고 사회적 거리두기와 비대면 수업으로 인해 신체활동이 감소한 상태에서 운동을 전혀 않고 하루 6시간 이상 컴퓨 터와 스마트폰으로 게임을 하면서 체중이 15kg 정도 급격 히 늘었다고 한다. 혈액검사에서 갑상샘 호르몬과 부신피질 호르몬의 이상소견은 없었다\n이 환자에서 볼 수 있는 소견으로 가장 가능성 높은 항목은?", "stem_table": "| 체중 68kg (95 백분위수 이상)신장 152cm (50 백분위수)체질량지수 29.4 (99 백분위수 이상)복부둘레 98cm (90백분위수 이상) |\n|---|", "options": ["Buffalo hump", "비장 비대", "전신의 다모증", "목의 흑색가시세포종", "하지와 함요부종"], "answer": [4], "image": null, "images": [], "id_simple": "2022-Q53"}, {"id": "gsb-2022-L21-Q88", "year": 2022, "qnum": 88, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "12세 여아가 내원 5개월 전부터 살찔 것 같다며 음식 섭취를 거부하여 급격한 14kg의 체중감소를 보여서 내원하였다. 내원 시 신체계측 결과는 다음과 같다. 환자의 이학적 검진 시 눈꺼풀이나 사지의 부종은 없었다.?\n이 환자의 영양결핍 유형에서 나타나는 소견으로 가장 가능성 높은 항목은?", "stem_table": "| 체중 33.5kg, 연령별 체중 3백분위 수 미만에 해당 신장별 체중 3 백분위수 미만에 해당신장 158cm, 연령별 신장 50 백분위수에 해당 |\n|---|", "options": ["피부 주름", "모발 숱 감소와 색조변화", "자극받는 부위의 피부염", "간비대", "복부팽만"], "answer": [1], "image": null, "images": [], "id_simple": "2022-Q88"}, {"id": "gsb-2021-L21-Q31", "year": 2021, "qnum": 31, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "평소 건강하던 12세 여아가 내원 3개월 전부터 친구들에게 살쪘다고 놀림을 받은 이후부터 음식 섭취를 거부하여 15kg의 체중감소를 보여서 내원하였다. 내원 시 신체계측 결과는 다음과 같다. 진찰 시 부종은 없었다. 이 환자의 영양결핍 유형으로 가장 옳은 것은?", "stem_table": "| 체중 34.1kg, 연령별 체중 5-10 백분위수에 해당            신장별 체중 3 백분위수 미만에 해당신장 152cm, 연령별 신장 50 백분위수에 해당 |\n|---|", "options": ["underweight", "wasting", "stunting", "Kwashiokor", "Marasmic kwashiokor"], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q31"}, {"id": "gsb-2021-L21-Q32", "year": 2021, "qnum": 32, "jokbo_lec_no": "21", "lecture": "소아의 영양결핍과 비만", "professor": "심정옥", "curr_lec_no": "21", "curr_lecture": "소아의 영양결핍과 비만", "stem": "평소 건강하던 13세 남아가 내원 4개월 전부터 복통, 설사, 혈변이 지속되면서 12kg의 체중감소를 보 한 적이 있고, 이후 월경량이 절반 정도로 감소하였다고 한다. 여성호르몬 검사와 자궁난관조영술 결과가 아래와 같고 질초음파 검사에서 이상소견이 보이지 않았다면, 난임의 원인으로 가장 가능성이 높은 진단은?", "stem_table": "| MCD#3 LH 3.3 (1~12mIU/mL), FSH 5.9 (1~12mIU/mL), Estradiol 60 (30~120pg/ml)MCD#21 progesterone 10.5 (1~30ng/ml) |\n|---|", "options": ["아셔만 증후군 (Asherman‘s syndrome)", "안드로겐 무감성 증후군 (Androgen insensitivity syndrome)", "다낭성 난소 증후군 (Polycystic ovary syndrome)", "황체기 결함 (Luteal phase defect)", "터너 증후군 (Turner syndrome)"], "answer": [1], "image": "gsb_img/image101.jpeg", "images": [], "id_simple": "2025-Q56"}, {"id": "gsb-2023-L24-Q30", "year": 2023, "qnum": 30, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "31세 여성이 1년 간 임신이 되지 않아 병원에 왔다. 월경주기는 28일 간격으로 규칙적이고, 월경통은 없다고 한다. 2년전 임신 9-10주 경에 인공 임신 중절을 한 적이 있고, 이후 월경량이 절반 정도로 감소하였다고 한다. 여성호르몬 검사와 자궁난관조영술 결과가 아래와 같고 질초음파 검사에서 이상소견이 보이지 않았다면, 난임의 원인으로 가장 가능성이 높은 진단은?", "stem_table": "| MCD#3 LH 3.5 (1~12mIU/mL), FSH 4.8 (1~12mIU/mL), Estradiol 52 (30~120pg/ml)MCD#21 progesterone 10.7 (1~30ng/ml) |\n|---|", "options": ["터너 증후군 (Turner syndrome)", "안드로겐 무감성 증후군 (Androgen insensitivity syndrome)", "다낭성 난소 증후군 (Polycystic ovary syndrome)", "황체기 결합 (Luteal phase defect)", "아셔만 증후군 (Asherman’s syndrome)"], "answer": [5], "image": "gsb_img/image102.png", "images": [], "id_simple": "2023-Q30"}, {"id": "gsb-2023-L24-Q48", "year": 2023, "qnum": 48, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "32세 산과력 0-0-0-0인 여자가 결혼 후 3년 동안 피임을 하지 않았으나, 임신되지 않아 병원에 왔다. 월경은 28일 주기로 규칙적이었고, 신체검진에서 특이소견은 없었다. 혈청검사에서 항뮬러관 호르몬(Anti-Mullerian hormone) 수치는 3.2ng/mL로 정상범위었고, 초음파에서 동난포 개수(Antral follicle count)는 왼쪽 난소에 9개, 오른쪽 난소에 10개였으며, 남편의 정액검사 결과는 정상이었다. 자궁난관 조영술 사진이 아래와 같을 때, 이 환자에서 임신을 위한 처치는?", "stem_table": null, "options": ["자궁내시경", "인공수정", "체외수정 시술", "자궁내막 소파술", "배란유도"], "answer": [3], "image": "gsb_img/image103.png", "images": [], "id_simple": "2023-Q48"}, {"id": "gsb-2022-L24-Q80", "year": 2022, "qnum": 80, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "32세 여성이 1년간 임신이 되지 않아 병원에 왔다. 월 경주기는 28일 간격으로 규칙적이고 월경통은 없다고 한다. 결혼 전 임신 9-10주 경에 인공 임신 중절을 한 적이 있고 이후 월경량이 절반 정도로 감소하였다고 한다. 여성 호몬 검사와 자궁난관조영술 결과가 아래와 같고 질초음파 검사에서 이상소견이 보이지 않았다면 난임의 원인으로 가장 가능성이 높은 진단은?", "stem_table": null, "options": ["터너증후군(Turner syndrome)", "안드로겐 무감성 증후군(Androgen insensitivity syndrome)", "다낭성 난소 증후군(Polycystic ovary syndrome)", "황체기 결함(Luteal phase defect)", "아새먼 증후군(Asherman’s syndrome)"], "answer": [5], "image": "gsb_img/image104.png", "images": [], "id_simple": "2022-Q80"}, {"id": "gsb-2022-L24-Q91", "year": 2022, "qnum": 91, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "31세 여자가 결혼 후 1년 동안 임신이 되지 않아 병원에 왔다. 여성호르몬 검사, 질초음파 검사 및 자궁난관조영 술 검사는 모두 정상소견이었다. 3일 금욕 후 시행한 남편의 정액검사가 아래와 같을 떄 가장 적절한 처치는", "stem_table": "| 정액 부피 (mL) 1.4 (1.3-1.5)총 정자수 2.0(x106 per ejaculate)정자 운동성(%) 5(40-43)정상모양의 정자 비율 (%) 1(3.9-4) |\n|---|", "options": ["자연임신시도", "세포질 내 정자주입술(Intracytoplasmic sperm injection)", "프로게스테론(Progesterone)", "자궁내시경(Hysteroscopy)", "진단적 복강경(Diagnostic laparoscopy)"], "answer": [2], "image": null, "images": [], "id_simple": "2022-Q91"}, {"id": "gsb-2021-L24-Q35", "year": 2021, "qnum": 35, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "불임부부의 정액검사 (Semen analysis) 결과이다. 남편의 나이는 35세이다. 이 결과의 해석은?", "stem_table": "| Volume: 2mlConcentration: 25 million/mlMortility: forward progression 15%Morphology (strict criteria): 10%White blood cell: less than 1 million/ml |\n|---|", "options": ["Normal semen analysis", "Oligozoospermia", "Astenozoospermia", "Teratozoospermia", "Leukospermia"], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q35"}, {"id": "gsb-2021-L24-Q36", "year": 2021, "qnum": 36, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "불임부부의 검사 결과이다. 여성의 나이는 39세이고, 남편의 나이는 38세이다. 병력청취상 결혼한 지 5년이 되었고, 첫 1년만 월경주기법으로 피임을 하였고, 이후에는 피임을 하지 않았다. 월경주기는 규칙적이며, 여드름, 월경통 등은 없었다. 과거 골반염의 병력도 없었다. 골반 초음파검사 및 HSG는 정상이었다. 3일간 금욕한 남편의 정액검사에는 이상이 없었다. 이 환자에서 현재 가장 필요한 것은?", "stem_table": null, "options": ["ovarian reserve 검사", "정액검사 재검사", "Saline hysterosonography", "Hysteroscopy", "진단복강경검사 (Diagnostic laparoscopy)"], "answer": [1], "image": null, "images": [], "id_simple": "2021-Q36"}, {"id": "gsb-2020-L24-Q49", "year": 2020, "qnum": 49, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "32세 여자가 1년동안 임신이 되지 않아 내원하였다. 생리는 28일마다 규칙적으로 하였으며, 생리통은 없었다. 결혼 전 9~10주에 인공임신중절을 하고, 자궁 소파술을 받았으며, 남아있는 것이 있어 이후 소파술을 여러번 더 받았다. 생리양은 이전에 비해 절반으로 감소하였고, 검사 결과는 아래 그림과 같고, 질초음파 검사 결과는 정상이었다.\nMCD3 : LH 3.3, FSH 5.9, Estradiol 60\nMCD21 Progesterone 10.5", "stem_table": null, "options": ["터너증후군", "안드로겐 무감", "다낭성난소증후군", "황체기결함", "아셔만 증후군"], "answer": [5], "image": "gsb_img/image105.png", "images": [], "id_simple": "2020-Q49"}, {"id": "gsb-2020-L24-Q50", "year": 2020, "qnum": 50, "jokbo_lec_no": "24", "lecture": "불임", "professor": "구승엽", "curr_lec_no": "24", "curr_lecture": "불임", "stem": "31세 여성이 결혼 후 1년 간 임신이 되지 않아 내원하였다. 이 환자는 키 159cm, 체중 69kg이었으며, 하복부에 털이 많고, 월경이 불규칙하여 1년에 3-4회 정도 하였다. 이 환자는 보조생식술을 시행한 적은 없으며, 난관조영술 소견은 정상이었다. 남편의 정액검사는 정상이었다. 초음파 상 오른쪽 난소와 왼쪽 난소에 각각 19개와 15개의 cyst가 관찰되었다. 이 환자에서 임신을 위해 처방하여야할 약제는?", "stem_table": null, "options": ["생식샘자극호르몬방출호르몬 작용제", "레트로졸", "프로게스테론", "도파민 agonist", "생식샘자극호르몬"], "answer": [3], "image": "gsb_img/image106.png", "images": [], "id_simple": "2020-Q50"}, {"id": "gsb-2025-L25-Q43", "year": 2025, "qnum": 43, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "자궁근종이 여성호르몬과 연관되어 있다는 근거로 옳은 것은?", "stem_table": null, "options": ["자궁근종은 초경 이전에도 흔하게 발견된다.", "이른 초경은 자궁근종의 발생을 증가시킨다.", "자궁근종이 있는 여성의 혈청 에스트로겐 농도가 높다", "비만은 자궁근종의 발생을 감소시킨다.", "출산을 여러번 한 여성은 자궁근종 발생이 증가한다."], "answer": [2], "image": null, "images": [], "id_simple": "2025-Q43"}, {"id": "gsb-2025-L25-Q44", "year": 2025, "qnum": 44, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "42세 여성의 자궁절제술 소견이다. 이 환자에서 수술을 결정하게 된 적응증으로 예상되는 것은?", "stem_table": null, "options": ["무월경", "희발월경", "유방통", "월경통", "절박유산"], "answer": [4], "image": null, "images": ["gsb_img/image107.jpeg", "gsb_img/image108.jpeg"], "id_simple": "2025-Q44"}, {"id": "gsb-2023-L25-Q2", "year": 2023, "qnum": 2, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "자궁근종이 여성호르몬과 연관되어 있다는 근거로 옳은 것은?", "stem_table": null, "options": ["자궁근종은 폐경 이후에도 커진다.", "흡연은 자궁근종의 발생을 증가시킨다.", "이른 초경은 자궁근종의 발생을 증가시킨다.", "비만은 자궁근종의 발생을 감소시킨다.", "자궁근종이 있는 여성은 근종이 없는 여성에 비해 혈청 에스트로겐 농도가 높다."], "answer": [3], "image": null, "images": [], "id_simple": "2023-Q2"}, {"id": "gsb-2023-L25-Q15", "year": 2023, "qnum": 15, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "35세 여성이 극심한 복통으로 왔다. 복통의 원인은 근종의 염전으로 생각되는데, 가장 가능성 높은 근종의 위치를 고르시오.", "stem_table": null, "options": ["1", "2", "3", "4", "5"], "answer": [1], "image": "gsb_img/image109.png", "images": [], "id_simple": "2023-Q15"}, {"id": "gsb-2022-L25-Q27", "year": 2022, "qnum": 27, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "31세 여성이 월경과다와 난임으로 병원에 왔다. 월경통 은 심하지 않다고 하며 2년 전 결혼을 하여 임신을 시도하였으나 아직 임신이 되지 않고 있다고 한다. 초음파 영상은 다음과 같다. 치료방법으로 가장 적절한 것은?", "stem_table": null, "options": ["선택적 프로게스테론 수용체 조절제( selective progesterone receptor modulator)", "자궁근종 용해술(myolysis)", "고강도 집속 초음파(HIFU)", "자궁경하 자궁근종 절제술(hysteroscopic myomectomy)", "복강경하 자궁근종 절제술(laparoscopic myomectomy)"], "answer": [5], "image": "gsb_img/image110.png", "images": [], "id_simple": "2022-Q27"}, {"id": "gsb-2022-L25-Q65", "year": 2022, "qnum": 65, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "아래 원으로 표시된 부분의 자궁근종으로 인해 환자가 경험할 수 있는 가장 흔한 증상을 고르시오", "stem_table": null, "options": ["골반통", "월경과다", "월경통", "빈뇨", "배변장애"], "answer": [2], "image": "gsb_img/image111.png", "images": [], "id_simple": "2022-Q65"}, {"id": "gsb-2021-L25-Q37", "year": 2021, "qnum": 37, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "다음은 자궁근종에 관한 설명이다. 맞는 것은?", "stem_table": null, "options": ["폐경 전 급격한 크기 증가는 암을 의심하여야 한다.", "에스트로겐은 크기 증가, 프로게스테론은 크기를 감소시킨다.", "임신 중 크기가 커진 근종은 분만 후에도 크기가 유지된다.", "Type 0 점막하(pedunculated, submucosal) 근종은 fertility에 영향을 미친다.", "임신 중 근종의 degeneration에 의한 통증은 곧바로 조기진통으로 이어진다."], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q37"}, {"id": "gsb-2021-L25-Q38", "year": 2021, "qnum": 38, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "산과력 0-0-0-0인 35세 기혼여성이 자궁근종으로 의뢰되었다. 초음파검사 결과 10cm의 intramural myoma (FIGO type O-3)가 관찰되었다. 평소 월경양이 많았으며, 가끔 한 달에 두 번 월경을 하여 출혈인지 월경인지 구별이 안 된다고 하였다. 혈액검사 결과는 Hb: 9.5 mg/dl 이었다. 현재 임신을 하려고 노력하고 있다고 하였다. 이 환자의 치료로서 적절한 것은?", "stem_table": null, "options": ["자궁내막소작술 (endometrial ablation)", "MRgHIFU (MR guided high frequency ultrasound)", "Uterine embolization", "Mirena(progesterone containing IUD) insertion", "Laparoscopic myomectomy"], "answer": [5], "image": null, "images": [], "id_simple": "2021-Q38"}, {"id": "gsb-2020-L25-Q51", "year": 2020, "qnum": 51, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "38세 산과력이 2-0-0-2인 여자 환자가 월경통과 과다월경을 주소로 내원하였다. 환자는 1년 전 타 병원에서 미레나를 삽입하였으나, 삽입 1개월 후 빠진 전력이 있다. 환자는 NSAIDs와 경구피임약 등을 복용하였으나 효과를 보지 못하였다. 환자는 향후 임신계획이 없다고 하였다. 이 환자의 초음파 소견은 자궁크기가 증가하였고, 근층이 증가한 소견을 보였다. 이 환자에게 가장 적절한 치료법은?", "stem_table": null, "options": ["근종절제술", "자궁절제술", "자궁경수술", "온열요법", "소파술"], "answer": [2], "image": "gsb_img/image112.png", "images": [], "id_simple": "2020-Q51"}, {"id": "gsb-2020-L25-Q52", "year": 2020, "qnum": 52, "jokbo_lec_no": "25", "lecture": "자궁근종, 자궁선근증", "professor": "김훈", "curr_lec_no": "25", "curr_lecture": "자궁근종/자궁선근증", "stem": "산과력 0-0-0-0인 32세 여성이 월경과다로 내원하였다. 이 환자는 임신을 원하고, 초음파와 다음과 같을 때, 이 환자에게 가장 적절한 치료법은?", "stem_table": null, "options": ["복강경하 장막하근종 절제술", "자궁내막 소파수술", "자궁경부 원추절제술", "개복하 전자궁절제술", "자궁경 수술"], "answer": [5], "image": "gsb_img/image113.png", "images": [], "id_simple": "2020-Q52"}, {"id": "gsb-2025-L26-Q31", "year": 2025, "qnum": 31, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "45세 여자가 산부인과 정기검진을 위해 병원에 왔다. 문진상 평소 생리는 규칙적으로 하며 산과력은 2-0-0-2로 더 이상의 출산은 원치 않았다. 자궁경부암 세포검사에서Ayptical glandular cell 소견 보여 시행한 질확대경검사에서 adenocarcinoma in situ의 결과가 나왔다. 적절한 치료 방침은?", "stem_table": null, "options": ["자궁경부 원추절제술", "1년 후 자궁경부 세포검사", "6개월 후 자궁경부 세포 검사 및 인유두종바이러스 검사", "자궁절제술", "냉동치료"], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q31"}, {"id": "gsb-2025-L26-Q32", "year": 2025, "qnum": 32, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "35세 여자가 질출혈은 주소로 내원하였다. 자궁경부에 3cm의 종양이 있고 조작검사에서 자궁경부 편평세포암으로 진단되었다. 영상 검사에서 자궁방조직의 침윤이 보였으며 질 침윤은 보이지 않았고 대동맥 림프절 전이가 관찰되었다. 적절한 치료는?", "stem_table": null, "options": ["광범위 자궁절제술", "동시항암화학방사요법", "항암화학요법", "자궁절제술 및 림프절절제술", "광범위 자궁경부절제술"], "answer": [2], "image": "gsb_img/image114.jpeg", "images": [], "id_simple": "2025-Q32"}, {"id": "gsb-2023-L26-Q22", "year": 2023, "qnum": 22, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "다음 중 Huma papillomavirus (인유두종바이러스)와 관련된 내용 중 맞는 것은?", "stem_table": null, "options": ["HPV 감염은 검사에서 음성으로 확인한 후에만 예방 백신을 투여한다.", "고위험 HPV에 감염은 자연 치유되는 경우가 낮아 치료해야 한다.", "HPV백신을 접종한 경우에도 자궁경부세포진검사(PAP smear)는 필요하다.", "고위험 인유두종바이러스는 항문 및 성기(Anogenital) 암과는 관련이 없다.", "현재 시판되는 HPV백신은 고위험군 관련 병변에만 예방 효과가 있다."], "answer": [3], "image": null, "images": [], "id_simple": "2023-Q22"}, {"id": "gsb-2023-L26-Q49", "year": 2023, "qnum": 49, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "다음 자궁경부전암성 병변(CIN)과 자궁경부암에 대한 설명 중 맞는 것은?", "stem_table": null, "options": ["모든 CIN 병변은 저절로 소실되는 경우가 많아 경과 관찰만 시행한다.", "자궁경부암의 가장 흔한 초기 증상은 하복부 통증이다.", "PAP smear에서 암세포가 확인되면 조직검사를 시행할 필요가 없다.", "Lugol solution 도포에서의 색깔 변화는 세포 내 단백질 양의 변화로 발생한다.", "CIN3의 치료는 ablation 보다는 LLETZ나 Conization이 바람직하다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q49"}, {"id": "gsb-2023-L26-Q71", "year": 2023, "qnum": 71, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "35세 미혼 여자가 아래의 검진 결과를 가지고 왔다. 처치는?\n- 자궁경부세포진검사 > 비정형상피세포이상(atypical squamous cells of undetermined significance, ASC-US))\n- 인유두종바이러스 검사(HPV test)> 33, 45\n- 자궁경부 조직검사(punch biopsy)> 저등급이형성증(low-grade squamous intraepithelial lesion, LSIL)", "stem_table": null, "options": ["경과관찰 후 재검", "아사이클로비르(Acyclovir) 경구 투여", "메트로니다졸(metronidazole) 질정 투여", "자궁경부원추절제술(large electrosurgical excision procedure, LEEP)", "근치적 자궁경부절제술(radical trachelectomy)"], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q71"}, {"id": "gsb-2022-L26-Q40", "year": 2022, "qnum": 40, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "다음 자궁경부전암성 병변과 자궁경부암 screening 및 진단 검사에 대한 설명 중 맞는 것은?", "stem_table": null, "options": ["CIN1의 경우에는 감염이 지속적으로 유지되는 경우가 많다", "자궁경부암의 가장 흔한 초기 증상은 질출혈이다.", "자궁경부세포진검사 (PAP smear)는 민감도가 90% 이상이다", "Lugol solution에서 색깔 변화가 있는 부분이 병변이 있을 가능성이 높다", "Acetic acid 도포 후 색깔 변화가 있는 부분이 병변이 없을 가능성이 높다."], "answer": [1], "image": null, "images": [], "id_simple": "2022-Q40"}, {"id": "gsb-2022-L26-Q81", "year": 2022, "qnum": 81, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "다음 중 Human papillomavirus(인유두종바이러스)와 관련된 내용 중 맞는 것은?", "stem_table": null, "options": ["HPV 감염 검사에서 음성으로 확인한 후에만 예방 백신을 투여한다.", "고위험 HPV에 감염된 경우에는 자궁경부암 진행 위험 때문에 치료해야 한다.", "예방 백신을 접종한 경우라도 자궁경부세포 스크리능 검사는 시행해야 한다.", "고위험 인유두종 바이러스는 항문 및 성기 (Anogenital) 병변에만 관련이 있다.", "현재 시판되는 HPV 백신은 고위험군 관련 병변에만 예방 효과가 있다."], "answer": [3], "image": null, "images": [], "id_simple": "2022-Q81"}, {"id": "gsb-2021-L26-Q39", "year": 2021, "qnum": 39, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "다음 중 Human papillomavirus(인유두종바이러스)와 관련된 내용 중 맞는 것은?", "stem_table": null, "options": ["HPV 감염이 없다고 확인한 후에 예방 백신을 투여한다.", "HPV type 6/11은 대표적 고위험바이러스이다.", "예방 백신을 접종한 경우라면 자궁경부세포 스크리능 검사는 필요 없다.", "모든 타입(종류)의 바이러스는 항문 및 성기 (Anogenital) 병변과 관련이 있다.", "HPV 감염은 자연 소멸되는 경우가 많다."], "answer": [5], "image": null, "images": [], "id_simple": "2021-Q39"}, {"id": "gsb-2021-L26-Q40", "year": 2021, "qnum": 40, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "다음 자궁경부전암성 병변과 자궁경부암 screening 및 진단 검사에 대한 설명 중 맞는 것은?", "stem_table": null, "options": ["자궁경부암의 경우 Colposcopy 검사 상 변형대에서 Atypical vessel을 보인다.", "자궁경부암의 가장 흔한 초기 증상은 하복부 통증이다.", "자궁경부세포진검사 (PAP smear)는 민감도가 90% 이상이다.", "LSIL/CIN 1의 경우 대부분 CIN2/3으로 진행한다.", "Rugol’s iodine 도포 후 갈색의 색깔변화가 있는 부분이, 병변이 있을 가능성이 높다."], "answer": [1], "image": null, "images": [], "id_simple": "2021-Q40"}, {"id": "gsb-2020-L26-Q53", "year": 2020, "qnum": 53, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "HPV에 대한 다음 설명 중 옳은 것은?", "stem_table": null, "options": ["HPV 감염 확인 이후 예방 백신을 투여한다", "Human papillomavirus type 6/11 은 대표적인 고위험 바이러스이다.", "예방백신을 맞아도 PAP smear는 필요하다", "모든 HPV는 항문 및 성기 병변과 관련이 있다.", "고위험 HPV 감염시 대부분 자궁경부암으로 진행한다."], "answer": [3], "image": null, "images": [], "id_simple": "2020-Q53"}, {"id": "gsb-2020-L26-Q54", "year": 2020, "qnum": 54, "jokbo_lec_no": "26", "lecture": "자궁경부 전암성병변 및 암", "professor": "노재홍", "curr_lec_no": "28", "curr_lecture": "자궁경부 전암성병변 및 암", "stem": "다음 자궁경부전암성 병변과 자궁경부암 발생과정 및 screening 검사에 대한 설명 중 맞는 것은?", "stem_table": null, "options": ["HPV 검사는 screening 검사로 사용될 수 없다", "자궁경부암 선별검사는 질출혈 등 증상이 있을 때만 시행한다.", "PAP smear는 민감도 90% 이상인 검사이다.", "LSIL/CIN 1은 대부분 CIN 2/3으로 진행한다.", "Lugol's iodine 도포 후 갈색 색변화 없는 부분에 병변이 있을 가능성이 높다."], "answer": [5], "image": null, "images": [], "id_simple": "2020-Q54"}, {"id": "gsb-2025-L27-Q21", "year": 2025, "qnum": 21, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "가임기 여성의 자궁경부 조직의 현미경 소견에 대한 설명들이다. 옳은 것을 고르시오.", "stem_table": null, "options": ["Exocervix 점막의 위쪽 1/3의 핵 대 세포질 비율(N:C ratio)이 가장 높다.", "Koilocyte는 exocervix의 basal layer 세포와 유사한 모습을 보인다.", "High-grade squamous intraepithelial lesion에서 핵 대 세포질 비율이 감소한다.", "Low-grade squamous intraepithelial lesion 병변은 면역염색 상 p16를 진하게 발현한다.", "Transformation zone은 기존의 columnar epithelium이 squamous epithelium으로 대체된 부위이다."], "answer": [5], "image": null, "images": [], "id_simple": "2025-Q21"}, {"id": "gsb-2025-L27-Q22", "year": 2025, "qnum": 22, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "다음 질환 중 HPV 감염과 연관되었을 가능성이 가장 높은 것을 고르시오.", "stem_table": null, "options": ["Lichen simplex chronicus", "Cervical adenocarcinoma", "Extramammary Paget’s disease", "Embryonal rhabdomyosarcoma", "Lichen sclerosus"], "answer": [2], "image": null, "images": [], "id_simple": "2025-Q22"}, {"id": "gsb-2023-L27-Q20", "year": 2023, "qnum": 20, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "다음 중 질환명과 관련 현미경 소견을 틀리게 짝지은 것을 고르시오.", "stem_table": null, "options": ["Extramammary Paget disease – Periodic acid-Schiff-positive tumor cell", "Condyloma acuminatum – Papillomatosis", "VAIN 1 – Koilocytosis", "Lichen simplex chronicus - Epidermal atrophy", "Embryonal rhabdomyosarcoma - Rhabdomyoblast"], "answer": [4], "image": null, "images": [], "id_simple": "2023-Q20"}, {"id": "gsb-2023-L27-Q23", "year": 2023, "qnum": 23, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "63세 여자 환자가 건강검진 중 자궁경부에 덩어리가 발견되어 자궁경부 병변에 대한 punch biopsy를 시행 받았다. 검체의 현미경 소견은 다음 사진과 같았다. 다음 중 본 질환에 대한 설명 중 옳은 것을 고르시오.", "stem_table": null, "options": ["대부분의 경우 병변에서 Low-risk HPV가 검출된다.", "본 질환의 잘 알려진 전구병변은 HSIL(CIN3)이다.", "Sexually transmitted disease에 해당된다.", "면역조직화학염색 상 p16의 발현은 없을 가능성이 높다.", "분화가 좋은 경우에는 keratin이 풍부하게 관찰된다."], "answer": [3], "image": "gsb_img/image115.png", "images": [], "id_simple": "2023-Q23"}, {"id": "gsb-2022-L27-Q12", "year": 2022, "qnum": 12, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "35세 여자 환자가 건강검진을 위해 내원하여 자궁경부 세포진 검사(Papanicolaou test)를 시행받았다. 전체 검체 중 비정상 세포는 한 군데에서만 발견되었으며, 해당 세포들의 현미경 소견은 모두 아래 사진과 같았다. 본 환자에 대한 설명들 중 틀린 것을 고르시오.", "stem_table": null, "options": ["Papanicolaou test 검체에서 관찰되는 세포들은 koilocytosis 소견을 보인다", "High-grade squamous intraepithelial lesion(HSIL) 에 해당되는 병변이다.", "Human papillomavirus(HPV)의 viral replication이 활발하게 진행중이다", "자궁경부 중 가장 흔히 발생하는 위치는 transformation zone이다", "면역화학검사상 p16 단백의 과발현은 관찰되지 않을 것이다."], "answer": [2], "image": "gsb_img/image116.png", "images": [], "id_simple": "2022-Q12"}, {"id": "gsb-2022-L27-Q32", "year": 2022, "qnum": 32, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "다음은 가임기 여성의 자궁 경부의 정상 조직학적 소견에 대한 설명들이다. 설명들 중 옳은 것을 고르시오.", "stem_table": null, "options": ["Endocervix는 stratified columnar epithelium으로 구성되어 있다.", "Exocervix는 simple columnar epithelium으로 구성 되어있다", "Exocervix의 상피세포는 세포질 내에 점액을 함유하는 것이 특징이다", "Transformation zone의 상피는 squamous epithelium이 columnar epithelium으로 대체되는 metaplasia의 소견을 보인다", "정상 exocervix의 상피세포들은 기저층(basal layer)에 서 표면으로 갈수록 세포들이 점점 성숙하는(maturation) 것을 관찰할 수 있다"], "answer": [5], "image": null, "images": [], "id_simple": "2022-Q32"}, {"id": "gsb-2021-L27-Q41", "year": 2021, "qnum": 41, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "31세 여자 환자가 건강검진을 위한 자궁경부 세포진 검사 (PAP smear)를 시행받은 후 High-grade squamous epithelial lesion (HSIL)을 진단받았다. 추가적인 정밀 검사를 위하여 산부인과 외래에 내원하였으며, 자궁경부 colposcopic punch biopsy와 HPV test를 시행 받았다. 본 환자의 조직 검사에 대한 다음 설명 중 틀린 것을 고르시오.", "stem_table": null, "options": ["High-risk HPV가 검출될 가능성이 높다.", "p57에 대한 면역조직화학검사가 진단에 도움이 된다.", "병변이 transformation zone에 존재할 가능성이 높다.", "Cervical intraepithelial neoplasia 3(CIN 3)가 관찰될 가능성이 있다.", "HSIL을 구성하는 세포들이 basement membrane을 침범했을 경우 squamous cell carcinoma로 진단할 수 있다."], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q41"}, {"id": "gsb-2021-L27-Q42", "year": 2021, "qnum": 42, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "질 및 외음부에서 발생하는 다음 질환 중 human papilloma -virus와 연관이 있는 것을 고르시오.", "stem_table": null, "options": ["Lichen sclerosus", "Embryonal rhabdomyosarcoma", "Extramammary Paget’s disease", "Condyloma acuminatum", "Lichen simplex chronicus"], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q42"}, {"id": "gsb-2020-L27-Q55", "year": 2020, "qnum": 55, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "33세 여자 환자가 건강검진센터에서 자궁경부 Pap smear을 시행받았다. Pap smear 슬라이드를 현미경으로 관찰 시, 세포들은 대부분 mature squamous cell로 구성되어 있었으며, 간혹 perinuclear halo와 binucleation을 보이는 세포가 관찰되었다. 본 질환에 대한 다음 설명 중 옳은 것은?", "stem_table": null, "options": ["인유두종바이러스(human papilloma virus)의 DNA가 환자의 host DNA로 삽입되어 squamous cell의 증식을 유발시키고 있다.", "대부분의 경우에는 자연적으로 사라진다. (spontaneous regression)", "Cervical intraepithelial neoplasia 3 (CIN 3)의 전형적인 세포학적 소견이다.", "일반적으로는 자궁경부보다는 질(vagina)에서 호발한다.", "에스트로겐의 비정상적인 장기간 자극으로 인하여 발생한다."], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q55"}, {"id": "gsb-2020-L27-Q56", "year": 2020, "qnum": 56, "jokbo_lec_no": "27", "lecture": "(병리) 자궁경부 질환, 외음부 질환", "professor": "김혜령", "curr_lec_no": "27", "curr_lecture": "(병리학) 자궁경부 질환/외음부질환", "stem": "정상자궁 조직학적 소견 중 틀린 것은?", "stem_table": null, "options": ["자궁 경부 transformation zone은 columnar metaplasia로 인해 형성되는 영역이다", "Transformation zone의 화생세포는 HPV 감염에 민감하다", "Endocervix는 점액을 분비하는 columnar epithelium으로 구성되어있다", "Exocervix는 stratisfied squmous epithelium으로 구성되어있다", "Exocervix의 상피세포는 표면에 올라갈수록 세포질이 더 풍부하다"], "answer": [1], "image": null, "images": [], "id_simple": "2020-Q56"}, {"id": "gsb-2025-L28-Q23", "year": 2025, "qnum": 23, "jokbo_lec_no": "28", "lecture": "(병리) 자궁체부 질환", "professor": "김효진", "curr_lec_no": "31", "curr_lecture": "(병리학) 자궁체부질환", "stem": "자궁내막암에 대한 다음 설명 중 틀린 것을 고르시오.", "stem_table": null, "options": ["POLE ultramutated molecular subtype이 가장 예후가 좋다.", "Serous carcinoma는 주변 자궁내막은 atrophy의 소견을 보이는 경우가 대부분이다.", "PTEN mutation은 endometrial hyperplasia 단계에서는 관찰되지 않는다.", "Endometrioid carcinoma에서 gland 구조가 잘 형성된 경우 grade 1으로 진단한다.", "Serous carcinoma는 난소에서 발생하는 high-grade serous carcinoma와 유사한 조직학적 소견을 보인다."], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q23"}, {"id": "gsb-2025-L28-Q24", "year": 2025, "qnum": 24, "jokbo_lec_no": "28", "lecture": "(병리) 자궁체부 질환", "professor": "김효진", "curr_lec_no": "31", "curr_lecture": "(병리학) 자궁체부질환", "stem": "20세 여자 환자가 질 출혈이 발생하여 응급실에 내원하였다. 혈중 β-human chorionic gonadotropin (β-hCG) 수치가 60,000 mIU/ml로 측정되었으며 초음파상 gestational sac은 뚜렷이 관찰되지 않았다. 자궁 소파술을 시행하였으며, 태아 부위는 관찰되지 않았다. 채취된 조직은 그림과 같은 소견을 보였다. 다음 중 옳은 설명을 고르시오.", "stem_table": null, "options": ["Choriocarcinoma가 발생할 위험이 높지 않다.", "Cytotrophoblast에서 p57의 발현 여부에 대한 평가가 진단에 도움이 된다.", "정상 villi가 혼재되어 있다.", "염색체 검사를 하면 Triploidy를 보일 것이다.", "Trophoblast의 증식이 국소적으로 소량 관찰된다."], "answer": [2], "image": "gsb_img/image117.png", "images": [], "id_simple": "2025-Q24"}, {"id": "gsb-2023-L28-Q10", "year": 2023, "qnum": 10, "jokbo_lec_no": "28", "lecture": "(병리) 자궁체부 질환", "professor": "김효진", "curr_lec_no": "31", "curr_lecture": "(병리학) 자궁체부질환", "stem": "Type I 자궁내막암 (Endometrial carcinoma) 과 가장 연관성이 적은 것은?", "stem_table": null, "options": ["Aneuploidy", "PTEN mutation", "Indolent behavior", "Unopposed estrogen", "Endometrial hyperplasia"], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q10"}, {"id": "gsb-2023-L28-Q11", "year": 2023, "qnum": 11, "jokbo_lec_no": "28", "lecture": "(병리) 자궁체부 질환", "professor": "김효진", "curr_lec_no": "31", "curr_lecture": "(병리학) 자궁체부질환", "stem": "42세 산모가 임식 14주에 질 출혈을 주소로 내원하였다. 혈청 β- human chorionic gonadotrophin(β-hCG) 수치가 150,000 mIU/ml으로 상승되어 있었고, 자궁경부 개대 및 소파술(dilatation and curettage)을 시행한 조직의 병리소견은 사진과 같다. 다음 중 옳은 것은?", "stem_table": null, "options": ["태아의 일부(fetal part)가 관찰될 수 있다.", "정상 융모(chorionic villi)가 함께 혼합되어 있다.", "P57에 대한 면역조직화학검사가 진단에 도움이 된다.", "심한 출혈(hemorrhage)과 괴사(necrosis)를 동반한다.", "향후 choriocarcinoma의 발생 위험을 증가시키지 않는다."], "answer": [3], "image": "gsb_img/image118.png", "images": [], "id_simple": "2023-Q11"}, {"id": "gsb-2023-L28-Q28", "year": 2023, "qnum": 28, "jokbo_lec_no": "28", "lecture": "(병리) 자궁체부 질환", "professor": "김효진", "curr_lec_no": "31", "curr_lecture": "(병리학) 자궁체부질환", "stem": "다음 중 난소 종양들의 발병 과정을 고려하였을 때 각 종양과 연관된 병변의 짝이 가장 합당하게 연결된 것은?", "stem_table": null, "options": ["Mucinous carcinoma – BRCA1 mutation",
