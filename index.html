: [5], "image": "gsb_img/image130.png", "images": [], "id_simple": "2022-Q40"}, {"id": "gsb-2022-L30-Q75", "year": 2022, "qnum": 75, "jokbo_lec_no": "30", "lecture": "난관 및 난소종양", "professor": "정현훈", "curr_lec_no": "30", "curr_lecture": "난관 및 난소종양", "stem": "65세 여자가 아랫배에 덩이가 만져져서 병원에 왔다. 최근 1개월 동안 소화 불량과 3kg 체중감소가 있었다고 한다. 골반초음파검사에서 소량의 복수와 함께 약 11cm 크기의 좌측난소 종괴가 사진과 같이 보인다. 혈액검사 결과는 다음과 같다. 처치는?", "stem_table": null, "options": ["2개월 뒤 추적관찰", "복합경구 피임제", "경화요법 (sclerotherapy)", "좌측 난소낭종 절제술", "좌측 난소난관 절제술 및 동결절편검사"], "answer": [5], "image": "gsb_img/image131.png", "images": [], "id_simple": "2022-Q75"}, {"id": "gsb-2021-L30-Q45", "year": 2021, "qnum": 45, "jokbo_lec_no": "30", "lecture": "난관 및 난소종양", "professor": "정현훈", "curr_lec_no": "30", "curr_lecture": "난관 및 난소종양", "stem": "26세 임신력 0-0-0-0인 미혼 여성이 5일 동안 발생한 소량의 질출혈을 주소로 내원하였다. 월경은 29일 주기로 규칙적이었다고 한다. 초음파 검사에서 지금 4cm의 막이 얇고, 단방성인 왼쪽 난소종양이 발견되었다. 가족 중 부인과 종양이나 유방암 등을 앓은 사람은 없었고, 기타 특이사항도 발견되지 않았다. 이 환자에게 시행해야 할 조치는?", "stem_table": null, "options": ["1개월 후 초음파 추적검사", "골반 CT 및 MRI", "초음파 유도 하 미세바늘 흡인술", "난소낭종 절제술", "왼쪽 난소 절제술"], "answer": [1], "image": null, "images": [], "id_simple": "2021-Q45"}, {"id": "gsb-2021-L30-Q46", "year": 2021, "qnum": 46, "jokbo_lec_no": "30", "lecture": "난관 및 난소종양", "professor": "정현훈", "curr_lec_no": "30", "curr_lecture": "난관 및 난소종양", "stem": "임신력 0-0-1-0인 26세 여자가 정기검진과 부인과적 상담을 위하여 병원에 왔다. 가족력에서 이모가 유방암으로 사망하였고, 어머니와 언니는 난소암으로 수술과 항암화학치료를 받았다고 한다. 향후 결혼과 임신을 원하고 있다. 적절한 처치로 옳지 않은 것은?", "stem_table": null, "options": ["최소 3대에 걸친 pedigree analysis를 시행해야 하며, BRCA1/BRCA2 유전자 검사가 난소암 발생 예측에 도움이 된다.", "임신을 시도할 때까지 경구 피임제 복용을 권장한다.", "29세 까지는 1년마다 유방촬영술 혹은 유방 MRI을 시행하고, 30세부터는 6개월마다 유방촬영술과 유방 MRI를 교대로 한다.", "35세 이후에는 예방적 양측 난소 및 나팔관 절제술을 고려하는데, BRCA1 변이가 있으면 35세-40세에 시행하고 BRCA2 변이가 있으면 40-45세에 시행한다.", "30-35세 이후부터 1년 간격으로 질식초음파검사와 CA125 검사를 예방적 양측 난소 및 나팔관 절제술을 할 때까지 시행한다."], "answer": [3, 5], "image": null, "images": [], "id_simple": "2021-Q46"}, {"id": "gsb-2020-L30-Q61", "year": 2020, "qnum": 61, "jokbo_lec_no": "30", "lecture": "난관 및 난소종양", "professor": "정현훈", "curr_lec_no": "30", "curr_lecture": "난관 및 난소종양", "stem": "46세 여자가 3개월전부터 발생한 복수로 병원에\n왔다. 검사상 난소 종괴가 발견되었고, 흉부 검사, 골스캔 검사에서 이상 소견은 보이지 않았다. 개복수술을 시행하여 종양감축술을 시행한 결과 병리 소견은 다음과 같았다. 병기는?\n-Ovary: High-grade serous adenocarcinoma,\nruptured capsule\n-Uterus: Involvement\n-Omentum: >2cm multiple metastatic nodule\n-Peritoneum: >2cm multiple metastatic nodule\n-Liver and spleen: Surface nodule 1cm\n-Lymph nodes: No tumor involvement\n-Ascites: positive for malignant cells", "stem_table": null, "options": ["IIIA1", "IIIA2", "IIIB", "IIIC", "IVA"], "answer": [4], "image": null, "images": [], "id_simple": "2020-Q61"}, {"id": "gsb-2020-L30-Q62", "year": 2020, "qnum": 62, "jokbo_lec_no": "30", "lecture": "난관 및 난소종양", "professor": "정현훈", "curr_lec_no": "30", "curr_lecture": "난관 및 난소종양", "stem": "14세 여아가 1달전부터 지속된 복부팽만감으로 내원하였다. 초음파검사상 우측 난소에서 17cm 정도의 종괴가 관찰되었다. 또 혈액검사상 CA125 는 17 (0-46U/ml) AFP는 380 (0-10ng/ml) hCG 는 3 (0-5mIU/ml) 었다. 가장 가능성이 높은 진단은?", "stem_table": null, "options": ["serous cystadenocarcinoma", "borderline mucinous carcinoma", "dysgerminoma", "immature teratoma", "endodermal sinus tumor"], "answer": [5], "image": null, "images": [], "id_simple": "2020-Q62"}, {"id": "gsb-2025-L31-Q75", "year": 2025, "qnum": 75, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "임신력 3-0-0-3인 52세 여자가 1년전부터 시작된 불규칙적인 질출혈로 방문하였다. 외래에서 시행한 자궁내막생검결과 및 골반 자기공명영상 결과 다음과 같은 소견을 보였다. 향후 적절한 처치는?", "stem_table": null, "options": ["진단적 자궁경검사", "병기설정술", "프로게스테론 치료", "방사선치료", "항암화학치료"], "answer": [2], "image": null, "images": ["gsb_img/image132.png", "gsb_img/image133.png"], "id_simple": "2025-Q75"}, {"id": "gsb-2025-L31-Q76", "year": 2025, "qnum": 76, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "다음은 폐경 후 여자에서 발생하는 질 출혈의 원인이다, 가장 흔한 원인은?", "stem_table": null, "options": ["Endometrial atrophy", "Estrogen replacement therapy", "Endometrial polyp", "Endometrial hyperplasia", "Endometrial cancer"], "answer": [1], "image": null, "images": [], "id_simple": "2025-Q76"}, {"id": "gsb-2022-L31-Q50", "year": 2022, "qnum": 50, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "67세 여자 환자가 한달 전부터 시작된 중등도 질출혈 로 인근 의원을 방문하였다. 사진은 해당 의원에서 시행한 경질 초음파 소견이다. 자궁내막 검사를 시행해 자궁내막암 진단을 받고 본원으로 전원되었다. 다음으로 시행할 검사는?", "stem_table": null, "options": ["자궁내막 조직검사", "확진용 자궁내막 조직검사", "CT MR 등 영상검사", "자궁경 검사", "진단 복강경 검사"], "answer": [3], "image": "gsb_img/image134.jpeg", "images": [], "id_simple": "2022-Q50"}, {"id": "gsb-2022-L31-Q92", "year": 2022, "qnum": 92, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "56세 여자 환자가 2주 전부터 시작된 질출혈로 인근 의원에서 자궁내막암으로 진단받고 추가 검사와 치료를 위해 방문했다. 환자에게 향후 치료 방침과 일반적인 예후에 대해 설명하고 있다. 맞는 설명은?", "stem_table": null, "options": ["10명 중 7명 정도는 FIGO I기 이다.", "10명 중 2명이 유전성 자궁내막암이다", "FIGO I기 환자 1차 치료는 수술 및 세포독성 항암 병합치료이다.", "개복 수술 방법이 복강경 수술보다 예후가 우수하다", "재발한 경우 주된 1차 치료법은 방사선치료이다."], "answer": [1], "image": null, "images": [], "id_simple": "2022-Q92"}, {"id": "gsb-2021-L31-Q47", "year": 2021, "qnum": 47, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "67세 여자 환자가 한 달 전부터 시작된 중등도 질출혈로 방문하였다. 고혈압 조절을 위한 약제 이외에는 사용 중인 약제는 없었다. 사진은 외래에서 시행한 경질 초음파 소견이다. 진단을 위해서 시행해야 할 검사는?", "stem_table": null, "options": ["질 세포진", "자궁경부 조직검사", "자궁내막 조직검사", "자궁 확대경 검사", "진단 복강경"], "answer": [3], "image": "gsb_img/image135.png", "images": [], "id_simple": "2021-Q47"}, {"id": "gsb-2021-L31-Q48", "year": 2021, "qnum": 48, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "56세 여자 환자가 2주 전부터 시작된 질출혈로 인근 의원에서 자궁내막암으로 진단받고 추가 검사와 치료를 위해 방문했다. 환자에게 향후 치료 방침과 일반적인 예후에 대해 설명하고 있다. 맞는 설명은?", "stem_table": null, "options": ["70% 정도는 병변이 자궁에 국한된 상태에서 진단된다.", "FIGO I기 5년 생존율은 70% 내외이다.", "유전성이 20% 정도로 BRCA 변이 여부 검사가 필요하다.", "1차 치료 방법은 방사선치료 또는 세포독성 항암치료이다.", "수술은 개복수술 방법이 표준 방법이다"], "answer": [1], "image": null, "images": [], "id_simple": "2021-Q48"}, {"id": "gsb-2020-L31-Q63", "year": 2020, "qnum": 63, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "66세 여자가 한달 전에 중등도 질출혈을 주소로 내원했다. 고혈압 약 외 사용한 약제가 없다고 했다. 초음파 검사결과는 아래와 같았다. 이를 진단하기 위한 검사방법은?", "stem_table": null, "options": ["자궁내막 조직검사", "자궁경부원추절제술", "질세포진검사", "자궁경", "진단 복강경 검사"], "answer": [1], "image": "gsb_img/image134.jpeg", "images": [], "id_simple": "2020-Q63"}, {"id": "gsb-2020-L31-Q64", "year": 2020, "qnum": 64, "jokbo_lec_no": "31", "lecture": "자궁체부암", "professor": "김용범", "curr_lec_no": "32", "curr_lecture": "자궁체부암", "stem": "56세 여자가 2주 전 질출혈로 인근 의원에서 자궁내막암으로 진단받고 추가검사와 치료를 받기 위해 내원하였다. 향후 치료 방침과 예후로 옳은 것은?", "stem_table": null, "options": ["자궁내막암의 70%는 자궁에 국한되어있다.", "FIGO 1기 환자 5년 생존률은 70%이다", "대부분 유전성으로 BRCA 검사가 필수적이다", "주된 1차치료는 방사선과 항암치료이다", "수술은 개복수술이 표준이다"], "answer": [1], "image": null, "images": [], "id_simple": "2020-Q64"}, {"id": "gsb-2025-L32-Q63", "year": 2025, "qnum": 63, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음 중 전립샘에 발생한 질환에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["양성전립샘비대 (benign prostatic hyperplasia)는 주로 중심구역(central zone)에서 발생하여 요도를 눌러 증상을 유발한다.", "결절과다형성 (nodular hyperplasia)시 DHT(dihydrotestosterone)은 주로 epithelial cell에 작용하고, stromal cell에는 작용하지 않아 stroma는 위축된다.", "전립샘암에서 가장 흔하게 관찰되는 유전자의 이상은 TMPRSS2-ETS fusion gene이다.", "전립샘암으로 전절제된 전립샘에서 종양이 여러개 있을때는 전체 종양을 합하여 Gleason score를 평가한다.", "전립샘암은 주로 뼈로 전이를 잘하여 spine이나 femur, pelvis 등에서 주로 osteolytic lesion을 형성한다."], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q63"}, {"id": "gsb-2025-L32-Q64", "year": 2025, "qnum": 64, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "고환에서 발생한 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["기형종(Teratoma)은 성인에서는 주로 mixed germ cell tumor의 형태로 나오며, 모든 사춘기 이후의 기형종은 immature component 유무에 따라 악성/양성이 결정된다.", "Seminoma는 주로 소아에 발생하며 혈중 alpha-fetoprotein이 상승되어 있고 방사선 치료에 잘 반응한다.", "60세 이상의 연령에서 가장 많이 생기는 고환종양은 Spermatocytic tumor이다.", "제자리종자세포종양(germ cell neoplasia in situ)는 대부분의 고환의 germ cell tumor의 전구병변이며, 치료하지 않고 두면 7년 혹은 그 이상의 시간이 지난 후 침윤성 germ cell tumor로 진행한다.", "Non-seminomatous germ cell tumor는 60%에서 stage II, III로 발견되며 초기에 림프절 전이를 하고, 나중에 hematogenous metastasis를 한다."], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q64"}, {"id": "gsb-2023-L32-Q17", "year": 2023, "qnum": 17, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "33세 남자환자가 갑자기 커지는 고환의 종괴를 주소로 내원하여 고환절제술을 시행받았다. 종양의 현미경적 소견은 다음과 같다. 이 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["고환에서 생기는 종양 중 가장 흔하다.", "방사선치료에 잘 반응한다.", "제자리종자세포종양(germ cell neoplasia in situ)에서 기원한다.", "면역조직화학염색에서 c-kit에 양성 소견을 보이면 진단할 수 있다.", "현미경소견에서 Schiller-Duval body나 hyaline globule이 관찰된다."], "answer": [3], "image": "gsb_img/image136.png", "images": [], "id_simple": "2023-Q17"}, {"id": "gsb-2023-L32-Q36", "year": 2023, "qnum": 36, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "72세 남자 환자의 전립선의 현미경 소견이다. 이 질환에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["Epithelial cell 뿐만 아니라 stromal cell의 증식도 관찰된다.", "주로 전립샘의 peripheral zone에서 발생한다.", "A-methylacyl-coenzyme A-racemase (AMACR)에 대한 면역조직화학염색을 하면 양성으로 염색된다.", "전립샘암의 전암병변으로 여겨진다.", "Isochromosme i(12p)가 발생에 가장 큰 기여를 하는 유전자 이상으로 알려져 있다."], "answer": [1], "image": "gsb_img/image137.png", "images": [], "id_simple": "2023-Q36"}, {"id": "gsb-2023-L32-Q39", "year": 2023, "qnum": 39, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음 중 전립샘암에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["전립샘암은 주로 중심구역(central zone)에서 발생하여 요도를 눌러 증상을 유발한다.", "전립샘의 침생검 조직에서 암이 의심될 때는 high molecular weight cytokeratin이나 p63과 같은 면역조직화학염색을 시행하여 basal cell을 확인하면 전립샘암으로 진단할 수 있다.", "전립선암에서 가장 흔히 관찰되는 유전적 이상은 MYC 유전자의 증폭(MYC amplification)이다.", "전립샘암은 양성전립샘비대(benign prostatic hypertrophy)와 달리 호르몬치료에 반응하지 않으므로 근치전립샘절제나 면역항암치료를 해야 한다.", "근치전립샘절제(radical prostatectomy)에서 Gleason score 7 (3+4)는 가장 많은 Gleason pattern이 3, 그 다음으로 많은 Gleason pattern은 4라는 의미이다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q39"}, {"id": "gsb-2023-L32-Q78", "year": 2023, "qnum": 78, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음의 고환에서 발생한 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["제자리정모세포종양(Germ cell neoplasia in situ)는 대부분의 종자세포종양(germ cell tumor)의 전구 병변으로 여겨지며, 치료하지 않고 뒀을 때 약 70% 환자가 침윤성 종자세포종양으로 진행한다.", "Seminoma는 주로 소아에 발생하며 혈중 alpha-fetoprotein이 상승되어 있고 방사선치료에 잘 반응한다.", "Yolk sac tumor의 확진을 위해서는 CD30과 CK(cytokeratin) 면역염색이 도움이 된다.", "사춘기 이전에 발생한 기형종(teratoma)의 경우에는 주로 pure form으로 나오며, immature component 유무가 양성과 악성을 결정한다.", "고환에서 생긴 림프종은 주로 30대에 호발하며 가장 흔하게 발생하는 림프종은 광범위큰B세포림프종 (diffuse large B cell lymphoma)이다."], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q78"}, {"id": "gsb-2022-L32-Q23", "year": 2022, "qnum": 23, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음 중 전립선질환에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["전립선 암은 주로 이행구역 (transition zone)에서 발생하여 요도를 눌러 증상을 유발한다", "전립선의 결절 증식(nodular hyperplasia)은 전암성 병변이므로 적극적인 치료를 해야하며, 가장 널리 쓰이는 약제는 5a-reductase 억제제이다.", "전립선암에서 가장 흔히 관찰되는 유전적 이상은 androgen receptor mutation이다.", "전립샘암종의 현미경적 특징은 샘들이 작아지고 핵인(nucleoli)이 뚜렷해지며 기저세포(basal cell)의 소실을 보이는 것이다.", "전립선 침생검에서 Gleason score 8(3+5)는 가장 많은 Gleason pattern이 3, 그 다음으로 많은 Gleason pattern이 5라는 의미이다."], "answer": [4], "image": null, "images": [], "id_simple": "2022-Q23"}, {"id": "gsb-2022-L32-Q55", "year": 2022, "qnum": 55, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음의 고환에서 발생한 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["Spermatocytic tumor의 경우 30대에 호발하고 제자리정모세포종양(Germ cell neoplasia in situ)를 거치지 않고 발생하는 것이 특징이다", "Seminoma는 종양세포가 레이스와 같은 모양의 네트워크를 형성하거나 solid 혹은 cord와 같은 모양을 보이며 Shiller-Duval body가 관찰된다", "Embryonal carcinoma의 확진을 위해서는 CD30과 CK(Cytokeratin)면역염색이 도움이 된다", "사춘기 이후에 발생한 기형종(teratoma)의 경우에는 주로 pure form으로 나오며 immature component가 없는 경우에는 양성종양으로 간주한다", "Non-seminomatous germ cell tumor의 경우에는 60% 정도에서 stage II,III로 관찰되나 radiosensitive하여 방사선 치료의 효과가 좋다."], "answer": [5], "image": null, "images": [], "id_simple": "2022-Q55"}, {"id": "gsb-2021-L32-Q53", "year": 2021, "qnum": 53, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음의 고환에서 발생한 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["60세 이상의 연령에서 가장 많이 생기는 고환종양은 Spermatocytic tumor이다.", "Seminoma는 면역조직화학염색을 하면 OCT3/4, Ki-1 (CD30) CK에 양성소견을 보인다.", "사춘기 이후에 고환에서 발생한 기형종(postpubertal teratoma)의 경우에는 제자리종자세포종양(Germ cell neoplasia in situ)와 무관하게 발생하며, immaturity와 무관하게 악성으로 여겨진다.", "고환종(Seminoma)의 경우는 고환에서 발생하는 종양 중 pure form으로는 가장 흔하며, 대개의 경우 stage 1에서 발견되고 방사선 치료에 잘 반응하여 치료효과가 좋다.", "Yolk sac tumor의 경우는 주고 3세 이하의 유아에서 많이 발생하며, HCG를 분비하여 초기 진단이나, 치료 후 치료효과를 판별하는데 이용된다."], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q53"}, {"id": "gsb-2021-L32-Q54", "year": 2021, "qnum": 54, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음 중 전립선 암에 대한 설명으로 옳지 않은 것은?", "stem_table": null, "options": ["전립선 암은 주로 peripheral zone에서 발생한다.", "전립선암에서 가장 흔하게 관찰되는 유전자이상은 TMPRSS2-ETS fusion이다.", "Gleason grade는 전립선암의 stage 및 예후와 밀접한 관련이 있으며, 침생검 검체에서 Gleason score는 가장 흔한 pattern과 가장 나쁜 pattern의 합으로 표시한다.", "Radical prostatectomy 검체에서 Gleason pattern 3이 33%, Gleason pattern 4가 65%, Gleason pattern 5는 2% 관찰되ㄴ면 Gleason score 9 (4+5)로 표시한다.", "Prostate adenocarcinoma는 perineural invasion을 잘한다."], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q54"}, {"id": "gsb-2020-L32-Q68", "year": 2020, "qnum": 68, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "65세 남자가 혈액검사상 이상소견을 주소로 내원하였다. 지역 병원에서 측정한 PSA는 4.2mg/dL, 본원에서 측정한 PSA는 5.3mg/dL였다. 환자는 배뇨장애나 복부 불편감을 호소하지는 않았다. 환자에게 측정한 직장 수지 검사상 작은 종괴가 촉지되었다. 이후 처치는? 1) 경과관찰2) 전립선 조직 생검3) 전립선 국소 절제술4) 방사선치료5) 항암화학요법", "stem_table": null, "options": [], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q68"}, {"id": "gsb-2020-L32-Q75", "year": 2020, "qnum": 75, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "다음 중 Germ cell neoplasma in situ를 거치지 않고 발생하는 생식세포종양은?", "stem_table": null, "options": ["고환종 (seminoma)", "정모세포고환종 (spermatocytic tumor)", "배아암종 (embryonal carcinoma)", "융모막암종 (choriocarcinoma)", "사춘기 이후 발생한 기형종"], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q75"}, {"id": "gsb-2020-L32-Q76", "year": 2020, "qnum": 76, "jokbo_lec_no": "32", "lecture": "(병리) 남성생식기계 질환", "professor": "김영아", "curr_lec_no": "35", "curr_lecture": "(병리학) 남성생식기계 질환", "stem": "전립선 질환에 대한 다음 설명 중 옳은 것은?", "stem_table": null, "options": ["결절 증식 (nodular hyperplasia)은 주로 중심 구역 (central zone)에서 발생하여 요도를 눌러 증상을 유발한다.", "결절 증식 (nodular hyperplasia)은 샘조직의 과다증식으로 인해 일어나 낭성 조직으로 늘어난 샘조직이 관찰되며 간질인 섬유조직은 위축되고, 과증식을 보이지 않는다.", "전립선암은 우리나라 남성 암 발생률 1위를 차지한다.", "전립샘암종의 현미경적 특성은 샘들이 작아지고 핵인이 뚜렷해지나 기저 세포의 소실은 보이지 않는 것으로 면역조직화학 염색을 통해 육안적으로 보이지 않는 기저 세포를 확인할 수 있다.", "전립샘암종의 병기와 예후를 예측하는 데 있어 중요한 것은 Gle  "gsb_img/image192.png"], "id_simple": "2020-Q72"}, {"id": "gsb-2020-L33-Q73", "year": 2020, "qnum": 73, "jokbo_lec_no": "33", "lecture": "(병리학실습) 여성생식기계 질환 1", "professor": "이철", "curr_lec_no": "34", "curr_lecture": "(병리학실습) 여성생식기계질환", "stem": "45세 여성환자가 질출혈을 주소로 내원하여 자궁절제술을 받았다. 다음은 자궁병변의 육안 및 현미경적 소견이다. 진단은?", "stem_table": null, "options": ["Mature cystic teratoma", "Serous cystadenoma", "Leiomyoma", "Adenomyosis", "Endometrioid carcinoma"], "answer": [3], "image": null, "images": ["gsb_img/image193.png", "gsb_img/image194.png"], "id_simple": "2020-Q73"}, {"id": "gsb-2020-L33-Q74", "year": 2020, "qnum": 74, "jokbo_lec_no": "33", "lecture": "(병리학실습) 여성생식기계 질환 1", "professor": "이철", "curr_lec_no": "34", "curr_lecture": "(병리학실습) 여성생식기계질환", "stem": "자궁에서 발견된 다음 병리학소견에 알맞은 진단은?", "stem_table": null, "options": ["Endocervical adenocarcinoma", "Endometrioid carcinoma", "Leiomyoma", "Adenomyosis", "Mucinous carcinoma"], "answer": [2], "image": "gsb_img/image195.png", "images": [], "id_simple": "2020-Q74"}, {"id": "gsb-2025-L34-Q57", "year": 2025, "qnum": 57, "jokbo_lec_no": "34", "lecture": "(병리) 유방 질환 1", "professor": "유한석", "curr_lec_no": "38", "curr_lecture": "유방 병리 I: 양성유방질환", "stem": "28세 여성이 모유 수유 중 유두 하방의 열감과 통증, 붓기를 주소로 내원하였다. 다음 중 의심되는 질환 및 치료 방법이 맞게 짝지어진 것을 고르시오.", "stem_table": null, "options": ["Acute mastitis-수술적 절제술(surgical excision)", "Acute mastitis-항생제 치료", "Fat necrosis-수술적 배액(surgical drainage)", "유방암-수술적 절제술(surgical excision)", "유방암-추적관찰"], "answer": [2], "image": null, "images": [], "id_simple": "2025-Q57"}, {"id": "gsb-2025-L34-Q58", "year": 2025, "qnum": 58, "jokbo_lec_no": "34", "lecture": "(병리) 유방 질환 1", "professor": "유한석", "curr_lec_no": "38", "curr_lecture": "유방 병리 I: 양성유방질환", "stem": "다음 중 유방에서 발생하는 양성 유방 질환에 관한 설명으로 맞는 것을 고르시오", "stem_table": null, "options": ["유방에 발생하는 fat necrosis의 주요 원인은 감염성 질환이다.", "유방의 양성 유두종의 가장 흔한 증상 중 하나는 혈성 유두 분비(bloody nipple discharge)이다.", "흡연시 유방 실질에 낭성 변화 및 석회화가 동반된다.", "유방의 염증성 질환은 대부분 고령의 환자에서 발생할 수 있다.", "유방은 발생학적이상(developmental disorder)과 관련된 질환이 매우 자주 발생하는 장기이다."], "answer": [2], "image": null, "images": [], "id_simple": "2025-Q58"}, {"id": "gsb-2023-L34-Q56", "year": 2023, "qnum": 56, "jokbo_lec_no": "34", "lecture": "(병리) 유방 질환 1", "professor": "유한석", "curr_lec_no": "38", "curr_lecture": "유방 병리 I: 양성유방질환", "stem": "30세 여성이 유방 초음파 검사상 발견된 1.5cm 크기의 멍울을 주소로 내원하였다. 이에 대해 시행한 조직학적 검사 결과지에 표기된 각 진단명 확인 후 필요한 임상적 후속 조치로 맞는 것을 고르시오.", "stem_table": null, "options": ["병리 조직 검사 상 usual ductal hyperplasia로 진단된 경우 악성 종양 발생위험도가 매우 높음을 환자에게 설명하고 예방적 유방전절제술을 권고한다. (단 BRCA 유전자 변이가 없는 경우)", "병리 조직 검사 상 granulomatous lobular mastitis로 진단된 경우 스테로이드 치료 대신 항암 및 방사선 치료를 고려하게 된다.", "Atypical ductal hyperplasia로 진단된 경우 악성 종양으로 진행하거나 암을 동반할 위험도가 전혀 없으므로 더 이상의 추적 관찰은 필요 없음을 환자에게 알린다.", "Fibrocystic change로 진단된 경우 환자에게 악성종양으로 진행할 위험도가 높으므로 광범위 수술적 절제술 및 항암치료를 반드시 권고해야 한다.", "병리 조직 검사 상 림프구의 침윤이 심한 lymphocytic mastitis로 진단된 경우 환자에게 자가면역질환의 가능성이 있음을 안내하고 갑상선 등에 대한 추가 검사를 시행해야 한다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q56"}, {"id": "gsb-2023-L34-Q87", "year": 2023, "qnum": 87, "jokbo_lec_no": "34", "lecture": "(병리) 유방 질환 1", "professor": "유한석", "curr_lec_no": "38", "curr_lecture": "유방 병리 I: 양성유방질환", "stem": "다음 중 유방에서 발생하는 양성 유방 질환에 대한 설명으로 맞는 것을 고르시오.", "stem_table": null, "options": ["유방은 발생학적 이상(developmental disorder)과 관련된 질환이 매우 자주 발생하는 장기이다.", "40세 미만의 젊은 환자에서 유방 통증 증상이 동반되는 경우 가장 우선적으로 고려해야하는 질환은 유방암이다.", "유방의 염증성 질환은 대부분 고령의 환자에서 발생한다.", "유방에서 발생하는 상피증식성 질환은 모두 악성 종양이다.", "lactiferous duct에 squamous metaplasia가 발생하면 심한 경우 abscess까지 동반될 수 있는데 이를 유발하는 가장 흔한 원인 중 하나는 흡연이다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q87"}, {"id": "gsb-2022-L34-Q38", "year": 2022, "qnum": 38, "jokbo_lec_no": "34", "lecture": "(병리) 유방 질환 1", "professor": "유한석", "curr_lec_no": "38", "curr_lecture": "유방 병리 I: 양성유방질환", "stem": "30세 여성이 유방 초음파 검사상 발견된 1.5cm 크기의 멍울을 주소로 내원하였다. 이에 대해 시행한 조직학적 검사 결과지에 표기된 각 진단명 확인 후 필요한 임상적 후속 조치로 맞는 것을 고르시오", "stem_table": null Q77", "year": 2020, "qnum": 77, "jokbo_lec_no": "34", "lecture": "(병리) 유방 질환 1", "professor": "유한석", "curr_lec_no": "38", "curr_lecture": "유방 병리 I: 양성유방질환", "stem": "다음 중 유방에서 발생하는 inflammatory disease에 대한 설명 중 맞는 것은?", "stem_table": null, "options": ["Lymphocytic mastopathy는 제2형 당뇨병 환자에서 흔하다.", "Granulomatous lobular mastitis는 수유기간 동안 발현되는 소엽상피의 항원에 대한 과민반응으로 나타날 것으로 생각되고 있다.", "Acute mastitis의 흔한 원인균은 Streptococcus이다", "Recurrent subareolar abscess는 국소적인 세균 감염이 원이이다.", "Mammary duct ectasia는 유즙에 의한 유관 확장이다."], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q77"}, {"id": "gsb-2020-L34-Q78", "year": 2020, "qnum": 78, "jokbo_lec_no": "34", "lecture": "(병리) 유방 질환 1", "professor": "유한석", "curr_lec_no": "38", "curr_lecture": "유방 병리 I: 양성유방질환", "stem": "다음 중 유방에서 발생하는 atypical duct hyperplasia에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["주로 증상이 없고, mammographic calcification 또는 densities로 관찰된다.", "평생 유방암이 발생할 위험도는 5~7%이다.", "High grade ductal carcinoma in situ가 2mm 이내로 관찰될 때 진단할 수 있다.", "유방암 발생 위험도가 증가하긴 하지만 전암성 병변은 아니다.", "침범된 lobule의 50%이하의 acini에 종양 세포로 채워져 있을 때 진단한다."], "answer": [1], "image": null, "images": [], "id_simple": "2020-Q78"}, {"id": "gsb-2025-L35-Q11", "year": 2025, "qnum": 11, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "52세 여자 환자가 건강검진에서 발견된 종괴를 주소로 내원하였다. 초음파 검사에서 크기 1.0cm의 경계가 불분명한 주 종괴 외에 주변부에 작은 다발성 종괴가 관찰되었으며, 유방암 의심 하에 조직 검사를 시행 받았다. 이 종괴의 조직학적 소견(그림 1) 및 E-cadherin 면역조직화학검사 소견(그림 2)이 아래와 같았을 때 기본적인 생체표지자(basic biomarker)의 상태로 가장 가능성이 높은 조합은 무엇인가?", "stem_table": null, "options": ["ER(+), PR(+), HER2(-)", "ER(+), PR(-), HER2(+)", "ER(-), PR(+), HER2(-)", "ER(-), PR(-), HER2(+)", "ER(-), PR(-), HER2(-)"], "answer": [1], "image": null, "images": ["gsb_img/image196.jpeg", "gsb_img/image197.jpeg"], "id_simple": "2025-Q11"}, {"id": "gsb-2025-L35-Q12", "year": 2025, "qnum": 12, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "28세 여자가 유방에서 만져지는 종괴를 주소로 내원하였다. 최근 몇 달간 종괴의 크기가 커졌다고 하였으며, 환자의 어머니와 이모가 유방암 및 난소암의 병력을 가지고 있었다. 환자는 조직 검사를 시행 받았으며, 조직학적 소견(그림 1)과 ER(그림 2), PR(그림 3), HER2(그림 4)의 상태가 아래와 같았다. 이후 시행한 유전자 검사를 통해 환자에서 발생한 종양이 유전성 유방암으로 확인되었다면 다음 중 환자가 가지고 있을 가능성이 가장 높은 증후군은 무엇인가?", "stem_table": null, "options": ["Li-Fraumeni syndrome", "Li-Fraumeni variant syndrome", "Cowden syndrome", "BRCA1-associated hereditary breast and ovarian cancer", "BRCA2-associated hereditary breast and ovarian cancer"], "answer": [4], "image": null, "images": ["gsb_img/image198.jpeg", "gsb_img/image199.jpeg", "gsb_img/image200.jpeg", "gsb_img/image201.jpeg"], "id_simple": "2025-Q12"}, {"id": "gsb-2023-L35-Q13", "year": 2023, "qnum": 13, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "다음 중 유방에서 발생하는 소엽상피내암종 (lobular carcinoma in situ)에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["E-cadherin 소실은 침윤성 소엽암종(invasive lobular carcinoma)으로의 진행과 연관되어 나타난다.", "현재 관상피내암종(ductal carcinoma in situ)과 동일하게 T category에서 Tis로 인정된다.", "치료하지 않으면 침윤성 유방암으로 진행할 확률이 1년에 5%씩 증가한다.", "Atypical lobular hyperplasia와의 감별은 침범된 소엽의 개수에 따라 결정된다.", "소엽상피내암종이 발견될 경우 동측 유방뿐 아니라 반대쪽 유방도 침윤성 유방안 발생 위험도가 높아진다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q13"}, {"id": "gsb-2023-L35-Q52", "year": 2023, "qnum": 52, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "58세 폐경 후 여성으로 침습성 유방암 진단으로 유방 전절제술을 하였다. 수술 후 최종 병리 조직 검사 상 침습성 종양의 크기는 2.5cm이었고, 조직학적 등급 II, 절제연에 암세포는 없었고, 림프절 전이는 없었다. 종양의 에스트로겐 수용체 양성, HER2 음성으로 OncotypeDX 테스트를 의뢰하였고, Low risk 로 결과가 나왔다 (Recurrence score =11, 10-year distant recur risk 2%). 다음으로 시행해야 할 치료는?", "stem_table": null, "options": ["재수술", "방사선치료", "항암화학치료", "호르몬치료", "표적치료"], "answer": [4], "image": null, "images": [], "id_simple": "2023-Q52"}, {"id": "gsb-2023-L35-Q69", "year": 2023, "qnum": 69, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "다음 중 유방암의 분자 아형 중 HER2-positive subtype에 대한 설명으로 맞는 것은?", "stem_table": null, "options": ["BRCA2 mutation carrier에서 자주 발생한다.", "암 발생 10년 이후에도 지속적인 재발을 보이며 내장 전이(visceral metastasis)보다 뼈 전이가 흔하다.", "침윤성 유방암의 조직학적 아형 중 tubular carcinoma, cribriform carcinoma, mucinous carcinoma가 대체로 이에 속한다.", "선행항암화학요법에 대한 완전관해율은 호르몬 수용체 음성인 경우 더 높다.", "Flat epithelial atypia가 전구병변으로 생각되고 있다."], "answer": [4], "image": null, "images": [], "id_simple": "2023-Q69"}, {"id": "gsb-2022-L35-Q76", "year": 2022, "qnum": 76, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "다음 중 유방암의 분자 아형 중 luminal A subtype에 대한 설명으로 맞는 것은?", "stem_table": null, "options": ["PD-L1의 발현빈도가 다른 subtype에 비해 높아 최근 이에 대한 표적 치료제가 개발되었다.", "암 발생 후 10년 이후에도 재발을 보이며 내장 전이(visceral metastasis)보다 뼈 전이가 흔하다.", "침윤성 유방암의 조직학적 아형 중 medullary carcinoma, metaplastic carcinoma, adenoid cystic carcinoma가 이에 속한다.", "항암화학요법에 반응성이 높다 선행항암화학요법에 대한 완전관해율이 50%에 달한다.", "atypical apocrine adenosis가 전구병변으로 생각되고 있다."], "answer": [2], "image": null, "images": [], "id_simple": "2022-Q76"}, {"id": "gsb-2022-L35-Q86", "year": 2022, "qnum": 86, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "다음 중 유방에서 발생하는 관상피내암종(ductal carcinoma in situ)에 대한 설명으로 맞는 것은?", "stem_table": null, "options": ["침윤 전단계의 증식성 병변으로 기저막은 잘 유지되어있으나 근상피세포의 소실이 관찰된다", "관상피내암종은 침윤성 유방암과는 다른 genomic profile을 보인다", "고등급의 관상피내암종은 치료하지 않으면 침윤성 유방암으로 진행할 확률이 1년에 1%씩 증가한다", "저등급 관상피내암종에서 고등급 관상피내암종으로 진행하고 이어서 침윤성 유방암으로 진행한다", "괴사가 동반되고 고등급이며 범위가 넓은 경우 수술 후 재발의 위험도가 높다."], "answer": [5], "image": null, "images": [], "id_simple": "2022-Q86"}, {"id": "gsb-2021-L35-Q57", "year": 2021, "qnum": 57, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "다음 중 유전성 유방암 및 이와 관련된 유전자에 대한 설명으로 맞지 않은 것은?", "stem_table": null, "options": ["유방암이 젊은 나이에 발생하고, 다발성으로 존재하며 가족력이 있는 경우 유전성 유방암을 의심해 볼 수 있다.", "BRCA1 유전자 관련 familial breast and ovarian cancer 환자에서 발생하는 유방암은 삼중음성 유방암이 흔하다.", "BRCA2 유전자 관련 familial breast and ovarian cancer는 난소암, 남성 유방암, 전립선암, 췌장암, 위암 발생과 연관성이 있다.", "Li-Fraumeni syndrome의 경우 70세까지 유방암이 발생할 위험도가 10-20%로 다른 유전성 유방암에 비해 비교적 낮다.", "CHEK2 유전자 변이가 있는 Li-Fraumeni variant syndrome에서는 방사선 노출 후 유방암의 위험도가 증가한다."], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q57"}, {"id": "gsb-2021-L35-Q58", "year": 2021, "qnum": 58, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "유방암의 분자 아형 중 triple-negative subtype에 대한 설명으로 맞는 것은?", "stem_table": null, "options": ["PIK3CA 변이의 빈도가 다른 subtype에 비해 높고 최근 이에 대한 표적 치료제가 개발되었다.", "암 발생 후 10년 이후에도 빈번하게 재발을 보이며 다른 subtype에 비해 뼈 전이가 흔하다.", "침윤성 유방암의 조직학적 아형 중 medullary carcinoma, metaplastic carcinoma, adenoid cystic carcinoma가 이에 속한다.", "항암화학요법에 반응성이 높아 선행항암화학요법에서 완전관해가 30% 이상이나 완전관해에 이르더라도 예후가 나쁘다.", "atypical apocrine adenosis가 전구병변으로 생각되고 있다."], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q58"}, {"id": "gsb-2020-L35-Q79", "year": 2020, "qnum": 79, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "에스트로겐 수용체가 양성인 종양의 발생과 관련된 분자유전학적 발암 기전으로 옳지 않은 것은?", "stem_table": null, "options": ["gain chromosome 1q", "HER2 amplification", "PIK3CA mutation", "Germline BRCA2 mutation", "loss chromosome 16q"], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q79"}, {"id": "gsb-2020-L35-Q80", "year": 2020, "qnum": 80, "jokbo_lec_no": "35", "lecture": "(병리) 유방 질환 2", "professor": "박소연", "curr_lec_no": "39", "curr_lecture": "유방 병리 II: 유방암", "stem": "유방암의 위험인자로 알맞은 조합이 아닌 것은?", "stem_table": null, "options": ["유방암 가족력 - 늦은 폐경기", "이른 초경 - Atypical ductal hyperplasia", "Estrogen 보충 요법 - 자궁내막암", "비만 - 종양억제유전자의 돌연변이", "모유 수유 - Fibroadenoma의 발생"], "answer": [5], "image": null, "images": [], "id_simple": "2020-Q80"}, {"id": "gsb-2025-L36-Q33", "year": 2025, "qnum": 33, "jokbo_lec_no": "36", "lecture": "(CBL) 부인과 환자 진료적 접근", "professor": "-", "curr_lec_no": "40", "curr_lecture": "[CBL] 부인과 환자 진료적 접근", "stem": "28세 산과력 0-0-0-0 여자가 지속되는 질출혈을 주소로 병원에 내원하였다.1년전부터 생리가 불규칙해지기 시작하였으며 최근 2개월간 무월경과 이후 소량의 출혈이 불규칙하게 반복되었다. 키 158cm, 체중 75kg 이며 얼굴에 여드름이 있었다. 이 환자와 관련있는 질환 또는 상태를 고르시오.", "stem_table": "| 자궁경부세포진검사: 정상혈색소 12.5 g/dL, 응고검사 정상 범위였다.경질 초음파 검사 상 자궁과 난소에 종괴는 보이지 않았으며 자궁내막 두께는 2cm 로 두꺼워져 있었다. |\n|---|", "options": ["인유두종바이러스 감염", "고프로락틴혈증", "무대항 에스트로겐 (Unopposed estrogen)", "자궁내막증", "자궁샘근육증"], "answer": [3], "image": "gsb_img/image202.png", "images": [], "id_simple": "2025-Q33"}, {"id": "gsb-2025-L36-Q34", "year": 2025, "qnum": 34, "jokbo_lec_no": "36", "lecture": "(CBL) 부인과 환자 진료적 접근", "professor": "-", "curr_lec_no": "40", "curr_lecture": "[CBL] 부인과 환자 진료적 접근", "stem": "자궁경부암 선별검사로 사용되고 있으며 민감도가 가장 높은 검사법을 고르시오", "stem_table": null, "options": ["고위험 인유두종바이러스 검사 (high risk human papilloma virus test)", "자궁경부세포진검사 (Cervical cytology, Pap smear)", "질확대경검사 (colposcopy)", "자궁경부관 소파술 (endocervical curettage)", "p16/Ki-67 dual stain."], "answer": [1], "image": null, "images": [], "id_simple": "2025-Q34"}, {"id": "gsb-2023-L36-Q18", "year": 2023, "qnum": 18, "jokbo_lec_no": "36", "lecture": "(CBL) 부인과 환자 진료적 접근", "professor": "-", "curr_lec_no": "40", "curr_lecture": "[CBL] 부인과 환자 진료적 접근", "stem": "인유두종바이러스 중 자궁경부암을 발생시키는 위험도가 가장 높은 아형(type) 2가지는?", "stem_table": null, "options": ["16,18", "18, 31", "35, 39", "51, 52", "56, 68"], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q18"}, {"id": "gsb-2023-L36-Q33", "year": 2023, "qnum": 33, "jokbo_lec_no": "36", "lecture": "(CBL) 부인과 환자 진료적 접근", "professor": "-", "curr_lec_no": "40", "curr_lecture": "[CBL] 부인과 환자 진료적 접근", "stem": "35세 여자가 부정출혈로 진단은?", "stem_table": null, "options": ["Seminoma", "Embryonal carcinoma", "Yolk sac tumor", "Teratoma", "Choriocarcinoma"], "answer": [2], "image": null, "images": ["gsb_img/image213.jpeg", "gsb_img/image214.jpeg", "gsb_img/image215.jpeg"], "id_simple": "2025-Q69"}, {"id": "gsb-2023-L40-1-Q36", "year": 2023, "qnum": 36, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "72세 남자 환자의 전립선의 현미경 소견이다. 이 질환에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["Epithelial cell 뿐만 아니라 stromal cell의 증식도 관찰된다.", "주로 전립샘의 peripheral zone에서 발생한다.", "methylacyl-coenzyme A-racemase (AMACR)에 대한 면역조직화학염색을 하면 양성으로 염색된다.", "전립샘암의 전암병변으로 여겨진다.", "Isochromosme i(12p)가 발생에 가장 큰 기여를 하는 유전자 이상으로 알려져 있다."], "answer": [1], "image": "gsb_img/image137.png", "images": [], "id_simple": "2023-Q36"}, {"id": "gsb-2023-L40-1-Q39", "year": 2023, "qnum": 39, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "다음 중 전립샘암에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["전립샘암은 주로 중심구역(central zone)에서 발생하여 요도를 눌러 증상을 유발한다.", "전립샘의 침생검 조직에서 암이 의심될 때는 high molecular weight cytokeratin이나 p63과 같은 면역조직화학염색을 시행하여 basal cell을 확인하면 전립샘암으로 진단할 수 있다.", "전립선암에서 가장 흔히 관찰되는 유전적 이상은 MYC 유전자의 증폭(MYC amplification)이다.", "전립샘암은 양성전립샘비대(benign prostatic hypertrophy)와 달리 호르몬치료에 반응하지 않으므로 근치전립샘절제나 면역항암치료를 해야 한다.", "근치전립샘절제(radical prostatectomy)에서 Gleason score 7 (3+4)는 가장 많은 Gleason pattern이 3, 그 다음으로 많은 Gleason pattern은 4라는 의미이다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q39"}, {"id": "gsb-2023-L40-1-Q78", "year": 2023, "qnum": 78, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "다음의 고환에서 발생한 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["제자리정모세포종양(Germ cell neoplasia in situ)는 대부분의 종자세포종양(germ cell tumor)의 전구 병변으로 여겨지며, 치료하지 않고 뒀을 때 약 70% 환자가 침윤성 종자세포종양으로 진행한다.", "Seminoma는 주로 소아에 발생하며 혈중 alpha-fetoprotein이 상승되어 있고 방사선치료에 잘 반응한다.", "Yolk sac tumor의 확진을 위해서는 CD30과 CK(cytokeratin) 면역염색이 도움이 된다.", "사춘기 이전에 발생한 기형종(teratoma)의 경우에는 주로 pure form으로 나오며, immature component 유무가 양성과 악성을 결정한다.", "고환에서 생긴 림프종은 주로 30대에 호발하며 가장 흔하게 발생하는 림프종은 광범위큰B세포림프종 (diffuse large B cell lymphoma)이다."], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q78"}, {"id": "gsb-2022-L40-1-Q34", "year": 2022, "qnum": 34, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "76세 남자환자의 전립선의 현미경소견이다. 이 질환에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["Epithelial cell 뿐만 아니라 stromal cell의 증식도 관찰된다.", "주로 전립샘의 central zone에서 발생한다.", "A-methylacyl-conezyme A-racemase(AMACR)에 대한 면역조직화학염색을 하면 기저세포(basal cell)의 소실을 확인할 수 있다.", "우리나라 남성 암 발생률 2위를 차지한다.", "Androgen이 성장에 가장 중요하므로 anti-androgen treatment가 치료의 기본이다."], "answer": [5], "image": null, "images": ["gsb_img/image216.png", "gsb_img/image216.png"], "id_simple": "2022-Q34"}, {"id": "gsb-2022-L40-1-Q70", "year": 2022, "qnum": 70, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "37세 남자 환자가 고환의 만져지는 종괴를 주소로 내원하여 고환절제술을 시행받았다 종양의 현미경적 소견은 다음과 같다. 이 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["주로 혈행성 전이(hematogenous metastasis)를 한다.", "면역조직화학염색상 PLAP OCT3/4에 양성을 보인다.", "고환에서 2번째로 흔하게 발생하는 종양이다.", "영아기(infancy)에서 발생한 경우 예후가 좋다.", "혈중 alpha-fetoprotein(AFP) 수치를 통해 진단 및 수술 후 치료반응을 예측할 수 있다."], "answer": [2], "image": "gsb_img/image217.png", "images": [], "id_simple": "2022-Q70"}, {"id": "gsb-2022-L40-1-Q87", "year": 2022, "qnum": 87, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "3세 남아가 고환의 종괴를 주소로 내원하여 고환종양으로 진단받고 고환절제술을 받았다. 환자의 고환 종양의 현미경 소견은 다음과 같다. 진단은?", "stem_table": null, "options": ["Embryonal carcinoma", "Seminoma", "Spermatocytic tumor", "Yolk sac tumor", "Choriocarcinoma"], "answer": [4], "image": "gsb_img/image218.png", "images": [], "id_simple": "2022-Q87"}, {"id": "gsb-2021-L40-1-Q65", "year": 2021, "qnum": 65, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "27개월 된 남아가 고환의 만져지는 종괴를 주소로 내원하여 고환절제술을 시행받았다. 종양의 현미경적 소견은 다음과 같다. 이 종양에 대한 설명으로 옳은 것은? (*참고-STS 11515 표본)", "stem_table": null, "options": ["3세 이하의 유아의 고환종양에서 가장 흔하다.", "Germ cell neoplasia in situ와 무관하게 발생한다.", "사춘기 이전에 발생했기 때문에 immaturity와 상관없이 악성으로 여겨진다.", "잠복고환증과 연관되어 가장 흔하게 발생하는 고환암이다.", "유아에서 발생했기 때문에 다른 germ cell tumor가 동반되었을 가능성이 높다."], "answer": [2], "image": "gsb_img/image219.jpeg", "images": [], "id_simple": "2021-Q65"}, {"id": "gsb-2021-L40-1-Q66", "year": 2021, "qnum": 66, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "35세 남자가 고환의 종괴를 주소로 내원하여 고환종양으로 진단받고 고환절제술을 받았다. 환자의 고환종양의 현미경 소견은 다음과 같다. 진단은? (*참고-STS 11508 표본)", "stem_table": null, "options": ["Embryonal carcinoma", "Seminoma", "Sermatocytic tumor", "Yolk sac tumor", "Choriocarcinoma"], "answer": [2], "image": "gsb_img/image220.jpeg", "images": [], "id_simple": "2021-Q66"}, {"id": "gsb-2021-L40-1-Q67", "year": 2021, "qnum": 67, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "76세 남자 환자의 전립선 현미경 소견이다. 이 질환에 대한 설명으로 옳은 것은? (*참고-STS 11507 표본)", "stem_table": null, "options": ["A-methylacyl-coenzyme A-racemase (AMACR) 면역조직화학염색에 양성을 보인다.", "주로 전립샘의 central zone에서 발생한다.", "High molecular weight cytokeratin(HMWCK)에 대한 면역조직화학염색을 하면 기저세포(basal cell)의 소실을 확인할 수 있다.", "전립샘암종의 전암병변(precursor lesion)이다.", "5a-reductase inhibitor가 치료제로 이용된다."], "answer": [5], "image": "gsb_img/image221.png", "images": [], "id_simple": "2021-Q67"}, {"id": "gsb-2020-L40-1-Q87", "year": 2020, "qnum": 87, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "27개월 남아의 고환에서 종괴가 관찰되었다. 다음은 고환절제술 후에 관찰한 현미경 소견이다. 이 종양에 대해서 옳은 것은?", "stem_table": null, "options": ["3세 이하의 유아에서 가장 흔하게 관찰되는 고환종이다.", "높은 hCG는 수술 전 진단과 수술 후 추적에 도움을 준다.", "초기에 혈행성 전이를 한다.", "잠복고환증과 연관된 고환암 중에서 가장 흔하다.", "Isochromosome 12p [i(12p)] 관찰하였다."], "answer": [1], "image": null, "images": ["gsb_img/image222.png", "gsb_img/image223.png"], "id_simple": "2020-Q87"}, {"id": "gsb-2020-L40-1-Q88", "year": 2020, "qnum": 88, "jokbo_lec_no": "40-1", "lecture": "(병리학실습) 남성생식기계질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "76세의 남자 환자가 높은 PSA 수치를 보였다. 이에 따라 전립선 침생검을 수행한 결과, 다음과 같은 현미경 소견을 보였다.", "stem_table": null, "options": ["Alpha methyacyl CoA racemase(AMACR) 염색이 이루어진다.", "Transition zone에서 발생한다.", "HMWCK(high-molecular weight cytokeratin)의 면역화학염색을 통하여 basal cell을 확인할 수 있다.", "전립샘암종의 전암병변이다.", "cribriform으로 Gleason pattern 4에 해당한다."], "answer": [4], "image": null, "images": ["gsb_img/image224.png", "gsb_img/image225.png"], "id_simple": "2020-Q88"}, {"id": "gsb-2025-L40-2-Q59", "year": 2025, "qnum": 59, "jokbo_lec_no": "40-2", "lecture": "(병리학실습) 유방질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "55세 여자 환자에서 좌측 유방 초음파 검사상에서 2.0cm 크기의 경계가 불분명한 종괴가 관찰되어 수술적 절제가 시행되었고 아래 사진과 같이 병리 검사상 침습적 관상암(invasive carcinoma, NST)로 진단 받았다. 수술 후 검체에서 시행한 면역조직화학염색 검사상 estrogen receptor(ER) 30%, progesteron receptor(PR) 0%, HER2 3+, ki-67 3%로 판독되었다. 본 종양의 분자아형은 무엇인지 고르시오", "stem_table": null, "options": ["Luminal A 유방암", "Luminal B 유방암", "HER2 양성 유방암", "삼중음성 유방암", "섬유성 유방암"], "answer": [2], "image": "gsb_img/image226.png", "images": [], "id_simple": "2025-Q59"}, {"id": "gsb-2025-L40-2-Q60", "year": 2025, "qnum": 60, "jokbo_lec_no": "40-2", "lecture": "(병리학실습) 유방질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "Mammography 검사상 5.0cm 크기의 경계가 불분명한 종괴가 관찰되어 이에 대한 절제수술을 시행받았다. 다음은 해당 검체의 조직검사 현미경 소견 상 나뭇잎과 같은 ‘엽상’ 모양이 관찰되며, 기질세포의 증식이 뚜렷이 관찰되었다. 이 질환에 대한 설명 중 옳은 것을 고르시오?", "stem_table": null, "options": ["진단명은 fibroadenoma이며 재발위험도가 0%임을 환자에게 설명하고 안심시킨다", "상피기원의 악성 종양으로 Invasive carcinoma, NST의 일종이다", "세포 분열도 (mitosis count)가 한 슬라이드내 10군데의 고배율 관찰 결과 30개 이상 (>30/10 high power field) 관찰되는 경우 악성일 가능성이 높다", "본 종양은 항상 악성종양이다", "유방 질환 중 가장 흔한 형태이다"], "answer": [3], "image": "gsb_img/image227.png", "images": [], "id_simple": "2025-Q60"}, {"id": "gsb-2023-L40-2-Q9", "year": 2023, "qnum": 9, "jokbo_lec_no": "40-2", "lecture": "(병리학실습) 유방질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "55세 여자 환자에서 좌측 유방 초음파 검사상에서 2.0cm 크기의 경계가 불분명한 종괴가 관찰되어 수술적 절제가 시행되었고 아래 사진과 같이 병리 검사상 침습적 관상암(invasive carcinoma, NST)로 진단받았다. 향후 시행되어야 하는 병리 검사에 대한 설명 중 맞는 것을 고르시오.", "stem_table": null, "options": ["호르몬 수용체의 경우 면역조직화학염색 검사상 100% 양성이 나오는 경우에만 항호르몬 치료제를 사용할 수 있다.", "호르몬 수용체 발현 확인을 위해 sequencing검사법을 우선적으로 시행해야 한다.", "HER2유전자 증폭을 확인하기 위한 검사법 중 면역조직화학염색(IHC)은 선호되지 않는 검사법이다.", "면역조직화학 염색 검사상 호르몬 수용체 과발현 및 HER2유전자 증폭을 확인하는 것은 환자의 표적 치료를 위해 시행해야 할 중요한 검사이다.", "HER2 면역조직화학염색 검사상 equivocal(2+/3) 이상의 양성 소견이 나오면 HER2 유전자 증폭으로 간주하고 바로 Herceptin 치료를 시행할 수 있다."], "answer": [4], "image": "gsb_img/image228.png", "images": [], "id_simple": "2023-Q9"}, {"id": "gsb-2022-L40-2-Q26", "year": 2022, "qnum": 26, "jokbo_lec_no": "40-2", "lecture": "(병리학실습) 유방질환", "professor": "김영아, 유한석", "curr_lec_no": "41", "curr_lecture": "(병리학실습) 남성생식기계질환/유방질환", "stem": "Mammography 검사상 5.2cm 크기의 종괴가 관찰되었고 이에 대한 절제수술을 시행받았다. 다음은 해당 검체의 조직검사 현미경 소견 상 나뭇잎과 같은 ‘엽상’ 모양이 관찰되며 기질세포의 증식이 뚜렷이 관찰되었다. 이 질환에 대한 설명 중 옳은 것을 고르시오.", "stem_table": null, "options": ["Fibroadenoma 로 진단할 수 있으며 재발위험도가 0%임을 환자에게 설명한다.", "진단은 invasive carcinoma,NST 형으로 추가적 항암치료가 요구된 function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdTableToHtml(md) {
  if(!md) return '';
  const lines = md.trim().split('\n').filter(l=>l.trim());
  const rows = [];
  for(const line of lines) {
    const cells = line.split('|').map(c=>c.trim()).filter((cell,i,a)=>!(i===0&&cell===''||i===a.length-1&&cell===''));
    if(cells.length) rows.push(cells);
  }
  if(rows.length<2) return '<pre>'+esc(md)+'</pre>';
  const filtered = rows.filter((_,i)=>i!==1);
  if(!filtered.length) return '';
  let html='<table class="stem-table"><thead><tr>';
  for(const cell of filtered[0]) html+='<th>'+esc(cell)+'</th>';
  html+='</tr></thead><tbody>';
  for(const row of filtered.slice(1)) {
    html+='<tr>';
    for(const cell of row) html+='<td>'+esc(cell)+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table>';
  return html;
}

// ═══════════════════════════════════════════════════
// SHUFFLE
// ═══════════════════════════════════════════════════
function shuffleArray(arr) {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  const btn = document.getElementById('shuffle-btn');
  if(isShuffled) {
    filteredQ = shuffleArray(filteredQ);
    btn.classList.add('active');
    btn.textContent = '↕ 랜덤 해제';
  } else {
    // Restore original order by re-applying filters
    btn.classList.remove('active');
    btn.textContent = '↕ 랜덤 순서';
    applyFilters(true); // true = skip shuffle
    return;
  }
  renderFeed();
  renderIndex();
}

// ═══════════════════════════════════════════════════
// FILTER
// ═══════════════════════════════════════════════════
function applyFilters(skipShuffle) {
  const SRC = (filterTerm==='icm') ? ICM_QUESTIONS : QUESTIONS;
  const isICM = (filterTerm==='icm');
  filteredQ = SRC.filter(q => {
    const yearOk = (filterYear==='all' || String(q.year)===String(filterYear));
    let lecOk;
    if(filterLec==='all') lecOk=true;
    else if(filterLec==='null') lecOk=!q.curr_lec_no;
    else lecOk=q.curr_lec_no===filterLec;
    // ICM 은 과목(1차/2차) term 로직 미적용 — termOk=true
    const t=isICM ? 0 : lecTerm(q.curr_lec_no);
    const termOk = isICM ? true : (filterTerm==='all' || t===0 || String(t)===filterTerm);
    const scrapOk = !filterScrapOnly || anyScrap(q.id);
    return yearOk && lecOk && termOk && scrapOk;
  });
  if(isShuffled && !skipShuffle) {
    filteredQ = shuffleArray(filteredQ);
  }
  renderFeed();
  updateStats();
  updateScopeBar();
  renderIndex();
  saveFilter();
}

// ICM 단원 순서(코드 → 라벨). curr_lec_no 고유값을 이 순서대로 노출.
const ICM_LEC_ORDER=['1A','1B','1C','1D','1E','2','3','4','5','6','7'];
const ICM_SIMGROUPS = [];
const ICM_Q2GROUP = {};
const ICM_UNIT_SIM = {};
function rebuildLecOptions(){
  const sel=document.getElementById('lec-select'); if(!sel) return;
  // ICM 과목: ICM_QUESTIONS 의 curr_lec_no 고유값을 정해진 순서대로 옵션 생성
  if(filterTerm==='icm'){
    const seen={};
    (typeof ICM_QUESTIONS!=='undefined'?ICM_QUESTIONS:[]).forEach(function(q){ if(q.curr_lec_no && !seen[q.curr_lec_no]) seen[q.curr_lec_no]=q.curr_lecture||''; });
    const ordered=ICM_LEC_ORDER.filter(function(k){return seen[k]!==undefined;});
    // 순서표에 없는 잔여 코드도 뒤에 붙임(안전)
    Object.keys(seen).forEach(function(k){ if(ordered.indexOf(k)<0) ordered.push(k); });
    // 첫 진입(저장된 lec 가 'all') 시 첫 단원 자동 선택 — 렉 방지 우선
    if(filterLec==='all' && ordered.length){ filterLec=ordered[0]; }
    let h='';
    ordered.forEach(function(k){ h+='<option value="'+esc(k)+'">'+esc(k+'. '+seen[k])+'</option>'; });
    h+='<option value="all">전체 단원</option>';  // '전체'는 맨 아래(명시 선택 전용)
    sel.innerHTML=h;
    sel.value=filterLec;
    if(sel.value!==filterLec){ filterLec=(ordered.length?ordered[0]:'all'); sel.value=filterLec; }
    return;
  }
  if(!FULL_LEC.length) return;
  // 현재 과목(filterTerm) 에 해당하는 강의 key 목록 — 첫 강의 자동선택 판정용
  const lecKeys=[];
  FULL_LEC.forEach(function(r){
    const t=lecTerm(r.key);
    if(filterTerm==='all' || t===0 || String(t)===filterTerm) lecKeys.push(r.key);
  });
  // 첫 진입(저장된 lec 가 'all') 시 첫 강의 자동 선택 — 렉 방지 우선
  if(filterLec==='all' && lecKeys.length){ filterLec=lecKeys[0]; }
  let html='';
  FULL_LEC.forEach(function(r){
    const t=lecTerm(r.key);
    if(filterTerm==='all' || t===0 || String(t)===filterTerm){
      html+='<option value="'+r.key+'">'+esc(r.label)+'</option>';
    }
  });
  html+='<option value="all">전체 강의</option>';  // '전체'는 맨 아래(명시 선택 전용)
  sel.innerHTML=html;
  sel.value=filterLec;
  if(sel.value!==filterLec){ filterLec=(lecKeys.length?lecKeys[0]:'all'); sel.value=filterLec; }
}

function countStats() {
  let correct=0,wrong=0,answered=0;
  filteredQ.forEach(q=>{
    const sa=hideAnswers?null:savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length>0){
      answered++;
      if(sa.correct) correct++; else wrong++;
    }
  });
  return {total:filteredQ.length,answered,correct,wrong};
}
function updateStats() {
  const s=countStats();
  document.getElementById('stat-shown').textContent=s.total;
  document.getElementById('stat-correct').textContent=s.correct;
  document.getElementById('stat-wrong').textContent=s.wrong;
}
function updateScopeBar() {
  const s=countStats();
  document.getElementById('scope-bar').innerHTML=
    `전체 <b>${s.total}</b>문항 &nbsp;|&nbsp; 푼 <b>${s.answered}</b> &nbsp;|&nbsp; 정답 <b style="color:var(--correct)">${s.correct}</b> &nbsp;|&nbsp; 오답 <b style="color:var(--incorrect)">${s.wrong}</b>`;
}

    +'</div>'

// ICM 단원별 진척도(단원명·푼/총·정답률). 알렌 진척도(appendAllenProgress) 미호출.
function renderICMProgress(pv){
  const agg={};
  (typeof ICM_QUESTIONS!=='undefined'?ICM_QUESTIONS:[]).forEach(function(q){
    const k=q.curr_lec_no||'기타';
    if(!agg[k]) agg[k]={total:0,done:0,correct:0,label:q.curr_lecture||''};
    agg[k].total++;
    const sa=savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length){ agg[k].done++; if(sa.correct) agg[k].correct++; }
  });
  const ordered=ICM_LEC_ORDER.filter(function(k){return agg[k];});
  Object.keys(agg).forEach(function(k){ if(ordered.indexOf(k)<0) ordered.push(k); });
  let totT=0,totD=0,totC=0,rows='';
  ordered.forEach(function(k){
    const a=agg[k]; totT+=a.total; totD+=a.done; totC+=a.correct;
    const pct=a.total?Math.round(a.done/a.total*100):0;
    const acc=a.done?Math.round(a.correct/a.done*100):0;
    const full=(a.total>0&&a.done===a.total);
    const simP=(typeof ICM_UNIT_SIM!=='undefined'&&ICM_UNIT_SIM.hasOwnProperty(k))?ICM_UNIT_SIM[k]:null;
    const simCls=(simP==null)?'na':(simP>=50?'hi':(simP>=25?'mid':'lo'));
    rows+='<tr>'
      +'<td class="prog-lec">'+esc(k+'. '+a.label)+'</td>'
      +'<td class="prog-num">'+a.total+'</td>'
      +'<td class="prog-num'+(full?' prog-done-full':'')+'">'+a.done+'</td>'
      +'<td class="prog-num">'+(a.done?acc+'%':'—')+'</td>'
      +'<td class="prog-num prog-sim '+simCls+'">'+(simP==null?'—':simP+'%')+'</td>'
      +'<td><div class="prog-cell-prog"><div class="prog-bar'+(full?' full':'')+'"><span style="width:'+pct+'%"></span></div><span class="prog-pct">'+pct+'%</span></div></td>'
      +'</tr>';
  });
  const totPct=totT?Math.round(totD/totT*100):0;
  const totAcc=totD?Math.round(totC/totD*100):0;
  const who=CURRENT_USER?esc(CURRENT_USER):'(사용자 미선택)';
  pv.innerHTML=
    '<div class="prog-title">📊 풀이 진척도 확인 — 임상의학입문 (ICM)</div>'
    +'<div class="prog-sub">현재 사용자 <b>'+who+'</b> · 과목 <b>임상의학입문 (ICM)</b> · 단원별 집계입니다.</div>'
    +'<div class="prog-summary">'
      +'<div class="prog-sum-chip">총 '+totT+'문항</div>'
      +'<div class="prog-sum-chip">푼 문항 '+totD+'개</div>'
      +'<div class="prog-sum-chip">전체 진척률 '+totPct+'%</div>'
      +'<div class="prog-sum-chip">정답률 '+(totD?totAcc+'%':'—')+'</div>'
      +'<div class="prog-sum-chip">단원 '+ordered.length+'개</div>'
    +'</div>'
    +'<div class="prog-table-wrap"><table class="prog-table"><thead><tr>'
      +'<th>단원</th><th style="text-align:center;">총</th><th style="text-align:center;">푼</th><th style="text-align:center;">정답률</th><th style="text-align:center;" title="과년도 반복 출제 비율(유사문항 묶음 기준)">유사도</th><th>진척</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
async function saveMetaBlur(kind, lec, el){
  const val=el.value.trim();
  if(val===(curMeta(kind,lec)||'')) return;
  const ind=document.getElementById('save-'+kind+'-'+lec);
  if(ind){ ind.textContent='…'; ind.style.color='var(--text-muted)'; }
  const ok=await sbUpsert('__'+kind+'__'+lec,{expl:val});
  setSyncPills();
  if(ind){
    if(ok){ ind.textContent='✓'; ind.style.color='var(--correct)'; setTimeout(function(){ if(ind&&ind.textContent==='✓') ind.textContent=''; },1600); }
    else { ind.textContent='⚠'; ind.style.color='var(--incorrect)'; }
  }
}

      dotCls += sa.correct?' dot-correct':' dot-wrong';

function scrollToCard(idx) {
  const el=document.getElementById('card-'+idx);
  if(el){
    const b=el.closest('.qbundle');
    if(b){
      const gi=b.id.slice(7);  // 'bundle-'
      const slides=Array.prototype.slice.call(b.querySelector('.qbundle-track').children);
      const pos=slides.indexOf(el);
      if(pos>=0) bundleGo(gi,pos);
      b.scrollIntoView({behavior:'smooth',block:'start'});
    } else {
      el.scrollIntoView({behavior:'smooth',block:'start'});
    }
  }
  document.querySelectorAll('.idx-item').forEach((b,i)=>b.classList.toggle('idx-current',i===idx));
}

// RENDER FEED (vertical scroll)
// ═══════════════════════════════════════════════════
// 유사문항 그룹 — 강의별 족보 stem+선지 유사도(결정론 difflib, 동일문항/선지순서·표현 변경 묶음)
const SIMGROUPS = [];
// 오분류 의심 문항 → 추정 정정 강의 (2026-06-09 검수 TIER1+2). 풀이 전 배지로 경고.
const MISCLASS = {};
const MISIMG = {};
// 유사문항 그룹 맵 (SIMGROUPS 는 위 인라인)
const Q2GROUP={};
SIMGROUPS.forEach(function(g,gi){ g.forEach(function(qid){ Q2GROUP[qid]=gi; }); });
let bundleState={};   // gid → 활성 슬라이드 index (재렌더 시 복원)

function makeQCard(q,i){
  const div=document.createElement('div');
  div.className='q-card'; div.id='card-'+i;
  div.setAttribute('data-qid',q.id); div.setAttribute('data-qidx',i);
  div.innerHTML=buildCardHtml(q,i);
  return div;
}
function renderFeed() {
  const feed=document.getElementById('feed');
  const noRes=document.getElementById('no-results');
  feed.innerHTML='';
  if(filteredQ.length===0){
    noRes.style.display='block';
    return;
  }
  noRes.style.display='none';

  const frag=document.createDocumentFragment();
  const idxOf={}; filteredQ.forEach(function(q,i){ idxOf[q.id]=i; });
  const doneG={};
  filteredQ.forEach(function(q,i){
    const gi=(filterTerm==='icm'?ICM_Q2GROUP:Q2GROUP)[q.id];
    if(gi!=null){
      if(doneG[gi]) return;   // 이미 묶음으로 렌더됨
      const memIdx=(filterTerm==='icm'?ICM_SIMGROUPS:SIMGROUPS)[gi].filter(function(id){return idxOf[id]!=null;}).map(function(id){return idxOf[id];});
      if(memIdx.length>=2){ doneG[gi]=true; frag.appendChild(buildBundle(gi, memIdx)); return; }
      // 현재 필터에 1개만 → 일반 카드로
    }
    frag.appendChild(makeQCard(q,i));
  });
  feed.appendChild(frag);
  // 활성 슬라이드 복원
  Object.keys(doneG).forEach(function(gi){ bundleGo(gi, bundleState[gi]||0); });
}
// 유사문항 묶음(가로 캐러셀) — 각 슬라이드는 정상 card-{i} 라 답/스크랩/해설 그대로 동작
function buildBundle(gi, memIdx){
  const b=document.createElement('div'); b.className='qbundle'; b.id='bundle-'+gi;
  const n=memIdx.length;
  const head=document.createElement('div'); head.className='qbundle-head';
  head.innerHTML='<span>🔗 유사문항 '+n+'개 · 옆으로 넘겨 비교</span><span class="qbundle-counter">1 / '+n+'</span>';
  const track=document.createElement('div'); track.className='qbundle-track';
  memIdx.forEach(function(i,k){
    const card=makeQCard(filteredQ[i], i);
    card.style.display=(k===0?'block':'none');
    track.appendChild(card);
  });
  const nav=document.createElement('div'); nav.className='qbundle-nav';
  let dots=''; for(let k=0;k<n;k++) dots+='<span class="qbundle-dot'+(k===0?' on':'')+'" onclick="bundleGo(\''+gi+'\','+k+')"></span>';
  nav.innerHTML='<button class="qbundle-arrow" onclick="bundleNav(\''+gi+'\',-1)">‹ 이전</button>'
    +'<div class="qbundle-dots">'+dots+'</div>'
    +'<button class="qbundle-arrow" onclick="bundleNav(\''+gi+'\',1)">다음 ›</button>';
  b.appendChild(head); b.appendChild(nav); b.appendChild(track);
  // 터치 스와이프(모바일)
  let sx=null;
  track.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
  track.addEventListener('touchend',function(e){ if(sx==null)return; const dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>45) bundleNav(gi, dx<0?1:-1); sx=null; },{passive:true});
  return b;
}
function bundleGo(gi, idx){
  const b=document.getElementById('bundle-'+gi); if(!b) return;
  const slides=b.querySelector('.qbundle-track').children; const n=slides.length; if(!n) return;
  idx=((idx%n)+n)%n; bundleState[gi]=idx;
  for(let k=0;k<n;k++) slides[k].style.display=(k===idx?'block':'none');
  const c=b.querySelector('.qbundle-counter'); if(c) c.textContent=(idx+1)+' / '+n;
  b.querySelectorAll('.qbundle-dot').forEach(function(d,k){ d.classList.toggle('on',k===idx); });
}
function bundleNav(gi,dir){ bundleGo(gi,(bundleState[gi]||0)+dir); }

// BUILD CARD HTML
// ═══════════════════════════════════════════════════
const CIRCLES=['①','②','③','④','⑤'];

function buildCardHtml(q,idx) {
  const sa=hideAnswers?null:(savedAnswers[q.id]||null);
  const answered=sa&&sa.sel&&sa.sel.length>0;
  const isScrap=!!savedScraps[q.id];

  const lecTag=q.curr_lec_no?(q.curr_lec_no==='NF'?'🔍 99. Not found':`${q.curr_lec_no}강 ${esc(q.curr_lecture||'')}`):'기타/미분류';
  const recoveredTag=q.recovered?`<span class="meta-tag tag-recovered">복원</span>`:'';

  // Star button: ☆ (empty) / ★ (filled) — 내 스크랩 토글
  const starChar = isScrap ? '★' : '☆';
  const starTitle = isScrap ? (esc(CURRENT_USER||'')+' 스크랩 해제') : '스크랩';
  const starBtn=`<button class="scrap-btn${isScrap?' starred':''}"
    onclick="toggleScrap('${q.id}')" title="${starTitle}">${starChar}</button>`;
  // 누가 스크랩했는지 배지(나 외 사용자)
  const others=(allScraps[q.id]||[]).filter(function(u){return u!==CURRENT_USER;});
  const whoBadges=others.map(function(u){return '<span class="scrap-who">⭐'+esc(u)+'</span>';}).join('');

  // 문항 수정(qfix) — 헤더 우측에 배치(별도 줄 없이 항상 노출)
  const isFixed=!!(shared['__qfix__'+q.id]&&(shared['__qfix__'+q.id].expl||'').trim());
  const fixBadge=isFixed?'<span class="qfix-badge">✎ 수정됨</span>':'';
  const fixBtn=`<button class="qfix-edit-btn" onclick="startQFix('${q.id}')" title="문항(본문·보기·정답) 수정">✏️ 문항 수정</button>`;
  // 오분류 교정(강의 재분류) — 헤더 우측
  const isLecFixed=!!(shared['__lecfix__'+q.id]&&(shared['__lecfix__'+q.id].expl||'').trim());
  const lecFixBtn=`<button class="qfix-edit-btn lecfix-btn" onclick="openLecPicker('${q.id}')" title="이 문항을 올바른 강의로 이동(오분류 교정)">🏷️ 오분류${isLecFixed?' <span class="lecfix-badge">교정됨</span>':''}</button>`;

  // header
  const header=`<div class="q-card-header">
    <div class="q-card-header-inner">
      <span class="meta-tag tag-year">${q.year}</span>
      <span class="meta-tag tag-lec">${lecTag}</span>
      ${q.professor?`<span class="meta-tag tag-prof">${esc(q.professor)}</span>`:''}
      <span class="meta-tag tag-qnum">족보 Q${q.qnum}</span>
      ${recoveredTag}
      ${MISCLASS[q.id]?`<span class="meta-tag tag-misclass" title="다른 강의(강${MISCLASS[q.id]}) 내용일 가능성이 있는 문항입니다. 지금 강의에서 배우지 않은 내용이면 오분류입니다.">⚠ 오분류 의심 → 강${MISCLASS[q.id]}?</span>`:''}
      ${MISIMG[q.id]?`<span class="meta-tag tag-misimg" title="${esc(MISIMG[q.id])}">⚠ 이미지 오류 의심</span>`:''}
    </div>
    <div class="scrap-area">${whoBadges}${fixBtn}${lecFixBtn}${starBtn}</div>
  </div>`;

  const misImgNote=MISIMG[q.id]?`<div class="misclass-note" style="background:#fdeeee;border-color:#e0a8a8;color:#9a3030;">⚠ <b>이미지 오류 의심</b> — ${esc(MISIMG[q.id])}</div>`:'';
  const misNote=MISCLASS[q.id]?`<div class="misclass-note">⚠ <b>오분류 의심</b> — 이 문항은 <b>강${MISCLASS[q.id]}</b> 내용일 가능성이 있습니다. 지금 강의(${q.curr_lec_no}강)에서 배운 내용이 아니라면 태깅 오류이니 참고하세요.</div>`:'';

  // stem (isFixed/fixBadge/fixBtn 은 헤더 위에서 이미 정의)
  const stem=`<div class="q-stem">${esc(q.stem)}${fixBadge}</div>`;
  const qfixFormHtml=buildQFixForm(q.id, q);

  // table
  const tbl=q.stem_table?`<div class="stem-table-wrap">${mdTableToHtml(q.stem_table)}</div>`:'';

  // image — 단일(q.image) 및 다중(q.images 배열, ICM) 모두 지원
  let img='';
  if(q.image){
    img=`<div class="q-image"><img src="${esc(q.image)}" alt="문항 이미지" title="클릭하면 확대됩니다" data-src="${esc(q.image)}" onclick="openImgLightbox(this.src)" onerror="imgFail(this)"></div>`;
  }
  if(Array.isArray(q.images)){
    q.images.forEach(function(src){
      if(!src) return;
      img+=`<div class="q-image"><img src="${esc(src)}" alt="문항 이미지" title="클릭하면 확대됩니다" data-src="${esc(src)}" onclick="openImgLightbox(this.src)" onerror="imgFail(this)"></div>`;
    });
  }

  // choices
  let choices='<div class="choices">';
  q.options.forEach((opt,i)=>{
    const num=i+1;
    let cls='choice-btn';
    if(answered){
      if(q.answer.includes(num)) cls+=' correct-ans';
      else if(sa.sel.includes(num)) cls+=' my-wrong-ans';
    }
    const disabled=answered?'disabled':'';
    choices+=`<button class="${cls}" ${disabled} onclick="onChoice('${q.id}',${num},${idx})">
      <span class="choice-num">${CIRCLES[i]}</span>
      <span>${esc(opt)}${(q.option_images&&q.option_images[i])?`<img class="opt-img" src="${esc(q.option_images[i])}" alt="선지 그림" onclick="event.stopPropagation();openImgLightbox(this.src)">`:''}</span>
    </button>`;
  });
  choices+='</div>';

  // (결과 배너 제거: 정답 보기=초록, 오답 선택=빨강 하이라이트로 충분)

  // explanation — only visible after answering
  const expl=buildExplHtml(q.id, answered);

  return `${header}
  <div class="q-card-body">
    ${stem}${misNote}${misImgNote}${tbl}${img}${qfixFormHtml}${choices}${expl}
  </div>`;
}

function mdLite(s){return esc(s).replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>');}
const TAB_FIELDS=[{key:'expl',label:'해설'},{key:'memo2',label:'구민준'},{key:'memo1',label:'이현우'}];

// ═══════════════════════════════════════════════════
// 문항 수정(QFIX) — 파싱 오류 교정, 공유 저장
// ═══════════════════════════════════════════════════
const QFIX_ORIG={};  // {qid:{stem,options,answer,image}} — 원본 백업(복원용)
const CIRCLES_FIX=['①','②','③','④','⑤'];
// 문항수정 폼에서 대기 중인 사진 변경: qid→ (dataURL=새사진 / null=삭제 / 키없음=변경없음). 저장 시 __qfix__ JSON 의 image 로 영속.
const QFIX_IMG={};

function applyQFixes(){
  // shared 에서 __qfix__* 키 순회 → QUESTIONS 원소 덮어쓰기
  for(const k in shared){
    if(!k.startsWith('__qfix__')) continue;
    const qid=k.slice('__qfix__'.length);
    const raw=(shared[k]&&shared[k].expl)||'';
    if(!raw.trim()) continue;
    let fix;
    try{ fix=JSON.parse(raw); }catch(e){ continue; }
    const q=findQ(qid);
    if(!q) continue;
    if(!QFIX_ORIG[qid]) QFIX_ORIG[qid]={stem:q.stem, options:q.options.slice(), answer:q.answer.slice(), image:q.image};
    if(fix.stem!==undefined) q.stem=fix.stem;
    if(Array.isArray(fix.options)&&fix.options.length) q.options=fix.options;
    if(Array.isArray(fix.answer)&&fix.answer.length) q.answer=fix.answer;
    if('image' in fix) q.image=fix.image;   // dataURL=교체 / null=삭제
  }
}

// ── 오분류 교정(강의 재분류) ──
// 강의코드→정식 강의명 맵(원본 QUESTIONS 1회 캡처). 강의 이동 시 표시명 동기화용.
let LECNAME=null;
function buildLecName(){
  if(LECNAME) return;
  LECNAME={};
  QUESTIONS.forEach(function(q){ if(q.curr_lec_no && !(q.curr_lec_no in LECNAME)) LECNAME[q.curr_lec_no]=q.curr_lecture||''; });
}
const QLEC_ORIG={};  // {qid:{no,name}} 원본 백업(복원용)
// 서버 __lecfix__* → QUESTIONS.curr_lec_no/curr_lecture 오버라이드
function applyLecFixes(){
  buildLecName();
  for(const k in shared){
    if(!k.startsWith('__lecfix__')) continue;
    const qid=k.slice('__lecfix__'.length);
    const code=((shared[k]||{}).expl||'').trim();
    const q=findQ(qid);
    if(!q) continue;
    if(!(qid in QLEC_ORIG)) QLEC_ORIG[qid]={no:q.curr_lec_no, name:q.curr_lecture};
    if(code){ q.curr_lec_no=code; q.curr_lecture=(LECNAME&&LECNAME[code])||''; }
    else { q.curr_lec_no=QLEC_ORIG[qid].no; q.curr_lecture=QLEC_ORIG[qid].name; }
  }
}
// 오분류 버튼 → 강의 선택 모달
function openLecPicker(qid){
  const q=findQ(qid); if(!q) return;
  let roster;
  if(qid.indexOf("ICM-")===0){
    const seen={}; (typeof ICM_QUESTIONS!=="undefined"?ICM_QUESTIONS:[]).forEach(function(x){ if(x.curr_lec_no&&!(x.curr_lec_no in seen)) seen[x.curr_lec_no]=x.curr_lecture||""; });
    roster=ICM_LEC_ORDER.filter(function(k){return k in seen;}).map(function(k){return {key:k,label:k+". "+seen[k]};});
  } else { roster=(FULL_LEC&&FULL_LEC.length)?FULL_LEC:lecRoster(); }
  let opts='<option value="">— 교정 취소(원래 강의로 되돌림) —</option>';
  roster.forEach(function(r){
    opts+='<option value="'+esc(r.key)+'"'+(q.curr_lec_no===r.key?' selected':'')+'>'+esc(r.label)+'</option>';
  });
  const ov=document.createElement('div');
  ov.className='lecfix-modal-overlay';
  ov.innerHTML='<div class="lecfix-modal">'
    +'<div class="lecfix-modal-title">🏷️ 오분류 교정 — 이 문항을 올바른 강의로 이동</div>'
    +'<div class="lecfix-modal-q">'+esc((q.stem||'').slice(0,90))+'…</div>'
    +'<label class="lecfix-modal-label">이동할 강의</label>'
    +'<select id="lecpick-sel" class="lecfix-modal-select">'+opts+'</select>'
    +'<div class="lecfix-modal-actions">'
      +'<button class="lecfix-save" onclick="saveLecFix(\''+qid+'\')">이동</button>'
      +'<button class="lecfix-cancel" onclick="closeLecPicker()">취소</button>'
    +'</div></div>';
  ov.addEventListener('click',function(e){ if(e.target===ov) closeLecPicker(); });
  document.body.appendChild(ov);
}
function closeLecPicker(){ const ov=document.querySelector('.lecfix-modal-overlay'); if(ov) ov.remove(); }
async function saveLecFix(qid){
  const sel=document.getElementById('lecpick-sel'); if(!sel) return;
  const code=sel.value;
  const ok=await sbUpsert('__lecfix__'+qid,{expl:code});
  setSyncPills();
  applyLecFixes();
  closeLecPicker();
  applyFilters();   // filteredQ 재계산 + renderFeed/stats/scope/index 일괄
  const pv=document.getElementById('progress-view'); if(pv && !pv.hidden) renderProgress();
  if(!ok) alert('인터넷 연결이 없어 공유 저장에 실패했습니다(이 브라우저에 임시 반영).');
}

// 문항수정 폼의 사진 영역 내부 HTML. 대기변경(QFIX_IMG) 우선, 없으면 현재 q.image.
function qfixImgInner(qid, q){
  const pending=(qid in QFIX_IMG);
  const eff=pending?QFIX_IMG[qid]:(q?q.image:null);
  if(pending && QFIX_IMG[qid]===null){
    // 삭제 대기
    return '<div class="qfix-img-status del">🗑 사진 삭제 예정 (저장 시 적용)</div>'
      +'<div class="qfix-img-actions"><button class="qfix-img-undo-btn" onclick="qfixUndoImg(\''+qid+'\')">되돌리기</button></div>';
  }
  if(eff){
    const isNew=pending; // 새로 붙여넣은 사진
    let h='';
    if(isNew) h+='<div class="qfix-img-status new">🆕 새 사진 (저장 시 적용)</div>';
    h+='<img class="qfix-img-preview" src="'+esc(eff)+'" alt="문항 사진">';
    h+='<div class="qfix-img-actions"><button class="qfix-img-del-btn" onclick="qfixDelImg(\''+qid+'\')">🗑 사진 삭제</button>';
    if(isNew) h+='<button class="qfix-img-undo-btn" onclick="qfixUndoImg(\''+qid+'\')">되돌리기</button>';
    h+='</div>';
    return h;
  }
  return '<div class="qfix-img-none">사진 없음 — 여기 클릭 후 Ctrl+V 로 붙여넣기</div>';
}
function refreshQFixImg(qid){
  const zone=document.getElementById('qfix-img-zone-'+qid);
  if(!zone) return;
  const q=findQ(qid);
  zone.innerHTML=qfixImgInner(qid,q);
}
function qfixDelImg(qid){
  QFIX_IMG[qid]=null;   // 삭제 대기(저장 시 영속)
  refreshQFixImg(qid);
}
function qfixUndoImg(qid){
  delete QFIX_IMG[qid]; // 대기 변경 취소 → 현재 사진으로 복귀
  refreshQFixImg(qid);
}
function startQFix(qid){
  const form=document.getElementById('qfix-form-'+qid);
  if(!form) return;
  form.classList.add('show');
  const ta=document.getElementById('qfix-stem-'+qid);
  if(ta) ta.focus();
}
function cancelQFix(qid){
  delete QFIX_IMG[qid]; // 대기 사진변경 폐기
  const form=document.getElementById('qfix-form-'+qid);
  if(form){ form.classList.remove('show'); refreshQFixImg(qid); }
}
async function saveQFix(qid){
  const ta=document.getElementById('qfix-stem-'+qid);
  if(!ta) return;
  const stem=ta.value.trim();
  const options=[];
  for(let i=1;i<=5;i++){
    const inp=document.getElementById('qfix-opt-'+i+'-'+qid);
    options.push(inp?inp.value.trim():'');
  }
  const answer=[];
  for(let i=1;i<=5;i++){
    const cb=document.getElementById('qfix-ans-'+i+'-'+qid);
    if(cb&&cb.checked) answer.push(i);
  }
  if(!answer.length){ alert('정답을 최소 1개 선택해야 합니다.'); return; }
  // 사진: 이번에 바꿨으면 그 값, 아니면 기존 저장된 override 보존
  let imgToSave; // undefined = fix 에 image 미포함(원본 사용)
  if(qid in QFIX_IMG){ imgToSave=QFIX_IMG[qid]; }
  else {
    const prevRaw=(shared['__qfix__'+qid]&&shared['__qfix__'+qid].expl)||'';
    if(prevRaw){ try{ const pf=JSON.parse(prevRaw); if('image' in pf) imgToSave=pf.image; }catch(e){} }
  }
  const fix={stem:stem, options:options, answer:answer};
  if(imgToSave!==undefined) fix.image=imgToSave;
  // 적용 (원본 백업은 변경 전에)
  const q=findQ(qid);
  if(q){
    if(!QFIX_ORIG[qid]) QFIX_ORIG[qid]={stem:q.stem, options:q.options.slice(), answer:q.answer.slice(), image:q.image};
    q.stem=stem; q.options=options; q.answer=answer;
    if(imgToSave!==undefined) q.image=imgToSave;
  }
  delete QFIX_IMG[qid]; // 대기 사진변경 소비
  const ok=await sbUpsert('__qfix__'+qid, {expl:JSON.stringify(fix)});
  setSyncPills();
  // 카드 재렌더(filteredQ 에서 해당 qid 의 index 찾기)
  const cardEl=document.querySelector('.q-card[data-qid="'+qid+'"]');
  if(cardEl){
    const i=parseInt(cardEl.getAttribute('data-qidx'),10);
    if(!isNaN(i)&&filteredQ[i]){ cardEl.innerHTML=buildCardHtml(filteredQ[i], i); }
  }
  if(!ok) alert('인터넷 연결이 없어 공유 저장에 실패했습니다.\n내용은 이 브라우저에 임시 저장됐으니, 연결 후 다시 "저장"하면 공유됩니다.');
}
async function restoreQFix(qid){
  if(!confirm('이 문항을 원본으로 복원할까요? (교정 내용이 지워집니다)')) return;
  await sbUpsert('__qfix__'+qid, {expl:''});
  setSyncPills();
  delete QFIX_IMG[qid];
  const q=findQ(qid);
  if(q&&QFIX_ORIG[qid]){
    q.stem=QFIX_ORIG[qid].stem;
    q.options=QFIX_ORIG[qid].options.slice();
    q.answer=QFIX_ORIG[qid].answer.slice();
    if('image' in QFIX_ORIG[qid]) q.image=QFIX_ORIG[qid].image;
    delete QFIX_ORIG[qid];
  }
  const cardEl=document.querySelector('.q-card[data-qid="'+qid+'"]');
  if(cardEl){
    const i=parseInt(cardEl.getAttribute('data-qidx'),10);
    if(!isNaN(i)&&filteredQ[i]){ cardEl.innerHTML=buildCardHtml(filteredQ[i], i); }
  }
}

function buildViewHtml(qid, field){

  if(txt&&txt.trim()) return '<div class="expl-text" id="view-'+field+'-'+qid+'">'+mdLite(txt)+'</div>';
  return '<div class="memo-empty" id="view-'+field+'-'+qid+'">'+esc(empty)+'</div>';

// SUPABASE 공유 계층 (해설·메모1·메모2·첨부사진)

function sbInit(){
  try{ if(window.supabase&&SB_URL&&SB_KEY){ SB=window.supabase.createClient(SB_URL,SB_KEY); } }
  catch(e){ SB=null; }
}
async function sbLoadAll(){
  if(!SB) return;
  try{
    const res=await SB.from('qnotes').select('qid,expl,memo1,memo2,expl_imgs');
    if(res.error) throw res.error;
    (res.data||[]).forEach(function(r){ shared[r.qid]={expl:r.expl,memo1:r.memo1,memo2:r.memo2,expl_imgs:r.expl_imgs||[]}; });
    sbOnline=true; saveSharedCache();
  }catch(e){ sbOnline=false; }
}
async function sbUpsert(qid, patch){
  shared[qid]=Object.assign({}, shared[qid], patch);   // 로컬 우선 반영
  saveSharedCache();
  if(!SB){ sbOnline=false; return false; }
  try{
    const row=Object.assign({qid:qid, updated_at:new Date().toISOString()}, patch);
    const res=await SB.from('qnotes').upsert(row,{onConflict:'qid'});
    if(res.error) throw res.error;
    sbOnline=true; return true;
  }catch(e){ sbOnline=false; return false; }
}
function saveSharedCache(){
  try{
    const slim={};
    for(const k in shared){ const s=shared[k]; slim[k]={expl:s.expl,memo1:s.memo1,memo2:s.memo2}; } // 이미지는 캐시 제외(용량)
    localStorage.setItem(LS_SHARED, JSON.stringify(slim));
  }catch(e){}
}
function setSyncPills(){
  document.querySelectorAll('.sync-pill').forEach(function(p){
    p.className='sync-pill '+(sbOnline?'on':'off');
    p.textContent=sbOnline?'🟢 공유 중':'🔴 오프라인';
  });
}

// ── 서버 진도/스크랩 (progress 테이블, 사용자별) ──
// 내 진도(answers)는 savedAnswers, 내 스크랩은 savedScraps, 전체 스크랩(공유)은 allScraps.
async function sbLoadProgress(){
  if(!SB) return;
  try{
    // ★페이지네이션: Supabase 기본 1000행 제한으로 진도 truncate 방지(1000행씩 끝까지 로드)
    let _rows=[], _from=0; const _PAGE=1000;
    while(true){
      const res=await SB.from('progress').select('uname,qid,sel,correct,scrap').range(_from,_from+_PAGE-1);
      if(res.error) throw res.error;
      const _b=res.data||[]; _rows=_rows.concat(_b);
      if(_b.length<_PAGE) break; _from+=_PAGE;
    }
    savedAnswers={}; allScraps={}; savedScraps={};
    _allenAnswers={}; _allenScrap={};   // ★알렌도 서버 기준(족보와 동일 progress 테이블, qid 'allen-' 접두로 구분)
    _rows.forEach(function(r){
      var isAllen=(typeof r.qid==='string' && r.qid.indexOf('allen-')===0);
      if(r.uname===CURRENT_USER){
        if(isAllen){
          if(r.sel&&r.sel.length) _allenAnswers[r.qid]={sel:r.sel,correct:!!r.correct};
          if(r.scrap) _allenScrap[r.qid]=true;
        }else{
          if(r.sel&&r.sel.length) savedAnswers[r.qid]={sel:r.sel,correct:!!r.correct};
          if(r.scrap) savedScraps[r.qid]=true;
        }
      }
      if(!isAllen && r.scrap){ (allScraps[r.qid]=allScraps[r.qid]||[]).push(r.uname); }  // 공유 스크랩 배지는 족보만
    });
    sbOnline=true;
    try{ localStorage.setItem(LS_ANSWERS,JSON.stringify(savedAnswers)); localStorage.setItem(LS_SCRAP,JSON.stringify(savedScraps)); }catch(e){}
    try{ localStorage.setItem(allenUserKey('allen_v3_answers'),JSON.stringify(_allenAnswers)); localStorage.setItem(allenUserKey('allen_v3_scrap'),JSON.stringify(_allenScrap)); }catch(e){}
  }catch(e){ sbOnline=false; }
}
async function sbSaveProgress(qid, patch){
  if(!CURRENT_USER) return false;
  try{ localStorage.setItem(LS_ANSWERS,JSON.stringify(savedAnswers)); localStorage.setItem(LS_SCRAP,JSON.stringify(savedScraps)); }catch(e){}
  if(!SB){ sbOnline=false; return false; }
  try{
    const row=Object.assign({uname:CURRENT_USER, qid:qid, updated_at:new Date().toISOString()}, patch);
    const res=await SB.from('progress').upsert(row,{onConflict:'uname,qid'});
    if(res.error) throw res.error;
    sbOnline=true; return true;
  }catch(e){ sbOnline=false; return false; }
}
// ★서버 도입 전 로컬에만 있던 알렌 진도를 현재 사용자 서버 행으로 1회 백필(서버 미존재분만). 안 하면 서버가 정본이 되며 기존 풀이 유실.
async function allenBackfillToServer(){
  if(!SB || !CURRENT_USER || !_allenPreServer) return;
  var la=_allenPreServer.answers||{}, ls=_allenPreServer.scrap||{};   // 서버 로드 전 스냅샷(캐시는 이미 덮였을 수 있음)
  var rows=[];
  Object.keys(la).forEach(function(qid){
    if(!_allenAnswers[qid] && la[qid] && la[qid].sel && la[qid].sel.length){   // 서버에 답이 없는 것만
      rows.push({uname:CURRENT_USER, qid:qid, sel:la[qid].sel, correct:!!la[qid].correct, scrap:!!ls[qid], updated_at:new Date().toISOString()});
    }
  });
  Object.keys(ls).forEach(function(qid){
    if(ls[qid] && !la[qid] && !_allenScrap[qid]){   // 답 없이 스크랩만 있던 것
      rows.push({uname:CURRENT_USER, qid:qid, scrap:true, updated_at:new Date().toISOString()});
    }
  });
  if(!rows.length) return;
  try{
    var res=await SB.from('progress').upsert(rows,{onConflict:'uname,qid'});
    if(res.error) throw res.error;
    rows.forEach(function(r){ if(r.sel&&r.sel.length) _allenAnswers[r.qid]={sel:r.sel,correct:!!r.correct}; if(r.scrap) _allenScrap[r.qid]=true; });
    saveAllenAnswers(); saveAllenScrap();   // 캐시도 갱신
    sbOnline=true;
  }catch(e){ sbOnline=false; }
}

// 붙여넣은 이미지를 최대 1100px로 축소 + JPEG 압축 → dataURL 콜백(공통)
function compressImageBlob(blob, cb){
  const reader=new FileReader();
  reader.onload=function(ev){
    const img=new Image();
    img.onload=function(){
      const MAX=1100; let w=img.width, h=img.height;
      if(w>MAX){ h=Math.round(h*MAX/w); w=MAX; }
      if(h>MAX){ w=Math.round(w*MAX/h); h=MAX; }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      const ctx=cv.getContext('2d');
      ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0,w,h);
      let dataURL;
      try{ dataURL=cv.toDataURL('image/jpeg',0.82); }catch(e){ dataURL=ev.target.result; }
      cb(dataURL);
    };
    img.onerror=function(){ alert('이미지를 불러오지 못했습니다.'); };
    img.src=ev.target.result;
  };
  reader.readAsDataURL(blob);
}
// 해설/메모 첨부사진: 축소 → Supabase 공유 저장(탭별로 태깅)
function addImageFromBlob(qid, field, blob){
  compressImageBlob(blob, function(dataURL){
    const imgs=rawImgs(qid).slice(); imgs.push({f:field, s:dataURL});
    sbUpsert(qid,{expl_imgs:imgs}).then(function(ok){
      refreshExplImgs(qid); setSyncPills();
      if(!ok) alert('인터넷 연결이 없어 사진 공유 저장에 실패했습니다. 연결 후 다시 시도해 주세요.');
    });
  });
}
function delExplImg(qid,i){
  const cur=rawImgs(qid);
  if(!cur[i]) return;
  if(!confirm('이 사진을 삭제할까요? (공유됨)')) return;
  const imgs=cur.slice(); imgs.splice(i,1);
  sbUpsert(qid,{expl_imgs:imgs}).then(function(){ refreshExplImgs(qid); setSyncPills(); });
}

// 문항 이미지 로드 실패 시 자리표시(따옴표 중첩 버그 방지 위해 함수로 분리)
function imgFail(el){
  const rel=el.getAttribute('data-src')||'';
  // 1차: 상대경로(로컬 파일) 실패 시 Supabase 절대 URL로 폴백 → GitHub Pages 등에서도 이미지 표시
  if(rel && !el.dataset.sbTried && rel.indexOf('http')!==0){
    el.dataset.sbTried='1';
    el.src=SB_URL+'/storage/v1/object/public/site/'+rel;
    return;
  }
  // 폴백도 실패 → placeholder
  const parent=el.parentNode; if(!parent) return;
  parent.innerHTML='';
  const span=document.createElement('span');
  span.className='img-placeholder';
  span.textContent='[이미지 없음'+(rel?': '+rel:'')+']';
  parent.appendChild(span);
}
// paste 핸들러 — 해설/구민준/이현우 textarea 가 포커스됐을 때 동작(탭별 태깅)
document.addEventListener('paste',function(e){
  const ae=document.activeElement;
  if(!ae||!ae.id) return;
  // 문항수정 사진 영역에 붙여넣기 → 대기 변경(QFIX_IMG)에 새 사진 적용(저장 시 영속)
  const mq=ae.id.match(/^qfix-img-zone-(.+)$/);
  if(mq){
    const qid=mq[1];
    const items=(e.clipboardData&&e.clipboardData.items)||[];
    for(let i=0;i<items.length;i++){
      if(items[i].type&&items[i].type.indexOf('image')===0){
        const blob=items[i].getAsFile();
        if(blob){ compressImageBlob(blob,function(d){ QFIX_IMG[qid]=d; refreshQFixImg(qid); }); e.preventDefault(); return; }
      }
    }
    return;
  }
  const m=ae.id.match(/^ta-(expl|memo1|memo2)-(.+)$/);
  if(!m) return;
  const field=m[1], qid=m[2];
  const items=(e.clipboardData&&e.clipboardData.items)||[];
  let found=false;
  for(let i=0;i<items.length;i++){
    if(items[i].type&&items[i].type.indexOf('image')===0){
      const blob=items[i].getAsFile();
      if(blob){ addImageFromBlob(qid,field,blob); found=true; }
    }
  }
  if(found) e.preventDefault();
});

// marked.js lazy init
function markedParse(md){
  md = (md||'');
  // (3) 줄끝 <br> 가 breaks:true 의 개행<br> 와 중복돼 수치가 과도하게 벌어지는 것 방지 → 줄끝 <br>+개행은 단일 개행으로
  md = md.replace(/<br\s*\/?>[ \t]*\n/gi, '\n');
  // (2) ~ 는 의학 범위표기(참고치 0.5 ~ 4.5)인데 GFM 취소선(~~)으로 오인돼 ---- 로 표시되는 것 방지 → 리터럴 ~ 로 이스케이프
  md = md.replace(/~/g, '\\~');
  var html = window.marked ? window.marked.parse(md) : '<pre>'+md+'</pre>';
  // allenslibrary 링크 내부화: 우리 개념(ALLEN_LINKMAP)에 있으면 내부 이동, 없으면 외부(새 탭)
  html = html.replace(/<a href="https?:\/\/(?:www\.)?allenslibrary\.com\/study\/theory\/(\d+)"[^>]*>/gi, function(m, id){
    if(typeof ALLEN_LINKMAP!=='undefined' && ALLEN_LINKMAP[id]){
      return '<a href="#" class="allen-ilink" onclick="openAllenConceptById(\''+id+'\');return false;">';
    }
    return '<a class="allen-xlink" target="_blank" rel="noopener" href="https://www.allenslibrary.com/study/theory/'+id+'">';
  });
  // 이미지는 족보처럼 eager 로드(초기 1회) — lazy 는 스크롤 중 로드·리플로우로 오히려 스크롤 렉 유발. decoding 만 async.
  html = html.replace(/<img (?![^>]*decoding=)/gi, '<img decoding="async" ');
  return html;
}
// allenslibrary 링크 클릭 → 우리 알렌 개념 탭의 해당 섹션으로 내부 이동
function openAllenConceptById(id){
  var loc = (typeof ALLEN_LINKMAP!=='undefined') ? ALLEN_LINKMAP[id] : null;
  if(!loc) return;
  switchView('allen-concept');
  setTimeout(function(){
    if(typeof selectAllenSub==='function') selectAllenSub(loc[0], loc[1]);
    var p=document.getElementById('allen-concept-panel'); if(p) p.scrollTop=0;
  }, 40);
}
// 출처(MD2601/임종평25-2 등) → 출제 연도 추출
function allenYear(src){
  src=(src||'');
  var m=src.match(/^MD(\d{2})(\d{2})?$/);          // MD25→2025, MD2601→2026
  if(m) return 2000+parseInt(m[1],10);
  m=src.match(/(\d{2})-\d/);                          // 임종평25-2, 임상적중26-1
  if(m) return 2000+parseInt(m[1],10);
  m=src.match(/(\d{2})/); if(m) return 2000+parseInt(m[1],10);
  return 0;
}

// ── switchView (v3 override) ──────────────────────────────────────────────
function switchView(view){
  var jokboView = document.getElementById('jokbo-view');
  var acView    = document.getElementById('allen-concept-view');
  var aqView    = document.getElementById('allen-quiz-view');
  var progView  = document.getElementById('progress-view');

  // hide all
  if(jokboView) jokboView.hidden = true;
  if(acView)    acView.hidden    = true;
  if(aqView)    aqView.hidden    = true;
  if(progView)  progView.hidden  = true;

  // deactivate all tabs
  ['toptab-aconcept','toptab-aquiz','toptab-jokbo','toptab-progress'].forEach(function(tid){
    var el=document.getElementById(tid); if(el) el.classList.remove('active');
  });

  if(view==='jokbo'){
    if(jokboView) jokboView.hidden=false;
    var t=document.getElementById('toptab-jokbo'); if(t) t.classList.add('active');
  } else if(view==='allen-concept'){
    if(acView) acView.hidden=false;
    var t2=document.getElementById('toptab-aconcept'); if(t2) t2.classList.add('active');
    renderAllenConcepts();
  } else if(view==='allen-quiz'){
    if(aqView) aqView.hidden=false;
    var t3=document.getElementById('toptab-aquiz'); if(t3) t3.classList.add('active');
    if(!(aqView._rendered && aqView._term===filterTerm)) renderAllenQuiz();
  } else if(view==='progress'){
    if(progView) progView.hidden=false;
    var t4=document.getElementById('toptab-progress'); if(t4) t4.classList.add('active');
    renderProgress();
  }
  window.scrollTo(0,0);
}

var _acRendered = false;

function allenTermLabel(){ return filterTerm==='1'?' · 1차':filterTerm==='2'?' · 2차':''; }
function renderAllenConcepts(){
  var container = document.getElementById('allen-concept-view');

  if(container._term===filterTerm && container.querySelector('#allen-toc')) return;

  function buildGroup(termVal, label){
    var items=[];
    ALLEN_CONCEPTS.forEach(function(ch, ci){
      var subs=[];

    });

    return '<div class="allen-toc-group"><div class="allen-toc-group-hdr">'+label+'</div>'+items.join('')+'</div>';
  }
  var tocHtml;
  if(filterTerm==='1') tocHtml=buildGroup(1,'🟦 1차 범위');
  else if(filterTerm==='2') tocHtml=buildGroup(2,'🟥 2차 범위');

function escHtml(s){

var CIRCLE_NUMS = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩'];

function renderAllenQuiz(){
  var container = document.getElementById('allen-quiz-view');
  if(!container) return;
  // 진도·스크랩은 서버(sbLoadProgress)가 정본 → 여기서 로컬 재로드 안 함(서버 데이터 덮어쓰기 방지).
  // _allenAnswers/_allenScrap 가 아직 비어있고(서버 응답 전) 캐시가 있으면 1회만 채움(첫 페인트 오프라인 대비).
  if(!Object.keys(_allenAnswers).length){ loadAllenAnswers(); }
  if(!Object.keys(_allenScrap).length){ loadAllenScrap(); }

  // 챕터 옵션 — 현재 과목(filterTerm) 에 해당하는 챕터만
  var chMap = {};

  var yset={}; ALLEN_QUESTIONS.forEach(function(q){ if(filterTerm==='all'||String(q.term)===filterTerm){ var y=allenYear(q.source); if(y) yset[y]=1; } });

  years.forEach(function(y){ yearBtns+='<button class="yr-btn'+(_allenFilterYear===String(y)?' active':'')+'" data-y="'+y+'" onclick="setAllenYear(\''+y+'\')">'+y+'</button>'; });

  container.innerHTML =
    '<div class="layout">'+
