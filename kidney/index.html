<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>신장요로 족보 퀴즈 2026</title>
<style>
:root {
  --header-bg:#2c3e5d;--header-text:#fff;--body-bg:#FAFAF8;
  --sidebar-bg:#f0ede8;--sidebar-border:#ddd8d0;
  --accent:#4080b0;--accent-hover:#306090;--accent-light:#eaf1f7;
  --correct:#3a7a4a;--correct-light:#d4edda;--correct-border:#b5d8bd;
  --incorrect:#b85450;--incorrect-light:#f8d7da;--incorrect-border:#e8b4b2;
  --card-bg:#ffffff;--card-border:#e0dbd4;--card-shadow:0 1px 4px rgba(60,50,40,0.07);
  --text-primary:#2c3e5d;--text-secondary:#555555;--text-muted:#9a958c;
  --chip-bg:#e8f0f8;--chip-text:#2c5080;
  --font-stack:'Apple SD Gothic Neo','Nanum Gothic','Malgun Gothic','Noto Sans KR',sans-serif;
  --sidebar-width:296px;
  --star-color:#e8a020;
  --radius-sm:6px;--radius-md:10px;--radius-lg:14px;
  --header-h:52px;
  --tabs-h:47px;            /* #top-tabs(sticky) 높이 — 사이드바 sticky top 이 헤더+탭바 아래에 붙도록 */
  --sticky-top:99px;        /* = header-h + tabs-h (calc 비의존 폴백) */
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font-stack);background:var(--body-bg);color:var(--text-primary);min-height:100vh;-webkit-font-smoothing:antialiased;}

/* HEADER */
header{
  background:var(--header-bg);color:var(--header-text);
  padding:0 20px;display:flex;align-items:center;justify-content:space-between;
  height:var(--header-h);position:sticky;top:0;z-index:100;
  box-shadow:0 2px 12px rgba(0,0,0,0.2);
}
.header-left{display:flex;flex-direction:column;gap:2px;}
header h1{font-size:1rem;font-weight:700;letter-spacing:-0.02em;line-height:1.2;}
.header-sub{font-size:0.7rem;opacity:0.7;letter-spacing:0.01em;}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
#mobile-sidebar-btn{
  display:none;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.25);
  color:#fff;padding:6px 13px;border-radius:var(--radius-sm);cursor:pointer;font-size:0.79rem;
  font-family:var(--font-stack);transition:background 0.15s;
}
#mobile-sidebar-btn:hover{background:rgba(255,255,255,0.2);}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - var(--header-h));}

/* SIDEBAR */
#sidebar{
  width:var(--sidebar-width);min-width:var(--sidebar-width);
  background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);
  position:sticky;top:calc(var(--header-h) + var(--tabs-h));height:calc(100vh - var(--header-h) - var(--tabs-h));
  overflow-y:auto;flex-shrink:0;display:flex;flex-direction:column;
  scrollbar-width:thin;scrollbar-color:#d0d8e4 transparent;
}
#sidebar::-webkit-scrollbar{width:5px;}
#sidebar::-webkit-scrollbar-track{background:transparent;}
#sidebar::-webkit-scrollbar-thumb{background:#d0d8e4;border-radius:10px;}

/* Single panel (no tabs) */
.sidebar-panel{flex:1;overflow-y:auto;padding:16px 14px 20px;}

/* Filter section */
.filter-section{margin-bottom:18px;}
.filter-label{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.year-btns{display:flex;flex-wrap:wrap;gap:5px;}
.yr-btn{
  background:transparent;border:1.5px solid var(--card-border);border-radius:20px;
  padding:4px 12px;font-size:0.76rem;cursor:pointer;color:var(--text-secondary);
  transition:all 0.15s;font-family:var(--font-stack);font-weight:500;
}
.yr-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.yr-btn:hover:not(.active){border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
#lec-select{
  width:100%;padding:7px 10px;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  font-size:0.79rem;font-family:var(--font-stack);color:var(--text-primary);
  background:var(--card-bg);cursor:pointer;outline:none;transition:border-color 0.15s;
}
#lec-select:focus{border-color:var(--accent);}
/* scrap filter */
.scrap-filter-row{display:flex;align-items:center;gap:7px;margin-top:5px;}
.scrap-toggle-label{font-size:0.8rem;cursor:pointer;color:var(--text-secondary);user-select:none;display:flex;align-items:center;gap:5px;}
.scrap-toggle-label input{cursor:pointer;accent-color:var(--accent);}

.scope-bar{
  background:var(--accent-light);border:1px solid #c8dff4;border-radius:var(--radius-sm);
  padding:9px 11px;font-size:0.77rem;color:var(--text-secondary);margin-bottom:12px;
  line-height:1.8;
}
.scope-bar b{color:var(--text-primary);}

.sidebar-actions{display:flex;flex-direction:column;gap:7px;margin-bottom:14px;}
.action-btn{
  width:100%;padding:8px 12px;background:var(--header-bg);color:#fff;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;font-family:var(--font-stack);
  font-weight:600;transition:all 0.15s;letter-spacing:0.01em;
}
.action-btn:hover{background:var(--accent-hover);}
.action-btn.secondary{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.secondary:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.action-btn.secondary.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;}
.action-btn.shuffle-btn{
  background:transparent;color:var(--text-secondary);border:1.5px solid var(--card-border);font-weight:500;
}
.action-btn.shuffle-btn.active{
  background:var(--accent-light);border-color:var(--accent);color:var(--accent);font-weight:600;
}
.action-btn.shuffle-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.action-btn.clear-btn{background:transparent;color:#9a5b3b;border:1.5px solid #e0c4b0;font-weight:500;}
.action-btn.clear-btn:hover{border-color:#c2603a;color:#fff;background:#c2603a;}

/* Backup / Restore */
/* Current user panel */
.user-box{margin-bottom:14px;padding:11px;border:1px solid var(--sidebar-border);border-radius:var(--radius-sm);background:rgba(0,0,0,0.015);}
.user-line{font-size:0.8rem;color:var(--text-secondary);margin-bottom:8px;}
.user-line b{color:var(--accent);font-weight:700;}
.user-switch{width:100%;padding:7px 10px;background:#fff;color:var(--text-secondary);border:1.5px solid var(--card-border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.76rem;font-family:var(--font-stack);font-weight:600;}
.user-switch:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}
.user-hint{font-size:0.66rem;color:var(--text-muted);line-height:1.5;margin-top:7px;}
/* Identity prompt modal */
.id-modal{position:fixed;inset:0;background:rgba(0,0,0,0.55);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px;}
.id-modal.show{display:flex;}
.id-card{background:#fff;border-radius:14px;padding:28px 26px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.3);}
.id-title{font-size:1.1rem;font-weight:700;color:var(--text-primary);margin-bottom:6px;}
.id-sub{font-size:0.78rem;color:var(--text-muted);margin-bottom:18px;line-height:1.5;}
.id-btns{display:flex;flex-direction:column;gap:10px;}
.id-btn{padding:13px;border:1.5px solid var(--card-border);border-radius:10px;background:#fff;color:var(--text-primary);font-family:var(--font-stack);font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.12s;}
.id-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);}

/* Divider */
.sidebar-divider{height:1px;background:var(--sidebar-border);margin:14px 0;}

/* Inline index list (inside filter panel) */
.idx-header{
  font-size:0.65rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
  color:var(--text-muted);margin-bottom:8px;display:block;
}
.idx-scope-inline{
  font-size:0.75rem;color:var(--text-secondary);margin-bottom:8px;padding:7px 9px;
  background:var(--card-bg);border-radius:var(--radius-sm);border:1px solid var(--card-border);
  line-height:1.6;
}
.idx-scope-inline b{color:var(--text-primary);}
.idx-list{display:flex;flex-direction:column;gap:2px;}
.idx-item{
  display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:var(--radius-sm);
  cursor:pointer;font-size:0.76rem;color:var(--text-primary);transition:background 0.12s;
  text-decoration:none;border:none;background:transparent;font-family:var(--font-stack);
  text-align:left;width:100%;
}
.idx-item:hover{background:var(--accent-light);}
.idx-item.idx-current{background:rgba(42,114,181,0.15);font-weight:600;}
.idx-dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#d0d8e4;
}
.idx-dot.dot-correct{background:var(--correct);}
.idx-dot.dot-wrong{background:var(--incorrect);}
.idx-dot.dot-scrap{background:var(--star-color);}
.idx-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* MAIN */
#main{flex:1;padding:20px 22px;max-width:880px;overflow-x:hidden;}
/* 알렌 문제 풀이 사이드바(족보와 동일 톤) */
#allen-sidebar{width:var(--sidebar-width);min-width:var(--sidebar-width);background:var(--sidebar-bg);border-right:1px solid var(--sidebar-border);position:sticky;top:calc(var(--header-h) + var(--tabs-h));height:calc(100vh - var(--header-h) - var(--tabs-h));overflow-y:auto;flex-shrink:0;}
#allen-main{flex:1;padding:20px 22px;max-width:880px;overflow-x:hidden;}
#aq-ch-sel{width:100%;padding:7px 9px;border:1px solid var(--card-border);border-radius:6px;background:#fff;font-family:var(--font-stack);font-size:0.82rem;color:var(--text-primary);cursor:pointer;}
.allen-ilink{color:var(--accent);text-decoration:underline;cursor:pointer;}
.allen-xlink{color:var(--accent);text-decoration:underline;}
.allen-xlink::after{content:" ↗";font-size:0.78em;opacity:0.7;}
@media(max-width:767px){#allen-sidebar{width:100%;min-width:0;height:auto;position:static;border-right:none;border-bottom:1px solid var(--sidebar-border);}#allen-main{padding:12px 13px;max-width:100%;}}
.stats-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.stat-chip{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:20px;
  padding:4px 14px;font-size:0.76rem;color:var(--text-secondary);
  box-shadow:var(--card-shadow);
}
.stat-chip b{color:var(--text-primary);}

/* QUESTION CARDS FEED */
#feed{display:flex;flex-direction:column;gap:18px;}
#no-results{text-align:center;color:var(--text-muted);margin-top:80px;font-size:0.95rem;display:none;line-height:2;}

/* SINGLE CARD */
.q-card{
  background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-lg);
  overflow:hidden;box-shadow:var(--card-shadow);
  scroll-margin-top:64px;transition:box-shadow 0.15s;
}
.q-card:hover{box-shadow:0 3px 12px rgba(20,50,90,0.11);}
.q-card-header{
  background:linear-gradient(135deg,#f5f3ef 0%,#ede9e4 100%);
  padding:10px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:7px;
  border-bottom:1px solid var(--card-border);
}
.q-card-header-inner{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:1;}
.meta-tag{
  font-size:0.67rem;font-weight:700;padding:2px 9px;border-radius:12px;
  letter-spacing:0.02em;line-height:1.5;
}
.tag-year{background:var(--header-bg);color:#fff;}
.tag-lec{background:var(--chip-bg);color:var(--chip-text);}
.tag-prof{background:#f0e8f5;color:#5a3270;}
.tag-qnum{background:#f5f0e6;color:#6a4c20;}
.tag-recovered{background:#fff8cc;color:#7a5a00;}

/* Star button: ☆/★ */
.scrap-btn{
  margin-left:auto;background:transparent;border:none;cursor:pointer;
  font-size:1.2rem;line-height:1;padding:2px 5px;border-radius:4px;
  transition:transform 0.15s,color 0.15s;flex-shrink:0;color:#c8d0da;
}
.scrap-btn:hover{transform:scale(1.25);}
.scrap-btn.starred{color:var(--star-color);}

.q-card-body{padding:18px 18px 14px;}
.q-stem{
  font-size:0.91rem;line-height:1.75;color:var(--text-primary);
  margin-bottom:14px;font-weight:500;white-space:pre-wrap;word-break:break-word;
}
/* stem table */
.stem-table-wrap{margin-bottom:14px;overflow-x:auto;}
.stem-table{width:100%;border-collapse:collapse;font-size:0.81rem;}
.stem-table th{
  background:var(--header-bg);color:#fff;padding:6px 10px;
  text-align:center;font-weight:600;border:1px solid #2a5070;
}
.stem-table td{
  border:1px solid #d0dce8;padding:5px 10px;text-align:center;background:#f7fafd;
}
.stem-table tr:nth-child(even) td{background:#eef4fa;}
/* image */
.q-image{margin-bottom:14px;text-align:center;}
.q-image img{max-width:100%;max-height:320px;border-radius:var(--radius-sm);border:1px solid var(--card-border);object-fit:contain;background:#f4f6f8;cursor:zoom-in;transition:filter 0.12s;}
.q-image img:hover{filter:brightness(0.94);}
.img-placeholder{display:inline-block;padding:8px 16px;background:#f4f6f8;border:1px dashed #c8d0da;border-radius:var(--radius-sm);color:var(--text-muted);font-size:0.8rem;}

/* choices */
.choices{display:flex;flex-direction:column;gap:7px;}
.choice-btn{
  background:#fafbfc;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  padding:10px 13px;text-align:left;cursor:pointer;font-size:0.86rem;line-height:1.55;
  color:var(--text-primary);transition:all 0.15s;font-family:var(--font-stack);
  display:flex;align-items:flex-start;gap:9px;width:100%;
}
.choice-btn:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);}
.choice-num{font-weight:700;font-size:0.77rem;color:var(--accent);flex-shrink:0;min-width:18px;margin-top:1px;}
/* CORRECT = green */
.choice-btn.correct-ans{background:var(--correct-light);border-color:var(--correct-border);color:#154530;font-weight:600;}
.choice-btn.correct-ans .choice-num{color:var(--correct);}
/* MY WRONG = light red */
.choice-btn.my-wrong-ans{background:var(--incorrect-light);border-color:var(--incorrect-border);color:#7a1820;}
.choice-btn.my-wrong-ans .choice-num{color:var(--incorrect);}
.choice-btn:disabled{cursor:default;}

/* answer reveal */
.answer-reveal{
  margin-top:14px;padding:11px 15px;
  background:linear-gradient(135deg,#f0faee 0%,#e5f5e0 100%);
  border:1px solid var(--correct-border);border-radius:var(--radius-sm);display:none;
  font-size:0.83rem;color:#154530;line-height:1.65;
}
.answer-reveal.show{display:block;}
.answer-reveal.wrong{background:linear-gradient(135deg,#fdf1f0 0%,#fce8e7 100%);border-color:var(--incorrect-border);color:#7a1820;}
.ans-label{font-weight:700;font-size:0.73rem;letter-spacing:0.06em;text-transform:uppercase;color:var(--correct);margin-bottom:3px;}
.answer-reveal.wrong .ans-label{color:var(--incorrect);}

/* EXPLANATION — hidden until answered */
.expl-section{
  margin-top:12px;border-top:1px solid var(--card-border);padding-top:12px;
  display:none;
}
.expl-section.expl-visible{display:block;}
.expl-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px;}
.expl-title{font-size:0.72rem;font-weight:700;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;}
.expl-actions{display:flex;gap:5px;}
.expl-edit-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid var(--card-border);background:transparent;color:var(--text-secondary);
  font-family:var(--font-stack);transition:all 0.12s;
}
.expl-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.expl-revert-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid #e0b870;background:transparent;color:#8a5c18;
  font-family:var(--font-stack);transition:all 0.12s;display:none;
}
.expl-revert-btn.show{display:inline-block;}
.expl-revert-btn:hover{background:#fff5e0;}
.expl-text{font-size:0.84rem;line-height:1.75;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;}
.expl-text.placeholder{color:var(--text-muted);font-style:italic;}
.expl-textarea{
  width:100%;min-height:80px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);
  padding:8px 10px;font-size:0.84rem;line-height:1.6;font-family:var(--font-stack);
  color:var(--text-primary);resize:vertical;outline:none;
  display:none;background:#fafcff;
}
.expl-save-btn{
  display:none;margin-top:6px;padding:6px 16px;background:var(--accent);
  color:#fff;border:none;border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;
  font-family:var(--font-stack);font-weight:600;transition:background 0.15s;
}
.expl-save-btn:hover{background:var(--accent-hover);}
.expl-paste-hint{font-size:0.72rem;color:var(--text-muted);margin-top:6px;display:none;line-height:1.5;}
.expl-paste-hint.show{display:block;}
.expl-imgs{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
.expl-img-wrap{position:relative;display:inline-block;}
.expl-img{max-width:100%;max-height:340px;border:1px solid var(--card-border);border-radius:6px;cursor:zoom-in;display:block;}
.expl-img-del{position:absolute;top:5px;right:5px;width:22px;height:22px;border:none;border-radius:50%;background:rgba(0,0,0,0.55);color:#fff;font-size:0.78rem;line-height:1;cursor:pointer;padding:0;}
.expl-img-del:hover{background:rgba(184,84,80,0.95);}
/* Tabs (해설 / 메모1 / 메모2) */
.tab-bar{display:flex;align-items:center;gap:4px;border-bottom:1.5px solid var(--card-border);margin-bottom:10px;flex-wrap:wrap;}
.tab-btn{font-size:0.78rem;padding:6px 13px;border:none;background:transparent;color:var(--text-secondary);font-family:var(--font-stack);font-weight:600;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1.5px;transition:all 0.12s;}
.tab-btn:hover{color:var(--accent);}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);}
.tab-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-left:5px;vertical-align:middle;}
.tab-dot.memo1{background:#d98a3d;} .tab-dot.memo2{background:#3d7fd9;}
.sync-pill{margin-left:auto;font-size:0.64rem;font-weight:600;padding:2px 7px;border-radius:9px;white-space:nowrap;}
.sync-pill.on{color:#2f7a44;background:#e7f4ec;} .sync-pill.off{color:#9a3b38;background:#f7e9e8;}
.tab-pane{}
.tab-pane[hidden]{display:none!important;}
/* GNB 뷰 전환: jokbo-view 는 .layout{display:flex} 라 UA 의 [hidden] 을 덮어써 안 숨겨지는 문제 → 명시적 숨김 */
#jokbo-view[hidden]{display:none!important;}
.memo-empty{font-size:0.82rem;color:var(--text-muted);font-style:italic;line-height:1.7;}
.memo-hint{font-size:0.68rem;color:var(--text-muted);margin-bottom:7px;line-height:1.5;}
.expl-textarea.memo-live{display:block;min-height:90px;background:#fff;}
.expl-textarea.memo-live:focus{border-color:var(--accent);background:#fafcff;}
.memo-status{font-size:0.68rem;margin-top:5px;min-height:1em;line-height:1.4;}
.memo-status.saving{color:var(--text-muted);}
.memo-status.ok{color:#2f7a44;}
.memo-status.err{color:#9a3b38;}
.offline-note{font-size:0.7rem;color:#9a3b38;background:#f7e9e8;border-radius:5px;padding:6px 9px;margin-top:7px;line-height:1.5;}
.scrap-area{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.scrap-who{font-size:0.66rem;font-weight:700;color:#b8860b;background:#fdf6e3;border:1px solid #ecdca0;border-radius:9px;padding:2px 7px;white-space:nowrap;}
.img-lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;cursor:zoom-out;}
.img-lightbox.show{display:flex;}
.img-lightbox img{width:96vw;height:92vh;object-fit:contain;border-radius:6px;}

/* MOBILE */
@media(max-width:767px){
  #mobile-sidebar-btn{display:block;}
  .layout{flex-direction:column;}
  #sidebar{
    position:fixed;top:0;left:-310px;width:300px;height:100vh;
    z-index:200;transition:left 0.25s ease;box-shadow:4px 0 20px rgba(0,0,0,0.2);
  }
  #sidebar.open{left:0;}
  .sidebar-overlay{
    display:none;position:fixed;inset:0;background:rgba(0,0,0,0.45);z-index:199;
  }
  .sidebar-overlay.visible{display:block;}
  #main{padding:12px 13px;max-width:100%;}
}
/* HEADER CONTROLS (과목·사용자 변경) */
.hdr-select{font-family:var(--font-stack);font-size:0.74rem;font-weight:600;padding:5px 7px;border-radius:6px;border:1px solid rgba(255,255,255,0.32);background:rgba(255,255,255,0.13);color:#fff;cursor:pointer;max-width:160px;}
.hdr-select option{color:#222;}
.hdr-user-btn{font-family:var(--font-stack);font-size:0.74rem;font-weight:700;padding:5px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.32);background:rgba(255,255,255,0.13);color:#fff;cursor:pointer;white-space:nowrap;}
.hdr-user-btn:hover,.hdr-select:hover{background:rgba(255,255,255,0.24);}
/* TOP VIEW TABS */
#top-tabs{display:flex;gap:0;background:var(--sidebar-bg);border-bottom:1px solid var(--sidebar-border);padding:0 14px;position:sticky;top:var(--header-h);z-index:90;}
.top-tab{font-size:0.86rem;font-weight:700;font-family:var(--font-stack);padding:11px 18px;border:none;background:transparent;color:var(--text-secondary);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;transition:all 0.12s;}
.top-tab:hover{color:var(--accent);}
.top-tab.active{color:var(--accent);border-bottom-color:var(--accent);}
/* PROGRESS DASHBOARD */
#progress-view{max-width:1000px;margin:0 auto;padding:22px 18px 60px;}
.prog-title{font-size:1.05rem;font-weight:700;color:var(--text-primary);margin-bottom:4px;}
.prog-sub{font-size:0.8rem;color:var(--text-muted);margin-bottom:18px;line-height:1.6;}
.new-prof{font-weight:800;color:var(--accent);}
.prog-summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.prog-sum-chip{background:var(--chip-bg);color:var(--chip-text);border-radius:var(--radius-sm);padding:8px 14px;font-size:0.84rem;font-weight:600;}
.prog-table{width:100%;border-collapse:collapse;font-size:0.84rem;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-md);overflow:hidden;}
.prog-table th{background:var(--sidebar-bg);color:var(--text-primary);font-weight:700;text-align:left;padding:10px 12px;border-bottom:1.5px solid var(--sidebar-border);font-size:0.78rem;}
.prog-table td{padding:9px 12px;border-bottom:1px solid #efece6;vertical-align:middle;}
.prog-table tr:last-child td{border-bottom:none;}
.prog-table tbody tr:hover td{background:#faf8f4;}
.prog-lec{font-weight:600;color:var(--text-primary);}
.prog-num{text-align:center;white-space:nowrap;}
.prog-done-full{color:var(--correct);font-weight:700;}
.prog-bar{position:relative;height:8px;background:#eceae4;border-radius:5px;overflow:hidden;min-width:70px;}
.prog-bar>span{position:absolute;left:0;top:0;height:100%;background:var(--accent);border-radius:5px;transition:width 0.2s;}
.prog-bar.full>span{background:var(--correct);}
.prog-prof{color:var(--text-secondary);white-space:nowrap;font-size:0.8rem;}
.prog-cell-prog{display:flex;align-items:center;gap:8px;}
.prog-pct{font-size:0.78rem;color:var(--text-secondary);min-width:32px;}
.prog-sim{font-weight:700;}
.prog-sim.hi{color:#1f9d57;}
.prog-sim.mid{color:#c2a200;}
.prog-sim.lo{color:#c0392b;}
.prog-sim.na{color:#cfccc6;font-weight:600;}
.meta-input{padding:4px 6px;border:1px solid var(--card-border);border-radius:5px;font-family:var(--font-stack);font-size:0.8rem;text-align:center;background:#fff;}
.date-input{width:80px;}
.sim-input{width:56px;}
.meta-input:focus{border-color:var(--accent);outline:none;background:#fafcff;}
.meta-saved{font-size:0.7rem;margin-left:4px;}
.prog-table-wrap{overflow-x:auto;}
/* 유사문항 묶음(캐러셀) */
.qbundle{border:1.5px solid var(--accent);border-radius:var(--radius-lg);background:var(--card-bg);margin-bottom:18px;overflow:hidden;box-shadow:0 2px 10px rgba(64,128,176,0.12);}
.qbundle-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 15px;background:var(--accent-light);border-bottom:1px solid var(--card-border);font-size:0.82rem;font-weight:700;color:var(--accent);}
.qbundle-counter{font-weight:600;color:var(--text-secondary);font-size:0.76rem;white-space:nowrap;}
.qbundle-track{position:relative;}
.qbundle-track>.q-card{margin:0;border:none;box-shadow:none;border-radius:0;animation:bundleFade 0.22s ease;}
@keyframes bundleFade{from{opacity:0.35;transform:translateX(8px);}to{opacity:1;transform:none;}}
.qbundle-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--card-border);background:#fbfaf7;}
.qbundle-arrow{font-family:var(--font-stack);font-size:0.82rem;font-weight:700;padding:6px 14px;border:1px solid var(--accent);border-radius:var(--radius-sm);background:#fff;color:var(--accent);cursor:pointer;transition:all 0.12s;}
.qbundle-arrow:hover{background:var(--accent);color:#fff;}
.qbundle-dots{display:flex;gap:7px;align-items:center;}
.qbundle-dot{width:9px;height:9px;border-radius:50%;background:#d3d0ca;cursor:pointer;transition:background 0.12s;}
.qbundle-dot.on{background:var(--accent);}
/* 오분류 의심 배지 */
.tag-misclass{background:#fff3e0;color:#b35900;border:1px solid #e0a060;font-weight:700;cursor:help;}
.tag-misimg{background:#fde7e7;color:#b03030;border:1px solid #e09090;font-weight:700;cursor:help;}
.misclass-note{margin:8px 0 0;padding:8px 11px;background:#fff7ec;border:1px solid #e8c79a;border-radius:var(--radius-sm);font-size:0.78rem;color:#8a5a1a;line-height:1.55;}
/* 오분류 교정(강의 재분류) 버튼·모달 */
.lecfix-btn{border-color:#b06a8f;color:#8a3a63;}
.lecfix-btn:hover{border-color:#8a3a63;color:#8a3a63;background:#fdf0f6;}
.lecfix-modal-overlay{position:fixed;inset:0;background:rgba(20,24,40,0.45);display:flex;align-items:center;justify-content:center;z-index:1000;padding:18px;}
.lecfix-modal{background:var(--card-bg,#fff);border-radius:12px;max-width:440px;width:100%;padding:20px 22px;box-shadow:0 16px 48px rgba(0,0,0,0.3);font-family:var(--font-stack);}
.lecfix-modal-title{font-size:1rem;font-weight:800;color:var(--text-primary,#222);margin-bottom:8px;}
.lecfix-modal-q{font-size:0.82rem;color:var(--text-secondary,#666);background:var(--accent-light,#f3f5fb);padding:8px 10px;border-radius:7px;margin-bottom:14px;line-height:1.4;}
.lecfix-modal-label{display:block;font-size:0.76rem;font-weight:700;color:var(--text-secondary,#555);margin-bottom:5px;}
.lecfix-modal-select{width:100%;padding:8px 10px;border:1.5px solid var(--card-border,#ddd);border-radius:7px;font-size:0.85rem;font-family:var(--font-stack);color:var(--text-primary,#222);background:#fff;cursor:pointer;}
.lecfix-modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.lecfix-save,.lecfix-cancel{padding:8px 18px;border-radius:7px;font-size:0.84rem;font-weight:700;cursor:pointer;font-family:var(--font-stack);border:1.5px solid transparent;}
.lecfix-save{background:var(--accent,#4060c0);color:#fff;}
.lecfix-save:hover{filter:brightness(1.08);}
.lecfix-cancel{background:transparent;border-color:var(--card-border,#ccc);color:var(--text-secondary,#666);}
.lecfix-cancel:hover{background:var(--accent-light,#eef);}
.lecfix-badge{display:inline-block;font-size:0.7rem;font-weight:700;color:#8a3a63;background:#fdf0f6;border:1px solid #e0b8cf;border-radius:6px;padding:1px 6px;margin-left:5px;}
@media(max-width:767px){
  #top-tabs{top:var(--header-h);overflow-x:auto;}
  .top-tab{padding:11px 13px;font-size:0.8rem;white-space:nowrap;}
  #progress-view{padding:16px 10px 50px;}
  .prog-table{font-size:0.78rem;min-width:660px;}
  .prog-table th,.prog-table td{padding:7px 6px;}
  .date-input{width:72px;}
  .sim-input{width:50px;}
  header h1{font-size:0.86rem;}
  .hdr-select{max-width:118px;font-size:0.7rem;}
  .hdr-user-btn{font-size:0.7rem;padding:5px 7px;}
}
/* ── 문항 수정(qfix) ── */
.qfix-badge{
  display:inline-block;font-size:0.62rem;font-weight:700;padding:1px 6px;
  border-radius:8px;background:#fff3cd;color:#856404;border:1px solid #ffc107;
  vertical-align:middle;margin-left:5px;line-height:1.4;
}
.qfix-edit-btn{
  font-size:0.71rem;padding:2px 9px;border-radius:5px;cursor:pointer;
  border:1px solid #b0c4de;background:transparent;color:#2c5080;
  font-family:var(--font-stack);transition:all 0.12s;margin-left:4px;
}
.qfix-edit-btn:hover{border-color:var(--accent);color:var(--accent);}
.qfix-form{
  background:#f8faff;border:1.5px solid var(--accent);border-radius:var(--radius-md);
  padding:14px 16px;margin-top:12px;display:none;
}
.qfix-form.show{display:block;}
.qfix-form-title{font-size:0.74rem;font-weight:700;color:var(--accent);margin-bottom:10px;letter-spacing:0.04em;}
.qfix-field-label{font-size:0.69rem;font-weight:700;color:var(--text-muted);margin-bottom:3px;margin-top:8px;display:block;}
.qfix-stem-ta{
  width:100%;min-height:70px;border:1.5px solid #b0c4de;border-radius:var(--radius-sm);
  padding:7px 9px;font-size:0.83rem;line-height:1.6;font-family:var(--font-stack);
  color:var(--text-primary);resize:vertical;outline:none;background:#fff;
}
.qfix-stem-ta:focus{border-color:var(--accent);}
.qfix-opt-input{
  width:100%;border:1.5px solid #b0c4de;border-radius:var(--radius-sm);
  padding:5px 9px;font-size:0.82rem;font-family:var(--font-stack);
  color:var(--text-primary);outline:none;background:#fff;margin-bottom:4px;
}
.qfix-opt-input:focus{border-color:var(--accent);}
.qfix-ans-wrap{display:flex;flex-wrap:wrap;gap:10px;margin-top:5px;}
.qfix-ans-cb{display:flex;align-items:center;gap:4px;font-size:0.84rem;cursor:pointer;font-family:var(--font-stack);}
.qfix-ans-cb input[type=checkbox]{accent-color:var(--accent);cursor:pointer;width:15px;height:15px;}
.qfix-btns{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap;}
.qfix-save-btn{
  padding:6px 16px;background:var(--accent);color:#fff;border:none;
  border-radius:var(--radius-sm);cursor:pointer;font-size:0.8rem;
  font-family:var(--font-stack);font-weight:600;transition:background 0.15s;
}
.qfix-save-btn:hover{background:var(--accent-hover);}
.qfix-cancel-btn{
  padding:6px 14px;background:transparent;color:var(--text-secondary);
  border:1.5px solid var(--card-border);border-radius:var(--radius-sm);cursor:pointer;
  font-size:0.8rem;font-family:var(--font-stack);transition:all 0.12s;
}
.qfix-cancel-btn:hover{border-color:var(--accent);color:var(--accent);}
.qfix-restore-btn{
  padding:6px 14px;background:transparent;color:#8a5c18;
  border:1.5px solid #e0b870;border-radius:var(--radius-sm);cursor:pointer;
  font-size:0.8rem;font-family:var(--font-stack);transition:all 0.12s;
}
.qfix-restore-btn:hover{background:#fff5e0;}
/* ── 문항수정 사진 ── */
.qfix-img-zone{
  border:1.5px dashed var(--card-border);border-radius:var(--radius-sm);
  padding:10px;margin-top:4px;text-align:center;background:#fafbfc;cursor:text;
  outline:none;transition:border-color 0.12s,background 0.12s;
}
.qfix-img-zone:focus{border-color:var(--accent);background:#f0f7ff;}
.qfix-img-zone img.qfix-img-preview{max-width:100%;max-height:220px;border-radius:var(--radius-sm);border:1px solid var(--card-border);object-fit:contain;background:#f4f6f8;}
.qfix-img-none{font-size:0.78rem;color:var(--text-muted);padding:8px 0;}
.qfix-img-status{font-size:0.74rem;font-weight:700;margin-bottom:6px;}
.qfix-img-status.new{color:var(--accent);}
.qfix-img-status.del{color:#c0392b;}
.qfix-img-actions{display:flex;gap:7px;justify-content:center;margin-top:8px;flex-wrap:wrap;}
.qfix-img-del-btn{padding:4px 12px;background:transparent;color:#c0392b;border:1.5px solid #e3a8a0;border-radius:var(--radius-sm);cursor:pointer;font-size:0.76rem;font-family:var(--font-stack);transition:all 0.12s;}
.qfix-img-del-btn:hover{background:#fdecea;}
.qfix-img-undo-btn{padding:4px 12px;background:transparent;color:#8a5c18;border:1.5px solid #e0b870;border-radius:var(--radius-sm);cursor:pointer;font-size:0.76rem;font-family:var(--font-stack);transition:all 0.12s;}
.qfix-img-undo-btn:hover{background:#fff5e0;}
.qfix-img-hint{font-size:0.71rem;color:var(--text-muted);margin-top:6px;line-height:1.5;}
/* ── 진척도 메모 ── */
.lmemo-input{
  width:100%;border:1.5px solid var(--card-border);border-radius:var(--radius-sm);
  padding:4px 8px;font-size:0.79rem;font-family:var(--font-stack);
  color:var(--text-primary);background:#fff;outline:none;min-width:100px;
}
.lmemo-input:focus{border-color:var(--accent);}
.lmemo-input:disabled{background:#f5f5f3;color:var(--text-muted);cursor:not-allowed;}
.lmemo-saved{font-size:0.67rem;color:var(--correct);margin-left:4px;}

/* ──V3_CSS_START── */
/* ── v3 Allen styles ───────────────────────────────── */
#allen-concept-view {
  max-width: 1100px; margin: 0 auto; padding: 18px 16px 60px;
}
/* 알렌 문제 풀이는 족보처럼 좌측에 완전히 붙는 풀폭 .layout (중앙정렬 X) */
#allen-quiz-view { max-width: none; margin: 0; padding: 0; }
.allen-layout {
  display: flex; gap: 18px; align-items: flex-start;
}
@media(max-width:768px){
  .allen-layout { flex-direction: column; }
}
/* Concept TOC */
.allen-toc {
  width: 260px; min-width: 220px; flex-shrink: 0;
  background: var(--sidebar-bg); border: 1px solid var(--sidebar-border);
  border-radius: var(--radius-md); padding: 10px 0; position: sticky; top: calc(var(--header-h) + 50px);
  max-height: calc(100vh - 120px); overflow-y: auto;
}
@media(max-width:768px){
  .allen-toc { width: 100%; position: static; max-height: 260px; }
}
.allen-toc-group { margin-bottom: 2px; }
.allen-toc-group-hdr {
  font-size: 0.72rem; font-weight: 700; padding: 6px 14px 4px;
  color: var(--text-muted); text-transform: uppercase; letter-spacing: .04em;
}
.allen-toc-ch-hdr {
  font-size: 0.79rem; font-weight: 700; color: var(--text-primary);
  padding: 5px 14px 2px; cursor: pointer;
}
.allen-toc-ch-hdr:hover { color: var(--accent); }
.allen-toc-item {
  display: block; width: 100%; text-align: left; border: none; background: none;
  font-size: 0.78rem; color: var(--text-secondary); font-family: var(--font-stack);
  padding: 4px 14px 4px 22px; cursor: pointer; border-radius: 0;
  transition: background .1s, color .1s;
}
.allen-toc-item:hover { background: var(--accent-light); color: var(--accent); }
.allen-toc-item.active { background: var(--accent-light); color: var(--accent); font-weight: 700; }
/* Concept panel */
.allen-concept-panel {
  flex: 1; min-width: 0;
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-md); padding: 22px 24px;
  box-shadow: var(--card-shadow);
}
.allen-concept-panel h1,
.allen-concept-panel h2,
.allen-concept-panel h3 { color: var(--text-primary); margin: 18px 0 8px; }
.allen-concept-panel h1 { font-size: 1.15rem; border-bottom: 2px solid var(--card-border); padding-bottom: 6px; }
.allen-concept-panel h2 { font-size: 1.0rem; }
.allen-concept-panel h3 { font-size: 0.92rem; }
.allen-concept-panel p  { line-height: 1.7; margin: 8px 0; font-size: 0.9rem; }
.allen-concept-panel ul,
.allen-concept-panel ol { margin: 8px 0 8px 22px; line-height: 1.7; font-size: 0.9rem; }
.allen-concept-panel table { border-collapse: collapse; width: 100%; margin: 12px 0; font-size: 0.85rem; }
.allen-concept-panel th, .allen-concept-panel td {
  border: 1px solid var(--card-border); padding: 5px 9px; text-align: left;
}
.allen-concept-panel th { background: var(--accent-light); font-weight: 700; }
.allen-concept-panel blockquote {
  border-left: 3px solid var(--accent); margin: 10px 0; padding: 6px 14px;
  background: var(--accent-light); border-radius: 0 6px 6px 0; font-size: 0.88rem;
}
.allen-concept-panel img { max-width: 100%; max-height: 420px; width: auto; object-fit: contain; border-radius: 6px; margin: 8px 0; display: block; }
.allen-concept-panel code { background: #f0ede8; padding: 1px 5px; border-radius: 3px; font-size: 0.85em; }
.allen-concept-panel pre { background: #f0ede8; padding: 10px 14px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
.allen-concept-placeholder { color: var(--text-muted); text-align: center; padding: 60px 0; font-size: 0.95rem; }

/* Allen Quiz */
.allen-quiz-filters {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center;
  margin-bottom: 18px;
  background: var(--sidebar-bg); border: 1px solid var(--sidebar-border);
  border-radius: var(--radius-md); padding: 12px 16px;
}
.allen-quiz-filters label { font-size: 0.82rem; color: var(--text-secondary); font-weight: 600; }
.allen-quiz-filters select, .allen-quiz-filters button {
  font-size: 0.82rem; font-family: var(--font-stack);
  border: 1.5px solid var(--card-border); border-radius: var(--radius-sm);
  padding: 5px 10px; background: #fff; color: var(--text-primary); cursor: pointer;
}
.allen-quiz-filters select:focus, .allen-quiz-filters button:hover {
  border-color: var(--accent); color: var(--accent);
}
.allen-quiz-stats {
  display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
}
.allen-stat-chip {
  background: var(--chip-bg); color: var(--chip-text);
  font-size: 0.79rem; font-weight: 600; padding: 4px 11px;
  border-radius: 20px;
}
/* Allen question card */
.allen-q-card {
  background: var(--card-bg); border: 1px solid var(--card-border);
  border-radius: var(--radius-md); padding: 18px 20px;
  margin-bottom: 16px;
  /* box-shadow 제거: 수백 카드의 그림자 blur 재계산이 스크롤 시 페인트 렉 유발(족보 .q-card 도 box-shadow:none). 분리는 border 로 충분. */
  /* ★렉 해결: 단원당 100+문항(갑상샘105·당뇨107) 한방 렌더 부담 → 화면 밖 카드 렌더 스킵.
     contain-intrinsic-size 로 미렌더 카드 추정높이를 줘 스크롤바·점프 안정화. */
  content-visibility: auto;
  contain-intrinsic-size: 0 420px;
}
.allen-q-hdr {
  font-size: 0.76rem; color: var(--text-muted); margin-bottom: 8px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.allen-q-hdr .ch-badge {
  background: var(--accent-light); color: var(--accent);
  border-radius: 4px; padding: 2px 7px; font-weight: 700; font-size: 0.73rem;
}
.allen-q-hdr .term-badge {
  border-radius: 4px; padding: 2px 7px; font-weight: 600; font-size: 0.73rem;
}
.allen-q-hdr .term-badge.t1 { background: #ddeeff; color: #1a5080; }
.allen-q-hdr .term-badge.t2 { background: #fde8e8; color: #80201a; }
.allen-q-stem {
  font-size: 0.9rem; line-height: 1.65; margin-bottom: 12px; color: var(--text-primary);
}
.allen-q-stem img { max-width: 100%; max-height: 340px; width: auto; object-fit: contain; border-radius: 6px; margin: 6px 0; display: block; }
.allen-q-stem p { margin: 6px 0; }
.allen-q-stem table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 0.84rem; }
.allen-q-stem th, .allen-q-stem td { border: 1px solid var(--card-border); padding: 4px 8px; }
.allen-q-stem th { background: var(--accent-light); }
.allen-q-stem blockquote {
  border-left: 3px solid var(--accent); margin: 8px 0; padding: 5px 12px;
  background: var(--accent-light); border-radius: 0 5px 5px 0; font-size: 0.87rem;
}
.allen-opts { list-style: none; padding: 0; margin-bottom: 10px; }
.allen-opts li {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 8px 12px; border-radius: var(--radius-sm);
  border: 1.5px solid var(--card-border); margin-bottom: 6px;
  cursor: pointer; font-size: 0.88rem; line-height: 1.55;
  transition: background .1s, border-color .1s;
  background: #fff;
}
.allen-opts li:hover:not(.locked) { background: var(--accent-light); border-color: var(--accent); }
.allen-opts li.locked { cursor: default; }
.allen-opts li.correct-ans { background: var(--correct-light); border-color: var(--correct-border); color: var(--correct); }
.allen-opts li.chosen-wrong { background: var(--incorrect-light); border-color: var(--incorrect-border); color: var(--incorrect); }
.allen-opts li .opt-num { font-weight: 700; min-width: 20px; flex-shrink: 0; color: var(--text-muted); }
.allen-opts li.correct-ans .opt-num,
.allen-opts li.chosen-wrong .opt-num { color: inherit; }
.allen-q-verdict {
  font-size: 0.82rem; font-weight: 700; padding: 4px 0 2px;
  margin-bottom: 6px;
}
.allen-q-verdict.ok { color: var(--correct); }
.allen-q-verdict.ng { color: var(--incorrect); }
.allen-q-expl {
  font-size: 0.85rem; line-height: 1.65; color: var(--text-secondary);
  border-top: 1px solid var(--card-border); padding-top: 10px; margin-top: 4px;
}
.allen-q-expl img { max-width: 100%; border-radius: 5px; margin: 5px 0; display: block; }
.allen-q-expl p { margin: 5px 0; }
.allen-q-expl table { border-collapse: collapse; width: 100%; margin: 6px 0; font-size: 0.83rem; }
.allen-q-expl th, .allen-q-expl td { border: 1px solid var(--card-border); padding: 4px 7px; }
.allen-q-expl th { background: var(--accent-light); }
.allen-q-expl blockquote {

}
.allen-no-results { color: var(--text-muted); text-align: center; padding: 40px 0; }
/* Allen progress table */
.allen-prog-section { margin-top: 30px; }

/* end v3 Allen styles */

 사구체에서 여과된 후에는 세뇨관에서 재흡수와 분비가 일어난다.", "정상인에서 크레아티닌 혈중 농도는 성별과 연령근육량, 등의 영향을 거의 받지 않는다.", "혈중 크레아티닌 농도를 MDRD Study Equation에 대입한 추정 사구체여과율은 모든 인종에서 보편적으로 적용 가능하다.", "CKD-EPI (cr) 공식은 신기능 저하 환자 뿐만 아니라 신기능이 정상인 사람에서도 적용 가능하다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q11"}, {"id": "kid-2023-L01-Q19", "year": 2023, "qnum": "19", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "35세 여자 환자가 심한 운동을 하고 다음 날 아침 붉은 색 소변이 배출되었다요시험지봉. 검사와 요검경 소견은 다음과 같다. 적색뇨의 원인으로 아래 보기 중에서 가장 가능성이 높은 것은? U/A: s.g. 1.020, alb 2+, blood 3+, RBC many/HPF 요검경:", "stem_table": null, "options": ["요로 감염", "사구체신염으로 인한 혈뇨", "Renal-vein entrapment syndrome", "생리혈에 의한 contamination", "과도한 운동으로 인한 방광 출혈"], "answer": [2], "image": "kid_img/kid_41.jpeg", "images": [], "id_simple": "2023-Q19"}, {"id": "kid-2023-L01-Q43", "year": 2023, "qnum": "43", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "20년 째 당뇨병을 앓고 있는 60세 여성이 최근에 체중 증가와 부종을 주증상으로 내원하였다환자의. 부종의 양상은 아래 그림과 같다부종의. 원인으로서 가장 가능성이 낮은질환은 무엇인가?", "stem_table": null, "options": ["신증후군", "만성신장병", "울혈성 심부전", "심부정맥 혈전증", "간경변"], "answer": [4], "image": "kid_img/kid_42.jpeg", "images": [], "id_simple": "2023-Q43"}, {"id": "kid-2023-L01-Q72", "year": 2023, "qnum": "72", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "단백뇨의 진단과 기전에 관한 아래의 설명 중 옳지 않은 것은?", "stem_table": null, "options": ["요검사 시험지봉에서 명확하게 검출되는 범위인 1일 500mg 이상 의 단백질이 소변으로 배출된느 것을 단백뇨라 정의한다.", "Bence-Jones proteinuria는 overflow proteinuria에 해당한다.", "단백뇨의 정량을 위해서는 24시간 요수집 검사 대신 임읜에서 측 정한 단백질크레아티닌/ 농도비를 이용할 수 있다.", "울혈성 심부전, 발열과 운동 등에서 나타나는 단백뇨는 기능적 단 백뇨에 해당된다.", "젊은 성인에서 소량의 단백뇨가 지속적으로 배출되는 경우 기립성 단백뇨를 배제하여야 한다."], "answer": [1], "image": null, "images": [], "id_simple": "2023-Q72"}, {"id": "kid-2022-L01- ], "image": null, "images": [], "id_simple": "2021-Q2"}, {"id": "kid-2021-L01-Q3", "year": 2021, "qnum": "3", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "적색뇨로 병원을 방문한 30세 여성 환자의 요검사에서 혈뇨가 확 인되었다. 다음 중 사구체 병변을 의심하여야 하는 상황은 어떤 것인 가?", "stem_table": null, "options": ["Dysmorphic RBC < 30%", "Blood clot이 동반됨", "소변의 육안적 색깔이 신선한 붉은 색", "소변 전기영동 검사에서 M protein(+)", "Urine albumin/creatinine ratio가 2200mg/g Cr"], "answer": [5], "image": null, "images": [], "id_simple": "2021-Q3"}, {"id": "kid-2021-L01-Q4", "year": 2021, "qnum": "4", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "단백뇨의 진단과 기전에 관한 아래의 설명 중 옳지 않은것은?", "stem_table": null, "options": ["정상적으로 단백질의 하루 소변으로 배설되는 양은 150mg 미만 이며 이 중 알부민은 30mg 미만이다.", "Bence-Jones proteinuria는 tubular proteinuria에 해당한다.", "단백뇨의 정량을 위해서는 24시간 요수집 검사 대신 임의뇨에서 측정한 단백질크레아티닌/ 농도비를 이용할 수 있다.", "발열과 운동 직후에 일시적인 단백뇨가 배출되는 경우 기능적인 단백뇨로 볼 수 있다.", "젊은 성인에서 소량의 단백뇨가 지속적으로 배출되는 경우 기립성 단백뇨를 배제하여야 한다."], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q4"}, {"id": "kid-2021-L01-Q5", "year": 2021, "qnum": "5", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "당뇨병이 있는 70세 남자 환자가 부종을 주소로 내원하였다. 육안 적 진찰 소견에서 우측에 비해 좌측 하지가 심하게 부어 있었다. 이 경우 감별해야 할 질환에 해당되지 않는것은?", "stem_table": null, "options": ["임파부종", "하지 정맥 심부 혈전증", "봉와직염", "혈관 부종", "신증후군"], "answer": [5], "image": null, "images": [], "id_simple": "2021-Q5"}, {"id": "kid-2021-L01-Q89", "year": 2021, "qnum": "89", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "추정 사구체여과율(estimated GFR)을 구하는 여러 방법 중 인 종에 상관없이 한국에서도 적용할 수 있으며 측정 사구체여과율 (measured GFR) 값에 가장 가까운 것은 어느 것인가?", "stem_table": null, "options": ["Cockroft-Gault equation", "MDRD Study equation", "Inulin clearance", "CKD-EPI (cr) equation", "24 hour urine collection을 이용한 Creatinine clearance"], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q89"}, {"id": "kid-2020-L01-Q1", "year": 2020, "qnum": "1", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "30세 여성이 소변검사에서 잠혈반응 양성을 주소로 내원하였다다음. 중 요시험지봉 검사에서 확인할 수 있는 내용은?", "stem_table": null, "options": ["혼탁도", "nitrite", "RBC", "cast", "crystal"], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q1"}, {"id": "kid-2020-L01-Q2", "year": 2020, "qnum": "2", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "인종에 관계없이 모두 적용 가능하여 우리나라 화자들을 대상으로 임상에서 많이 이용되고 있는 eGFR 계산 방법은?", "stem_table": null, "options": ["Cokroft-Gault equation", "Inulin clearance", "24hr creatinine", "CKD-EPI (cr) equation", "MDRD study equation"], "answer": [4], "image": null, "images": [], "id_simple": "2020-Q2"}, {"id": "kid-2020-L01-Q3", "year": 2020, "qnum": "3", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "28세 남성이 운동 후 시행한 dipstick 잠혈 양성반응을 보여 내원하였다. 다음 중 사구체성 혈뇨임을 시사하는 소견은?", "stem_table": null, "options": ["CVA tenderness", "Albumin 3+", "Blood clot +", "원심분리 후 상층액이 붉은색", "Dysmorphic RBC 20%"], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q3"}, {"id": "kid-2020-L01-Q4", "year": 2020, "qnum": "4", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "당뇨병과 고혈압 환자에서 microalbuminuria에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["미세알부민뇨는 dipstick 검사에서 1+로 진단할 수 있다.", "1일 알부민 배출량이 300mg/d 이상일 때를 말한다.", "당뇨병에서 미세알부민뇨의 존재는 신장 합병증을 조기진단하는 데 도움이 된다.", "당뇨병에서와 달리 고혈압에서 미세알부민뇨의 임상적인 의의는 없다.", "미세알부민뇨 진단을 위해 반드시 24시간 요검사를 해야한다."], "answer": [3], "image": null, "images": [], "id_simple": "2020-Q4"}, {"id": "kid-2020-L01-Q5", "year": 2020, "qnum": "5", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "70세 남성이 proteinuria와 edema로 내원하였다. 혈압은 정상이었고, 비중 1.015, 잠혈반응 음성, spot urine PCR 2.3g/g 였다단백질. 성상을 확인하기 위해 단백전기영동을 진행했을 때 아래 그림에서 2c와 같이 나타났다가장. 가능성이 높은 질환은?", "stem_table": null, "options": ["Idiopathic membranous glomerulonephritis", "Orthostatic proteinuira", "Acute tubular necrosis", "Lupus nephritis", "Multiple myeloma"], "answer": [5], "image": null, "images": [], "id_simple": "2020-Q5"}, {"id": "kid-2020-L01-Q6", "year": 2020, "qnum": "6", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "부종의 병태생리 가운데 plasma oncotic pressure의 감소와 관련이 있는 것은?", "stem_table": null, "options": ["CHF", "malnutrition", "NSAID에 의한 부종", "venous obstruction", "angioedema"], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q6"}, {"id": "kid-2019-L01-Q21", "year": 2019, "qnum": "21", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "단백뇨가 검출되어 Urine PEP 검사를 시행하였다이때. 다음과 같은 결과가 나타내는 뇨의 이상은?", "stem_table": null, "options": ["정상", "Glomerular proteinuria", "Tubular proteinuria", "Overproduction proteinuria"], "answer": [3], "image": "kid_img/kid_62.jpeg", "images": [], "id_simple": "2019-Q21"}, {"id": "kid-2019-L01-Q22", "year": 2019, "qnum": "22", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "35세 여자환자가 1일 전부터 시작된 열배뇨통빈뇨를, , 호소하며 내원하여 요로감염을 의심하였다요검사. 결과로 가장 적절한 것은?", "stem_table": null, "options": ["심한 단백뇨", "아질산반응 양성", "다양한 cellular cast", "Calcium oxalate crystal", "dysmorphic RBC 양성"], "answer": [2], "image": null, "images": [], "id_simple": "2019-Q22"}, {"id": "kid-2018-L01-Q29", "year": 2018, "qnum": "29", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "붉은색 소변이 나옴이에. 대한 진단을 하기 앞서 제일 먼저 해야 할 것은?", "stem_table": null, "options": ["혈액 배양", "요시험지봉 검사 및 소변 배양", "컴퓨터 단층 촬영", "초음파검사", "IVP"], "answer": [2], "image": null, "images": [], "id_simple": "2018-Q29"}, {"id": "kid-2018-L01-Q82", "year": 2018, "qnum": "82", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "환자가 한 달 전에는 creatinine도 정상이고 했는데 2일 전에 소변 검사를 했더니 붉은색 소변을 보이며 creatinine이 높고 고열, 구토 증상도 있고 저혈압그러면서아래. 박스에는 한 달 전 소변검사 결과와 2일 전에 한 소변검사 결과를 보여줌한달전. 소변검사: protein 1+, RBC 1~4/HPF... 이틀 전 소변검사: protein 1+, RBC 5~9/HPF, bacteria 1+ 환자가 보이는 소견에 가장 알맞은 임상적 상황은?", "stem_table": null, "options": ["고혈압과 폐부종에 의한 혈뇨다.", "Nephrotic Syndrome 관련 보기", "1주일 내에 12kg가 찌면서 부종이 생긴다.", "urine culture을 해보면 10^5 이상의 colony가 검출된다.", "Rhabdomyolysis에 의한 소견이다."], "answer": [4], "image": null, "images": [], "id_simple": "2018-Q82"}, {"id": "kid-2018-L01-Q41", "year": 2018, "qnum": "41", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "19세 남자가 소변검사이상으로 내원하였다소변검사. 비중 1.020 / 단백질 2+ / RBC <1/HPF / serum Cr 0.8 상기 환자의 다음 검사로 가장 먼저 시행해야 할 것은?", "stem_table": null, "options": ["혈청 항원항체/ 검사", "단회뇨 단백질크레아티닌/ 비 검사", "소변 단백 전기영동검사", "골수검사", "신장초음파 검사"], "answer": [2], "image": null, "images": [], "id_simple": "2018-Q41"}, {"id": "kid-2018-L01-Q43", "year": 2018, "qnum": "43", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "edema관련 그래프 (Gamma 부분에 spike가 높았음) 다음 중 부종을 일으킨 병태생리는?", "stem_table": null, "options": ["glomerulus edema", "functional edema", "overflow edema", "tubular edema"], "answer": [3], "image": null, "images": [], "id_simple": "2018-Q43"}, {"id": "kid-2018-L01-Q90", "year": 2018, "qnum": "90", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "검사 결과가 총 2가지 나옴. (과거 검사 결과 & 이번에 한 검사 결과과거에는) 혈뇨, 단백뇨 나왔는데 부종이나 이런 증상 없었음 ) 이번에는 단백뇨, 혈뇨와 함께 부종이 생기고 고혈압이 생기고 albumin 내려가고 등등어느. 증후군에 속할까? 과거 검사 RBC 1-5/HPF 알부민 2+ 2일전에 문제 생겨서 검사 받으러옴 그결과 현재 RBC 9-10/HPF 알부민 3+ 알부민크레/ 1500mg/g 크레아티닌 2.1 부종 고혈압 존재", "stem_table": null, "options": ["급성 신염", "신증후군", "무증상 요이상", "신세뇨관 결손", "고혈압"], "answer": [1], "image": null, "images": [], "id_simple": "2018-Q90"}, {"id": "kid-2016-L01-Q30", "year": 2016, "qnum": "30", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "다음은 육안적 혈뇨로 내원한 40세 남자의 소변검사결과이다. 가장 가능성이 높은 진단은? [요시험지봉검사]: 요잠혈 3+, 요단백 3+ [요침사검사]: 적혈구(20/HPF), RBC cast 관찰, 이상형태적혈구(dysmorphic RBC): 90%", "stem_table": null, "options": ["방광암", "토리콩팥염(glomerulonephritis)", "콩팥세포암", "요로결석", "전립선염"], "answer": [2], "image": null, "images": [], "id_simple": "2016-Q30"}, {"id": "kid-2016-L01-Q31", "year": 2016, "qnum": "31", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "15세 60kg 남자가 학교 소변 검사에서 발견된 검사 이상으로 내원하였다. 14세 당시에도 내원하였는데 당시 120/70mmHg 부종 및 전신 증상 없었다. 14세 비중 1.020 dipstick protein 1+, RBC 5-9/HPF 15세 비중 1.025 dipstick protein 1+, RBC 1-4/HPF Serum IDMS trace creatine 0.8mg/dL (eGFR 126ml/min/1.73m2) 오후 4시 소변 albumin/creatine 100mg/g creatine", "stem_table": null, "options": ["급성신염", "신증후군", "무증상요이상", "만성신부전", "세뇨관결손"], "answer": [3], "image": null, "images": [], "id_simple": "2016-Q31"}, {"id": "kid-2016-L01-Q32", "year": 2016, "qnum": "32", "jokbo_lec_no": "01", "lecture": "01 신질환의 임상적 접근방법", "professor": "김동기", "curr_lec_no": "01", "curr_lecture": "신장질환의 임상적 접근방법 1,2", "stem": "70세 남자가 다음과 같은 검사 이상으로 내원하였다. 소변검사 : 비중 1.020 , albumin stick 음성 , RBC<1/HPF, Urine protein to creatinine ratio : 1000mg/g creatinine 혈청단백질 7.0g/dL, 혈청알부민 400g/dL, 혈청크레아티닌 3.0mg/dL 상기 환자의 다음 검사 중 가장 먼저 시행하여야 할 것을 한 가지 고르시오.", "stem_table": null, "options": ["소변검사 재검사", "24시간 소변단백질 검사", "소변단백 전기영동 검사", "골수 검사", "신장초음파 검사"], "answer": [], "image": null, "images": [], "id_simple": "2016-Q32", "note": "원본 표기: 1?3?"}, {"id": "kid-2025-L02-Q42", "year": 2025, "qnum": "42", "jokbo_lec_no": "02", "lecture": "02 체내의 항상성 유지기전 산염기 :", "professor": "주권욱", "curr_lec_no": "02", "curr_lecture": "체내의 향상성 유지기전: 산염기 1,2", "stem": "63세 여자가 발열을 주소로 응급실을 방문하였다. 환 자는 빈맥, 호흡수 증가 및 혼동 상태를 보였으며 검사는 아래와 같았다. 아래의 검사 결과 만으로 유추할 수 있는 이 환자의 산염기 상태를 아래의 답가지에서 고르시오. pH 7.28, PCO2 18mmHg, HCO3- 7mEq/L", "stem_table": null, "options": ["단순 대사성산증", "대사성 산증 + 호흡성 알칼리증", "대사성 산증 + 적절한 호흡성 보상", "대사성 알칼리증 + 호흡성 산증", "호흡성 알칼리증"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q42"}, {"id": "kid-2025-L02-Q43", "year": 2025, "qnum": "43", "jokbo_lec_no": "02", "lecture": "02 체내의 항상성 유지기전 산염기 :", "professor": "주권욱", "curr_lec_no": "02", "curr_lecture": "체내의 향상성 유지기전: 산염기 1,2", "stem": "고음이온차성 대사성 산증의 주요 원인이 아닌 것을 다음의 답가지에서 고르시오.", "stem_table": null, "options": ["DKA", "Lactic acidosis", "만성 설사", "급성 신부전", "Ethylene glycol 섭취"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q43"}, {"id": "kid-2025-L02-Q44", "year": 2025, "qnum": "44", "jokbo_lec_no": "02", "lecture": "02 체내의 항상성 유지기전 산염기 :", "professor": "주권욱", "curr_lec_no": "02", "curr_lecture": "체내의 향상성 유지기전: 산염기 1,2", "stem": "25세 발레리나가 하지 무력감을 주소로 내원하였다. 환자는 내원 2주 전부터 기운이 없었고 하루 전부터는 하 지의 무력감이 발생하여 걷기 어려울 정도였다. 환자는 구 토나 약물 복용력은 완강히 부인하였으며, 가족력도 특이 사항은 없었다. 환자는 굉장히 말라 보였으며, 혈압은 90/55 mmHg 였고 하지의 근력이 떨어져 있는 것 외에는 특별한 신체 검진 소견은 없었다. 다음은 이 환자의 검사 결과이다. 검사 결과를 보고 이 환자에서 가장 가능성이 높은 진단을 아래의 답가지에서 고르시오. pH 7.50, PCO2 48 mmHg, HCO3- 35 mmol/L, Na = 134 mmol/L, K = 2.2 mmol/L, Cl = 91 mmol/L BUN/Cr 35/0.6 mg/dL urine Na 45 mmol/L urine K 25 mmol/L urine Cl < 5 mmol/L", "stem_table": null, "options": ["현재 사용 중인 이뇨제 남용", "Bartter 증후군", "Liddle 증후군", "습관적인 구토", "Gitelman 증후군"], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q44"}, {"id": "kid-2025-L02-Q45", "year": 2025, "qnum": "45", "jokbo_lec_no": "02", "lecture": "02 체내의 항상성 유지기전 산염기 :", "professor": "주권욱", "curr_lec_no": "02", "curr_lecture": "체내의 향상성 유지기전: 산염기 1,2", "stem": "25년 전부터 당뇨병으로 치료받고 있던 70세 남자가 손발이 저려서 내원하였다. 혈압은 150/90 mmHg, 양측 하지에 오목부종(pitting edema)이 있었다. 이 환자의 검사 결과는 다음과 같았다. 검사결과를 보고 이 환자에서 가장 가능성이 높은 진단을 아래의 답가지에서 고르시오. ABGA : pH 7.32 PaCO2 30 PaO2 98 HCO3- 16 Blood : BUN/Cr 32/1.5 mg/dL Na/K/Cl 139/6.0/110mEq/L U/A에서 albumin 2+", "stem_table": null, "options": ["Type 1 RTA", "Type 2 RTA", "DKA", "Starvation ketoacidosis", "Type 4 RTA"], "answer": [5], "image": null, "images": [], "id_simple": "2025-Q45"}, {"id": "kid-2025-L02-Q47", "year": 2025, "qnum": "47", "jokbo_lec_no": "02", "lecture": "02 체내의 항상성 유지기전 산염기 :", "professor": "주권욱", "curr_lec_no": "02", "curr_lecture": "체내의 향상성 유지기전: 산염기 1,2", "stem": "20세 남자환자가 다음과 다뇨를 주소로 내원하였다. 환자는 최근 5 kg의 체중 감소가 있었고 내원 당시 의식 저하가 관찰되었다. 신체검진에서 BP 90/60 mmHg Pulse 100회분이었고/ , 검사 소견은 다음과 같았다. 이 환자에서 만약 bicarbonate 교정이 필요하다고 하면 pH 7.2까지 교정하는 데 필요한 bicarbonate에 가장 근접한 양을 다음의 보기에서 고르시오. (환자의 체중은 60kg이고 pH 7.2일 때 [H+] = 63 nmol/L이다. 계산은 소숫점 한 자리까지만 하세요.) pH = 7.06 ([H+] = 88 nmol/L) pCO2 = 25 mmHg Serum Na = 140 mmol/L, Serum K = 3.5 mmol/L, Serum Cl = 100 mmol/L", "stem_table": null, "options": ["21", "52", "81", "108", "156"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q47"}, {"id": "kid-2025-L02-Q49", "year": 2025, "qnum": "49", "jokbo_lec_no": "02", "lecture": "02 체내의 항상성 유지기전 산염기 :", "professor": "주권욱", "curr_lec_no": "02", "curr_lecture": "체내의 향상성 유지기전: 산염기 1,2", "stem": "75세 남자환자가 수 일간 지속된 심한 구토를 주소로 응급실에 내원하였다. 신체검진에서 저혈압, 빈맥, 피부 긴장도 감소 소견을 보였 고검사, 소견은 다음과 같았다. 검사 결과를 보고 이 환자의 산염기 상태를 적절히 기술한 것을 아래의 답가지에서 고르시오. pH 7.2, PCO2 22 mmHg, HCO3- 10 mmol/L, Na+ 140 mmol/L, Cl- 85 mmol/L", : "저칼륨혈증의 감별진단으로 보기에 나열한 것에 추가 로 중요한 지표를 고르시오.", "stem_table": null, "options": [], "answer": [1], "image": "kid_img/kidq_L03-2025-Q74-0.png", "images": [], "id_simple": "2025-Q74", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2023-L03-Q22", "year": 2023, "qnum": "22", "jokbo_lec_no": "03", "lecture": "03 체내의 항상성 유지기전 수분전해질 :", "professor": "김세중·허남주", "curr_lec_no": "03", "curr_lecture": "체내의 향상성 유지기전: 수분 외 2강", "stem": "69세 남자 환자가 3일 전부터 시작된 의식 저하로 방문하였다. 특이 과거력이 없는 분으로서 이뇨제를 포함한 약물 복용력도 없었다. 30 pack-years의 흡연력이 있으며, 숨이 찬 증상도 호소하였다. Blood: BUN 10 mg/dl, creatinine 0.85 mg/dl, Na 120mmol/L, K 4.0mmol/L, total CO2 28mmol/L Urine: random urine protein/creatinine ratio 0.1g/g 숨찬 증상에 대해 흉부 x-ray와 CT를 검사하였다. 이에 폐에 종양이 발견되어 추가적인 검사를 할 예정이다. 의식 저하와 혈청 Na 수치가 낮아서 이에 대해서도 추가적인 검사를 하려고 한다. 가장 먼저 시행해야하는 검사는?", "stem_table": null, "options": ["Serum osmolality", "Hematuria", "Stool ezam", "Abdomen x-ray", "Kidney biopsy"], "answer": [1], "image": "kid_img/kid_84.jpeg", "images": [], "id_simple": "2023-Q22"}, {"id": "kid-2023-L03-Q28", "year": 2023, "qnum": "28", "jokbo_lec_no": "03", "lecture": "03 체내의 항상성 유지기전 수분전해질 :", "professor": "김세중·허남주", "curr_lec_no": "03", "curr_lecture": "체내의 향상성 유지기전: 수분 외 2강", "stem": "78세 남자가 7일 간의 수양성 설사로 왔다경정맥은. 평탄했고, 구강 점막은 말라 있었다검사결과는. 다음과 같았다치료는. ? 혈액검사: 백혈구 12,300/mm3, 혈색소 15.5g/dL, 혈소판 330,000/mm2 혈액요소질소크레아티닌/ 90/3.2 mg/dL Na+/K+/Cl- 144/5.3/9.6 mmol/L, AST/ALT 45/52 IU 요검사: 비중 1.030, 알부민 -, blood – 크레아티닌 90mg/dL, Na+ 10mmol/L", "stem_table": null, "options": ["혈액투석", "고리이뇨제", "0,45% 식염수", "0.9% 식염수", "저용량 도파민"], "answer": [4], "image": null, "images": [], "id_simple": "2023-Q28"}, {"id": "kid-2023-L03-Q41", "year": 2023, "qnum": "41", "jokbo_lec_no": "03", "lecture": "03 체내의 항상성 유지기전 수분전해질 :", "professor": "김세중·허남주", "curr_lec_no": "03", "curr_lecture": "체내의 향상성 유지기전: 수분 외 2강", "stem": "65세 남자가 의식이 저하되어 보호자에 의해 응급실로 내원하였 다환자는. 내원 당시 혈압: 136/78mmHg, 맥박수:72 회분호흡/ , : 18 회분체온/ , 36.5℃ 였다이학적. 검사에서 혀는 말라 있지 않았 고피부탄력도는, 정상이었다과거 professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음에서 설명하는 막의 주요 구성성분에 대한 자가항 체 형성이 특정 사구체질환의 발생과 관련있다고 알려져 있다. 이에 해당하는 사구체질환으로 가장 가능성이 높은 질환은 다음 중 무엇인가?", "stem_table": null, "options": ["IgA nephropathy", "Membranoproliferative glomerulonephritis", "Membranous nephropathy", "Minimal change disease", "Anti-GBM nephritis"], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q32"}, {"id": "kid-2025-L06-Q33", "year": 2025, "qnum": "33", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "사구체에 존재하는세포들 중 다음의 설명에 가장 잘 맞는 세포는 무엇인가? - 기질 생산능력이 있다. - 사구체뭉치(glomerular tuft)에 대한 구조적지지 (structural support) 역할을 한다. - 수축(contractile) 및 탐식(phagocytic)능력이 있 다. - 각종 전달물질(biological mediator)을 생산한다.", "stem_table": null, "options": ["Glomerular endothelial cell", "Podocyte", "Mesangial cell", "Parietal epithelial cell", "Neutrophil"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q33"}, {"id": "kid-2025-L06-Q34", "year": 2025, "qnum": "34", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음은 어떤 사구체질환의 병인기전에 대한 설명이다. 이 사구체질환에서 기대되는 대표적인 사구체 병변으로 가 장 가능성이 높은 것은 아래 그림의1 사구체 1-5 중 어느 것인가? - Unknown circulating factor가 작용할 것으로 추측 하고 있으며, 이는 신이식 (renal transplantation) 직 후 재발하는 증례들을 통해 유추할 수 있다. - 신장의 일부를 절제한 실험동물에서 발병하는 것이 관찰되며, 이를 통해 몇몇 이차성으로 발병하는 증례 들의 발병기전을 설명할 수 있다. - Podocyte 손상이 발병에 중요하게 작용할 것이라 는 증거들이 제기되고 있다. - HIV-1 혹은 COVID-19 감염과 연관된 증례들이 보고된다.", "stem_table": null, "options": ["사구체 1", "사구체 2", "사구체 3", "사구체 4", "사구체 5"], "answer": [4], "image": "kid_img/kid_155.jpeg", "images": [], "id_simple": "2025-Q34"}, {"id": "kid-2025-L06-Q35", "year": 2025, "qnum": "35", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음에서 기술하는 환자의 사구체질환의 병인기전에 가장 합당한 것은 무엇인가? 71세 남자환자가 1개월전 발병한 oliguria를 주소로 내 원하였다. 검사결과 심한 단백뇨와 현미경적 혈뇨가 관 찰되었고 혈중 C3 농도가 낮아져있었다. 신생검을 시행 하였고 그림은1 대표적인 사구체 소견을 보여주고 있 고, 그림는2 면역형광검사 소견이다.", "stem_table": null, "options": ["Galactose-Deficient IgA1", "Autoantibody to type IV collagen", "Autoantibody formation to PLA2 receptor", "Hyperplasia of podocyte", "Dysregulation of alternative complement pathway"], "answer": [5], "image": null, "images": ["kid_img/kid_156.jpeg", "kid_img/kid_160.jpeg"], "id_simple": "2025-Q35"}, {"id": "kid-2025-L06-Q36", "year": 2025, "qnum": "36", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음에서 설명하는 소견에 합당한 lupus nephritis의 class는 무엇인가?", "stem_table": null, "options": ["Lupus nephritis, Class II", "Lupus nephritis, Class III", "Lupus nephritis, Class IV", "Lupus nephritis, Class V", "Lupus nephritis, Class VI"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q36"}, {"id": "kid-2025-L06-Q37", "year": 2025, "qnum": "37", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음의 설명에 가장 잘 맞는 낭성 신질환은? - 육안적으로 다양한 크기의 낭이 신장전체를 가득 채우며, 신장의 크기가 매우 커진다. - 주로 PKD1, PKD2 gene의 mutation에 의해 발생 한다. - 40% 정도에서 polycystic liver disease를 동반한 다.", "stem_table": null, "options": ["Autosomal dominant polycystic disease", "Autosomal recessive polycystic disease", "Glomerulocystic disaese", "Multicystic renal dysplasia", "Medullary sponge kidney"], "answer": [1], "image": null, "images": [], "id_simple": "2025-Q37"}, {"id": "kid-2025-L06-Q38", "year": 2025, "qnum": "38", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음에서 기술하는 환자의 전자현미경 소견으로 가장 기대되는 소견은 무엇인가? 7세 여아가 거품뇨를 주소로 내원하여 시행한 검사에 서 심한 단백뇨가 관찰되었고 혈중 albumin 농도가 낮 아져 있었다. 그림은1 이 환자의 신생검 광학현미경 검사에서 관찰된 대표적인 사구체 소견이고 대부분의 사구체가 이와 같은 소견을 보이고 있었다. 세뇨관 간 질에는 이상소견이 관찰되지 않았으며, 면역형광검사 는 모두 음성이었다.", "stem_table": null, "options": ["발돌기의 광범위한 소실(Diffuse foot process effacement)", "상피하 전자고밀도물질 침착(Subepithelial electron-dense deposits)", "사구체 기저막 비후(GBM thickening)", "사구체 기저막 이상(Abnormality of GBM)", "메산지움 전자고밀도물질 침착(Mesangial electron-dense deposits)"], "answer": [1], "image": "kid_img/kid_161.jpeg", "images": [], "id_simple": "2025-Q38"}, {"id": "kid-2025-L06-Q39", "year": 2025, "qnum": "39", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음 그림에서1 관찰되는 사구체 병변을 어떻게 표현 하는 것이 가장 적당한가?", "stem_table": null, "options": ["Segmental sclerosis", "Global sclerosis", "Endothelial cell proliferation", "Mesangial cell proliferation", "Podocyte proliferation"], "answer": [4], "image": "kid_img/kid_162.jpeg", "images": [], "id_simple": "2025-Q39"}, {"id": "kid-2025-L06-Q40", "year": 2025, "qnum": "40", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음의 환자에서 의심되는 사구체질환을 확인하기 위 해 추가로 시행할 검사로 가장 적절한 것은 무엇인가? 13세 남자환자가 단백뇨가 관찰되어 내원하였다. 1년 전 신체검사에서도 hematuria, proteinuria가 관찰되었 다. 원인 신질환을 감별하기 위해 신생검을 시행하였 고 광학현미경 검사에서는 일부 사구체에서 segmental sclerosis가 관찰되었고 중등도의 세뇨관 간질 손상이 관찰되었다. 면역형광검사에서 immunoglobulin 혹은 complement 침착은 관찰되지 않았다. 이 환자의 전자현미경에서 그림과1 같은 소견 이 관찰되었다.", "stem_table": null, "options": ["혈중 Anti-nephrin antibody 검사", "혈중 PLA2R 검사", "Type IV collagen a5 chain 면역형광검사", "Fibrinogen 면역형광검사", "C4d 면역형광검사"], "answer": [3], "image": "kid_img/kid_166.jpeg", "images": [], "id_simple": "2025-Q40"}, {"id": "kid-2025-L06-Q41", "year": 2025, "qnum": "41", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음의 전자현미경 사진 그림의1 화살표가 가리키는 소견이 관찰될 것으로 기대되는 사구체질환의 광학현미경 사구체 소견으로 가장 특징적인 것은 무엇인가?", "stem_table": null, "options": ["Diffuse neutrophil infiltration and endothelial cell proliferation", "Focal segmental sclerosis", "Mostly normal glomeruli", "Diffuse global sclerosis", "Diffuse crescent formation"], "answer": [1], "image": "kid_img/kid_167.jpeg", "images": [], "id_simple": "2025-Q41"}, {"id": "kid-2023-L06-Q16", "year": 2023, "qnum": "16", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "18세 남자 환자가 육안적 혈뇨 및 단백뇨를 주소로 내원하였으며환자의, 가족력에서 어머니가 요검사상 혈뇨가 관찰되었다신생검. 광학현미경 검사에서는 segmental sclerosis와 세뇨관 위축 등이 관찰되었고, 전자현미경검사에서 아래 사진과 같은 소견이 관찰되었다. 다음 중 이 환자의 신질환 발생과 가장 관련있다고 생각되는 것은 무엇인가?", "stem_table": null, "options": ["Hepatitis B virus", "Anti-GBM antibody", "Hepatitis B virus", "alpha-5 chain of type 4 collagen", "Neutral endopeptidase (NEP, CD10)"], "answer": [4], "image": "kid_img/kid_168.jpeg", "images": [], "id_simple": "2023-Q16"}, {"id": "kid-2023-L06-Q24", "year": 2023, "qnum": "24", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "23세 남자가 2일 전 발생한 전신부종으로 왔다. 2주 전 고열을 동반한 목감기로 진료를 받은 적이 있다혈압. 163/94mmHg, 맥박수 분당 75회, 호흡수 분당 16회체온, 36.8’C였다. 혈액 및 요 검사 소견은 아래와 같았다. 혈액: 백혈구 12,300/mm3, 혈색소 13.3g/dL, 혈소판 165 X 10^3/mm3 혈액요소질소크레아티닌/ 35/1.8mg/dL Na+/K+/Cl-/tCO2 141/4.6/87/23 mmol/L 요: 비중 1.025, 혈액 2+, 알부민 2+, 적혈구 5-9/고배율시야, 백혈구 5-9/고배율시야 신장조직검사에서 전자현미경 소견이 다음과 같았다진단은. ?", "stem_table": null, "options": ["IgA 신장염 (IgA nephropathy)", "미세변화 신증후군 (minimal change disease)", "막성 사구체신염 (membranous nephropathy)", "국소 분절 사구체 경화 (focal segmental glomerulosclerosis)", "감염 후 사구체신염 (acute post-infectious glomerulonephritis)"], "answer": [5], "image": "kid_img/kid_172.jpeg", "images": [], "id_simple": "2023-Q24"}, {"id": "kid-2023-L06-Q30", "year": 2023, "qnum": "30", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "65세 남자 환자가 신증후군을 주소로 내원하였다이. 환자의 신생검 광학현미경 검사 및 전자현미경 검사에서 다음과 같은 소견이 관찰되었다. 다음 중 이 환자의 초기 치료제로 맞는 것은?", "stem_table": null, "options": ["Complements", "Lysozyme", "Fluoroquinolone", "Glucocorticosteroids", "Omega-3"], "answer": [4], "image": "kid_img/kid_173.jpeg", "images": [], "id_simple": "2023-Q30"}, {"id": "kid-2023-L06-Q36", "year": 2023, "qnum": "36", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "신생검 병리검사에서는 일반적으로 광학현미경검사면역형광검사, 및 전자현미경 검사를 동시에 시행한다. 다음 중 전자현미경 검사의 목적으로 가장 적절치 않은것은 무엇인가?", "stem_table": null, "options": ["침착된 immunoglobulin 혹은 complement의 종류 확인", "면역복합체 침착 위치 확인", "Foot process 상태 확인", "GBM 두께 확인", "GBM 변화 확인"], "answer": [1], "image": "kid_img/kid_174.jpeg", "images": [], "id_simple": "2023-Q36"}, {"id": "kid-2023-L06-Q42", "year": 2023, "qnum": "42", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "아래 사진에서 화살표가 가리키는 세포는 무엇인가?", "stem_table": null, "options": ["Podocyte", "Mesangial cell", "Parietal epithelial cell", "Glomerular endothelial cell", "Macrophage"], "answer": [2], "image": "kid_img/kid_175.jpeg", "images": [], "id_simple": "2023-Q42"}, {"id": "kid-2023-L06-Q46", "year": 2023, "qnum": "46", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "다음에 열거하는 항목 중 아래 사구체에서 관찰되는 병변의 형성과 가장 관련이 깊은 것은 무엇인가?", "stem_table": null, "options": ["WT1", "C3", "RPLR", "IgA", "Anti-GBM antibody"], "answer": [5], "image": "kid_img/kid_176.jpeg", "images": [], "id_simple": "2023-Q46"}, {"id": "kid-2023-L06-Q54", "year": 2023, "qnum": "54", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "신기능의 이상을 주소로 내원한 15세 남자 환자의 신생검 광학현미경 검사에서 여러 사구체 중 하나에서 다음과 같은 소견이 관찰되었다. 아래 열거한 사구체 질환 중 이러한 소견을 관찰함으로써 진단에서 배제될 수 있는 질환은 무엇인가?", "stem_table": null, "options": ["Focal segmental glomerulosclerosis", "Minimal change disease", "C3 glomerulonephritis", "IgA nephropathy", "Lupus nephritis"], "answer": [2], "image": "kid_img/kid_188.jpeg", "images": [], "id_simple": "2023-Q54"}, {"id": "kid-2023-L06-Q66", "year": 2023, "qnum": "66", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "55세 남자가 2주전부터 갑자기 나타난 양측 하지 부종으로 병원 에 왔다최근. 들어서 피곤하였고소변에서, 거름이 증가하였다시행. 한 검사결과는 다음과 같았다. serum creatinine 1.1mg/dL, albumin 2.5g/dL urinalysis albumin ++++, blood -, RBC 1-4/HPF Spot urine : protein 550mg/dL, creatinine 100mg/dL 이후에 콩팥 조직검사를 시행하였다. H&E staining (그림1) 및 면역형광염색에서 특이 소견 보이지 않고 전자현미경에서 그림와2 같이 관찰되었다. 이 질환에서 나타나는 합병증이 아닌 것은?", "stem_table": null, "options": ["coagulation defect", "Dyslipidemia", "Hypovolemic crisis", "Infection", "Synpharyngitic gross hematuria"], "answer": [5], "image": "kid_img/kid_190.jpeg", "images": [], "id_simple": "2023-Q66"}, {"id": "kid-2023-L06-Q78", "year": 2023, "qnum": "78", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "아래 사진은 신증후군으로 내원한 70세 여자환자의 신생검 광 학현미경 검체에 포함된 사구체의 대표 사진이다. 이 환자의 전자현 미경 검사에서 전자고밀도물질(electron-dense deposits)은 관찰되 지 않았고 podocyte process는 광범위하게 소실되어 있었다. 이 환 자의 면역형광검사에서 가장 기대되는 소견은 다음 중 무엇인가?", "stem_table": null, "options": ["Mesangial IgA staining", "Peripheral IgG staining", "Peripheral IgM staining", "All negative", "full house pattern"], "answer": [4], "image": "kid_img/kid_189.jpeg", "images": [], "id_simple": "2023-Q78"}, {"id": "kid-2023-L06-Q83", "year": 2023, "qnum": "83", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "상기도 감염 증상이 있고 다음날 육안적 혈뇨가 발생하여 내원한 15세 남자 환자의 신생검 광학현미경 검사에서 다음과 같이 사구체 내의 세포증식이 관찰되었고, 전자현미경에서 우측 사진과 같은 electron-densedeposit이 관찰되었다. 다음 중 이 질환의 병인기전 과 가장 관련 높은 것은 무엇인가?", "stem_table": null, "options": ["Abnormal lgA production", "Autoantibody to PLA2R", "Nephritogenic streptococc m_table": null, "options": ["PKD1", "PKD2", "PKHD1", "NPHS1", "MCKD1"], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q27"}, {"id": "kid-2021-L06-Q39", "year": 2021, "qnum": "39", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "아래 사진은 신증후군으로 내원한 70세 여자환자의 신생검 광학 현미경 검체에 포함된 사구체의 대표 사진이다. 이 환자의 전자현미 경 검사에서 전자고밀도물질(electron-dense deposits)은 관찰되지 않았고 podocyte process는 광범위하게 소실되어 있었다. 이 환자 의 면역형광검사에서 가장 기대되는 소견은 다음 중 무엇인가?", "stem_table": null, "options": ["Mesangial IgA staining", "Peripheral IgG staining", "Peripheral C3 staining", "All negative", "Mesangial C1q staining"], "answer": [4], "image": "kid_img/kid_221.jpeg", "images": [], "id_simple": "2021-Q39"}, {"id": "kid-2021-L06-Q40", "year": 2021, "qnum": "40", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "5세 여자환자가 육안적 혈뇨를 주소로 내원하였고 진단을 위해 신생검을 시행하였다. 신생검 면역형광검사에서 아래와 같은 소견을 보였다면 이 환자의 전자현미경 소견에서 가장 기대되는 소견은 다음 중 무엇인가?", "stem_table": null, "options": ["Mesangial electron-dense deposit", "No electron-dense deposit", "Diffuse foot process effacement", "Diffuse GBM thickening", "GBM lamellation and reticulation"], "answer": [1], "image": "kid_img/kid_225.jpeg", "images": [], "id_simple": "2021-Q40"}, {"id": "kid-2021-L06-Q41", "year": 2021, "qnum": "41", "jokbo_lec_no": "09", "lecture": "06 신질환의 병리 1,2,3", "professor": "문경철", "curr_lec_no": "09", "curr_lecture": "신질환의 병리 1,2,3", "stem": "35세 여자 환자가 육안적 혈뇨와 단백뇨를 주소로 내원하였다. 이 환자의 신생검 광학현미경 검사에서 광범위한 메산지움 세포의 증 식이 관찰되었다. 이 환자의 전자현미경 사진에서 화살표가 가리키는 세포의 이름은 무엇인가?", "stem_table": null, "options": ["Glomerular endothelial cell", "Mesangial cell", "Podocyte", "Parietal epithelial cell", "Smooth muscle cell"], "answer": [2], "image": "kid_img/kid_226.jpeg", "images": [], "id_simple": "2021-Q41"}, {"id": "kid-2021-L06-Q42", "year": 2021, "qnum": "42", "jokbo_lec_no": "09", "lecture": " 100mmHg", "체온 39°C", "2주전 감기증세로 목부위 심한 통증"], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q68"}, {"id": "kid-2025-L07-Q69", "year": 2025, "qnum": "69", "jokbo_lec_no": "10", "lecture": "07, 08 일차성이차성 사구체신염 ,", "professor": "이하정·진호준", "curr_lec_no": "10", "curr_lecture": "일차성 사구체신염 · 이차성 사구체신염", "stem": "위 환자에서 진단적 검사와 치료를 시행하였다. PSGN 의 전형적인 소견 및 치료와 일치하지 않은 것은?", "stem_table": null, "options": ["뇨검사에서 단백뇨와 혈뇨의 검출", "신장조직 검사의 광학현미경 소견", "신장조직 검사의 전자현미경 소견", "혈청검사에서 ASO 양성", "항고혈압제 및 이뇨제 사용"], "answer": [3], "image": null, "images": ["kid_img/kid_264.jpeg", "kid_img/kid_265.jpeg"], "id_simple": "2025-Q69"}, {"id": "kid-2025-L07-Q70", "year": 2025, "qnum": "70", "jokbo_lec_no": "10", "lecture": "07, 08 일차성이차성 사구체신염 ,", "professor": "이하정·진호준", "curr_lec_no": "10", "curr_lecture": "일차성 사구체신염 · 이차성 사구체신염", "stem": "24세 여자가 수개월전부터 반복되는 피로감, 발열, 관 절통, 다리의 부종, 얼굴의 나비모양 발진을 주소로 내원하 였다. 신체검사에서 혈압은 150/100mmHg였으며 부분적 탈모도 관찰할 수 있었다. 기본 검사를 시행하였고 다음과 같은 결과를 얻었다. 이에 대한 임상적 추정진단과 확진을 위한 검사를 계획하 였다적절하지. 않은 계획은? hemoglobin 13 g/dL WBC 3,000/microL, platelet 45,000/microL Urinalysis; Protein +++, RBC>100/HPF serum BUN/creatinine; 25/1.5 mg/dL serum protein/albumin; 6.5/3.5 g/dL", "stem_table": null, "options": ["루프스 신염을 의심하여 Antinuclear Ab, Ds-DNA Ab 등을 추가 검사하여야 한다", "혈청보체 (C3, C4)의 혈장내 농도를 검사한다", "이상단백질(paraprotein)의 신장침범이 의심되므로 소변 단백전기영동검사를 시행한다", "신장의 침범 정도를 판단하는 것이 중요하므로 신장조 직검사를 시행한다", "일반적으로 면역억제치료를 기본으로 하며 동반되는 임 상적 이상을 조절하기 위한 약물치료를 계획한다"], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q70"}, {"id": "kid-2025-L07-Q71", "year": 2025, "qnum": "71", "jokbo_lec_no": "10", "lecture": "07, 08 일차성이차성 사구체신염 ,", "professor": "이하정·진호준", "curr_lec_no": "10", "curr_lecture": "일차성 사구체신염 · 이차성 사구체신염", "stem": "위 환자에서 신장조직 검사를 시행하였다. 다음 광학 현미경 검사중 가장 가능성 높은 것은? (그림 위에서부터 순서대로 1-5) 실제 시험에서도 선지에 class가 주어짐", "stem_table": null, "options": ["LN class 1 그림", "LN class 2 그림", "LN class 3 그림", "LN class 4 그림", "LN class 5 그림"], "answer": [4], "image": null, "imag  발열과 체중감소, 부종 증상 으로 인근 병원을 방문하였을 때 단백뇨와 혈뇨가 발견되었으며 신장 기능이 다소 저하되었다고 들었다. 환자는 그로부터 다시 3주 후에 병원을 재방문하였을 때 신장 기능은 더욱 저하되어 있었다환자는. 평소 당뇨와 고혈압은 없었으며진통소염제, 혹은 한약 등 신독성 약 제의 복용은 부인하였다혈액과. 소변 검사는 다음과 같았다환자는. 사구체신염 의심하에 입원하여 신장 생검을 시행하기로 하였다. 환자 는 임상적 양상은 사구체신염의 증후군 가운데 어느 것에 해당하는 가? A: (1개월전 첫 방문시) BUN/Cr 20/1.5 mg/dL, U/A alb 2+, RBC 20~30/HBF, dysmorphic RBC 75%, urine protein/cr ratio 1.6 g/g Cr B: (그로부터 3주후 재방문시) BUN/Cr 55/3.2 mg/dL, U/A alb 2+, RBC 30~50/HBF, dysmorphic RBC 80%, urine protein/cr ratio 1.2 g/g Cr", "stem_table": null, "options": ["급성신염 증후군 (AGN)", "급속진행성 사구체신염 (RPGN)", "만성사구체신염 증후군 (CGN)", "신증후군 (NS)", "무증상성 요이상 (AUA)"], "answer": [2], "image": null, "images": [], "id_simple": "2022-Q5"}, {"id": "kid-2022-L07-Q31", "year": 2022, "qnum": "31", "jokbo_lec_no": "10", "lecture": "07, 08 일차성이차성 사구체신염 ,", "professor": "이하정·진호준", "curr_lec_no": "10", "curr_lecture": "일차성 사구체신염 · 이차성 사구체신염", "stem": "사구제질환의 정확한 진단을 위해 유전자 검사가 필요한 경우가 있다다음의. 다양한 임상 양상을 보이는 국소분절사구체경화 환자들 가운데 유전자 검사의 필요성이 가장 낮은 환자를 고르시오.", "stem_table": null, "options": ["청력 저하를 동반한 국소분절사구체경화 환자", "원인 불명의 말기신부전으로 투석을 받는 어머니와 남동생이 있 는 국소분절사구체경화 환자", "이식 후 재발한 신증후군으로 시행한 조직검사에서 진단된 국소 분절사구체경화 환자", "스테로이드 및 면역억제 치료에 반응을 보이지 않는 국소분절사 구체경화 환자", "임신 준비 중 발견된 무증상 요검사 이상으로 시행한 조직 검사에서 국소분절사구체 경화 환자"], "answer": [3], "image": null, "images": [], "id_simple": "2022-Q31"}, {"id": "kid-2022-L07-Q32", "year": 2022, "qnum": "32", "jokbo_lec_no": "10", "lecture": "07, 08 일차성이차성 사구체신염 ,", "professor": "이하정·진호준", "curr_lec_no": "10", "curr_lecture": "일차성 사구체신염 · 이차성 사구체신염", "stem": "65세 남자 환자가 검진에서 발견된 단백뇨로 왔다고혈압. 외에 특이 병력은 없었다. 단백뇨의 진단을 위해 시행한 정량 검사에서 신 증후군 범위의 단백뇨가 확인되어 혈청 검사 및 신장 조직검사를 시 행하였고, 결과는 다음과 같았다이. 질환의 원인 및 병태생리를 확인 하기 위해 추가적으로 가장 먼저 고려해야 하는 검사는? WBC 9500/mm3, Hemoglobin 10.5 g/dL, Platelet 162,000/mm3 Serum creatine 1.5 g/dL, CKD-EPl eGFR 48 ml/min/1.73 m2 Random urine protein/creatine 4.2 g/g Random urine microalbumin/crteatine 1.0 g/g lgG/A/M 859/282/120 mg/dl C3/C4 45/24 mg/dl FANA (-), Rhematoid f etic nephropathy", "crescentric GN"], "answer": [3], "image": null, "images": ["kid_img/kid_310.jpeg", "kid_img/kid_311.jpeg"], "id_simple": "2016-Q43"}, {"id": "kid-2025-L08-Q18", "year": 2025, "qnum": "18", "jokbo_lec_no": "12", "lecture": "09 신장과 고혈압", "professor": "오윤규", "curr_lec_no": "12", "curr_lecture": "신장과 고혈압", "stem": "75세 남자가 만성콩팥병과 고혈압으로 진단받고 로자 탄 (Losartan)과 암로디핀 (Amlodipine)을 처방받아 1달 간 복용한 후 내원하여 측정한 혈압이 165/95 mmHg 였 다. 이 환자가 혈압이 계속 조절이 안될 경우 추가해야 할 것으로 고려 중인 약물들이다. 투여하지 말아야 할 약물 은? 혈액: 혈액요소질소크레아티닌/ 32/1.95 mg/dL 추정사 구체 여과율 35 mL/min/1.73 m2", "stem_table": null, "options": ["하이드로클로로티아자이드 (Hydrochlorothiazide))", "에날라프릴 (Enalapril)", "스피로노락톤 (Spironolactone)", "비소프롤롤 (Bisoprolol)", "독사조신 (Doxazosin)"], "answer": [2], "image": null, "images": [], "id_simple": "2025-Q18"}, {"id": "kid-2025-L08-Q19", "year": 2025, "qnum": "19", "jokbo_lec_no": "12", "lecture": "09 신장과 고혈압", "professor": "오윤규", "curr_lec_no": "12", "curr_lecture": "신장과 고혈압", "stem": "63세 남자 환자가 1차 병원에서 우측 상복부에서 잡음 (bruit)이 청진된다고 듣고 내원하였다. 환자는 평소 암로 디핀 (amlodipine) 5 mg, 발사르탄 (valsartan) 80 mg 으 로 혈압이 140/90 mmHg 이하로 조절되었다고 한다. 내원 당시 혈압이 132/88 mmHg 였다. 신동맥혈관조영술 (angiography)에서 다음과 같은 소견이 발견되었다. 이 환 자의 치료 방침은? 혈액: 혈액요소질소크레아티닌/ 18/0.82 mg/dL", "stem_table": null, "options": ["신동맥성형술", "신동맥스텐트삽입술", "혈관우회수술", "내과적치료", "신동맥절제수술"], "answer": [4], "image": "kid_img/kid_315.jpeg", "images": [], "id_simple": "2025-Q19"}, {"id": "kid-2023-L08-Q2", "year": 2023, "qnum": "2", "jokbo_lec_no": "12", "lecture": "09 신장과 고혈압", "professor": "오윤규", "curr_lec_no": "12", "curr_lecture": "신장과 고혈압", "stem": "다음은 신장과 고혈압그리고, 염분 섭취에 관한 기술이다옳지. 않은 것을 고르시오.", "stem_table": null, "options": ["신장은 고혈압을 유발하기도 하고 높은 혈압에 의해 손상을 받는 표적장기이기도 하다.", "고혈압 환자는 pressure natriuresis 곡선이 우측으로 이동하여 염분 배설 장애를 보인다.", "염분 섭취량과 상관없이 모든 인종에서 나이가 들면 혈압이 상승한다.", "고혈압을 적절하게 조절하면 신기능의 악화 속도를 늦출 수 있다.", "야간 고혈압은 표적 장기의 손상 빈도를 높이며 신기능도 빠르게 악화시킨다."], "answer": [3], "image": null, "images": [], "id_simple": "2023-Q2"}, {"id": "kid-2023-L08-Q
