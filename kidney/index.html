age": "kid_img/kid_383.jpeg", "images": [], "id_simple": "2016-Q53"}, {"id": "kid-2016-L10-Q54", "year": 2016, "qnum": "54", "jokbo_lec_no": "13", "lecture": "11 급성 신손상", "professor": "김동기", "curr_lec_no": "13", "curr_lecture": "급성콩팥손상 1 · 급성콩팥손상 2", "stem": "72세 남자 환자가 사우나 후 적색뇨와 요량감소를 주소로 내원하였다평소. Simvastatin 복용. BUN/Cr 90mg/dL. 3.9 mg/dL. 잠혈 +3. 요검사 RBC 0-1/HPF. WBC 1-4/HPF. 진단은 무엇인가?", "stem_table": null, "options": ["RPGN", "출혈성 방광염", "급성 간질성 신염", "급성 신세뇨관 괴사", "Rhabdomyolysis에 의한 급성신손상"], "answer": [5], "image": null, "images": [], "id_simple": "2016-Q54"}, {"id": "kid-2016-L10-Q55", "year": 2016, "qnum": "55", "jokbo_lec_no": "13", "lecture": "11 급성 신손상", "professor": "김동기", "curr_lec_no": "13", "curr_lecture": "급성콩팥손상 1 · 급성콩팥손상 2", "stem": "69세 여자 환자가 신기능 저하로 내원하였다환자는. 2개월 전부터 설사를 했고, 한 달 전부터 빈도와 양이 늘어서 2개월 동안 15kg 체중이 감소했고평소, 고혈압 및 만성 B형 간염 보균상태 외에 특이병력은 없었다입원. 당시 체중과 키는 각각 40.6kg과 155cm였다혀는. 말라있었고구강점막이, 건조하였으며경정맥압이, 감소한 것이 확인되었다이. 환자에서 신기능 저하의 원인은 무엇인가? V/S 142/93mmHg – 109/min – 18/min – 36.7℃ CBC 9960/ – 15.1g/dL – 376K BUN/Cr 47/2.09mg/dL, Ca/P 9.2/3.4mg/dL Na/K/Cl/tCO2 139/2.8/115/12 mmol/L U/A with microscopy: SG 1.012 pH 5.5 ALB 1+ BLD – Urine Na/K/Cl <10/7.8/34 mmol/L, 요 크레아티닌 10mg/dL", "stem_table": null, "options": ["신전성 신손상", "신후성 신손상", "급성 세뇨관 괴사", "급성 간질성 신염", "급속 진행성 사구체신염"], "answer": [1], "image": null, "images": [], "id_simple": "2016-Q55"}, {"id": "kid-2016-L10-Q56", "year": 2016, "qnum": "56", "jokbo_lec_no": "13", "lecture": "11 급성 신손상", "professor": "김동기", "curr_lec_no": "13", "curr_lecture": "급성콩팥손상 1 · 급성콩팥손상 2", "stem": "30세 남자환자가 1주일 전 교통사고 이후 발생한 오심, 구토, 어지러움을 주소로 내원하였다혈압은. 120/80 mmHg이었다. 환자는 구토로 인해 거의 아무것도 먹지 못했다고 하였고, 3일 전부터는 소변량도 줄어든 것 같다고 하였다. 이전에 신기능이 정상이었으며검사결과는, 다음과 같았다. BUN/Cr : 90/4.0mg/dL Na+/K+/Cl- : 148/4.8/100mEq/L AST/ ALT 36/40 IU Urinalysis : SG 1.030 RBC 5-9/HPF, WBC 5-9/HPF protein +/- Urine chemistry : creatinine 40mg/dL, Na+/K+ 74/25mEq/L 이 환자에서 급성 신손상의 원인으로 가장 가능성이 높은 것은?", "stem_table": null, "options": ["신전성 신손상", "신후성 신손상", "급성 신세뇨관 괴사", "Afferent arteriole의 확장 감소", "급성 간질성 신염"], "answer": [3], "image": null, "images": [], "id_simple": "2016-Q56"}, {"id": "kid-2025-L11-Q1", "year": 2025, "qnum": "1", "jokbo_lec_no": "15", "lecture": "12 당뇨병성 신병증", "professor": "박세훈", "curr_lec_no": "15", "curr_lecture": "당뇨병콩팥병", "stem": "10년 전 제형2 당뇨병을 진단받은 55세 여자가 신장 합병증 여부를 위한 검진에서 이상 소견이 발견되었다. 다 른 심혈관계 질환은 없었다. 환자의 소변과 혈액 검사는 다음과 같다. 환자는 신장 생검을 시행하여 당뇨병 신병증 (diabetic nephropathy)으로 진단받았다. 이 환자의 치료로 가장 적절한 것을 한 가지 고르시오. BP 150/90 mmHg BUN/Cr 12/0.8 mg/dL, U/A s.g. 1.025, alb 1+, RBC < 1/HPF, WBC < 1/HPF Random urine albumin to creatinine ratio 500 mg/g cr LDL cholesterol 65 mg/dL HbA1c 7.8%", "stem_table": null, "options": ["고염식을 권장한다.", "일차 당뇨병 치료제로 인슐린을 사용한다.", "LDL cholesterol을 40 mg/dL 미만을 목표로 치료한다.", "혈압 조절을 위해 안지오텐신 전환효소 억제제 또는 안 지오텐신 수용체 차단제 계통의 항고혈압제를 우선 고려한 다.", "1년마다 신장 조직 검사를 시행하여 신장 상태를 추적 관찰한다."], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q1"}, {"id": "kid-2025-L11-Q2", "year": 2025, "qnum": "2", "jokbo_lec_no": "15", "lecture": "12 당뇨병성 신병증", "professor": "박세훈", "curr_lec_no": "15", "curr_lecture": "당뇨병콩팥병", "stem": "30 세 여자 환자가 6개월 전 제형2 당뇨병을 진단받았 다. 환자의 혈액과 소변 검사는 다음과 같다. 본 환자의 당 뇨병으로 인한 신장 합병증 여부에 대한 평가로 옳은 것은 무엇인가? 체중 50 kg, 키 160 cm BUN/Cr 15/0.31 mg/dl, eGFR by CKD-EPI 145 ml/min/1.73 m2 HbA1c 8.6% U/A: SG 1.010, pH 5.0, albumin -, glucose 2+, blood - Random urine albumin to creatinine ratio 10 mg/g of creatinine Random urine protein to creatinine ratio 80 mg/g of creatinine", "stem_table": null, "options": ["진단 후 5년이 지난 시점부터 미세알부민뇨를 검사하는 것이 좋다.", "당뇨병망막병증 여부 검사는 현 시점에서 할 필요 없 다.", "사구체여과율이 높아 과여과 상태의 합병증이 의심된다", "소변 단백전기영동 검사가 필요하다.", "24시간 요수집 검사에서 1일 300 mg 이상의 알부민뇨 가 나오면 미세알부민뇨에 해당한다."], "answer": [3], "image": null, "images": [], "id_simple": "2025-Q2"}, {"id": "kid-2023-L11-Q35", "year": 2023, "qnum": "35", "jokbo_lec_no": "15", "lecture": "12 당뇨병성 신병증", "professor": "박세훈", "curr_lec_no": "15", "curr_lecture": "당뇨병콩팥병", "stem": "10년 는?", "stem_table": null, "options": ["설포닐우레아(sulfonylurea)", "DPP-4 억제제", "SGLT2 억제제", "GLP-1 수용체 작용제 5_ 알파 글루코시다체 억제제(alpha glucosidase inhibitor)"], "answer": [3], "image": null, "images": [], "id_simple": "2023-Q79"}, {"id": "kid-2023-L11-Q89", "year": 2023, "qnum": "89", "jokbo_lec_no": "15", "lecture": "12 당뇨병성 신병증", "professor": "박세훈", "curr_lec_no": "15", "curr_lecture": "당뇨병콩팥병", "stem": "30세 여자 환자가 6개월 전 제형2 당뇨병을 진단받았다 환자의 혈액과 소변 검사는 다음과 같다. 체중 50kg, 키 160cm 「BUN/Cr 15/0.31 mg/dL, eGFR by CKD-EPl 145 ml/min/1.73m2 HbA1c 8.6% U/A: sg 1.010, pH 5.0, albumin-, glucose 2+, blood- Urine albumin to creatine ratio 10 mg/g cr, Urine protein to creatine ratio 80 mg/g cr.」 본 환자의 당뇨병으로 인한 신장 합병증 여부에 대한 평가로 옳은 것 은 무엇인가? ① 진단후 5년이 지난 시점부터 미세알부민뇨를 검사하는 것이 좋 다. ② 당뇨병성 망막병증 여부 검사는 현 시점에서 할 필요 없다. ③ 소변 단백전기영동 검사가 필요하다. ④ 사구체 여과율이 높아 과여과 상태의 당뇨병성 신장 합병증이 의 심된다.", "stem_table": null, "options": [], "answer": [4], "image": "kid_img/kidq_L11-2023-Q89-0.png", "images": [], "id_simple": "2023-Q89", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2022-L11-Q44", "year": 2022, "qnum": "44", "jokbo_lec_no": "15", "lecture": "12 당뇨병성 신병증", "professor": "박세훈", "curr_lec_no": "15", "curr_lecture": "당뇨병콩팥병", "stem": "35세 남자 환자가 1주일 전 제형2 당뇨병을 진단받았다 환자의 혈액과 소변 검사는 다음과 같다. 체중 93kg, 키 175츠 (BMI 30.4) BUN/Cr 15/0.4 mg/dL, eGFR by CKD-EPl 154 ml/min/1.73m2 HbA1c 8.6% U/A: sg 1.010, pH 5.4, albumin-, glucose 2+, blood- Urine albumin to creatine ratio 10 mg/g cr, Urine protein to creatine ratio 80 mg/g cr. 본 환자의 당뇨병으로 인한 신장 합병증 여부에 대한 평가로 옳은 것 은 무엇인가?", "stem_table": null, "options": ["진단후 5년이 지난 시점부터 미세알부민뇨를 검사하는 것이 좋 다.", "당뇨병성 망막병증 여부 검사는 현 시점에서 할 필요 없다.", "소변 단백전기영동 검사가 필요하다.", "사구체 여과율이 높아 과여과 상태의 당뇨병성 신장 합병증이 의 심된다.", "24시간 요수집 검사에서 1일 300mg 이상의 알부민뇨가 나오면 미세알부민뇨에 해당한다."], "answer": [4], "image": null, "images": [], "id_simple": "2022-Q44"}, {"id": "kid-2022-L11-Q45", "year": 2022, "qnum": "45", "jokbo_lec_no": "15", "lecture": "12 당뇨병성 신병증", "professor": "박세훈", "curr_lec_n 배양에서 10^5 CFU/ml 이상의 세균이 배양되었다", "Rhabdomyolysis로 인한 혈뇨이다"], "answer": [4], "image": null, "images": [], "id_simple": "2019-Q49"}, {"id": "kid-2018-L13-Q64", "year": 2018, "qnum": "64", "jokbo_lec_no": "34", "lecture": "15 요로감염 및 임신과 신장", "professor": "정종철", "curr_lec_no": "34", "curr_lecture": "요로감염 및 임신과 신장", "stem": "배뇨통과 잔뇨감하복부, 통증(?) 으로 내원한 32개월 임산부. 요배양 검사에서 10^5CFU 이상이 두 번씩 나옴적절한. 치료는?", "stem_table": null, "options": ["항생제 치료", "조기 분만", "경과 관찰", "", ""], "answer": [1], "image": null, "images": [], "id_simple": "2018-Q64"}, {"id": "kid-2016-L13-Q57", "year": 2016, "qnum": "57", "jokbo_lec_no": "34", "lecture": "15 요로감염 및 임신과 신장", "professor": "정종철", "curr_lec_no": "34", "curr_lecture": "요로감염 및 임신과 신장", "stem": "임신 24주인 30세 여성이 이틀전부터 발열오한옆구리, , 통증을 주소로 응급실에 내원하였다내원당시. 혈압 110/90mmHg, 체온 38.5도이었고 소변검사에서 RBC 5-9/HPF, WBC many/HPF가 나왔다. 이 환자의 치료로 적절한 것은?", "stem_table": null, "options": ["fluoroquinolone", "cephalosporin", "macrolide", "경과관찰한다.", "aminoglycoside"], "answer": [2], "image": null, "images": [], "id_simple": "2016-Q57"}, {"id": "kid-2016-L13-Q58", "year": 2016, "qnum": "58", "jokbo_lec_no": "34", "lecture": "15 요로감염 및 임신과 신장", "professor": "정종철", "curr_lec_no": "34", "curr_lecture": "요로감염 및 임신과 신장", "stem": "65세 여자가 발열로 내원하였다. 1개월 전 외부병원에서 발열 및 우측 옆구리통증으로 신우신염 및 이로 인한 패혈증을 진단받았다. 당시 소변과 혈액에서 E. coli, ESBL(+)가 동정되어 ertapenem으로 2주간 치료를 받았다. 치료 종료 1주 후 발열이 다시 발생하였고 우측 신우염 및 패혈증이 재발하여 추가로 10일간 ertapenem 치료를 받았다. 치료 종료 1주 후 발열이 다시 발생하였다항생제. 치료 외에 추가로 필요한 처치는? V/S : 131/61mmHg – 82/min – 18/min – 38.6℃ CBC :6100/mm3 – 9.4g/dL – 234K, hs-CRP : 4.5mg/dL U/A with microscopy : SG 1.026, pH 7.0, ALB+/-, BLD +/-, NIT-, WBC 5~9/HPF, RBC 1~4/HPF, urine culture : E. coli, ESBL+", "stem_table": null, "options": ["신장절제술(nephrectomy)", "도뇨관(foley catheter) 삽입", "요관부목 (ureteral stent) 거치", "경피적 배액술 (percutaneous drainage)", "경피적 신루 (percutaneous nephrostomy)"], "answer": [4], "image": null, "images": [], "id_simple": "2016-Q58"}, {"id": "kid-2016-L13-Q59", "year": 2016, "qnum": "59", "jokbo_lec_no": "34", "lecture": "15 요로감염 및 임신과 신장", "professor": "정종철", "curr_lec_no": "34", "curr_lecture": "요로감염 및 임신과 신장", "stem": "45세 60kg 여자환자가 2일전에 본 적색 소변을 주소로 내원하였다. 1달 전 소변검사와 혈장 creatinine이 정상이었다. 2일전생리, 후 2주째에 새빨간 소변을 보았고 배뇨통이 있었으며 하루 10회 소변을 보고 소변을 본 직후에 요의가 있었다. 발열은 없었고 치골상부 압통을 호소하였고 늑골척추각 압통은 없었다. dipstick test protein 1+ blood 3+ rbc 50-59/HPF bacteria 1+ 다음 중 환자에 부합하는 소견으로 알맞은 것은?", "stem_table": null, "options": ["혈뇨로 인한 고혈압과 폐부종이 있었다.", "단백뇨가 3.5g/17.3㎡/day 이상 있었다.", "최근 1달 사이에 부종으로 인해 체중이 10kg 증가하였다.", "소변배양에서 10^5 CFU/ml 이상의 세균이 배양되었다.", "rhabdomyolysis로 인한 혈뇨이다"], "answer": [4], "image": null, "images": [], "id_simple": "2016-Q59"}, {"id": "kid-2025-L14-Q5", "year": 2025, "qnum": "5", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "43세 남자가 건강 검진에서 발견된 단백뇨를 주소로 내 원하였다. 혈압 146/90 mmHg, 맥박 65회분/ , 호흡 17회/ 분, 체온 36.5℃이다. 검사 결과는 다음과 같다. 콩팥조직 검사 광학현미경 소견사진( 1)이다. 이 질환의 발생 기전 은? 혈액: 크레아티닌 1.6 mg/dL, 당화혈색소 7.0%, 총 단백질알부민/ 6.9/3.5 g/dL 소변: 백혈구 1~3/고배율시야, 적혈구 5～10/고배율 시야, 단백 105 mg/dL, 크레아티닌 100 mg/dL <콩팥조직 면역형광염색 결과> IgG: Negative IgM: Negative IgA: 2+, mesangial deposit C3: +/- Fibrinogen: Negative C1q: Negative", "stem_table": null, "options": ["사구체 족세포 결합 자가항체", "최종 당화 산물 침착", "메산지움에 침착된 면역 복합체", "IgA에 대한 동종항체 (alloantibody)", "잘못 접힌 (misfolded) 면역 글로불린의 응집"], "answer": [3], "image": "kid_img/kid_405.jpeg", "images": [], "id_simple": "2025-Q5"}, {"id": "kid-2025-L14-Q6", "year": 2025, "qnum": "6", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "62세 남자가 4주 전부터 양쪽 발이 부어서 내원하였다. 4주 동안 체중이 5kg 증가했고, 소화불량이 지속되었다. 평소에 복용하는 약은 없었다. 혈압 122/80 mmHg, 맥박 90회분/ , 호흡 17회분/ , 체온 36.7℃이다. 검사 결과는 다 음과 같다. 콩팥 조직 검사 소견 (사진1, 사진 2)이다. 진 단은? 혈액: 크레아티닌 1.5 mg/dL, 총단백질알부민/ 5.7/3.2 g/dL, 총 콜레스테롤 275 mg/dL Complement3 (정상 범위 83-193) 153 mg/dL, Complement4 (정상 범위 15-57) 43 mg/dL, IgG/A/M 1580/651/136 mg/dL B형간염 s항원 (+), C형간염항체 (-), ASO (-), 류 마티스 인자 (-) 항GBM 항체 (-), 항호중구 항체 (-), 한랭글로불린 (-), 항핵항체 (-) 소변: 비중 1.018, 단백질 (2+), 백혈구 0~2/고배율 시야, 적혈구 0~2/고배율시야, 알부민 305 mg/dL, 크 레아티닌 100 mg/dL", "stem_table": null, "options": ["막성 콩팥병", "아밀로이드증", "막증식성 사구체신염", "IgA 콩팥병", "미세변화콩팥병"], "answer": [1], "image": null, "images": ["kid_img/kid_406.jpeg", "kid_img/kid_407.jpeg"], "id_simple": "2025-Q6"}, {"id": "kid-2025-L14-Q76", "year": 2025, "qnum": "76", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "30세 남자가 5년 전부터 간헐적인 육안적 혈뇨를 주소 로 내원하였다. 환자는 특히 편도염을 앓고 난 후 1-2일 내에 콜라색 소변을 본다고 하였다. 내원 시 혈압은 145/95 mmHg였고, 소변검사에서는 단백뇨(1.5 g/day)와 혈뇨가 관찰되었으나, 신기능은 정상 범위였다. 이 환자에 서 IgA 신증을 진단하였을 때, 가장 먼저 고려해야 할 초 기 치료는 무엇인가?", "stem_table": null, "options": ["정기적인 신장 조직검사", "사이클로포스파마이드 (Cyclophosphamide)", "리툭시맙 (Rituximab)", "안지오텐신 전환효소 억제제 (ACE inhibitor) 또는 안 지오텐신 수용체 차단제 (ARB)", "혈장교환술 (Plasmapheresis)"], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q76"}, {"id": "kid-2023-L14-Q26", "year": 2023, "qnum": "26", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "22세 남자가 1주일 전부터 시작된 붉은색 소변으로 왔다. 과거력에서 특이 질환 없던 분으로서, 2주일전 감기를 앓았다고 한다양쪽. 다리에 부종을 동반하고 있다. 이에 검사를 진행하였고 다음의 결과를 보였다. Blood: BUN 22 mg/dl, creatinine 0.96mg/dl Dipstick albumin 3+, blood 3+, RBC 50-100/HPF, WBC < 1/HPF Random urine protein / creatinine ratio 6.4 g/g 콩팥 질환의 원인을 확인하기 위하여 조직 검사를 시행하였고 (그림 1), 면역 형광 염색 결과는 다음과 같다. IgG: Negative IgM: Negative IgA: 3+ C3: +/- Fibrinogen: Negative C1q: Negative 그림 1. 콩팥 조직 검사 결과. (A) H&E staining. (B) Immunofluorescent microscopy for IgA. (C) Electron microscopy. 위 질환에 대한 치료 방법 중식사, 생활에서 유지해야할 점은?", "stem_table": null, "options": ["저염식고단백, 식사", "고염식고단백, 식사", "저염식저단백, 식사", "고염식저단백, 식사", "없음"], "answer": [3], "image": "kid_img/kid_411.jpeg", "images": [], "id_simple": "2023-Q26"}, {"id": "kid-2022-L14-Q86", "year": 2022, "qnum": "86", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "기저 병력이 없는 47세 여자 환자가 건강검진에서 신장 검사 이 상 소견으로 내원하였다혈액. 및 소변 검사 결과는 아래와 같았다. 혈액 검사: BUN 16mg/dL, creatinine 0.7mg/dL, albumin 4.0 g/dl 소변 스틱 검사: Albumin +/- blood +/-, microscopy RBC 5-9/HPF, Dusmorphic RBC 10% Random urine protein-to-creatine ratio 0.12g/g 환자의 임상 소견은 사구체질환의 5가지 syndrome 중 무엇인가?", "stem_table": null, "options": ["Asymptomatic urinary abnormality", "Nephrotic syndrome", "Acute glomerulonephritis", "Chronic glomerulonephritis", "Rapidly progressive glomerulonephritis"], "answer": [3], "image": null, "images": [], "id_simple": "2022-Q86"}, {"id": "kid-2022-L14-Q87", "year": 2022, "qnum": "87", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "68세 여자가 내원 3개월 전부터 시작된 전신 위약식이, 부진으 로 시행한 혈액검사에서 신기능 저하로 의뢰되었다. 12년 전 당뇨병 으로 진단받고 이후 개인의원에서 비정기적으로 추적관찰하며 당뇨, 고혈압고지혈증, 약제를 처방 받아 복용하였으며약, 3년 전부터 통 풍과 관절염으로 간헐적으로 소염진통제를 복용하고 있었다키는. 158츠, 체중은 56kg이었고혈압은, 160/98 mmHg, 맥박수는 분당 87회호흡수는, 분당 22회체온은, 36.7℃이었다. 최근 1년 사이 4kg가량의 체중증가가 있었으며, 양 하지에 함요 부종이 관찰되었다. 과거 흡연력이 있었으며 평소 주 1회 이상의 음주력이 있었다환자. 의 혈액, 소변 검사가 다음과 같을 때, 환자의 신장질환 평가를 위해 우선적으로 고려할 영상 검사는 무엇인가? 혈액검사: WBC 6,490/mm3,Hb 7.2g/dL, Platelet 125,000/mm3 BUN/Cr 48/3.52 mg/dL, estimated glomerular filtration rate 14ml/min/1.73m2 Uric acid 9.8mg/dL, Ca/p 7.6/6.8 mg/dL, Electrolyte 142-5.6-101-14 mmol/L Cholesterol 441mg/dL, TG/HDL/LDL-C 169/57/357mg/dL Glucose 295mg/dL, Hemoglobin A1c 11.1% Protein/Albumin 4.2/2.2 g/dL, Bilirubin 0.3 mg/dL, ALP/AST/ALT 55/17/8 IU/L 소변 Dipstick urine test: SG 1.015 pH 6.5, Albumin 4+, RBC 1-4/HPF, WBC 1-4/HPF Random urine protein/creatine ratio 6.47 g/g", "stem_table": null, "options": ["K.U.B", "Kidney contrast CT", "CT urography", "Kidney doppler sonography", "Kidney MR"], "answer": [3], "image": null, "images": [], "id_simple": "2022-Q87"}, {"id": "kid-2021-L14-Q71", "year": 2021, "qnum": "71", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "72세 남자 환자가 전신허약감을 주소로 내원하였다. 10년 전부 터 당뇨를 진단 받고 경구혈당강하제를 복용 중이며, 1년 전 혈청 creatinine 1.3mg/dl라고 들었다고 한다. 4개월 전 신장 기능이 악 화되었다고 들었고, 당시 혈청 creatinine은 2.4mg/dl였다. 6주 전 혈압이 조절되지 않으며 혈청 creatinine은 5.5mg/dl로 증가하였다. 2주 전부터 구역감, 식욕부진, 전신허약감이 나타났고, 혈청 creatinine 7.8mg/dl였다내원. 당시 검사는 다음과 같다. Blood: BUN 55mg/dl, creatinine 8.7mg/dl, albumin 3.0g/dl Urine: dipstick alb 3+, blood 3+, microscopy RBC 20-39/HPF, dysmorphic RBC 80% Kidnet doppler SONO: RK 11.2cm, LK 10.2cm Normal size, exho and contour of BK. No focal lesion, hydronephrosis. Decreased renal perfusion Increased RI values in BK. Rt 0.77~0.81 Lt 0.78~0.80 → r/o diffuse parenchymal disease 환자의 임상 소견은 사구체질환의 5가지 syndrome 중 무엇인가?", "stem_table": null, "options": ["Asymptomatic urinary abnormality", "Nephrotic syndrome", "Acute glomerulonephritis", "Chronic glomerulonephritis", "Rapidly progressive glomerulonephritis"], "answer": [5], "image": null, "images": [], "id_simple": "2021-Q71"}, {"id": "kid-2021-L14-Q72", "year": 2021, "qnum": "72", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "ANCA 혈관염은 -granulomatosis with polyangiitis(GPA) -microscopic polyangiitis(MPA) -Churg-Strauss syndrome(CSS) 의 세가지로 나누어볼 수 있다. 다음 도표의 빈 칸에 들어갈 진단명 순서(①→②→③)로 가장 알맞은 것은? ① ② ③ 침범 장기 Kidney 80% 90% 45% Skin/cutaneous 40% 40% 50% Lung 90% 50% 90% Ear, nose, throat 90% 35% 50% Musculoskeletal 60% 60% 50% Neurologic 50% 30% 60% Gastrointestinal 50% 50% 70% ANCA 항체 종류 Anti-PR3 Ab 70% 40% 5% Anti-MPO Ab 25% 50% 40% Negative 5% 10% 55%", "stem_table": null, "options": ["GPA – MPA – CSS", "MPA – GPA – CSS", "CSS – GPA – MPA", "CSS – MPA – GPA", "GPA – CSS – MPA"], "answer": [1], "image": null, "images": [], "id_simple": "2021-Q72"}, {"id": "kid-2020-L14-Q53", "year": 2020, "qnum": "53", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "72세 남자가 신장기능 이상으로 내원하였다. 환자는 27년 전 당뇨 진단 후, 경구혈당강하제로 혈당을 조절하였으며, 6년 전부터 insulin으로 약제를 변경하여 투약하였고, 7년 전 고혈압을 진단받은 후 약물로 혈압을 조절하였다수. 년 전부터 콩팥기능이 저하되었다고 들었으나 경과를 관찰하였다수개월. 전부터 전신 위약감이 지속되고, 3-4kg의 체중 감소가 있었으나부인을, 간병하는 동안의 피로 때문이라고 생각하였다평소에도. 녹용이 든 한약을 1년에 한 번 정도 복용하였고, 전신 위약감이 지속되며 한약을 또 복용하였다. 4개월 전 신기능이 악화되었다고 듣고 신장내과를 방문하여 경과를 관찰하였고, 6주 전부터 혈압이 조절되지 않았고, 4주 전부터 기침가래와, 전신위약감이 발생하였다. 이에 타 병원 신장내과에 입원하여 말기 신부전이라 듣고, 혈액투석을 시작하였고, 이차소견을 듣기 위해 내원하였다환자의. 신기능 수치 변화는 다음 그림과 같다이. 환자의 임상 소견은 사구체질환 가운데 어떤 소견에 가장 합당한가?", "stem_table": null, "options": ["Nephrotic syndrome", "Acute glomerulonephritis", "Chronic glomerulonephritis", "Asymptomatic urinary abnormality", "Rapidly progressive glomerulonephritis"], "answer": [5], "image": "kid_img/kid_415.jpeg", "images": [], "id_simple": "2020-Q53"}, {"id": "kid-2020-L14-Q54", "year": 2020, "qnum": "54", "jokbo_lec_no": "30", "lecture": "16 CBL (GN, NS)", "professor": null, "curr_lec_no": "30", "curr_lecture": "[CBL] GN, NS", "stem": "27세 남자 환자가 단백뇨로 왔다군입대. 전 요 검사에서 혈뇨와 단백뇨가 있었으나 이외에 다른 증상이 없어 경과관찰하였다. 최근 소변에 거품이 증가하여 추가검사를 위해 내원하였다부종은. 없었고신장질환, 가족력은 없었다. 환자의 신장은 167cm, 체중 84kg였다혈압은. 155/95였다. 혈액 및 소변 검사 결과는 다음과 같았고신장, 조직검사에서는 아래와 같은 소견을 보였다. U/A with microscopy: SG 1.004, pH 5.5, Alb 1+, Blood 2+, RBC 5-9/HPF, DRBC 75%, uPCR 2.78g/g, uACR 2.18g/g, Cr 0.9mg/dl, eGFR74.9ml/min/1.72m2 Blood: Total ch./HDLc/LDLc/TG 280/40/147/350, HBV/HCV/HIV:all neg. IgG/A/M 873/91/156mg/dL, C3/C4 163/31mg/dL, ASO/RAF: all neg, FANA/Cryoglobulin/ANCA/PEP/Light chain: all neg 다음 중 적절한 치료가 아닌 것은?", "stem_table": null, "options": ["혈압 조절", "체중감량", "이상지질혈증 조절", "고용량 스테로이드 치료", "레닌안지오텐신- 시스템 억제제 사용"], "answer": [], "image": "kid_img/kid_419.jpeg", "images": [], "id_simple": "2020-Q54", "note": "원본 표기: 2?"}, {"id": "kid-2025-L15-Q3", "year": 2025, "qnum": "3", "jokbo_lec_no": "23", "lecture": "소아의 특성사구체질환 , 17~19 유전성 신질환" 물 복용 중이다. 가족 중 아내(44세, B형, 특이 병력 없음) 와 딸(16세, O형, 특이 병력 없음이) 신장 공여 의사를 밝 혔다. 다음 중 이 환자의 치료 계획에 대한 설명으로 가장 적절한 것은?", "stem_table": null, "options": ["상대적으로 젊은 나이로 판단되어 잠재적 기증자가 있 더라도 이식은 하지 않고 장기적으로 투석을 유지할 것을 권고한다.", "혈액형이 일치하고 가장 기저 질환이 적을 것으로 생각 되는 16세 딸과의 신장이식을 진행한다.", "혈액형을 고려하였을 때 부인과 이식 수술을 한다면 탈 감작 치료의 필요성은 고려하지 않아도 된다.", "가능하다면 신장이식을 우선적으로 고려하며 부인과의 교차반응 검사를 진행하고 이식 진행 여부를 판단할 수 있 다.", "환자의 고혈압은 이식 수술의 절대적 금기증이므로 어 떠한 종류의 신장이식도 고려할 수 없다."], "answer": [], "image": null, "images": [], "id_simple": "2025-Q55", "note": "원본 표기: 5(답 잘못된 것으로 추정되나 이의제기 받지 않음)"}, {"id": "kid-2023-L16-Q14", "year": 2023, "qnum": "14", "jokbo_lec_no": "20", "lecture": "만성 콩팥병 병인진단 I: ( ) 20~22 만성 콩팥병 치료 II: 신대체 요법", "professor": "김연수·김용철·이정표", "curr_lec_no": "20", "curr_lecture": "만성콩팥병 I : 진단과 보존적 치료 외 2강", "stem": "40세에 고혈압으로 진단받고 항고혈압 약제를 불규칙하게 복용해 오던 48세 남자 환자가 최근 건강검진에서 단백뇨가 발견되었다이. 환자는 추가 검사를 권유받고 3개월 후에 종합병원을 방문하여 검사를 시행하였다그. 결과는 다음과 같다. 1) 건강검진 결과 (2023년 1월) 혈압 146/95 mmHg, BUN/Cr 23/1.0 mg/dL, U/A alb 2+ RBC <1/HPF 2) 3개월 후 종합병원 방문 시 검사 결과 (2023년 4월) 체중 60kg, 혈압 140/90 mmHg, BUN/Cr 22/1.12 mg/dL, CKD-EPI (cr) eGFR 81 ml/min/1.73m2 U/A alb 2+ RBC <1/HPF, random urine alb/cr ratio 120 mg/g Cr 다음 중 이 환자에 대한 설명 중 옳은 것은?", "stem_table": null, "options": ["사구체여과율이 60ml/min 이상이므로 만성콩팥병의 기준에 해당되지 않는다.", "이 환자에서 6개월 이상 지속되는 단백뇨가 입증되어야 만성콩팥병을 진단할 수 있다.", "이 환자의 만성콩팥병 병기는 사구체 여과율 기준으로 G1에 해당된다.", "이 환자의 알부민뇨의 정도는 A2에 해당된다.", "만성콩팥병의 예후는 단백뇨와는 무관하며 사구체여과율에 의해 결정된다."], "answer": [4], "image": null, "images": [], "id_simple": "2023-Q14"}, {"id": "kid-2023-L16-Q1", "year": 2023, "qnum": "1", "jokbo_lec_no": "20", "lecture": "만성 콩팥병 병인진단 I: ( ) 20~22 만성 콩팥병 치료 II: 신대체 요법", "professor": "김연수·김용철·이정표", "curr_lec_no": "20", "curr_lecture": "만성콩팥병 I : 진단과 보존적 치료 외 2강", "stem": "4기 만성콩팥병 환자에서 예상되는 칼슘인/ 대사관련 지표 중에서 감소할 것으로 기대되는 것을 고르시오", "stem_table": null, "options": ["PTH", "1,25 (OH)2 vitamin D3", "FGF-23", "Body phosphate load", "Bone buffering capacity of calcium-phosphate apatite"], "answer": , "options": ["dialysis disequilibrium syndrome", "dialysis dementia", "stroke", "hyperkalemia", "aluminum intoxication"], "answer": [1], "image": null, "images": [], "id_simple": "2022-Q82"}, {"id": "kid-2021-L16-Q6", "year": 2021, "qnum": "6", "jokbo_lec_no": "20", "lecture": "만성 콩팥병 병인진단 I: ( ) 20~22 만성 콩팥병 치료 II: 신대체 요법", "professor": "김연수·김용철·이정표", "curr_lec_no": "20", "curr_lecture": "만성콩팥병 I : 진단과 보존적 치료 외 2강", "stem": "10년 전 당뇨병과 고혈압으로 진단받고 치료 중이던 57세 남자 환자가 건강 검진에서 단백뇨가 발견되었다. 환자는 3개월 후 종합병 원을 방문항 혈액가 소변 검사를 시행하여 다음과 같은 결과가 나타 났다이. 환자에 대한 설명 중 옳은 것은 무엇인가? 혈압 145/91mmHg, BUN/Cr 23/1.1mg/dl, eGFR 65ml/min, U/A alb 1+ Random urin albumin/cr ratio 100mg/g Cr", "stem_table": null, "options": ["사구체 여과율이 60mg/min 이상이므로 만성콩팥병의 기준에 해 당되지 않는다.", "이 환자에서 1년 이상 지속되는 단백뇨가 입증되어야 만성콩팥병 을 진단할 수 있다.", "이 환자의 만성콩팥병 병기는 사구체여과율 기준으로 GⅡ에 해당 한다.", "이 환자의 알부민뇨의 정도는 A3에 해당한다.", "만성콩팥병의 예후는 단백뇨와는 무관하며 사구체여과율에 의해 결정된다."], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q6"}, {"id": "kid-2021-L16-Q7", "year": 2021, "qnum": "7", "jokbo_lec_no": "20", "lecture": "만성 콩팥병 병인진단 I: ( ) 20~22 만성 콩팥병 치료 II: 신대체 요법", "professor": "김연수·김용철·이정표", "curr_lec_no": "20", "curr_lecture": "만성콩팥병 I : 진단과 보존적 치료 외 2강", "stem": "우리나라의 만성콩팥병의 원인 질환으로 가장 흔한 원인은 무엇인 가?", "stem_table": null, "options": ["당뇨병", "고혈압", "사구체신염", "약물성 신손상", "상염색체우성 다낭심"], "answer": [1], "image": null, "images": [], "id_simple": "2021-Q7"}, {"id": "kid-2021-L16-Q36", "year": 2021, "qnum": "36", "jokbo_lec_no": "20", "lecture": "만성 콩팥병 병인진단 I: ( ) 20~22 만성 콩팥병 치료 II: 신대체 요법", "professor": "김연수·김용철·이정표", "curr_lec_no": "20", "curr_lecture": "만성콩팥병 I : 진단과 보존적 치료 외 2강", "stem": "57세 여자가 호흡곤란과 부종으로 왔다. 8년 전 고혈압과 당뇨 병 진단 받았으며, 1년 전 급성심근경색 진단 후 관상동맥 우회술을 시행받고 투약 치료 중이다. 혈압 160/98mmHg, 맥박수 78/min이 었으며 양측 하지에 오목부종이 있었다. 검사결과는 아래와 같았다. 치료는? 혈액: Hb 13.5g/dL, WBC 13800/mm3, platelet 410000/mm3 Na/K/Cl 129/4.9/98 meq/L, BUN 56mg/dL, Cr 1.9mg/dL 소변: Na 10.0meq/L, Creatinine 70 mg/dL", "stem_table": null, "options": ["혈액투석", "l  요폐(urinary retention) 증상을 보이지만, 요실금 없이 소변은 잘 저장 되었다. 이 환자의 상태와 치료에 대한 설명으로 가장 옳 은 것은?", "stem_table": null, "options": ["교감신경 경로가 손상되어 저장 반사가 억제되고, 배뇨 반사는 정상적으로 일어난다.", "부교감신경 경로가 손상되어 배뇨근 수축이 일어나지 않으며, 치료를 위해 배뇨근을 이완시키는 항콜린성 약물 을 사용해야 한다.", "교감신경의 과도한 활성으로 요도 괄약근이 이완되어 요폐가 발생하므로, a-아드레날린 차단제를 사용해야 한 다.", "부교감신경의 배뇨 반사는 차단되었으나 교감신경의 저 장 반사는 유지되는 상태로, 치료를 위해 배뇨근 수축을 유도하는 치료를 고려할 수 있다.", "방광의 C-fiber afferent가 과활성되어 배뇨가 억제된 상태이므로, 캡사이신을 주입하여 감각 신경을 차단해야 한다."], "answer": [4], "image": null, "images": [], "id_simple": "2025-Q56"}, {"id": "kid-2025-L20-Q57", "year": 2025, "qnum": "57", "jokbo_lec_no": "26", "lecture": "26 요의 배설기전", "professor": "정승환", "curr_lec_no": "26", "curr_lecture": "요의 배설기전", "stem": "만성 방광염을 앓고 있는 환자가 적은 양의 소변에도 참을 수 없는 요의(urinary urgency)와 빈뇨 증상을 호소 하고 있다. 방광 기능 검사상, 방광 용적이 작아져 있고 낮 은 압력에서도 강한 배뇨감을 느꼈다. 이 환자의 증상을 유발하는 가장 핵심적인 병태생리학적 기전으로 옳은 것 은?", "stem_table": null, "options": ["방광벽의 콜라겐이 증가하여 방광 순응도가 물리적으로 감소했기 때문이다.", "방광 팽창을 감지하는 정상적인 A-delta 구심성 신경 의 반응 역치(threshold)가 비정상적으로 높아졌기 때문이 다.", "배뇨근을 수축시키는 부교감신경의 원심성 신호가 명확 한 원인 없이 과도하게 방출되기 때문이다.", "방광저장기능을 담당하는 교감신경의 원심성 신호가 저 하 되었기 때문이다.", "염증으로 인해 평소 비활성이던 C-fiber 구심성 신경이 활성화되어, 낮은 방광 압력에도 과민하게 반응하여 중추 신경계에 강한 요의 신호를 보내기 때문이다."], "answer": [5], "image": null, "images": [], "id_simple": "2025-Q57"}, {"id": "kid-2023-L20-Q32", "year": 2023, "qnum": "32", "jokbo_lec_no": "26", "lecture": "26 요의 배설기전", "professor": "정승환", "curr_lec_no": "26", "curr_lecture": "요의 배설기전", "stem": "중년 이상의 여성에서 흔히 발생하는 복압요실금은 다음 중 어떤 구조물의 약화에 의하여 주로 발생하는가?", "stem_table": null, "options": ["방광경부", "골반저근", "원위 횡문조임근", "근위 평활조임근", "외인성 횡문조임근"], "answer": [2], "image": null, "images": [], "id_simple": "2023-Q32"}, {"id": "kid-2023-L20-Q67", "year": 2023, "qnum": "67", "jokbo_lec_no": "26", "lecture": "26 요의 배설기전", "professor": "정승환", "curr_lec_no": "26", "curr_lecture": "요의 배설기전", "stem": "다음 중 방광의 배출기 때 관여하는 반사현상은?", "stem_table": null, "options": ["외요도 조임근 수축", "교감신경 원심로 억제", "부교감 원심로 활성 정지", "배뇨근 이완", "내요도조임근 수축"], "a  완충 부족"], "answer": [4], "image": "kid_img/kid_484.jpeg", "images": [], "id_simple": "2019-Q39"}, {"id": "kid-2018-L21-Q52", "year": 2018, "qnum": "52", "jokbo_lec_no": "27", "lecture": "27 요석과 폐쇄성 요로질환", "professor": "이정훈", "curr_lec_no": "27", "curr_lecture": "요석과 폐쇄성 요로질환", "stem": "68 세 남자가 소변 세기가 약한 증상이 있어 비뇨기과의원을 방문하였다가 전립선특이항원이 많이 증가하였다는 이야기를 들었다. 근처 종합병원으로 전원되어 전립선조직검사를 시행 받았으며 결과를 기다리는 도중 핍뇨와 전신부종을 주소로 비뇨기과 외래를 다시 방문하였다응급으로. 시행한 검사에서 혈청 크레아티닌이 16.2mg/dL(참고치 0.7-1.4mg/dL), 칼륨이 7.3mmol/L(참고치 3.5-5.5 mmol/L)로 비정상적인 소견을 보였으며비조영증강, 컴퓨터단층촬영그림( 참조컴퓨터) 단층촬영에서 양측의 수신증수뇨관증, , 골반 및 복부 임파선 전이골반뼈, 전이가 있는 소견을 보였다이. 환자에서 혈청 크레아티닌이 매우 상승한 중한 신손상이 발생하였는데 위험 인자로 가장 크게 작용한 것은?", "stem_table": null, "options": ["고령", "요로감염", "장기간 폐쇄", "양측성 완전 폐쇄", "요관에서의 완충 부족"], "answer": [4], "image": null, "images": [], "id_simple": "2018-Q52"}, {"id": "kid-2018-L21-Q69", "year": 2018, "qnum": "69", "jokbo_lec_no": "27", "lecture": "27 요석과 폐쇄성 요로질환", "professor": "이정훈", "curr_lec_no": "27", "curr_lecture": "요석과 폐쇄성 요로질환", "stem": "폐쇄성 요로병증에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["통증은 속도보다 크기와 관련이 있다", "결석 제거나 신우성형술 등 확정적 치료가 가장 중요하다", "무증상인 경우 경과 관찰만 해도 된다", "경피적 신루술이나 요관부목 등의 요로전환술을 가장 우선적으로 시행한다.", "폐쇄성 요로병증을 진단하기 위한 검사로 CT가 Gold standard로 여겨지며 이를 통해 신기능에 대한 정보를 얻을 수 있다."], "answer": [2], "image": null, "images": [], "id_simple": "2018-Q69"}, {"id": "kid-2018-L21-Q74", "year": 2018, "qnum": "74", "jokbo_lec_no": "27", "lecture": "27 요석과 폐쇄성 요로질환", "professor": "이정훈", "curr_lec_no": "27", "curr_lecture": "요석과 폐쇄성 요로질환", "stem": "요로결석 발생에 대하여 옳은 것은?", "stem_table": null, "options": ["연령대가 증가할수록 유병률도 증가한다.", "스트루바이트석은 감염과의 관련성이 높으며 마그네슘과 암모늄 등의 성분이 많아 남성에게서 호발한다.", "실제 소변은 다양한 물질이 섞여 있어 이질성 핵화(heterogenous nucleation)가 일어난다.", "소변의 알칼리화가 주된 원인이다.", "칼슘성분 요로결석은 칼슘섭취를 최대한 줄이면 결석의 생성을 줄일 수 있다."], "answer": [3], "image": null, "images": [], "id_simple": "2018-Q74"}, {"id": "kid-2018-L21-Q89", "year": 2018, "qnum": "89", "jokbo_lec_no": "27", "lecture": "27 요석과 폐쇄성 요로질환", "professor": " L22-Q52", "year": 2025, "qnum": "52", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암(renal cell carcinoma)에 대한 다음 설명 중 가장 옳은 것은?", "stem_table": null, "options": ["신세포암(renal cell carcinoma)는 림프관성 전이가 혈 행성 전이보다 흔하다.", "유전성 신세포암 증후군(hereditary renal cell carcinoma syndrome)에서 생기는 신세포암은 주로 unilateral, single lesion이며 노인에게 발병률이 높다.", "투명세포 신세포암(clear cell renal cell carcinoma)의 약 20%에서 VHL 유전자의 변이 또는 소실이 관찰된다.", "투명세포 신세포암(clear cell renal cell carcinoma)은 뚜렷한 세포막, 핵 주변의 halo, 핵의 irregularity가 특징적 이다.", "Fumarate hydratase deficient renal cell carcinoma는 다양한 형태의 조직학적 소견을 보일 수 있으며 환자의 예 후가 일반적인 신세포암보다 좋지 않다."], "answer": [5], "image": null, "images": [], "id_simple": "2025-Q52"}, {"id": "kid-2025-L22-Q53", "year": 2025, "qnum": "53", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "55세의 남성이 오른쪽 신장에 종양이 발생하여 수술을 받았다. 현미경 관찰시 아래 사진과 같은 모습을 보였으며 유전자 검사에서는 VHL 또는 Fumarate hydratase의 유전 자 변이는 관찰되지 않았으며 TEF3를 포함한 그 어떠한 유전자의 전위 (translocation)도 발견되지 않았다. 다음 중 가장 가능성이 높은 진단명은?", "stem_table": null, "options": ["투명세포 신세포암(clear cell renal cell carcinoma)", "유두모양신세포암(papillary renal cell carcinoma)", "혐색소신세포암(chromophobe cell renal cell carcinoma)", "집합관암종(collecting duct carcinoma)", "호산과립세포종(oncocytoma)"], "answer": [2], "image": "kid_img/kid_491.jpeg", "images": [], "id_simple": "2025-Q53"}, {"id": "kid-2023-L22-Q39", "year": 2023, "qnum": "39", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암(renal cell carcinoma) 혹은 신장의 낭성 질환의 유전학적 이상에 대한 설명 중 가장 옳은 것은?", "stem_table": null, "options": ["VHL 유전자는 proto-oncogene으로 작용하며, mutation에 의해 세포 증식 신호가 활성화되어 신세포암의 종양화가 유도된다.", "MET 유전자 loss에 의해 hypoxia-inducible factor (HIF)의 degradation이 감소되어 신세포암 종양화가 유도된다.", "유두모양신세포암(papillary type renal cell carcinoma)은 trisomies 7, 17 및 loss of Y와 연관된다.", "성인형다낭신(adult polycystic kidney disease)는 autosomal recessive로 유전되며 주로 MCKD1, MCKD2 유전자의 이상에 의해 생긴다.", "소아형다낭신(childhood polycystic kidney disease)는 autosomal dominant로 유전되며 주로 NPH1 유전자의 이상에 의해 생긴다."], "answer": [3], "image": null, "images": [], "id_simple": "2023-Q39"}, {"id": "kid-2023-L22-Q68", "year": 2023, "qnum": "68", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신장에 발생하는 종양성 질환의 병리학적 특성에 대한 설명으로 가장 옳은 것은?", "stem_table": null, "options": ["신세포암(renal cell carcinoma)는 림프관성전이가 혈행성전이보 다 흔하다.", "호산과립세포종(oncocytoma)의 25-50%에서 tuberous sclerosis와 연관된다.", "혈관근지방종(angiomyolipoma)은 HMB45 염색에 양성 소견을 보인다..", "혐색소신세포암(chromophobe tyoe renal cell carcinoma)는 TFE3 혹은 TFEB 유전자의 전위가 관찰된다", "투명세포 신세포암(clear cell type renal cell carcinoma)의 98%에서 MET 유전자의 loss가 관찰된다."], "answer": [3], "image": null, "images": [], "id_simple": "2023-Q68"}, {"id": "kid-2023-L22-Q73", "year": 2023, "qnum": "73", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암(renal cell carcinoma)에 대한 다음 설명 중 가장 옳 은 것은?", "stem_table": null, "options": ["집합관엄종(collecting duct carcinoma)은 육안성 경계가 좋은 균질한 종괴이며 신세포암의 유형들 중 예후가 좋다.", "유두모양신세포암(papillary type renal cell carcinoma)은 형태 학적으로 악성도가 높은 종양세포가 gland를 만들면서 fibrotic stroma에 침윤하는 양상을 보인다.", "유전성 신세포암(heredity renal cell carcinoma syndrome) 증 후군에서 생기는 신세포암은 주로 unilateral, single lesion이다", "유전성 신세포암에서 밝혀진 종양화 기전은 일반적인 산발성 신세 포암의 종양화 기전과는 무관하다.", "혐색소신세포암(chromophobe type renal cell carcinoma)은 뚜렷한 세포막, 핵 주변의 halo, 핵의 irregularity가 특징적이다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q73"}, {"id": "kid-2022-L22-Q66", "year": 2022, "qnum": "66", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신장에 발생하는 종양 혹은 낭성 질환에 대한 설명으로 가장 옳은 것은?", "stem_table": null, "options": ["신세포암(renal cell carcinoma)는 림프관성전이가 혈행성전이보 다 흔하다.", "집합관암종(collecting duct carcinoma)의 25-50%에서 tuberous sclerosis와 연관된다.", "혐색소신세포암종(chromophobe renal cell carcinoma)은 핵이 동그랗고 규칙적이며 예후가 나쁜 유형이다.", "호산과립세포종(oncocytoma)는 전자현미경 상에서 세포질내에 다량의 미토콘드리아가 관찰되는 점이 특징적이다.", "성인형다낭신(adult kidcey disease)는 autosomal recessice 로 유전되며 85%에서 PKD1 유전자의 이상에 의해 생긴다."], "answer": [4], "image": null, "images": [], "id_simple": "2022-Q66"}, {"id": "kid-2022-L22-Q67", "year": 2022, "qnum": "67", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암(renal cell carcinoma)의 유전적, 병리학적 특성에 대 한 설명으로 가장 옳은 것은?", "stem_table": null, "options": ["집합관암종(collecting duct carcinoma)은 육안상 경계가 좋은 균질한 종괴이며 예후가 좋다.", "유두모양(paillary type) 신세포암은 trismies 7, 17, loss of Y, MET 유전자 이상과 연관된다.", "Hereditary renal cell carcinoma syndrome에서 생기는 신세 포암은 주로 unilateral, single lesion이다.", "Hereditary renal cell carcinoma syndrome에서 밝혀진 종양 화기전은 일반적인 산발성(sporadic) 신세포암의 종양화 기전과 는 무관하다.", "Multiocular crystic renal neoplasm of low malignant potential은 투명세포(clear cell)로 이루어진 군집이 팽창형 성장 (expansile growth)을 하는 것이 특징적이다."], "answer": [2], "image": null, "images": [], "id_simple": "2022-Q67"}, {"id": "kid-2021-L22-Q59", "year": 2021, "qnum": "59", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신장에 발생하는 종양 혹은 낭성 질환에 대한 설명으로 가장 옳 은 것은?", "stem_table": null, "options": ["신유두샘종(renal papillary adenoma)은 저등급의 핵과 유두형 (papillary) 구조를 가지므로크기에, 무관하게 진단할 수 있다.", "소아형다낭신(childhood polycystic kidney disease)는 autosomal dominant로 유전되며 주로 NPH1 유전자의 이상에 의 해 생긴다.", "MiT family translocation renal cell carcinoma는 25-50%에 서 tuberous sclerosis와 연관된다.", "신세포암(renal cell carcinoma)는 혈행성전이가 림프관성전이보 다 흔하다.", "투명세포형 신세포암은 육안소견상 갈색(tan or mahogany brown)이며 약 1/3에서 중심부 scar를 가진다."], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q59"}, {"id": "kid-2021-L22-Q60", "year": 2021, "qnum": "60", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암(renal cell carcinoma)의 유전적, 병리학적 특성에 대 한 설명으로 가장 옳은 것은?", "stem_table": null, "options": ["투명세포형(clear cell type) 신세포암은 Trisomies 7, 17 및 loss of Y와 연관된다.", "Von Hippel-Lindau 증후군에서 생기는 신세포암은 unilateral, single lesion이다.", "유두모양 신세포암(papillary renal cell carcinoma)은 MET 유전 자의 이상과 관련이 있다.", "집합관형(collecting duct) 신세포암은 육안상 경계가 좋은 균질한 종괴이며 예후가 좋다.", "유전성 신세포암(hereditary renal cell carcinoma)에서 밝혀진 종양화 기전은 일반적인 산발성 신세포암의 종양화 기전과는 무관하다."], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q60"}, {"id": "kid-2020-L22-Q50", "year": 2020, "qnum": "50", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신장에 발생하는 신종양 또는 낭성질환에 대한 설명으로 가장 옳은 것은?", "stem_table": null, "options": ["성인형다낭신(adult polycystic kidney disease)는 AR로 유전되며, PKHD1 유전자 이상에 의해 발생한다.", "혐색소신세포암종(chromophobe renal cell carcinoma)는 투명세포형 신세포암종(clear cell carcinoma)에 비해 나쁜 예후를 보인다.", "신세포암(renal cell carcinoma)의 핵 등급(nuclear grade)은 grade 4가 가장 나쁜 예후를 보이며, sarcomatoid 혹은 rhabdoid differentiation을 보일 경우 grade 4로 분류된다.", "호산과립세포종(oncocytoma)은 미토콘드리아가 많고 풍부한 호산성 세포질을 가지는 세포로 이루어진 종양으로육안적으로, 경계가 좋은 종괴를 만들지만 전이를 일으킬 수 있으므로 악성종양으로 분류된다.", "투명세포형 신세포암종(clear cell renal carcinoma)은 투명한 종양세포들이 유두모양으로 성장을 하는 모습이 특징적인 소견이다."], "answer": [3], "image": null, "images": [], "id_simple": "2020-Q50"}, {"id": "kid-2020-L22-Q51", "year": 2020, "qnum": "51", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암(renal cell carcinoma)의 유전적 이상에 대한 설명으로 가장 옳은 것은?", "stem_table": null, "options": ["유전성 신세포암(hereditary renal cell carcinoma)은 산발성 신세포암(sporadic renal cell carcinoma)보다 발생빈도가 높다.", "투명세포형 신세포암(clear cell renal cell carcinoma)은 주로 VHL유전자 이상과 관련이 있다.", "집합관형 신세포암(Collecting ductal renal cell carcinoma)은 7번 염색체에 위치한 TFEB유전자의 이상에 의해 발생한다.", "유두모양 신세포암(papillary renal cell carcinoma)은 X염색체에 위치한 MET 유전자의 결실(Deletion)에 의해 주로 발생한다.", "Von Hipple-Lindau syndrome에서 생기는 신세포암은 대부분 단발성이며다른, 부위의 종양이 동반되는 경우는 드물다."], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q51"}, {"id": "kid-2020-L22-Q62", "year": 2020, "qnum": "62", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "68세 여자 환자의 신장종양 현미경소견이다. 본 질환에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["신세포암 중 가장 흔하다.", "MET의 activation mutation에 의해 발생한다.", "Hale’s colloidal iron 염색에 양성이다.", "육안상 밝은 노란색으로 보인다.", "면역조직화학염색에서 HMB45 양성이다."], "answer": [2], "image": "kid_img/kid_495.jpeg", "images": [], "id_simple": "2020-Q62"}, {"id": "kid-2020-L22-Q63", "year": 2020, "qnum": "63", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "73세 남성의 우측 신장 종괴 병리사진이다해당. 신장 종괴에 대한 설명 중 옳은 것은?", "stem_table": null, "options": ["신세포 암종 중 예후가 가장 좋다.", "세포질 내 지방이 있어 현미경으로 봤을 때 세포질이 투명해보인다.", "아주 드물고 (<1%), 예후가 나쁘다.", "TFE3 면역조직화학염색법이나, FISH로 TFE3 유전자의 translocation으로 확진한다.", "multifocal하게 발생한다."], "answer": [3], "image": "kid_img/kid_499.jpeg", "images": [], "id_simple": "2020-Q63"}, {"id": "kid-2018-L22-Q42", "year": 2018, "qnum": "42", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신장에 발생하는 종양에 대한 설명으로 가장 절절한 것은?", "stem_table": null, "options": ["Sporadic RCC 중 가장 흔한 유형은 collecting duct type 이다.", "Oncocytoma는 eosinophilic한 세포로 이루어져 있으며 세포질내에 미토콘드리아가 풍부한 양성종양이다.", "ccRCC에서 rhabdoid differentiation이 있을 때그렇지, 않은 경우보다 예후가 좋다", "Papillary type RCC는 핵주변으로 halo를 보이는 것이 특징적이다.", "AML은 perivascular epithelioid cell 기원으로 생각되며, HMB45 면역염색음성이 특징이다."], "answer": [2], "image": null, "images": [], "id_simple": "2018-Q42"}, {"id": "kid-2018-L22-Q78", "year": 2018, "qnum": "78", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "병리 사진 보여주고 옳은 거 고르기 1) 세포막이 뚜렷하지 않아서 ~ 2) perinuclear halo가 있고 핵이 irregular함. 3) basophilic 염색됨.", "stem_table": null, "options": [], "answer": [2], "image": null, "images": ["kid_img/kid_500.jpeg", "kid_img/kidq_L22-2018-Q78-0.png"], "id_simple": "2018-Q78", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2018-L22-Q80", "year": 2018, "qnum": "80", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "Gross 사진을 주고 옳은 것 고르기 1) 밝은 노란색으로 보이는 건 지방이 풍부하기 때문 2) 세포질이 적다. 3) 경계가 불분명하고 종괴와 정상실질의 구분이 어렵다.", "stem_table": null, "options": [], "answer": [1], "image": null, "images": ["kid_img/kid_501.jpeg", "kid_img/kidq_L22-2018-Q80-0.png"], "id_simple": "2018-Q80", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2018-L22-Q81", "year": 2018, "qnum": "81", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "병리소견 주고 옳은 것 고르기 1) VHL loss가 주된 유전자이상 2) distal cell tubule 기원 종양이다.", "stem_table": null, "options": [], "answer": [1], "image": null, "images": ["kid_img/kid_502.jpeg", "kid_img/kidq_L22-2018-Q81-0.png"], "id_simple": "2018-Q81", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2015-L22-Q31", "year": 2015, "qnum": "31", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신장에 발생한 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["호산과립세포종(oncocytoma)는 결절성경화증(tuberoussclerosis) 환자에서 잘 동반되는 신장종양이다.", "혈관근지방종(angiomyolipoma)는 갑자기 출혈을 일으킬 수 있으며면역조직화학염색상, TFE3 염색에서 양성을 보이는 것으로 쉽게 진단할 수 있다.", "신세포암(renal cell carcinoma)은 혈뇨나 늑골척추부의 통증과 같은 증상을 보이며 림프절전이가 조기에 관찰된다.", "Chromophobe type 신세포암(renal cell carcinoma)는 현미경적으로 perinuclear halo가 보이는 것이 특징이며 집합관(collecting duct) 기원이다.", "요로상피암(urothelial carcinoma)은 임상적으로 혈뇨, 옆구리 통증 등으로 조기발견되어 예후가 좋은 편이다."], "answer": [4], "image": null, "images": [], "id_simple": "2015-Q31"}, {"id": "kid-2015-L22-Q32", "year": 2015, "qnum": "32", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암에 대한 설명으로 옳지 않은 것은?", "stem_table": null, "options": ["Xp11.2 유전자전위(translocation)에 의한 신세포암은 비교적 젊은 환자에서 발생한다.", "Trisomy 17은 sporadic하게 발생한 papillary type 신세포암에서 관찰된다.", "Hereditay papillary renal cell carcinoma는 FH gene과 관련되어 있다.", "유전성(hereditary) 신세포암은 산발성(sporadic) 신세포암에 비해 양측성다발성으로, 생기는 경향이 있다.", "Chromosome 3의 결손(deletion)은 clear cell type의 신세포암을 유발한다."], "answer": [3], "image": null, "images": [], "id_simple": "2015-Q32"}, {"id": "kid-2015-L22-Q63", "year": 2015, "qnum": "63", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암의 아형 중 clear cell type과 papillary type을 일으키는 유전자 이상(genetic abnormality)를 각각 한가지씩 쓰시오.", "stem_table": null, "options": [], "answer": [], "image": "kid_img/kidq_L22-2015-Q63-0.png", "images": [], "id_simple": "2015-Q63", "note": "원본 정답키에 없음 / 원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2014-L22-Q47", "year": 2014, "qnum": "47", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암종(renal cell carcinoma)에 대한 다음 설명 중 옳지 않은 것을 고르시오.", "stem_table": null, "options": ["투석으로 인한 낭성 신질환을 가진 환자에서 발생확률이 높다.", "혈뇨와 flank pain 등으로 조기발견이 쉬워, 5년 생존율이 70%에 달한다.", "흔히 전이하는 장기로는 폐와 뼈가 있다.", "Papillary type의 신세포암종은 distal convoluted tubule 기원이다.", "Xp11 translocation carcinoma는 젊은 사람에게 발생하며, TFE3의 과발현을 보인다."], "answer": [2], "image": null, "images": [], "id_simple": "2014-Q47"}, {"id": "kid-2014-L22-Q48", "year": 2014, "qnum": "48", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신세포암종(renal cell carcinoma)을 일으키는 유전자 이상과 신세포암종의 아형 (subtype)을 연결한 것으로 옳은 것은?", "stem_table": null, "options": ["Hypermethylation of VHL - hereditary papillary carcinoma", "Inactivated, mutated MET - sporadic papillary carcinoma", "Trisomy 7 - sporadic clear carcinoma", "Inactivated, mutated VHL - hereditary clear cell carcinoma", "Mutation of FH gene - medullary carcinoma"], "answer": [4], "image": null, "images": [], "id_simple": "2014-Q48"}, {"id": "kid-2014-L22-Q49", "year": 2014, "qnum": "49", "jokbo_lec_no": "28", "lecture": "28 신종양", "professor": "이규상", "curr_lec_no": "28", "curr_lecture": "신종양", "stem": "신장에 발생한 종양에 대한 설명 중 옳은 것은", "stem_table": null, "options": ["혈관근지방종(angiomyolipoma)은 von Hippel-Lindau syndrome 환자에서 주로 발생한 다.", "Clear cell type은 신세포암종(renal cell carcinoma) 중에서 가장 흔하고 예후도 가장 좋 다.", "Chromophobe type은 신세포암종(renal cell carcinoma) 중에서 두 번째로 흔하다.", "요로상피암종(urothelial carcinoma)은 신우(renal pelvis), 방광이나 요관 등에 다발성으 로 발견되는 경우가 흔하다.", "신우(renal pelvis)에 발생한 요로상피암종(urothelial carcinoma)은 혈뇨 등의 증상으로 조기발견이 쉬워 예후가 매우 좋다."], "answer": [4], "image": null, "images": [], "id_simple": "2014-Q49"}, {"id": "kid-2025-L23-Q85", "year": 2025, "qnum": "85", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "요로상피종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["요로상피내암종 (carcinoma in situ, CIS)는 쉽게 소변 으로 배출되고, 방광점막에는 소수의 CIS 세포만이 매달린 모양(clining)으로 관찰되기 쉽다.", "근육침범방광암은 전체 방광암의 약 70-80%를 차지하 고, 보통 주변에 CIS 혹은 고등급유두모양요로상피암종 (noninvasive papillary urothelial carcinoma, high-grade) 가 동반되어 있다.", "저등급유두모양요로상피암종(Noninvasive papillary urothelial carcinoma, low-grade)는 papillae의 fusion, branching등이 흔히 관찰되며 cellular pleomorphism이 심 하다.", "p53의 돌연변이는 주로 papillary urothelial neoplasia 의 발생에 기여한다.", "Papillary urothelial neoplasm은 약 20% 정도가 재발 하고, 70-80% 정도는 진행한다."], "answer": [1], "image": null, "images": [], "id_simple": "2025-Q85"}, {"id": "kid-2025-L23-Q86", "year": 2025, "qnum": "86", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "다음과 같은 현미경소견을 보이는 병변을 무엇이라 하 는가?", "stem_table": null, "options": ["Urothelial papilloma", "Inverted papilloma", "Papillary urothelial neoplasm of low malignant potential", "Noninvasive papillary urothelial carcinoma, low-grade", "Invasive urothelial carcinoma"], "answer": [2], "image": null, "images": ["kid_img/kid_509.jpeg", "kid_img/kid_510.jpeg"], "id_simple": "2025-Q86"}, {"id": "kid-2023-L23-Q69", "year": 2023, "qnum": "69", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "요로상피암종의 발병기전에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["방광암의 7-80%는 dysplasia/CIS를 거쳐 침윤성 종양으로 발생 한다.", "침윤요로상피암종에서 FGFR3의 돌연변이는 주로 basal-squamous subtype에서 관찰된다.", "유두상 요로상피암종(papillary urothelial neoplasm)의 70% 정 도는 재발을반복하다 약 20% 정도에서 침윤성암종으로 진행한다.", "RAS 돌연변이는 요로상피내암종(urothelial carcinoma in situ) 에서 침윤성암종으로의 진행에 기여한다.", "RB의 돌연변이는 저등급 유두상 요로상피암종에서 관찰된다."], "answer": [5], "image": null, "images": [], "id_simple": "2023-Q69"}, {"id": "kid-2022-L23-Q83", "year": 2022, "qnum": "83", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "방광암에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["방광암은 개발도상국에서 선진국보다 많이 발생한다.", "진통제의 장기복용 혹은 흡연도 방광암을 유발할 수 있다.", "방광암의 90%는 유두상모양으로 발생하며이중, 70%는 치료 후 재발한다.", "방광에서 발생한 상피내암종(carcinoma in situ)은 다발성으로 발생하고 치료하지 않으면 약 20-30%에서 침윤성암종으로 발전 한다.", "방광암이 전립선실질을 요도(urethra)를 통해 침윤한 경우는 예 휴가 나빠 pathologic staging이 pT4이다."], "answer": [2], "image": null, "images": [], "id_simple": "2022-Q83"}, {"id": "kid-2022-L23-Q84", "year": 2022, "qnum": "84", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "요로상피암종의 유전적병리학적, 특성에 대한 설명으로 옳은 것 은?", "stem_table": null, "options": ["RB의 돌연변이는 유두상 요로상피암종(Papillary urothelial neoplasm)의 발생에 기여한다.", "FGFR3의 돌연변이는 요로상피내암종 (urothelial carcinoma in situ)의 발생에 관여한다.", "유두상 요로상피암종(Papillary urothelial neoplasm)의 70% 정도는 재발을 반복하다 약 20% 정도에서 침윤성암종으로 진 행한다.", "RAS의 돌연변이는 요로 상피내암종 (urothelial carcinoma in situ)에서 침윤성암종으로 진행에 기여한다.", "유두상 요로 상피암종(Papillary urothelial neoplasm)은 cohesiveness가 적어 쉽게 떨어져 나가 urine에서 detection 되기 쉽다."], "answer": [2], "image": null, "images": [], "id_simple": "2022-Q84"}, {"id": "kid-2021-L23-Q61", "year": 2021, "qnum": "61", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "요로상피에서 발생한 종양에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["Schistosomiasis에 의해 발생한 방광암은 adenocarcinoma가 대부분이다.", "Inverted papilloma는 표면은 정상 urothelium으로 덮여 있고, 안쪽으로 anastomosing하면서 자라는 cords나 islands로 ㅇ루어져 있고, cytologic atypia는 거의 보이지 않는다.", "Carcinoma in situ는 전암병변으로 보통 다발성으로 생기고, 반복 적으로 재발하면서 약 20-30%는 침윤성 요로세포암종으로 진행한다.", "Papillary urothelial neoplasm of low malignant potential(PUNLMP)은 papilloma보다 좀 더 두꺼워진 urothelium 과 늘어난 cell density를 보이면서, mitoses가 흔히 관찰되고 urothelium 전층에서 보인다.", "Renal pelvis에서 발생한 urothelial carcinoma는 hematuria나 flank pain 등의 증상을 빨리 보여서 조기발견이 쉬워 예후가 좋다."], "answer": [2], "image": null, "images": [], "id_simple": "2021-Q61"}, {"id": "kid-2021-L23-Q62", "year": 2021, "qnum": "62", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "요로상피암종의 유전적, 병리학적 특성에 대한 설명으로 옳지 않 은것은?", "stem_table": null, "options": ["RB의 돌연변이는 CIS(carcinoma in situ)의 발생에 기여한다.", "FGFR3의 돌연변이는 유두상 요로상피암종(papillary urothelial neoplasm)의 발생에 관여한다.", "RAS의 돌연변이는 침윤성 암종으로 진행하는 데 기여한다.", "요로상피암종의 70-80%는 papillary urothelial neoplasm의 형 태로 나타나며 치료 후 약 70% 정도에서 재발한다.", "CIS(carcinoma in situ)는 cohesiveness가 적어 쉽게 떨어져 나가 urine에서 detection되기 쉽다."], "answer": [3], "image": null, "images": [], "id_simple": "2021-Q62"}, {"id": "kid-2020-L23-Q48", "year": 2020, "qnum": "48", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "방광암에 관련된 설명으로 옳은 것은?", "stem_table": null, "options": ["인도수단, 등의 국가에서는 Schistosomahaematobium 감염에 의해 발병하는 경우가 많으며그, 중 70%는 urothelial carcinoma고, 30%는 squamous cell carcinoma이다.", "RAS 변이에 의해 유두상피암종이 발생한다.", "CIS에 RAS, RB 등의 유전자 변이가 작용한다.", "유두상피암종의 70%는 invasive cancer로 가고치료해도, 20%는 재발한다.", "방광암이 요도를 통해 prostatic stromal invasion을 했을 때의 병기는 pT4이다."], "answer": [2], "image": null, "images": [], "id_simple": "2020-Q48"}, {"id": "kid-2020-L23-Q41", "year": 2020, "qnum": "41", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "환자가 다음 병리소견을 보일 때 진단은?", "stem_table": null, "options": ["urothelial papilloma", "papillary urothelial carcinoma, low grade", "papillary urothelial carcinoma, high grade", "Inverted papilloma", "Invasive urothelial carcinoma"], "answer": [], "image": "kid_img/kid_514.jpeg", "images": [], "id_simple": "2020-Q41", "note": "원본 표기: 2 (2019-41과 동일 문제 추정출제된, 사진은 다르나 조직"}, {"id": "kid-2019-L23-Q40", "year": 2019, "qnum": "40", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "요로상피암종의 발생 기전 및 진행에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["FGFR3 mutation이 CIS 발생의 주된 기전이다.", "유두상 요로상피암종에서 침윤성 암종으로의 진행에 P53, RB1 돌연변이가 관여한다.", "9번 chromosome의 deletion은 전이를 일으키는 기전으로 알려져있다.", "요로상피암종의 60~70%는 유두상 요로상피암종의 형태로 나타나며 치료 후 약 15%에서 재발한다.", "비침윤성 요로상피 암종은 재발을 반복하다 70%에서 침윤성요로상피암종으로 진행하는데 이 과정에서 P53이 관여한다."], "answer": [2], "image": null, "images": [], "id_simple": "2019-Q40"}, {"id": "kid-2019-L23-Q41", "year": 2019, "qnum": "41", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "환자가 다음 병리소견을 보일 때 진단은?", "stem_table": null, "options": ["urothelial papilloma", "papillary urothelial carcinoma, low grade", "papillary urothelial carcinoma, high grade", "Inverted papilloma", "Invasive urothelial carcinoma"], "answer": [2], "image": "kid_img/kid_514.jpeg", "images": [], "id_simple": "2019-Q41"}, {"id": "kid-2018-L23-Q60", "year": 2018, "qnum": "60", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "방광경 검사에서 다발성의 종괴가 발견되어 절제하였고, 병리검사에서 다음과 같은 소견을 보였다가장. 가능성이 높은 진단명은?", "stem_table": null, "options": ["papillary urothelial hyperplasia", "urothelial papilloma", "papillary urothelial neoplasm of low malignant potential", "urothelial carcinoma in situ", "urothelial carcinoma"], "answer": [5], "image": null, "images": [], "id_simple": "2018-Q60"}, {"id": "kid-2018-L23-Q77", "year": 2018, "qnum": "77", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "병리 사진 보여주고 옳은 거 고르기", "stem_table": null, "options": ["크기가 커져도 hemorrhage나 낭성변화가 없다.", "paillary하게 증식하며 가운데 fibrovascular core가 있다.", "fibrovascular core 중심에 ganglion cell이 많다.", "collecting duct의 종양이다."], "answer": [2], "image": "kid_img/kid_515.jpeg", "images": [], "id_simple": "2018-Q77"}, {"id": "kid-2018-L23-Q84", "year": 2018, "qnum": "84", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "방광암에 관련해서 옳은 보기는?", "stem_table": null, "options": ["", "담배장기간, 진통제 사용방사선, 치료는 모두 방광암 유발 인자이다", "인도수단에는, Schistosoma haematobium 감염에 따른 urothelial carcinoma가 많이 일어나는데 그 중 70%는 urothelial carcinoma고 30%는 squamous cell carcinoma다.", "", "Prostatic stromal invasion에서 intraurethral과 transmural이 있는데 둘 다 pT4다."], "answer": [2], "image": null, "images": [], "id_simple": "2018-Q84"}, {"id": "kid-2018-L23-Q85", "year": 2018, "qnum": "85", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "Urothelial carcinoma의 genetic alteration에 대해서 맞는 보기는? 1) tp53, HRAS mutation은 high grade tumor을 일으키는 데에 관여한다. 2) Chromosome 9 deletion은 dysplasia/CIS 일으키는 데에 관여한다. 3) Low grade non-invasive tumor 치료 후 invasive으로 진행할 확률은 70%이고 이 때 tp53(? Rb?)이 작용한다.", "stem_table": null, "options": [], "answer": [2], "image": "kid_img/kidq_L23-2018-Q85-0.png", "images": [], "id_simple": "2018-Q85", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2018-L23-Q86", "year": 2018, "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "방광경 검사에서 0.2 cm 크기의 유두상 종괴가 발견되어 절제하였다병리검사에서. 유두상 종괴는 5층의 요로상피로 피복되어 있었고정상, 요로상피와 형태학적인 차이를 전혀 보이지 않았다. 침윤도 관찰되지 않았다가장. 가능성이 높은 진단명 한 가지를 고르시오.", "stem_table": null, "options": [], "answer": [1], "image": "kid_img/kidq_L23-2015-Q20-0.png", "images": [], "id_simple": "2015-Q20", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2015-L23-Q21", "year": 2015, "qnum": "21", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "흡연력(40 pack-year)이 있는 65세 남자에서 방광과 요로 및 신우에서 다발성의 종괴가 발견되었다. 병리검사에서 종괴는 부분적으로 유두상을 보였고 종양세포는 요로상피와 닮았으나 심한 이형성과 극성의 소실(loss of polarity)을 보였다. 유사분열은 흔히 관찰되었고 umbrella cell은 관찰되지 않았다. 면역조직화학검사에서 종양세포는 p53을 과발현하고 있었다가장. 가능성이 높은 진단명 한 가지를 고르시오. ※ (22-23) 아래 각 문항의 비뇨기계 종양 중에서 가장 가능성이 높은 진단명을, 문항마다 제시하는 수 만큼 답가지 (1-10) 중에서 고르시오.", "stem_table": null, "options": ["Urothelial papilloma", "Urothelial neoplasm of low malignant potential", "Urothelial carcinoma, low grade", "Urothelial carcinoma, high grade", "Seminoma", "Embryonal carcinoma", "Yolk sac tumor (endodermal sinus yumor)", "Choriocarcinoma", "Teratoma", "Mixed germ cell tumor"], "answer": [4], "image": null, "images": [], "id_simple": "2015-Q21"}, {"id": "kid-2015-L23-Q22", "year": 2015, "qnum": "22", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "25세의 남자가 커진 고환 때문에 고환절제술을 받았다수술. 전에 시행한 혈액검사에서 alpha-fetoprotein과 HCG가 상승되어 있었다병리검사에서. 종양은 분화가 나쁜 상피세포로 구성되어 있었고 출혈과 괴사를 동반하고 있었다 (사진 참조). 면역조직화학검사에서 종양세포는 alpha-fetoprotein과 HCG 및 Ki-1(CD30)을 모두 발현하였다가장. 가능성이 높은 진단명 한 가지를 고르시오.", "stem_table": null, "options": [], "answer": [6], "image": null, "images": ["kid_img/kid_522.jpeg", "kid_img/kid_523.jpeg", "kid_img/kid_524.jpeg", "kid_img/kidq_L23-2015-Q22-0.png"], "id_simple": "2015-Q22", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2015-L23-Q23", "year": 2015, "qnum": "23", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "30세의 남자가 커진 고환 때문에 고환절제술을 받았다수술. 전에 시행한 혈액검사에서 alpha-fetoprotein과 HCG 수치가 상승되어 있었다. 병리검사에서 종양은 연골과 지방조직 및 분화가 나쁜 상피세포로 구성되어 있었고 출혈과 괴사를 동반하고 있었다. 투명한 세포질과 뚜렷한 핵소체를 갖는 종양세포도 부분적으로 관찰되었다. 면역조직화학검사에서 alpha-fetoprotein, HCG, Ki-1(CD30) 및 PLAP(placental alkaline phosphatase)를 각각 발현하는 종양세포가 혼재하였다. 가장 가능성이 높은 진단명 한 가지를 고르시오.", "stem_table": null, "options": [], "answer": [10], "image": "kid_img/kidq_L23-2015-Q23-0.png", "images": [], "id_simple": "2015-Q23", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2014-L23-Q53", "year": 2014, "qnum": "53", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "하부요로 및 남성생식계 감염증 중에서 urethritis → prostatitis → cystitis → ureteritis → pyelonephritis의 순서로 진행할 가능성이 가장 높은 원인균 혹은 감염증은", "stem_table": null, "options": ["N. gonorrhoeae", "syphilis", "E. coli", "tuberculosis", "Herpes simplex"], "answer": [3], "image": null, "images": [], "id_simple": "2014-Q53"}, {"id": "kid-2014-L23-Q54", "year": 2014, "qnum": "54", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "방광경 검사에서 다발성의 종괴가 발견되어 절제하였고, 병리검사에서 다음과 같은 소견 을 보였다가장. 가능성이 높은 진단명은?", "stem_table": null, "options": ["papillary urothelial hyperplasia", "urothelial papilloma", "papillary urothelial neoplasm of low malignant potential", "urothelial carcinoma in situ", "urothelial carcinoma"], "answer": [5], "image": "kid_img/kid_525.jpeg", "images": [], "id_simple": "2014-Q54"}, {"id": "kid-2014-L23-Q55", "year": 2014, "qnum": "55", "jokbo_lec_no": "29", "lecture": "29 하부요로의 질환", "professor": "김영아", "curr_lec_no": "29", "curr_lecture": "하부요로의 질환", "stem": "방광경 검사의 육안 및 현미경 사진이다가장. 가능성이 높은 병리학적 진단은?", "stem_table": null, "options": ["inverted papilloma", "urothelial neoplasm of low malignant potential", "urothelial carcinoma in situ", "urothelial carcinoma, low grade", "urothelial carcinoma, high grade"], "answer": [1], "image": null, "images": ["kid_img/kid_529.jpeg", "kid_img/kid_530.jpeg"], "id_simple": "2014-Q55"}, {"id": "kid-2025-L24-Q64", "year": 2025, "qnum": "64", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "다음은 신장종양으로 신장절제술을 시행받은 74세 여 자 환자의 신장종양 현미경 소견이다. 본 질환에 대한 설 명으로 옳은 것은?", "stem_table": null, "options": ["육안소견 상 회백색으로 관찰된다.", "MET 유전자의 활성변이(activatin mutation)에 의해 발생한다.", "VHL 유전자의 불활성변이(inactivation mutation)이 종 양의 발생에 중요하다.", "요로상피암 중 가장 흔한 조직학적 아형이다.", "면역조직화학염색에서 HMB45에 양성을 보인다."], "answer": [3], "image": "kid_img/kid_534.jpeg", "images": [], "id_simple": "2025-Q64"}, {"id": "kid-2025-L24-Q65", "year": 2025, "qnum": "65", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "다음은 신장종양으로 신장절제술을 시행받은 68세 여 자 환자의 신장종양 현미경 소견이다. 본 질환에 대한 설 명으로 옳은 것은?", "stem_table": null, "options": ["신세포암 중 가장 악성도가 높은 암이다.", "WHO/ISUP 조직학적 등급이 예후와 관련이 있다.", "육안적으로 종괴는 연한 노란빛의 종괴로 관찰된다.", "확진을 위해 TFE3 또는 TFEB 유전자의 전위 (translocation)를 확인해야 한다.", "조직학적으로 세포 핵 주위의 공동(halo)이 특징적이다."], "answer": [2], "image": "kid_img/kid_535.jpeg", "images": [], "id_simple": "2025-Q65"}, {"id": "kid-2025-L24-Q66", "year": 2025, "qnum": "66", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "77세 남자 환자가 소변검사에서 이상세포가 관찰되어 방광경검사를 시행받았다. 다음은 방광경을 통한 환자의 방광 생검조직의 현미경 소견이다진단은. ?", "stem_table": null, "options": ["내장성유두종(Inverted papilloma)", "저등급유두모양요로상피암종(Papillary urothelial carcinoma, low grade)", "고등급유두모양요로상피암종(Papillary urothelial carcinoma, high grade)", "요로상피내암종(Urothelial carcinoma in situ)", "침윤성요로상피암종(Invasive urothelial carcinoma)"], "answer": [4], "image": "kid_img/kid_536.jpeg", "images": [], "id_simple": "2025-Q66"}, {"id": "kid-2025-L24-Q67", "year": 2025, "qnum": "67", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "다음은 74세 남자 환자의 방광절제술 검체의 현미경 소견이다이. 질환에 대한 설명으로 옳은 것은? ① 병리학적 진단은 침윤성요로상피암종이다. ② 가장 흔한 증상은 통증을 동반한 혈뇨이다. ③ 저등급과 고등급유두모양요로상피암종에서 비슷한 빈도 로 진행한다. ④ 방광의 근육층까지 침윤을 하면 병리학적 T 병기(pT stage)는 pT3이다.", "stem_table": null, "options": [], "answer": [1], "image": null, "images": ["kid_img/kid_540.jpeg", "kid_img/kidq_L24-2025-Q67-0.png"], "id_simple": "2025-Q67", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2023-L24-Q20", "year": 2023, "qnum": "20", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "67세 남자 환자의 신장종양의 현미경소견이다. 본 질환에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["신세포암중에서 두번째로 흔하게 발생하는 암종이다.", "Renal vein invasion을 잘 한다.", "육안적으로 central scar가 관찰되면 진단이 용이하다.", "초미세구조상 세포질내에 미토콘드리아 (mitochondria)가 가득 차 있다.", "면역조직화학염색에서 TFE3에 양성을 보인다."], "answer": [2], "image": "kid_img/kid_541.jpeg", "images": [], "id_simple": "2023-Q20"}, {"id": "kid-2023-L24-Q84", "year": 2023, "qnum": "84", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "72세 남자 환자의 신장종양의 현미경소견이다. 본 질환에 대한 설명으로 옳음 것은?", "stem_table": null, "options": ["육안적으로 밝은 노란색 종괴로 관찰되며, 이는 세포질 내에 glycogen과 lipid 성분이 있기 때문이다.", "이러한 현미경소견을 보이는 종양의 양성과 악성을 나누는 기준은 종양의 크기이다.", "VHL 유전자의 돌연변이 혹은 hypermethylation이 주요 발병기 전이다.", "WHO/ISUP nuclear grading과 예후와의 연관성이 아직까지 확 인되지 않은 종양이다.", "유전성으로 발병하는 경우는 tuberous sclerosis와 연관되어 있 다."], "answer": [2], "image": "kid_img/kid_542.jpeg", "images": [], "id_simple": "2023-Q84"}, {"id": "kid-2023-L24-Q76", "year": 2023, "qnum": "76", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "76세 남자환자가 혈뇨를 주소로 내원하였다. 다음은 환자의 절제 된 방광검체의 현미경 소견이다. 진단은?", "stem_table": null, "options": ["Inverted papilloma (내장성 유두종)", "Papillary urothelial carcinoma, low grade (저등급유두모 양요로상피암종)", "Papillary urothelial cacinoma, high grade (고등급유두모양요 로상피암종)", "Cacinoma in situ (CIS, 요로상피내암종)", "Invasive urothelial carcinoma (침윤요로상피암종)"], "answer": [5], "image": "kid_img/kid_543.jpeg", "images": [], "id_simple": "2023-Q76"}, {"id": "kid-2023-L24-Q82", "year": 2023, "qnum": "82", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "77세 남자환자가 소변검사에서 이상세포가 관찰되어 내원하였다. 환자는 2018년부터 반복적으로 방광암으로 여러 차례 경요도방광절 제술을 시행받은 병력이 있다. 방광검사시 방광 내에 뚜렷한 종괴는 관찰되지 않으며 부분적으로 점막이 붉게 충혈되어 있었다. 다음은 환자의 방광경을 통한 봥광생검조직의 현미경 소견이다. 병변에 대한 설명으로 옳은 것은?", "stem_table": null, "options": ["정상 점막두께를 보이고, 세포의 이형성을 보이지 않으므로 진단 은 요로상피유두종이다.", "병변은 치료하지 않고 추적관찰하여도 침윤성 병변으로 진행하지 않는다.", "병변은 보통 방광내에 다발성으로 발생한다.", "병변은 샘모양 분화(glandular differentiation)를 보인다."], "answer": [3], "image": "kid_img/kid_547.jpeg", "images": [], "id_simple": "2023-Q82"}, {"id": "kid-2022-L24-Q70", "year": 2022, "qnum": "70", "jokbo_lec_no": "37", "lecture": "30, 31 하부요로질환신종양 병리실습 /", "professor": "박정환", "curr_lec_no": "37", "curr_lecture": "하부요로질환/신종양 병리실습 1 · 하부요로질환/신종양 병리실습 2", "stem": "74세 여자 환자의 신장종양의 현미경소견이다. 본 질환에 대해 설명으로 옳은 것은?", "stem_table": null, "options": ["신장에서 발생하는 요로상피암 중에서 가장 흔하게 발생하는 암 종이다.", "MET 유전자의 activating mutation에 의해 발생한다.", "VHL 유전자의 불활성변이(inactivation mutation)가 종양의 발 생에 중요하다.", "육안적으로 적갈색으로 보인다.", "면역조직화학염색에서 HMB45에 양성을 보인다."], "answer": [3], "image": "kid_img/kid_548.jpeg", "images": [], "id_simple": "2022-Q70"}, {"id": "kid-2022-L24-Q71", "year": 2022, "qnum": "71", "jokbo_lec_no": "37", "lecture": "30,  중 틀린 사항은?", "stem_table": null, "options": ["확진을 위해서는 angiography를 시행한다.", "높은 저항계수 (Resisitive Index)를 보인다.", "Pulsus tardus and pavus 의 형태를 보인다.", "Renal angioplasty를 통하여 치료가 가능하다.", "CT angiography도 진단에 도움이 된다."], "answer": [2], "image": "kid_img/kid_591.jpeg", "images": [], "id_simple": "2022-Q79"}, {"id": "kid-2021-L26-Q67", "year": 2021, "qnum": "67", "jokbo_lec_no": "33", "lecture": "34 영상의학 연습", "professor": "조정연", "curr_lec_no": "33", "curr_lecture": "영상의학 연습", "stem": "사진의 중재시술은 다음 중 어느 신질환에서 시행하는가? (강의에서 보여주신 사진과 동일한 사진이 출제되었습니다, 빨간 점은 강의 화면 캡처라서 포인터가 표시된 것이니 무시하시면 됩니다)", "stem_table": null, "options": ["신장 종양 출혈", "신정맥 혈전증", "신외상", "요관 폐색", "신혈관성 고혈압"], "answer": [5], "image": "kid_img/kid_592.jpeg", "images": [], "id_simple": "2021-Q67"}, {"id": "kid-2021-L26-Q68", "year": 2021, "qnum": "68", "jokbo_lec_no": "33", "lecture": "34 영상의학 연습", "professor": "조정연", "curr_lec_no": "33", "curr_lecture": "영상의학 연습", "stem": "신장요로계 질환에서 초음파, CT, MRI를 비교한 설명 중 옳은 것은?", "stem_table": null, "options": ["초음파는 MRI에 비해여 대조해상도가 높은 객관적인 검사이다.", "CT는 MRI보다 다양한 영상기법이 가능하여 만성 신질환 진단에 유리하다.", "CT는 MRI에 비하여 검사시간이 짧아 방사선 피폭이 적다", "CT는 MRI에 비하여 공간해상도가 높아서 작은 결석의 진단에 유 리하다", "조영증강 MRI는 신부전 환자에 적용할 수 있는 안전한 검사이다."], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q68"}, {"id": "kid-2018-L26-Q27", "year": 2018, "qnum": "27", "jokbo_lec_no": "33", "lecture": "34 영상의학 연습", "professor": "조정연", "curr_lec_no": "33", "curr_lecture": "영상의학 연습", "stem": "angiomyolipoma 사진 주고 뭔지 물어봄. CT랑, US 줬음. self learning 사진과 같았음", "stem_table": null, "options": ["angiomyolipoma", "hematoma", "renal cell carcinoma", "abscess", "simple cyst"], "answer": [1], "image": null, "images": [], "id_simple": "2018-Q27"}, {"id": "kid-2025-L27-Q20", "year": 2025, "qnum": "20", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "Dynamic renal scan은 소변의 형성과정을 영상화하여 신장요로질환을 평가하고자 하는 주요한 핵의학 검사방법 이다. Dynamic renal scan에 사용되는 방사성의약품으로서 사구체여과율(glomerular filtration rate)을 주로 반영하는 것은 다음 중 무엇인가?", "stem_table": null, "options": ["99mTc-DTPA", "9mTc-MAG3", "99mTc-DMSA", "51Cr-EDTA", "모두 해당한다."], "answer": [1], "image": null, "images": [], "id_simple": "2025-Q20"}, {"id": "kid-2025-L27-Q21", "year": 2025, "qnum": "21", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "그림은 우측 신장의 수신증(hydronephrosis)이 있는 환자의 이뇨신장스캔(diuretic renal scan)으로서 좌측그림 은 이뇨제 투여전 기저스캔(basal scan), 우측그림은 이뇨 제 투여 후 스캔이다이에. 대한 바른 설명은 무엇인가?", "stem_table": null, "options": ["이뇨신장스캔은 정적신장스캔(static renal scan)의 한 종류이다.", "우측신장의 요로폐쇄(urinary obstruction)가 아니다.", "우측신장에 신우신염(pyelonephritis)이 있다.", "우측 수신증에 대한 치료가 필요하다.", "51Cr-EDTA를 사용한 검사이다."], "answer": [2], "image": "kid_img/kid_596.jpeg", "images": [], "id_simple": "2025-Q21"}, {"id": "kid-2023-L27-Q23", "year": 2023, "qnum": "23", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "다음의 그림은 좌측 신동맥(renal artery)의 협착(stenosis)이 있는 환자의 캡토프릴 신장스캔(captopril renal scan)으로서 좌측그림은 캡토프릴 투여전 기저스캔(basal scan), 우측 그림은 캡토프릴 투여후 스캔이다이. 환자는 최근 고혈압을 진단 받았다. 이에 대한 바른 설명은 무엇인가?", "stem_table": null, "options": ["캡토프릴 신장스캔은 정적신장스캔(static renal scan)의 한 종류이다.", "좌측신장에 요로폐쇄(urinary obstruction)가 있다.", "51Cr-EDTA를 사용한 검사이다.", "좌측신장에 신우신염(pyelonephritis)이 있다.", "좌측 신동맥 협착은 신혈관성고혈압의 원인이다."], "answer": [5], "image": "kid_img/kid_597.jpeg", "images": [], "id_simple": "2023-Q23"}, {"id": "kid-2023-L27-Q37", "year": 2023, "qnum": "37", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "Dynamic renal scan은 소변의 형성과정을 영상화하여 신장요 로질환을 평가하고자 하는 주요한 핵의학 검사방법이다. Dynamic renal scan에 사용되는 방사성의약품으로서 사구체여과율(GFR)을 주 로 반영하는 것은 다음 중 무엇인가?", "stem_table": null, "options": ["51Cr-EDTA", "Inulin", "99mTc-DMSA", "99mTc-DTPA", "99mTc-MAG3"], "answer": [4], "image": null, "images": [], "id_simple": "2023-Q37"}, {"id": "kid-2022-L27-Q68", "year": 2022, "qnum": "68", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "Dynamic renal scan은 소변의 형성과정을 영상화하여 신장요로 질환을 평가하고자 하는 주요한 핵의학 검사방법이다. Dynamic renal scan에 사용되는 방사성의약품으로서 사구체여과율(GFR) 보다 는 세뇨관 분비 기능(tubular secretory function)을 주로 반영하는 것은 다음 중 무엇인가?", "stem_table": null, "options": ["51Cr-EDTA", "Inulin", "99mTc-DMSA", "99mTc-DTPA", "99mTc-MAG3"], "answer": [5], "image": null, "images": [], "id_simple": "2022-Q68"}, {"id": "kid-2022-L27-Q69", "year": 2022, "qnum": "69", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "위의 그림은 우측 신장의 수신증(hydronephrosis)가 있는 환자의 이뇨신장스캔(diuretic renal scan)으로서 좌측은 이뇨제 투여전 기저스캔(basal scan), 우측은 이뇨제 투여후 스캔(diuretic scan)이다이에. 대한 바른 설명은 무엇인가?", "stem_table": null, "options": ["이뇨신장스캔은 정적신장스캔(static renal scan)의 한 종류이다.", "우측신장에 요로폐쇄(urinary obstruction)가 없다.", "51Cr-EDTA를 사용한 검사이다.", "우측신장에 신우신염(pyelonephritis)이 있다.", "우측신장은 신혈관성고혈압의 원인이다."], "answer": [2], "image": "kid_img/kid_606.jpeg", "images": [], "id_simple": "2022-Q69"}, {"id": "kid-2021-L27-Q69", "year": 2021, "qnum": "69", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "Dynamic renal scan은 소변의 형성과정을 영상화하여 신장요 로 질환을 평가하고자 하는 주요한 핵의학 검사방법이다. Dynamic renal scan에 사용되는 방사성의약품으로서 세뇨관 기능(tubular function)보다는 사구체여과율(GFR)을 주로 반영하는 것은 다음 중 무엇인가?", "stem_table": null, "options": ["51Cr-EDTA", "Inulin", "99mTc-DMSA", "99mTc-DTPA", "99mTc-MAG3"], "answer": [4], "image": null, "images": [], "id_simple": "2021-Q69"}, {"id": "kid-2021-L27-Q70", "year": 2021, "qnum": "70", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "위의 그림은 신장피질스캔으로서 좌측은 정상환자, 우측은 요로 계감염을 호소하는 환자이다다음. 중 바른 설명은 무엇인가? 1) 신장피질스캔은 dynamic renal scan의 한 종류이다. 2) 99mTc-MAG3를 사용한다. 3) 방사선피폭의 염려로 소아에서는 사용하지 않는다. 4) 신장섭취정도는 사구체여과율(GFR)을 반영한다. 4) 모두 틀리다.", "stem_table": null, "options": [], "answer": [5], "image": null, "images": ["kid_img/kid_610.jpeg", "kid_img/kidq_L27-2021-Q70-0.png", "kid_img/kidq_L27-2021-Q70-1.png"], "id_simple": "2021-Q70", "note": "원본에서 선지를 텍스트로 뽑을 수 없어 문항 이미지를 그대로 싣습니다."}, {"id": "kid-2019-L27-Q28", "year": 2019, "qnum": "28", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "우측 신장에 수신증이 있는 환자에게 renal scan을 실시한 후 excretion imaging (renogram) 결과가 다음과 같았다이에. 대한 올바른 해석은?", "stem_table": null, "options": ["우측 신장의 관류가 감소되어 있다.", "우측 신장의 사구체여과율 감소소견으로 요로폐쇄이다.", "우측 신장에 유의미한 폐쇄가 없는 단순 확장 소견이다.", "우측 신장은 기능이 전혀 없는 (nonfunctioning) 신장이다.", "이뇨제 투여 후 추가 스캔이 필요하다."], "answer": [5], "image": "kid_img/kid_611.jpeg", "images": [], "id_simple": "2019-Q28"}, {"id": "kid-2019-L27-Q29", "year": 2019, "qnum": "29", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "GFR을 측정하기에 이상적인 방사선 의약품은 혈액상에서 알부민과 같은 단백질과의 결합이 낮으면 낮을 수록 좋다이에. 반해서 혈액 내에서 단백질 결합이 높고 신세뇨관 분비를 통해 배출되는 방사선의약품은 신장 영상의 품질은 우수하지만 GFR을 추정할 수는 없다이러한. 성질을 가지고 있으며 이뇨신장스캔 (diuretic renal scan)에 흔히 사용되는 방사성의약품은 무엇인가?", "stem_table": null, "options": ["51Cr-EDTA", "99mTc-DTPA", "99mTc-MAG3", "99mTc-DMSA", "위의 보기 모두 해당"], "answer": [3], "image": null, "images": [], "id_simple": "2019-Q29"}, {"id": "kid-2019-L27-Q30", "year": 2019, "qnum": "30", "jokbo_lec_no": "36", "lecture": "35 신질환의 핵의학적 검사", "professor": "서민석", "curr_lec_no": "36", "curr_lecture": "신장요로질환의 핵의학 검사", "stem": "반복된 요로감염을 주소로 내원한 5세 남자아이의 scan 사진이다다음. 보기의 해석 중 가장 합당한 것은 무엇인가? (가) (나)", "stem_table": null, "options": ["(가는) 방사성의약품 투여 후 ‘동적 스캔으로’ 얻은 이미지이다.", "(나는) 방사성의약품 투여 후 ‘정적 스캔으로’ 얻은 이미지이다.", "left kidney의 급성 신우신염 소견이다.", "right kidney 방향의 reflux가 관찰된다.", "이뇨제 투여 후 검사가 필요하다."] function esc(s) {
  if(!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function mdTableToHtml(md) {
  if(!md) return '';
  const lines = md.trim().split('\n').filter(l=>l.trim());
  const rows = [];
  for(const line of lines) {
    const cells = line.split('|').map(c=>c.trim()).filter((cell,i,a)=>!(i===0&&cell===''||i===a.length-1&&cell===''));
    if(cells.length) rows.push(cells);
  }
  if(rows.length<2) return '<pre>'+esc(md)+'</pre>';
  const filtered = rows.filter((_,i)=>i!==1);
  if(!filtered.length) return '';
  let html='<table class="stem-table"><thead><tr>';
  for(const cell of filtered[0]) html+='<th>'+esc(cell)+'</th>';
  html+='</tr></thead><tbody>';
  for(const row of filtered.slice(1)) {
    html+='<tr>';
    for(const cell of row) html+='<td>'+esc(cell)+'</td>';
    html+='</tr>';
  }
  html+='</tbody></table>';
  return html;
}

// SHUFFLE
// ═══════════════════════════════════════════════════
function shuffleArray(arr) {
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function toggleShuffle() {
  isShuffled = !isShuffled;
  const btn = document.getElementById('shuffle-btn');
  if(isShuffled) {
    filteredQ = shuffleArray(filteredQ);
    btn.classList.add('active');
    btn.textContent = '↕ 랜덤 해제';
  } else {
    // Restore original order by re-applying filters
    btn.classList.remove('active');
    btn.textContent = '↕ 랜덤 순서';
    applyFilters(true); // true = skip shuffle
    return;
  }
  renderFeed();
  renderIndex();
}

// FILTER
// ═══════════════════════════════════════════════════
function applyFilters(skipShuffle) {
  const SRC = (filterTerm==='icm') ? ICM_QUESTIONS : QUESTIONS;
  const isICM = (filterTerm==='icm');
  filteredQ = SRC.filter(q => {
    const yearOk = (filterYear==='all' || String(q.year)===String(filterYear));
    let lecOk;
    if(filterLec==='all') lecOk=true;
    else if(filterLec==='null') lecOk=!q.curr_lec_no;
    else lecOk=q.curr_lec_no===filterLec;
    // ICM 은 과목(1차/2차) term 로직 미적용 — termOk=true
    const t=isICM ? 0 : lecTerm(q.curr_lec_no);
    const termOk = isICM ? true : (filterTerm==='all' || t===0 || String(t)===filterTerm);
    const scrapOk = !filterScrapOnly || anyScrap(q.id);
    return yearOk && lecOk && termOk && scrapOk;
  });
  if(isShuffled && !skipShuffle) {
    filteredQ = shuffleArray(filteredQ);
  }
  renderFeed();
  updateStats();
  updateScopeBar();
  renderIndex();
  saveFilter();
}

const ICM_LEC_ORDER=['1A','1B','1C','1D','1E','2','3','4','5','6','7'];
const ICM_SIMGROUPS = [];
const ICM_Q2GROUP = {};
const ICM_UNIT_SIM = {};
function rebuildLecOptions(){
  const sel=document.getElementById('lec-select'); if(!sel) return;
  // ICM 과목: ICM_QUESTIONS 의 curr_lec_no 고유값을 정해진 순서대로 옵션 생성
  if(filterTerm==='icm'){
    const seen={};
    (typeof ICM_QUESTIONS!=='undefined'?ICM_QUESTIONS:[]).forEach(function(q){ if(q.curr_lec_no && !seen[q.curr_lec_no]) seen[q.curr_lec_no]=q.curr_lecture||''; });
    const ordered=ICM_LEC_ORDER.filter(function(k){return seen[k]!==undefined;});
    // 순서표에 없는 잔여 코드도 뒤에 붙임(안전)
    Object.keys(seen).forEach(function(k){ if(ordered.indexOf(k)<0) ordered.push(k); });
    // 첫 진입(저장된 lec 가 'all') 시 첫 단원 자동 선택 — 렉 방지 우선
    if(filterLec==='all' && ordered.length){ filterLec=ordered[0]; }
    let h='';
    ordered.forEach(function(k){ h+='<option value="'+esc(k)+'">'+esc(k+'. '+seen[k])+'</option>'; });
    h+='<option value="all">전체 단원</option>';  // '전체'는 맨 아래(명시 선택 전용)
    sel.innerHTML=h;
    sel.value=filterLec;
    if(sel.value!==filterLec){ filterLec=(ordered.length?ordered[0]:'all'); sel.value=filterLec; }
    return;
  }
  if(!FULL_LEC.length) return;
  // 현재 과목(filterTerm) 에 해당하는 강의 key 목록 — 첫 강의 자동선택 판정용
  const lecKeys=[];
  FULL_LEC.forEach(function(r){
    const t=lecTerm(r.key);
    if(filterTerm==='all' || t===0 || String(t)===filterTerm) lecKeys.push(r.key);
  });
  // 첫 진입(저장된 lec 가 'all') 시 첫 강의 자동 선택 — 렉 방지 우선
  if(filterLec==='all' && lecKeys.length){ filterLec=lecKeys[0]; }
  let html='';
  FULL_LEC.forEach(function(r){
    const t=lecTerm(r.key);
    if(filterTerm==='all' || t===0 || String(t)===filterTerm){
      html+='<option value="'+r.key+'">'+esc(r.label)+'</option>';
    }
  });
  html+='<option value="all">전체 강의</option>';  // '전체'는 맨 아래(명시 선택 전용)
  sel.innerHTML=html;
  sel.value=filterLec;
  if(sel.value!==filterLec){ filterLec=(lecKeys.length?lecKeys[0]:'all'); sel.value=filterLec; }
}

function countStats() {
  let correct=0,wrong=0,answered=0;
  filteredQ.forEach(q=>{
    const sa=hideAnswers?null:savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length>0){
      answered++;
      if(sa.correct) correct++; else wrong++;
    }
  });
  return {total:filteredQ.length,answered,correct,wrong};
}
function updateStats() {
  const s=countStats();
  document.getElementById('stat-shown').textContent=s.total;
  document.getElementById('stat-correct').textContent=s.correct;
  document.getElementById('stat-wrong').textContent=s.wrong;
}
function updateScopeBar() {
  const s=countStats();
  document.getElementById('scope-bar').innerHTML=
    `전체 <b>${s.total}</b>문항 &nbsp;|&nbsp; 푼 <b>${s.answered}</b> &nbsp;|&nbsp; 정답 <b style="color:var(--correct)">${s.correct}</b> &nbsp;|&nbsp; 오답 <b style="color:var(--incorrect)">${s.wrong}</b>`;
}

function curSimPct(lec){ return LEC_SIM.hasOwnProperty(lec)?LEC_SIM[lec]:null; }
function renderProgress(){
  const pv=document.getElementById('progress-view'); if(!pv) return;
  // ICM 과목: 단원별(1A~7) 진척도 — 대사내분비 로직과 분리(교수·수업일·유사도 메타 없음)
  if(filterTerm==='icm'){ renderICMProgress(pv); return; }
  // 강의별 집계: 전체 연도 통합, 현재 사용자(savedAnswers) 기준
  const agg={};
  QUESTIONS.forEach(function(q){
    const k=q.curr_lec_no||'기타';
    if(!agg[k]) agg[k]={total:0,done:0};
    agg[k].total++;
    const sa=savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length) agg[k].done++;
  });
  const roster=(FULL_LEC.length?FULL_LEC:lecRoster()).filter(function(r){
    const t=lecTerm(r.key);
    return filterTerm==='all' || t===0 || String(t)===filterTerm;
  });
  let totT=0,totD=0,rows='';
  roster.forEach(function(r){
    const a=agg[r.key]||{total:0,done:0};
    totT+=a.total; totD+=a.done;
    const pct=a.total?Math.round(a.done/a.total*100):0;
    const full=(a.total>0&&a.done===a.total);
    const prof=curProf(r.key);
    const simP=curSimPct(r.key);
    const simCls=(simP==null)?'na':(simP>=70?'hi':(simP>=40?'mid':'lo'));
    const memoVal=curLecMemo(r.key);
    const memoDisabled=CURRENT_USER?'':'disabled';
    const memoPlaceholder=CURRENT_USER?'메모 (자동저장)':'사용자 선택 후 작성';
    const escapedLec=r.key.replace(/'/g,"\\'");
    rows+='<tr>'
      +'<td class="prog-lec">'+esc(r.label)+'</td>'
      +'<td class="prog-num prog-sim '+simCls+'">'+(simP==null?'—':simP+'%')+'</td>'
      +'<td class="prog-prof">'+profHtml(prof,r.key)+'</td>'
      +'<td class="prog-num prog-date">'+(curDate(r.key)?esc(curDate(r.key)):'—')+'</td>'
      +'<td class="prog-num">'+a.total+'</td>'
      +'<td class="prog-num'+(full?' prog-done-full':'')+'">'+a.done+'</td>'
      +'<td><div class="prog-cell-prog"><div class="prog-bar'+(full?' full':'')+'"><span style="width:'+pct+'%"></span></div><span class="prog-pct">'+pct+'%</span></div></td>'
      +'<td><input class="lmemo-input" id="lmemo-'+r.key+'" type="text" value="'+esc(memoVal)+'" placeholder="'+esc(memoPlaceholder)+'" '+memoDisabled+' onblur="saveLecMemo(\''+escapedLec+'\',this)"><span class="lmemo-saved" id="lmemo-saved-'+r.key+'"></span></td>'
      +'</tr>';
  });
  const totPct=totT?Math.round(totD/totT*100):0;
  const who=CURRENT_USER?esc(CURRENT_USER):'(사용자 미선택)';
  const termName= filterTerm==='1'?'대사와 내분비 1차': filterTerm==='2'?'대사와 내분비 2차':'전체 과목';
  pv.innerHTML=
    '<div class="prog-title">📊 풀이 진척도 확인</div>'
    +'<div class="prog-sub">현재 사용자 <b>'+who+'</b> · 강의별 전체 연도(2014~2025) 통합 집계입니다.<br>교수명·수업일은 2026 공식 시간표(Lectures.txt) 기준이며, 족보의 강의 묶음은 2023년 편성이라 2026 강의번호로 다시 맞춘 것입니다.<br>「메모」칸: 현재 사용자 전용 한 줄 메모, 칸을 벗어나면 자동저장.</div>'
    +'<div class="prog-summary">'
      +'<div class="prog-sum-chip">총 '+totT+'문항</div>'
      +'<div class="prog-sum-chip">푼 문항 '+totD+'개</div>'
      +'<div class="prog-sum-chip">전체 진척률 '+totPct+'%</div>'
      +'<div class="prog-sum-chip">강의 '+roster.length+'개</div>'
    +'</div>'
    +'<div class="prog-table-wrap"><table class="prog-table"><thead><tr>'
      +'<th>강의</th><th style="text-align:center;">유사도</th><th>교수</th><th style="text-align:center;">수업일</th><th style="text-align:center;">총</th><th style="text-align:center;">푼</th><th>진척</th><th>메모 ('+who+')</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
// ICM 단원별 진척도(단원명·푼/총·정답률). 알렌 진척도(appendAllenProgress) 미호출.
function renderICMProgress(pv){
  const agg={};
  (typeof ICM_QUESTIONS!=='undefined'?ICM_QUESTIONS:[]).forEach(function(q){
    const k=q.curr_lec_no||'기타';
    if(!agg[k]) agg[k]={total:0,done:0,correct:0,label:q.curr_lecture||''};
    agg[k].total++;
    const sa=savedAnswers[q.id];
    if(sa&&sa.sel&&sa.sel.length){ agg[k].done++; if(sa.correct) agg[k].correct++; }
  });
  const ordered=ICM_LEC_ORDER.filter(function(k){return agg[k];});
  Object.keys(agg).forEach(function(k){ if(ordered.indexOf(k)<0) ordered.push(k); });
  let totT=0,totD=0,totC=0,rows='';
  ordered.forEach(function(k){
    const a=agg[k]; totT+=a.total; totD+=a.done; totC+=a.correct;
    const pct=a.total?Math.round(a.done/a.total*100):0;
    const acc=a.done?Math.round(a.correct/a.done*100):0;
    const full=(a.total>0&&a.done===a.total);
    const simP=(typeof ICM_UNIT_SIM!=='undefined'&&ICM_UNIT_SIM.hasOwnProperty(k))?ICM_UNIT_SIM[k]:null;
    const simCls=(simP==null)?'na':(simP>=50?'hi':(simP>=25?'mid':'lo'));
    rows+='<tr>'
      +'<td class="prog-lec">'+esc(k+'. '+a.label)+'</td>'
      +'<td class="prog-num">'+a.total+'</td>'
      +'<td class="prog-num'+(full?' prog-done-full':'')+'">'+a.done+'</td>'
      +'<td class="prog-num">'+(a.done?acc+'%':'—')+'</td>'
      +'<td class="prog-num prog-sim '+simCls+'">'+(simP==null?'—':simP+'%')+'</td>'
      +'<td><div class="prog-cell-prog"><div class="prog-bar'+(full?' full':'')+'"><span style="width:'+pct+'%"></span></div><span class="prog-pct">'+pct+'%</span></div></td>'
      +'</tr>';
  });
  const totPct=totT?Math.round(totD/totT*100):0;
  const totAcc=totD?Math.round(totC/totD*100):0;
  const who=CURRENT_USER?esc(CURRENT_USER):'(사용자 미선택)';
  pv.innerHTML=
    '<div class="prog-title">📊 풀이 진척도 확인 — 임상의학입문 (ICM)</div>'
    +'<div class="prog-sub">현재 사용자 <b>'+who+'</b> · 과목 <b>임상의학입문 (ICM)</b> · 단원별 집계입니다.</div>'
    +'<div class="prog-summary">'
      +'<div class="prog-sum-chip">총 '+totT+'문항</div>'
      +'<div class="prog-sum-chip">푼 문항 '+totD+'개</div>'
      +'<div class="prog-sum-chip">전체 진척률 '+totPct+'%</div>'
      +'<div class="prog-sum-chip">정답률 '+(totD?totAcc+'%':'—')+'</div>'
      +'<div class="prog-sum-chip">단원 '+ordered.length+'개</div>'
    +'</div>'
    +'<div class="prog-table-wrap"><table class="prog-table"><thead><tr>'
      +'<th>단원</th><th style="text-align:center;">총</th><th style="text-align:center;">푼</th><th style="text-align:center;">정답률</th><th style="text-align:center;" title="과년도 반복 출제 비율(유사문항 묶음 기준)">유사도</th><th>진척</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}
async function saveMetaBlur(kind, lec, el){
  const val=el.value.trim();
  if(val===(curMeta(kind,lec)||'')) return;
  const ind=document.getElementById('save-'+kind+'-'+lec);
  if(ind){ ind.textContent='…'; ind.style.color='var(--text-muted)'; }
  const ok=await sbUpsert('__'+kind+'__'+lec,{expl:val});
  setSyncPills();
  if(ind){
    if(ok){ ind.textContent='✓'; ind.style.color='var(--correct)'; setTimeout(function(){ if(ind&&ind.textContent==='✓') ind.textContent=''; },1600); }
    else { ind.textContent='⚠'; ind.style.color='var(--incorrect)'; }
  }
}
